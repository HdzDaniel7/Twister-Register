<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BARCOMP α — Compensación de dobleces</title>
<style>:root{
  --bg:#0B0E13; --panel:#12161D; --panel2:#171C25; --panel3:#1D2430;
  --line:#242C39; --line2:#303A4A;
  /* --dim2 NO es decorativo: lo llevan la ayuda de las celdas, los rótulos de
     sección y las columnas de solo lectura de las tablas, que son datos. Estaba
     a 3.1:1 en oscuro y 3.2:1 en claro, bajo el 4.5:1 que pide WCAG 1.4.3 para
     texto normal, y estas tipografías son de 10 px. Los dos temas suben hasta
     pasar ese umbral medido contra --panel2, el fondo más apretado en el que
     aparece. Queda muy cerca de --dim: al exigir legibilidad a los dos, la
     jerarquía entre ellos ya no la lleva el color sino el tamaño y la caja. */
  --txt:#D8DFE9; --dim:#7E8A9C; --dim2:#78849A;
  --nominal:#3FA9F5; --measured:#F0A02E; --corrected:#3FD68C;
  --ok:#3FD68C; --warn:#FFC53D; --bad:#FF4D5E;
  --warnTxt:#F0D48A; --warnBd:#8A6A24; --warnBg:#FFC53D14;
  /* violeta: la pieza NO es real. No comparte familia con ningún otro
     color semántico justamente para que no se confunda con una medida. */
  --synthetic:#C08AF0;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  --sans:"Inter","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --h:44px; --ribbon:74px; --statusH:26px; --rtW:360px; --lfW:250px; --btH:340px;
  /* MODELAR: ancho de la tabla a la derecha. COMPENSAR: alto de la banda 3D. */
  --btW:760px; --compVP:250px;

  /* Todo lo que antes iba en crudo dentro del CSS, de scene/ y de ribbon.ts.
     El 3D y la cinta LEEN estos tokens en tiempo de ejecución, así que aquí
     está el color de la aplicación entera, tema por tema. */
  --vpbg:#080A0E; --grid1:#2A3546; --grid2:#1A212C; --fixture:#3A4658;
  /* el pin lateral, y la forma que toma la barra al quedar sujeta por él */
  --pincol:#57C8D6; --held:#F5A9E0;
  --inputbg:#0C1017; --inputbg2:#0E141D; --inputHovBd:#3C4759;
  --sel:#12324B; --selBd:#1E5C86; --selTxt:#9FD4FA; --selHov:#17415F;
  --btnHov:#28313F; --btnHovBd:#455065; --dcolbg:#0F1620;
  --oriW:#C9A5F5; --oriWbd:#6B4B9E; --oriT:#7FD8C4; --oriTbd:#3B7A6C;
  --hd1:#151A23; --hd2:#10141B; --scroll:#465268;
  --lblbg:#0B0E13CC; --floatbg:#0B0E13D9; --hintbg:#0B0E13B0;
  /* texto de las etiquetas del 3D. Iban en --dim y en un #fff a pelo, y
     en tema claro el blanco sobre blanco no se leía. */
  --lblTxt:#AEB9C8; --lblSel:#FFFFFF;
  --ring:#3FA9F533; --grip:#3FA9F544; --selRing:#3FA9F540;
}

/* ---------- tema claro ----------
   Los colores NO cambian de familia: --nominal sigue siendo azul, --measured
   ámbar, --corrected verde, y la escala de desviación sigue yendo de verde a
   ámbar a rojo. Lo que cambia es la luminosidad, para que se lean sobre blanco.
   El bloque va dos veces: bajo [data-theme="light"] (elección explícita) y bajo
   la preferencia del sistema, esta guardada contra una elección de oscuro. */
:root[data-theme="light"]{
  --bg:#F4F6F9; --panel:#FFFFFF; --panel2:#F0F3F7; --panel3:#E7ECF2;
  --line:#D7DDE6; --line2:#BFC8D4;
  --txt:#18202C; --dim:#5B6778; --dim2:#5F6E85;
  --nominal:#0D6FC4; --measured:#A96400; --corrected:#0F7A52;
  --ok:#0F7A52; --warn:#9A6B00; --bad:#C42133; --synthetic:#7A3FB0;
  --warnTxt:#6B4A00; --warnBd:#C79A2E; --warnBg:#FFC53D24;
  --vpbg:#EDF0F4; --grid1:#C2CBD8; --grid2:#D9DFE7; --fixture:#AEB9C8;
  --pincol:#1E8FA0; --held:#B33C8C;
  --inputbg:#FFFFFF; --inputbg2:#F7F9FC; --inputHovBd:#A6B2C2;
  --sel:#D5E7F8; --selBd:#8CBCE4; --selTxt:#0A4B87; --selHov:#C2DCF4;
  --btnHov:#DCE3EC; --btnHovBd:#A6B2C2; --dcolbg:#EDF3F9;
  --oriW:#6A38A2; --oriWbd:#B49BDE; --oriT:#0C6A58; --oriTbd:#84C9BB;
  --hd1:#FFFFFF; --hd2:#F1F4F9; --scroll:#B4BDCA;
  --lblbg:#FFFFFFD9; --floatbg:#FFFFFFE6; --hintbg:#FFFFFFCC;
  --lblTxt:#3B475A; --lblSel:#0A4B87;
  --ring:#0D6FC433; --grip:#0D6FC444; --selRing:#0D6FC440;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#F4F6F9; --panel:#FFFFFF; --panel2:#F0F3F7; --panel3:#E7ECF2;
    --line:#D7DDE6; --line2:#BFC8D4;
    --txt:#18202C; --dim:#5B6778; --dim2:#5F6E85;
    --nominal:#0D6FC4; --measured:#A96400; --corrected:#0F7A52;
    --ok:#0F7A52; --warn:#9A6B00; --bad:#C42133; --synthetic:#7A3FB0;
    --warnTxt:#6B4A00; --warnBd:#C79A2E; --warnBg:#FFC53D24;
    --vpbg:#EDF0F4; --grid1:#C2CBD8; --grid2:#D9DFE7; --fixture:#AEB9C8;
    --pincol:#1E8FA0; --held:#B33C8C;
    --inputbg:#FFFFFF; --inputbg2:#F7F9FC; --inputHovBd:#A6B2C2;
    --sel:#D5E7F8; --selBd:#8CBCE4; --selTxt:#0A4B87; --selHov:#C2DCF4;
    --btnHov:#DCE3EC; --btnHovBd:#A6B2C2; --dcolbg:#EDF3F9;
    --oriW:#6A38A2; --oriWbd:#B49BDE; --oriT:#0C6A58; --oriTbd:#84C9BB;
    --hd1:#FFFFFF; --hd2:#F1F4F9; --scroll:#B4BDCA;
    --lblbg:#FFFFFFD9; --floatbg:#FFFFFFE6; --hintbg:#FFFFFFCC;
    --lblTxt:#3B475A; --lblSel:#0A4B87;
    --ring:#0D6FC433; --grip:#0D6FC444; --selRing:#0D6FC440;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--txt);font-family:var(--mono);font-size:12px;
  -webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:var(--scroll)}
:focus-visible{outline:2px solid var(--nominal);outline-offset:1px}
/* Una fila de la tabla de desviacion enfocada. El outline va HACIA DENTRO
   (offset negativo): hacia fuera lo recorta el contenedor .tw, que tiene
   overflow, y el anillo se veria a medias justo en la fila de arriba y en la
   de abajo. */
tbody tr[tabindex]:focus-visible{outline:2px solid var(--nominal);outline-offset:-2px}

/* ---------- shell ---------- */
/* Tres bandas apiladas: la de arriba se reparte en tres columnas (paneles,
   3D, desviación), y abajo van la cinta —horizontal por naturaleza, mide la
   longitud desarrollada— y la tabla a todo el ancho, que es lo que necesita
   con sus 14 columnas. El alto de la tabla lo pone #btgrip. */
/* ---------- LA DISTRIBUCIÓN, POR MODO DE TRABAJO ----------
   El programa hace tres trabajos y cada uno quiere la pantalla para otra cosa.
   Antes los tres compartían un reparto fijo y ninguno cabía: la tabla de 13
   columnas enseñaba dos filas y el 3D se quedaba con un tercio de la pantalla.
   Ahora la clase del #app manda sobre la rejilla entera.

     m-model   MODELAR    la tabla a la derecha, entera y de arriba abajo,
                          con el 3D AL LADO — no debajo, que es lo que la
                          ahogaba— y la cinta bajo el 3D.
     m-meas    MEDIR      el modelo grande, la cinta alta y las estadísticas
                          en el lateral. No hay tabla que teclear.
     m-comp    COMPENSAR  ganancias en una tira y los comandos a todo el
                          ancho; el 3D queda como banda de comprobación.
                          Es además el modo taller: si en pantalla no hay nada
                          que no sea compensación, no hace falta un
                          interruptor de bloqueo aparte.

   Lo que un modo no usa se oculta con `display:none`, y su render se salta:
   ver renderPanels() en panels/render.ts.                                  */
#app{display:grid;height:100vh}
#hd{grid-area:hd}#ct{grid-area:ct}#rt{grid-area:rt}
#rb{grid-area:rb}#bt{grid-area:bt}#st{grid-area:st}

/* --- MODELAR: teclear ángulos sin desplazar --- */
#app.m-model{
  grid-template-columns:minmax(320px,1fr) var(--btW);
  grid-template-rows:var(--h) minmax(200px,1fr) var(--ribbon) var(--statusH);
  grid-template-areas:"hd hd" "ct bt" "rb bt" "st st"}
#app.m-model #rt{display:none}

/* --- MEDIR: mirar la pieza --- */
#app.m-meas{
  grid-template-columns:minmax(320px,1fr) var(--rtW);
  grid-template-rows:var(--h) minmax(200px,1fr) calc(var(--ribbon) + 46px) var(--statusH);
  grid-template-areas:"hd hd" "ct rt" "rb rb" "st st"}
#app.m-meas #bt{display:none}

/* --- COMPENSAR: la tabla de comandos manda, y no hay nada más --- */
#app.m-comp{
  grid-template-columns:1fr;
  grid-template-rows:var(--h) minmax(200px,1fr) var(--ribbon) var(--compVP) var(--statusH);
  grid-template-areas:"hd" "bt" "rb" "ct" "st"}
#app.m-comp #rt{display:none}
/* ---------- el 3D a pantalla completa ----------
   Pliega la tabla, el lateral y la cinta sin salir del modo: la tabla sigue
   donde estaba y el sitio en ella no se pierde. Es para mirar la pieza, que
   es la mitad del trabajo y la que peor llevaba compartir la pantalla. */
#app.solo{grid-template-columns:1fr;
  grid-template-rows:var(--h) 1fr var(--statusH);
  grid-template-areas:"hd" "ct" "st"}
#app.solo #bt,#app.solo #rt,#app.solo #rb,#app.solo #rtgrip{display:none}

/* Los dos tiradores siguen ahí en los tres modos, pero cada modo les da otro
   trabajo (ver bindGrips en app/events/grips.ts):

     #rtgrip   MODELAR el ancho de la tabla · MEDIR el ancho del lateral
               COMPENSAR nada: no hay columna a la derecha, y se esconde
     #btgrip   COMPENSAR el alto de la banda 3D · los demás el alto de la cinta

   Sin esto el tirador de la izquierda movía --rtW en un modo donde el lateral
   no existe, y no pasaba nada al arrastrarlo. */
#app.m-comp #rtgrip{display:none}

/* ---------- header ---------- */
#hd{display:flex;align-items:center;gap:14px;padding:0 12px;
  background:linear-gradient(180deg,var(--hd1),var(--hd2));border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:8px;font-family:var(--sans)}
.brand b{font-size:15px;font-weight:700;letter-spacing:.16em}
.brand .v{font-size:9px;letter-spacing:.18em;color:var(--nominal);
  border:1px solid var(--nominal);border-radius:2px;padding:1px 4px;opacity:.85}
.brand .sub{font-size:10px;color:var(--dim2);letter-spacing:.06em;margin-left:4px}
.hspace{flex:1}
.hbtns{display:flex;gap:5px}
.btn{background:var(--panel3);border:1px solid var(--line2);border-radius:3px;
  padding:5px 10px;cursor:pointer;color:var(--txt);white-space:nowrap;transition:.12s}
.btn:hover{background:var(--btnHov);border-color:var(--btnHovBd)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--sel);border-color:var(--selBd);color:var(--selTxt)}
.btn.pri:hover{background:var(--selHov)}
.btn.sm{padding:3px 7px;font-size:11px}
.seg{display:flex;border:1px solid var(--line2);border-radius:3px;overflow:hidden}
.seg button{background:var(--panel3);border:0;padding:5px 9px;cursor:pointer;color:var(--dim)}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--sel);color:var(--selTxt)}

/* ---------- panels ---------- */
#rt{background:var(--panel);overflow-y:auto;overflow-x:hidden}
/* ---------- el cajón de menú ----------
   Flota bajo la barra, encima del 3D. Está FUERA de la rejilla a propósito:
   así abrirlo no reparte la pantalla otra vez ni obliga a un onResize(), y el
   3D y la tabla no dan un salto cada vez que alguien mira las capas. */
#lf{position:fixed;top:var(--h);left:0;width:var(--lfW);z-index:30;
  max-height:calc(100vh - var(--h) - var(--statusH));
  background:var(--panel);border-right:1px solid var(--line2);
  border-bottom:1px solid var(--line2);
  box-shadow:6px 6px 18px #0006;overflow-y:auto;overflow-x:hidden}
#lf[hidden]{display:none}

/* ---------- la barra de menús ---------- */
.menubar{display:flex;gap:2px}
.mn{background:none;border:1px solid transparent;border-radius:3px;padding:5px 11px;
  cursor:pointer;color:var(--dim);font-family:var(--sans);font-size:12px;
  letter-spacing:.02em;transition:.12s}
.mn:hover{color:var(--txt);background:var(--panel3)}
.mn.on{color:var(--txt);background:var(--panel3);border-color:var(--line2)}
.col{display:flex;flex-direction:column;gap:5px}
#rt{border-left:1px solid var(--line);position:relative;z-index:2;background:var(--panel)}
.grp{border-bottom:1px solid var(--line)}
.eyebrow{font-family:var(--sans);font-size:9.5px;font-weight:600;letter-spacing:.15em;
  text-transform:uppercase;color:var(--dim2);padding:10px 11px 6px;display:flex;
  align-items:center;justify-content:space-between;gap:6px}
.eyebrow .n{color:var(--dim2);opacity:.6}
.grp .body{padding:0 8px 10px}

/* layers */
.layer{display:flex;align-items:center;gap:7px;padding:4px 3px;border-radius:3px;cursor:default}
.layer:hover{background:var(--panel2)}
.layer .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px}
/* La casilla en si no puede crecer sin desmontar la lista de capas, asi que
   quien crece es la FILA: el area sensible de un <label> es la etiqueta
   entera, y con 24 px de alto la casilla de 14 se puede pulsar con el dedo o
   con un raton impreciso. */
.layer{min-height:24px}
.layer input[type=checkbox]{accent-color:var(--nominal);width:14px;height:14px;cursor:pointer;
  flex:none}
.sw{width:15px;height:15px;border-radius:3px;border:1px solid #0006;cursor:pointer;
  padding:0;flex:none;overflow:hidden}
.sw::-webkit-color-swatch-wrapper{padding:0}.sw::-webkit-color-swatch{border:0;border-radius:2px}
/* Blanco de clic de 24x24, que es el minimo de WCAG 2.5.8 (AA). El glifo
   sigue siendo pequenio —la X y el simbolo de duplicar se leen mejor finos—
   pero la zona que responde es la caja entera: antes eran ~10x12 px, y fallar
   el boton de borrar en una lista de trece piezas es una prueba y error con
   consecuencias. El ancho que esto le quita al nombre del modelo se recupera
   con min-width:0 en el campo, que ya estaba. */
.xbtn{background:none;border:0;color:var(--dim2);cursor:pointer;padding:0;line-height:1;
  min-width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;
  border-radius:3px;flex:none}
.xbtn:hover{color:var(--bad);background:var(--panel3)}

/* datasets */
.ds{border:1px solid var(--line);border-radius:4px;padding:6px 7px;margin-bottom:6px;
  background:var(--panel2)}
.ds.act{border-color:var(--nominal);box-shadow:0 0 0 1px var(--selRing) inset}
.ds .top{display:flex;align-items:center;gap:6px}
/* el nombre del modelo se edita aquí mismo: campo sin marco hasta que se toca,
   para que la tarjeta siga leyéndose como una ficha y no como un formulario */
.ds input.nm{flex:1;min-width:0;font-size:11.5px;padding:2px 4px;width:auto;
  background:transparent;border-color:transparent;border-radius:3px}
.ds input.nm:hover{border-color:var(--line2);background:var(--inputbg)}
.ds input.nm:focus{border-color:var(--nominal);background:var(--inputbg)}
.ds .meta{display:flex;gap:9px;margin-top:4px;font-size:10px;color:var(--dim)}
.ds .meta b{font-weight:400;color:var(--txt)}

/* ---------- viewport ---------- */
/* overflow:hidden es lo que impide que el lienzo 3D se monte sobre el panel
   derecho mientras se arrastra #rtgrip. El otro medio freno es onResize(). */
#ct{position:relative;display:flex;flex-direction:column;background:var(--vpbg);
  min-width:0;overflow:hidden}
#vpwrap{position:relative;flex:1;min-height:0}
#vp{position:absolute;inset:0;display:block}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-50%);font-size:10px;padding:1px 4px;
  border-radius:2px;background:var(--lblbg);border:1px solid var(--line2);white-space:nowrap;
  letter-spacing:.03em;color:var(--lblTxt)}
.lbl.sel{color:var(--lblSel);border-color:currentColor}
/* La cota lleva su color en un punto, no en el texto: un color de identidad
   elegido sobre fondo oscuro se lava sobre fondo claro, y lo que hay que poder
   leer es la cifra. */
.lbl .swatch{display:inline-block;width:6px;height:6px;border-radius:1px;
  margin-right:4px;vertical-align:baseline}
#vptool{position:absolute;top:8px;left:8px;display:flex;gap:5px;align-items:center;
  background:var(--floatbg);border:1px solid var(--line);border-radius:4px;padding:5px 7px;
  backdrop-filter:blur(6px);flex-wrap:wrap;
  /* deja sitio a la leyenda, que está fija arriba a la derecha: con las
     palabras alemanas la barra llegaba a meterse debajo. El reserva casa
     con el max-width de #vplegend más los dos márgenes de 8 px. */
  max-width:calc(100% - 234px)}
#vplegend{position:absolute;top:8px;right:8px;background:var(--floatbg);border:1px solid var(--line);
  border-radius:4px;padding:7px 9px;backdrop-filter:blur(6px);font-size:10.5px;
  min-width:132px;max-width:210px}
#vplegend .row{display:flex;align-items:center;gap:6px;padding:1.5px 0}
#vplegend .dot{width:9px;height:3px;border-radius:2px;flex:none}
.scalebar{margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}
.scalebar .grad{height:7px;border-radius:2px;margin:3px 0 2px;
  background:linear-gradient(90deg,var(--ok),var(--warn),var(--bad))}
.scalebar .ends{display:flex;justify-content:space-between;color:var(--dim);font-size:9.5px}
.tag{font-size:9.5px;color:var(--dim2);letter-spacing:.1em;text-transform:uppercase;
  font-family:var(--sans);font-weight:600}
#hint{position:absolute;bottom:8px;left:8px;font-size:10px;color:var(--dim2);
  background:var(--hintbg);padding:3px 7px;border-radius:3px}
/* indicador de ejes: esquina inferior derecha, libre (#hint va abajo a la
   izquierda y #vplegend arriba a la derecha) */
#gizmo{position:absolute;bottom:8px;right:8px;width:68px;height:68px;
  pointer-events:none;opacity:.92}
/* tirador para ensanchar el panel derecho */
#rtgrip{position:absolute;top:0;bottom:0;right:-3px;width:7px;z-index:12;
  cursor:col-resize;background:transparent}
#rtgrip:hover,#rtgrip.drag{background:var(--grip)}

/* ---------- ribbon (signature) ---------- */
#rb{border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  background:var(--panel);position:relative;min-height:0;overflow:hidden}
#rbc{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer}
#rbtitle{position:absolute;top:6px;left:10px;font-family:var(--sans);font-size:9px;
  font-weight:600;letter-spacing:.15em;color:var(--dim2);pointer-events:none;text-transform:uppercase}

/* tirador para subir y bajar la tabla de abajo. Va en el borde superior de la
   cinta: se arrastra el bloque entero (cinta + tabla). */
#btgrip{position:absolute;top:-3px;left:0;right:0;height:7px;z-index:12;
  cursor:row-resize;background:transparent}
#btgrip:hover,#btgrip.drag{background:var(--grip)}

/* ---------- bloque de abajo: pestañas + tabla a todo el ancho ---------- */
#bt{display:flex;flex-direction:column;background:var(--panel);min-height:0;
  overflow:hidden;border-top:1px solid var(--line)}
#panes{flex:1;min-height:0;overflow:auto}

/* ---------- tabs ---------- */
#tabs{display:flex;border-bottom:1px solid var(--line);background:var(--panel2);position:sticky;top:0;z-index:5}
#tabs button{background:none;border:0;border-bottom:2px solid transparent;
  padding:9px 18px;cursor:pointer;color:var(--dim);font-family:var(--sans);font-size:10px;
  font-weight:600;letter-spacing:.11em;text-transform:uppercase}
#tabs button.on{color:var(--txt);border-bottom-color:var(--nominal);background:var(--panel3)}
.pane{display:none}.pane.on{display:block}

/* ---------- forms ---------- */
/* Sin flechas nativas: robaban ancho y tapaban las cifras.
   Sustitutos: teclas Flecha arriba/abajo y rueda del ratón sobre el campo
   enfocado (ver el manejador `wheel` en bind()).                          */
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

/* Un par etiqueta/campo NO crece con la pantalla. En una banda de 1600 px, un
   solo par estirado dejaba la etiqueta pegada al borde izquierdo y su campo al
   derecho con un metro de vacío en medio; lo que se quiere ahí son varios
   pares por renglón. `auto-fit` los reparte y `max-width` impide que el
   último superviviente se estire. */
.fgrid{display:grid;grid-template-columns:1fr 112px;gap:6px 10px;align-items:center;padding:2px 0;
  max-width:460px}
.fgrid label{font-size:11.5px;color:var(--dim)}
.fgrid.w3{grid-template-columns:1fr 72px 72px}
/* dos pares etiqueta/campo por renglón: la cabecera del modelo tiene que caber
   en una banda baja, o empuja la tabla fuera de la pantalla */
.fgrid.pair{grid-template-columns:auto 82px auto 82px;gap:5px 10px;max-width:none}
/* La tira de ajustes de COMPENSAR va a todo el ancho, pero repartida en
   columnas de ancho fijo en vez de un par estirado por renglón. */
#app.m-comp #panes .grp .body{display:flex;flex-wrap:wrap;gap:6px 28px;align-items:flex-start}
#app.m-comp #panes .grp .body > *{flex:0 1 auto}
#app.m-comp #panes .grp .body > .tw{flex:1 1 100%}
#app.m-comp #panes .grp .body > .hintline{flex:1 1 100%}
/* un botón de acción no tiene por qué medir 1460 px */
#panes .row .btn.grow{max-width:420px}
/* ni una celda de compensación 700 px: la tabla crece con las columnas que
   estén activas y para de crecer cuando ya caben todas */
#app.m-comp #panes table.cmd{max-width:1150px}
.mhead{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;padding-top:8px}
.mhead .eyebrow{padding:0 0 5px}
.mcol{min-width:210px}
.mcol.nm{flex:1;min-width:220px;max-width:420px}
input[type=text],input[type=number],select{background:var(--inputbg);border:1px solid var(--line2);
  border-radius:3px;padding:6px 8px;width:100%;font-size:12.5px;line-height:1.2;
  font-variant-numeric:tabular-nums}
input[type=number]{text-align:right}
input:hover,select:hover{border-color:var(--inputHovBd)}
input:focus,select:focus{border-color:var(--nominal);outline:0;
  box-shadow:0 0 0 2px var(--ring);background:var(--inputbg2)}
input[type=range]{width:100%;accent-color:var(--nominal);height:16px}
.rangerow{display:grid;grid-template-columns:1fr 62px;gap:8px;align-items:center}
.rangerow .val{text-align:right;color:var(--nominal);font-variant-numeric:tabular-nums}
.hintline{font-size:10px;color:var(--dim2);line-height:1.45;padding:4px 0 2px}

/* ---------- tables ---------- */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:4px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{background:var(--panel3);font-family:var(--sans);font-size:9px;font-weight:600;
  letter-spacing:.09em;text-transform:uppercase;color:var(--dim);padding:6px 5px;
  text-align:right;white-space:nowrap;position:sticky;top:0}
th:first-child,td:first-child{text-align:left}
td{padding:2px 4px;text-align:right;border-top:1px solid var(--line);white-space:nowrap;font-size:12px}
tbody tr:hover{background:var(--panel2)}
tbody tr.sel{background:var(--sel)}
tbody tr.clk{cursor:pointer}
/* El ancho de una celda editable se mide en DÍGITOS: box-sizing es border-box,
   así que del min-width hay que descontar los 12 px de padding. Con la mono a
   12.5 px un dígito son ~7 px, y de ahí salen los números de abajo. */
td input{padding:5px 6px;font-size:12.5px;border-color:transparent;background:transparent;
  min-width:59px}
/* la tabla de comandos aprieta dos dígitos más: sus celdas llevan cifras más
   cortas (un Δ, no una longitud de tres enteros y tres decimales) */
table.cmd td input{min-width:52px}
td input:hover{border-color:var(--line2);background:var(--inputbg)}
td input:focus{border-color:var(--nominal);background:var(--inputbg);box-shadow:0 0 0 2px var(--ring)}
/* la tabla LRA no se comprime: si no cabe, el contenedor .tw desplaza en X
   y el panel derecho se puede ensanchar arrastrando #rtgrip.              */
table.lra{min-width:910px}
/* las dos últimas son de leer, no de teclear: sitio propio para que Σ L no
   quede pegada al borde ni bajo la barra de desplazamiento */
table.lra th:nth-child(n+12),table.lra td:nth-child(n+12){min-width:76px}
table.lra th:last-child,table.lra td:last-child{padding-right:12px}
tfoot tr.foot td{border-top:1px solid var(--line2);color:var(--dim);
  background:var(--panel3)}
tfoot tr.foot td:first-child{font-family:var(--sans);font-size:9px;letter-spacing:.09em;
  text-transform:uppercase}
/* el ancho de la tabla de comandos lo pone paneComp() según cuántos
   parámetros se estén corrigiendo: con uno solo tiene que caber sin desplazar,
   porque la celda de Δ aplicada es la única editable. */
table.marks{min-width:540px}
td.dcol input[type=text]{text-align:right}
.marks td:first-child{white-space:nowrap;display:flex;gap:5px;align-items:center}
.ori{display:inline-block;width:15px;text-align:center;border-radius:2px;font-size:9.5px;
  padding:0 3px;border:1px solid}
.ori.W{color:var(--oriW);border-color:var(--oriWbd)}
.ori.T{color:var(--oriT);border-color:var(--oriTbd)}
.v-ok{color:var(--ok)}.v-warn{color:var(--warn)}.v-bad{color:var(--bad)}
/* WCAG 1.4.1: fuera de tolerancia NO puede decirse solo con el color.
   Una de cada doce personas no distingue el rojo del verde, y estas tablas
   además se fotocopian y se imprimen en blanco y negro para llevarlas a la
   máquina. Un signo detrás de la cifra viaja por los tres canales.
   `!` = pasada de tolerancia, `!!` = más del doble. No es adorno: es la MISMA
   escala que `cls()`, que ya reparte en tres. */
.v-warn::after,.v-bad::after{content:'!';font-weight:700;font-size:.82em;
  margin-left:3px;vertical-align:.08em}
.v-bad::after{content:'!!'}
/* El sello de versión usa v-bad para decir «compilado sobre cambios sin
   confirmar». Eso no es una tolerancia y el signo ahí sobra: el texto ya dice
   «+sucio». */
#st .ver::after{content:none}
/* Un <input> no admite ::after —los elementos reemplazados no tienen caja de
   contenido donde ponerlo— así que la recta por debajo del mínimo se marca con
   el TRAZO del borde, que es el otro canal que no es color. */
input.v-bad,input.v-warn{border-style:dashed}
.v-dim{color:var(--dim2)}
.chip{display:inline-block;padding:0 5px;border-radius:8px;font-size:10px;border:1px solid}
.chip.ok{color:var(--ok);border-color:#2C6B4C;background:#3FD68C14}
.chip.bad{color:var(--bad);border-color:#7A2C36;background:#FF4D5E14}

/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:7px 9px}
.stat .k{font-family:var(--sans);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim2)}
.stat .v{font-size:16px;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .u{font-size:10px;color:var(--dim);margin-left:2px}

/* status */
#st{display:flex;align-items:center;gap:0;background:var(--panel2);
  border-top:1px solid var(--line);font-size:10.5px;color:var(--dim);overflow:hidden}
#st .c{padding:0 11px;border-right:1px solid var(--line);white-space:nowrap;
  height:100%;display:flex;align-items:center;gap:5px}
#st b{font-weight:400;color:var(--txt);font-variant-numeric:tabular-nums}
/* El sello de compilación se empuja al extremo y no roba atención, pero tiene
   que estar SIEMPRE visible: es lo único que distingue la copia del taller de
   la publicada cuando alguien reporta un número raro. */
#st .ver{margin-left:auto;border-right:0;border-left:1px solid var(--line)}
#st .ver b{color:var(--dim)}
#st .ver.v-bad b{color:var(--bad)}

.row{display:flex;gap:5px;align-items:center}
.row.wrap{flex-wrap:wrap}
.mt6{margin-top:6px}.mt10{margin-top:10px}.mb6{margin-bottom:6px}
.grow{flex:1}
.divider{height:1px;background:var(--line);margin:9px 0}
/* El aviso es una SALVAGUARDA: si no se lee, no sirve. Estaba con tres
   literales fuera del sistema de tokens y en tema claro quedaba a ~1.7:1 sobre
   el panel, muy por debajo del 4.5:1 que pide WCAG 1.4.3. Ahora usa tokens
   propios, definidos en los dos temas como todo lo demás. */
.warnbox{border:1px solid var(--warnBd);background:var(--warnBg);border-radius:4px;padding:6px 8px;
  font-size:10.5px;color:var(--warnTxt);line-height:1.45}

@media (max-width:1180px){#app{grid-template-columns:206px 1fr 300px}}

/* ---------- modelos (variantes) ---------- */
.refbadge{font-family:var(--sans);font-size:8px;font-weight:700;letter-spacing:.12em;
  color:var(--nominal);border:1px solid var(--nominal);border-radius:2px;padding:0 3px;
  flex:none;opacity:.9}
/* Procedencia de una pieza. Una pieza inventada por el simulador y una medida
   se veían igual, y con eso se puede compensar contra números que no existen. */
.srcbadge{font-family:var(--sans);font-size:8px;font-weight:700;letter-spacing:.12em;
  border:1px solid currentColor;border-radius:2px;padding:0 3px;flex:none;opacity:.9;
  cursor:help}
.srcbadge.sim{color:var(--synthetic)}
.srcbadge.meas{color:var(--measured)}
.srcbadge.unk{color:var(--dim2)}

/* ---------- resorte medido ----------
   Una cifra sola no dice si vale: al lado van la dispersión y el n, y en
   ámbar el aviso de que el resorte depende del ángulo comandado. */
.sbrow{display:flex;align-items:baseline;gap:6px;padding:2px 0;
  font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums}
.sbrow .k{flex:1;color:var(--dim);font-family:var(--sans);font-size:10px;letter-spacing:.06em}
.sbrow .v{color:var(--txt);font-size:13px}
.sbrow .v .u{color:var(--dim);font-size:9px;margin-left:1px}
.sbrow .pm{color:var(--dim2);cursor:help}
.sbrow .n{color:var(--dim2);font-size:10px}
.sbrow .warn{flex-basis:100%;color:var(--warn);font-family:var(--sans);font-size:9.5px;cursor:help}
.linkbtn{background:none;border:0;color:var(--dim2);cursor:pointer;padding:3px 0 0;
  font-family:var(--sans);font-size:9.5px;letter-spacing:.06em;text-align:left;width:100%}
.linkbtn:hover{color:var(--nominal);text-decoration:underline}
.layer input[type=radio]{accent-color:var(--nominal);width:13px;height:13px;cursor:pointer}
.ds .meta b{font-variant-numeric:tabular-nums}

/* La columna Δ va PEGADA a su parámetro: la corrección se escribe al lado del
   dato sin perder el valor original. Fondo propio para que se lean como par. */
td.dcol,th.dcol{background:var(--dcolbg)}
td.dcol input{color:var(--corrected);min-width:56px}
td.dcol input.z{color:var(--dim2)}
/* Una celda que NO se entendió. El texto rechazado se queda a la vista en rojo
   en vez de esfumarse: antes volvía al valor de antes, que es lo mismo que se
   ve cuando el ajuste sí se acepta y no mueve nada. Va después de `.z` a
   propósito, misma especificidad, para ganar cuando la celda estaba en cero. */
td.dcol input.badcell,input.badcell{color:var(--bad);border-color:var(--bad)}
th.dcol{color:var(--corrected);opacity:.75}
tbody tr.hasd td:first-child{box-shadow:inset 2px 0 0 var(--corrected)}
.dv{color:var(--corrected)}
/* 12 columnas no caben en el panel: se desplaza en X dentro de .tw y el panel
   se puede ensanchar arrastrando #rtgrip. */


/* Un doblez SIN MEDIR no es un doblez que salió perfecto. La tabla los pintaba
   igual —«+0.000»— y esa es la lectura natural: «ese está bien». Se atenúan, se
   rayan en diagonal y el número se sustituye por un guion, que no se puede
   confundir con un cero. */
tr.nomeas td{opacity:.55}
tr.nomeas td:first-child{border-left:2px solid var(--dim2)}
td.nomeas{text-align:center;color:var(--dim2);font-weight:600}
</style>

ado con la misma pieza libre en el espacio. Es la consecuencia que se mide.",pinWorstKink:"Peor codo",pinStress:"Esfuerzo",pinOfYield:"del límite",pinYield:"En algún punto la barra pasa del límite elástico: al soltarla NO vuelve, y la pieza que sale no es la que dice el modelo. Con el material sin confirmar esto es un aviso, no una medida — pero el sitio donde ocurre sí es real.",pinYieldTip:"Tensión de flexión en la fibra más alejada, comparada con el límite elástico del material. Por encima del 100 % la deformación deja de ser recuperable.",pinOpen:"{n} contacto(s) sin cerrar",pinOpenTip:"El solver no pudo llevar la barra a tocar estos pines. Suele significar un fixture imposible: dos pines que piden la barra en dos sitios a la vez, o uno metido tan adentro que la pieza tendría que romperse para llegar.",pinKink:"Codo °",pinCurv:"Curvatura °/m",pinSigma:"σ MPa",matRho:"Densidad",matRhoTip:"Peso del material por metro cúbico. Solo la usa la flecha por gravedad: es lo que hace que la barra se cuelgue entre apoyos. Provisional como el resto del material.",sag:"Flecha",sagTip:"Cuánto se cuelga la barra por su propio peso en el tramo que ACABA en este pedestal, en milímetros. El voladizo de cada punta cuenta como ménsula y es donde más se nota: la longitud va a la cuarta potencia. La orientación manda más que el vano — de plano se cuelga (ancho/espesor)² veces más que de canto, que con 40×12 son once veces.",sagNote:"La flecha se calcula tramo a tramo como viga biapoyada, y los voladizos como ménsula. Una viga continua sobre varios apoyos es MÁS rígida que eso, así que este número sobreestima: es el lado seguro. Cada tramo se trata como recto — los dobleces dentro de un vano no rigidizan aquí. Cuando llegue el escaneo de una barra recta certificada montada en el fixture, esto se contrasta contra la flecha medida y deja de ser una estimación.",sagBad:"La flecha por gravedad pasa de la tolerancia de punto. Eso entra en la medición como un error que NO es de doblado: el lazo intentará corregirlo y no podrá. Añade un apoyo en el tramo peor, o acorta el voladizo.",sagNoMat:"Flecha: falta el material",sagNoMatTip:"Sin densidad y sin módulo elástico no hay número que dar. Se rellenan en la pestaña Amarre.",matE:"Módulo E",matYield:"Límite elástico",matTip:"Solo hace falta para pasar de deformación a esfuerzo. La FORMA que toma la barra sujeta no depende de E: con sección constante se cancela en el reparto, y hay una prueba de que cambiarlo no mueve un solo punto.",matProv:"Material PROVISIONAL: son valores de manual de un 6061-T6, no los de la colada que está en el taller. Sirven para ver dónde se concentra el esfuerzo; para afirmar «esta pieza se pasa por 12 MPa» hace falta el certificado del material.",mach:"Máquina",machTitle:"Comando de máquina",machCols:"Columnas, en este orden",machAxis:"Eje abs.",machSep:"Separador",machDec:"Decimales",machLen:"Longitudes",machAng:"Ángulos",machSignA:"Signo del ángulo",machSignR:"Signo del rodado",machSignTip:"Invierte el signo SOLO en el archivo. La cinemática no se toca: los mismos números siguen doblando la misma pieza en pantalla. Está aquí porque una máquina puede tener el eje montado al revés, y eso se corrige al escribir, no en el motor.",machRot:"Rodado como",machRotDelta:"giro respecto al anterior",machRotAbs:"posición absoluta del eje",machRotTip:"El modelo guarda cuánto GIRA el eje en cada estación, porque la máquina lo sostiene entre dobleces. Hay controles que quieren en cambio la posición absoluta del eje. Las dos describen la misma pieza; elegir la equivocada dobla bien la primera estación y mal todas las demás.",machHead:"Con encabezado",machCrlf:"Fin de línea CRLF",machCrlfTip:"Muchos controles de máquina no leen un fin de línea de UNIX. Con esto el archivo termina cada línea como espera un control de Windows.",machTail:"Fila de la cola",machTailTip:"Una última fila con la recta de salida. Sin ella el archivo no dice cuánto material queda después del último doblez, y las columnas que no le corresponden salen vacías, no en cero: un cero en la columna del ángulo es un doblez de cero grados, o sea una instrucción.",machPrev:"Vista previa",machMore:"y {n} fila(s) más.",machExport:"Exportar comando",machDirty:"Hay un ajuste manual escrito y sin aplicar. El archivo lleva el comando guardado, no lo que muestra la tabla de compensación: aplica primero, o el ajuste no sale.",machNote:"El formato que lee la dobladora está pedido y no ha llegado, así que aquí no se adivina: se deja a la vista. Antes de mandar una barra, comprueba en la vista previa las unidades y los signos contra una pieza que ya conozcas — es lo único de este archivo que no se puede deshacer. El perfil viaja en el JSON de la pieza, así que un archivo de máquina de hace meses se puede volver a generar igual.",lims:"Límites",limWhat:"Umbral",limVal:"Valor",limDef:"Fábrica",limState:"Estado",limWait:"Espera",limTouched:"tocado",limFactory:"de fábrica",limProv:"provisional · {p}",limRead:"Al leer un dato medido",limLoop:"Guardas del lazo",limReset:"Volver a los de fábrica",limHitStraight:"Con este umbral, {n} recta(s) de esta pieza no caben.",limNote:"Estos números no mueven ningún PI: deciden qué se rechaza, de qué dato se desconfía y cuánto puede corregir el lazo de una vez. Viajan en el JSON de la pieza, así que un archivo guardado dice con qué umbrales se juzgó. «Provisional» significa que el valor se eligió a falta de un dato que está pedido: A.6 es la repetibilidad real del escaneo (σ) y B.2 la cota de la máquina. Un 0 apaga esa vigilancia.",lim_axisMin:"Eje legible",lim_axisMinTip:"Desvío mínimo para creerle el EJE a un doblez medido. Por debajo, la dirección lateral es ruido: el eje se hereda del doblez anterior en vez de inventarlo. La regla real es atan(3σ/avance). Solo se aplica a lo MEDIDO; en un modelo tecleado un doblez de 0.2° es deliberado.",lim_piMin:"PI separados",lim_piMinTip:"Distancia mínima entre dos PI de un archivo importado. Dos puntos más juntos dan una dirección de puro ruido y de ahí un doblez inventado que además envenena la fila siguiente. La regla real es 5σ. Con dos PI pegados se rechaza el archivo entero: significa que la extracción de la nube salió mal.",lim_scaleMin:"Escala mínima",lim_scaleMinTip:"Fracción del paso nominal por debajo de la cual la nube importada no puede ser la misma pieza. NO es una tolerancia: caza un export cuyas columnas son la DESVIACIÓN y no la coordenada, o metros leídos como milímetros. Solo por abajo: a un escaneo con puntos de menos el paso medio le SUBE, y eso no es un archivo malo.",lim_straightMin:"Recta mínima",lim_straightMinTip:"Recta entre tangencias que hace falta para que quepan los herramentales: mordaza más carrera del cabezal. Es una cota de la MÁQUINA, no del escáner. Una recta negativa se lista aparte pase lo que pase: son dos herramentales en el mismo sitio.",lim_dead:"Banda muerta (ángulo)",lim_deadTip:"Por debajo de esta diferencia contra el nominal, el lazo no corrige: es ruido de medición y perseguirlo hace oscilar la pieza. 0 la apaga.",lim_deadFeed:"Banda muerta (avance)",lim_deadFeedTip:"Lo mismo que la banda muerta del ángulo, en milímetros y sobre el avance.",lim_maxStep:"Tope por ciclo (ángulo)",lim_maxStepTip:"Corrección máxima que el lazo puede aplicar de una vez. Un salto mayor no es una desviación de proceso: es un dato malo o un doblez que cruzó de rama. Se recorta y se sigue, en vez de mandarlo a la máquina. 0 quita el tope.",lim_maxStepFeed:"Tope por ciclo (avance)",lim_maxStepFeedTip:"Lo mismo que el tope del ángulo, en milímetros y sobre el avance.",fabHead:"Esta pieza no se puede fabricar como está:",fabNeg:"la recta que entra a {b} es NEGATIVA: los herramentales se cruzan.",fabShort:"la recta que entra a {b} no llega a {n} mm, que es lo que necesita el herramental.",fabTail:"la recta de salida no llega a {n} mm.",fabOver:"{b} pide más de {n}° de desvío: los largos de esa fila salen topados.",fileUnread:"el sistema no dejó leer el archivo (¿se movió, a: celdas, puntos, modelos, cotas, colocación y compensación aplicada. No deshace la cámara, el tema, el idioma, las capas ni el modo. 50 pasos.",soloTip:"Plegar la tabla y el lateral para ver la pieza entera (tecla F). Al volver, la tabla sigue donde estaba.",expPts:"Exportar puntos",modeModel:"Modelar",modeMeas:"Medir",modeComp:"Compensar",modeModelTip:"Teclear la pieza: la tabla entera a la derecha y el modelo al lado.",modeMeasTip:"Mirar la pieza medida: el modelo grande, la cinta alta y las estadísticas.",modeCompTip:"Modo taller: solo se editan las celdas de compensación. Los comandos a todo el ancho y el 3D como banda de comprobación.",sbTrend:"depende del ángulo (%s %/°, r=%r)",sbTrendTip:"El resorte cambia con el ángulo comandado, así que una constante única no describe el proceso. Con esta señal, ajuste por rango de ángulo en vez de adoptar un solo número.",srcSimTip:"Pieza inventada por el simulador. No se ha medido nada.",srcVerifyTip:"Verificación simulada tras aplicar la compensación. Tampoco es una medida.",srcMeasTip:"Pieza medida importada.",srcUnkTip:"Procedencia desconocida: viene de un archivo que no la guardaba.",anchor:"Extremo fijo",aStart:"Amarre (P0)",aEnd:"Libre (punta)",aBest:"Mejor ajuste",insPt:"+ Punto intermedio",delPt:"✕ Punto",ptNote:"Edición ABSOLUTA: al mover un punto los demás se quedan donde están y la cadena LRA se recalcula por inversa. Un punto nuevo nace colineal (ángulo 0), listo para moverse. Editar puntos funde los Δ en la base.",bake:"Fundir Δ",zeroD:"Δ a cero",bakeAsk:`Este modelo tiene Δ sin fundir.

¿Continuar?`,dTip:"Δ punta vs ref",dblz:"dbl",place:"Colocación",pivot:"Pivote",plX:"Mover X",plY:"Mover Y",plZ:"Mover Z",plRX:"Giro X",plRY:"Giro Y",plRZ:"Giro Z",plReset:"Restablecer colocación",plNote:"Mueve y gira la PIEZA sobre un suelo quieto, alrededor del PI que elijas como origen: la cuadrícula y la cámara no se mueven. Los pedestales la siguen, apoyando siempre en el suelo. No toca ningún avance, ángulo ni radio.",lMarks:"Puntos de referencia",marks:"Puntos de referencia",addMark:"+ Punto",nearPi:"PI",distPi:"Dist.",markNote:"Cotas sueltas en el espacio: el punto se une con el PI más cercano del modelo activo y la cifra dice a cuánto quedó. Sirve para acotar contra el fixture o un datum de taller. «+ Punto» lo crea sobre el doblez seleccionado.",cCalc:"Δ calc.",cAdj:"Δ aplicada",zeroTw:"Δ manual a cero",cellNote:"La celda Δ aplicada se escribe como en una hoja de cálculo, y hay tres formas. RELATIVO A LO QUE VES: un operador al principio opera sobre lo que muestra la celda — «+2» le suma 2, «-0.3» le quita tres décimas, «*1.1» le pone un 10 % más. RELATIVO AL LAZO: lo que calculó se llama c — «c», «c+2», «(c+1)/2». ABSOLUTO: un número suelto reemplaza, y «=» lo fuerza, que es como se escribe un negativo suelto — «=-3». El resto de la tabla es de solo lectura.",cellBad:`No se entendió lo que escribiste, así que no se guardó nada.

h way it leans, measured in plan from +X. Meaningless without tilt: a vertical cylinder spun about its own axis is the same cylinder.",pinDist:"Dist.",pinDistTip:"Distance between the pin axis and the bar axis where they come closest, in space. With plumb pins it equals the plan distance; leaning, it does not.",pinSide:"Side",pinSideAuto:"auto",pinSideTip:'Which side of the bar the pin is MOUNTED on. Fixture data, not a reading: read off the current shape, the moment an angle sends the bar past the post the reading flips and the contact closes on the wrong face — that is, it solves a part that went through the pin. "auto" decides from the geometry the first time, which is what it did before.',pinState:"State",pinHolding:"holding",pinEmpty:'No pins. "Seed" lays a few along the bar touching from alternating sides, which is how a bar is really held: all on one side would let it pivot on them.',addPin:"+ Pin",seedPin:"Seed pins",clearPin:"Remove all",pinNote:"A pedestal supports; a pin PREVENTS. Pins are bolted to the table, so they do not move when the part is repositioned: what changes is whether they still touch. A pin with clearance to spare pushes nothing and is ignored — not an error, the fixture may carry more pins than this part uses.",pinOffNote:"With clamping off the bar is computed free in space. Pins can still be placed and seen in the 3D view, but they deform nothing.",pinNoneHold:'No pin is touching the bar, so clamping changes nothing. Check height and position: the "Reaches" column says which ones fall short of the bar and "Gap" how far away they stop.',pinHeldN:"{n} pin(s) holding",pinTip:"Tip",pinTipTip:"How far the free end moves because the bar is held, compared with the same part free in space. It is the consequence you can measure.",pinWorstKink:"Worst kink",pinStress:"Stress",pinOfYield:"of yield",pinYield:"Somewhere the bar goes past its elastic limit: released, it does NOT spring back, and the part that comes out is not the one the model describes. With the material unconfirmed this is a warning, not a measurement — but where it happens is real.",pinYieldTip:"Bending stress at the outermost fibre against the material yield strength. Past 100 % the deformation stops being recoverable.",pinOpen:"{n} contact(s) left open",pinOpenTip:"The solver could not bring the bar onto these pins. That usually means an impossible fixture: two pins asking for the bar in two places at once, or one set so deep the part would have to break to reach it.",pinKink:"Kink °",pinCurv:"Curvature °/m",pinSigma:"σ MPa",matRho:"Density",matRhoTip:"Weight of the material per cubic metre. Only the gravity sag uses it: it is what makes the bar hang between supports. Provisional like the rest of the material.",sag:"Sag",sagTip:"How far the bar hangs under its own weight on the span ENDING at this pedestal, in millimetres. The overhang at each end counts as a cantilever and is where it shows most: length goes to the fourth power. Orientation matters more than span — flat it hangs (width/thickness)² times more than on edge, which with 40×12 is eleven times.",sagNote:"Sag is computed span by span as a simply supported beam, with the overhangs as cantilevers. A continuous beam over several supports is STIFFER than that, so this number overestimates: it is the safe side. Each span is treated as straight — bends inside a span do not stiffen it here. Once a certified straight bar is scanned mounted in the fixture, this gets checked against the measured sag and stops being an estimate.",sagBad:"Gravity sag exceeds the point tolerance. That enters the measurement as an error that is NOT a bending error: the loop will try to correct it and cannot. Add a support on the worst span, or shorten the overhang.",sagNoMat:"Sag: material missing",sagNoMatTip:"Without density and elastic modulus there is no number to give. Both are filled in on the Clamping tab.",matE:"Modulus E",matYield:"Yield strength",matTip:"Only needed to turn deformation into stress. T e Zelle · Mausrad oder Strg+↑ ↓ ändern den Wert um einen Schritt. Beim Betreten einer Zelle wird ihr Wert markiert: Tippen ersetzt ihn. Bis zu drei Nachkommastellen werden angenommen.",twnote:"Torsionslänge = gerades Stück (mm), über das die Torsion verteilt wird, mittig auf der Geraden. 0 = die ganze Gerade. Kein Schnittpunkt wird verschoben: es wird nur festgelegt, wo die Torsion stattfindet.",proc:"Simulierter Prozess (virtuelles Teil)",sbW:"Rückfederung hochkant",sbT:"Rückfederung flach",slip:"Vorschubschlupf",biasR:"Drehversatz",noise:"Scan-Rauschen",seed:"Startwert",simulate:"Gemessenes Teil erzeugen",dNone:"Kein gemessenes Teil. Simulieren Sie eines oder importieren Sie ein CSV.",deltas:"Abweichungen je Biegung",dA:"Δ Winkel",dR:"Δ Rollung",dF:"Δ Vorschub",dP:"Abw. Spitze",statMaxA:"Max. Δ Auslenkung",statRms:"RMS Auslenkung",statTip:"Abweichung freies Ende",statOut:"Außer Toleranz",gains:"Korrekturverstärkungen",gainW:"Verstärkung hochkant",gainT:"Verstärkung flach",gainR:"Verstärkung Rollung",gainF:"Verstärkung Vorschub",gainNote:"Rollung und Vorschub haben eigene Verstärkungen, weil sie nicht dieselbe Größe sind wie die Biegung. »Hochkant« und »flach« sind Rückfederungskonstanten: wie weit sich der Stab beim Loslassen öffnet. Die Rollung hat keine Feder — sie wurde ganz korrigiert, also mit Verstärkung 1,0, genau das, was beim Winkel verboten ist, weil es mit dem Messrauschen schwingt — und den Vorschub verschiebt der Schlupf, ein anderes Phänomen.",what:"Was korrigieren",cAng:"Biegewinkel",cRot:"Rollung",cFeed:"Vorschübe",apply:"Kompensation anwenden",reset:"Befehle zurücksetzen",cmdTbl:"Maschinenbefehle",cNow:"Aktuell",cNew:"Neu",cDelta:"Δ",predict:"Erwarteter Restfehler",verify:"Prüfen (2. Teil fahren)",noMeas:"Für die Kompensation wird ein gemessenes Teil benötigt.",stLen:"Abwicklungslänge",stBends:"Biegungen",stDatum:"Bezug",stMax:"Max. Abw.",stUnits:"Einheiten",engine:"Rechenkern",stVer:"Version",stVerTip:"Laufender Build. Bei einer auffälligen Zahl Es wurde nichts geladen: der bisherige Stand bleibt. Die Zeile unten ist für die Programmbetreuung.`,dStart:"Anfangsende",dBest:"Globale beste Anpassung",formula:"neuer Befehl = aktueller Befehl + Verstärkung × (Nennwert − Messwert)",note:"Nach jeder Korrektur wird die ganze Kette neu erzeugt: die Fortpflanzung zwischen den Biegungen steckt bereits im Modell.",repTitle:"Prüf- und Kompensationsbericht",repDate:"Datum",repPiece:"Teil",ok:"In Toleranz",bad:"Außer Toleranz",piece:"Teil",orW:"Hochkantbiegung (gegen die Breite)",orT:"Flachbiegung (gegen die Dicke)",confirmNew:"Ein neues leeres Modell anlegen? Nicht Gespeichertes geht verloren.",pts:"Punkt",x:"X",y:"Y",z:"Z",variants:"Modelle",addVar:"+ Modell",dupVar:"Duplizieren",setRef:"Als Referenz verwenden",isRef:"REF",srcSim:"SIM",srcVerify:"SIM ✓",srcMeas:"MESS",srcUnk:"K.A.",impCsv:"CSV importieren",impTip:"Gemessene Teile: eine CSV je Teil, mit den Schnittpunkten in den Spalten x,y,z. Es können mehrere Dateien auf einmal gewählt werden.",csvBad:"Diese Dateien enthielten keine drei Punkte mit Koordinaten und wurden nicht importiert:",csvComma:"Dezimaltrennzeichen ist ein Komma; es muss ein Punkt sein",csvCols:"{n} numerische Spalten je Zeile: x,y,z nicht erkennbar. Exportiere nur die Koordinaten oder Index + Koordinaten",csvFew:"weniger als drei Punkte mit Koordinaten",csvScale:"die Punkte schreiten im Mittel {n} mm fort, die des Modells {m} mm: das sind keine Koordinaten der Stange. Meist wurde eine Abweichungsspalte statt der Koordinate exportiert, oder die Einheit ist nicht Millimeter",csvNear:"die Punkte {i} liegen weniger als {d} mm vom vorherigen entfernt: zwei Schnittpunkte aufeinander erfinden eine Biegung. Punktextraktion prüfen",devRowTip:"Abweichung der Biegung {b}. Enter wählt sie in der 3D-Ansicht und in der Tabelle; die Pfeile gehen auf und ab.",pins:"Spannung",lPins:"Bolzen",lHeld:"Gespannte Stange",pinOn:"Stange von den Bolzen gehalten",pinOnTip:"Aus liegt die Stange frei im Raum und das Programm verhält sich genau wie vor der Einführung der Bolzen. Ein kann das Teil nicht dorthin, wohin die Tabelle es schickt: es bleibt, wo die Bolzen es lassen, und verformt sich, um dorthin zu kommen.",pinDoRot:"Rollung gibt ebenfalls nach",pinRotTip:"Ein Bolzen drückt in der Tischebene. Wenn neben dem Winkel auch die Rollung nachgibt, verteilt sich die Verformung meist besser, aber es sind zwei Unbekannte je Station statt einer — eine physikalische Entscheidung, keine Geschwindigkeitseinstellung.",pinTol:"Kontakt",pinTolTip:"Unterhalb dieses Abstands gilt die Stange als am Bolzen anliegend, es gibt nichts zu schließen.",pinDamp:"Verteilung",pinDampTip:"Nahe 0 sammelt sich die Verformung an der nachgiebigsten Station; höhere Werte verteilen sie auf mehr Stationen. Dieselbe Rolle wie die Reglerverstärkung: voll aufgedreht schwingt es.",pinDia:"Ø",pinGap:"Spalt",pinReach:"Erreicht",pinReachTip:"Ein Bolzen, der niedriger ist als die Unterseite der Stange, berührt sie nie, so gut er auch steht: er hält nichts.",pinYes:"ja",pinNo:"nein",pinHold:"Hält",pinHoldTip:"Ein Bolzen kann montiert sein und trotzdem außen vor bleiben: ausgeschaltet bleibt er in der 3D-Ansicht sichtbar, ohne zu wirken — so findet man heraus, welcher Bolzen was verursacht.",pinRef:"Vergleichen mit",pinRefTip:"Mit welcher Form der REFERENZ die übrigen Modelle verglichen werden: der freien — dem Entwurf, dem Teil außerhalb der Vorrichtung — oder der, die es unter den Bolzen tatsächlich annimmt. Beide Fragen sind berechtigt und liefern verschiedene Zahlen: die erste sagt, wie sich die Entwürfe unterscheiden, die zweite, wie sich die entstehenden Teile unterscheiden. Es verschiebt die Ausrichtung, die Versatz-Ebene und die Werte auf jeder Modellkarte.",pinShow:"Zeigen",pinShowFree:"Frei",pinShowHeld:"Gehalten",pinShowBoth:"Beide",pinShowTip:"Welche Stange gezeichnet wird: die der Tabelle (frei im Raum), die tatsächliche unter den Bolzen, oder beide übereinander, um sie auseinanderlaufen zu sehen. Allein wird eine Stange massiv gezeichnet; bei beiden geht die gehaltene ins Drahtgitter — zwei ineinander liegende Volumen sehen matschig aus.",pinTilt:"Neigung",pinTiltTip:"Wie weit der Bolzen aus der Senkrechten kippt, in Grad. 0 = lotrecht. Ein geneigter Bolzen berührt die Stange an anderer Stelle und aus anderer Richtung: der Kontakt wird zwischen beiden Achsen im Raum gelöst, nicht im Grundriss.",pinYaw:"Richtung",pinYawTip:"Wohin er kippt, im Grundriss ab +X gemessen. Ohne Neigung bedeutungslos: ein senkrechter Zylinder um die eigene Achse gedreht ist derselbe Zylinder.",pinDist:"Abst.",pinDistTip:"Abstand zwischen Bolzenachse und Stangenachse an ihrer engsten Stelle, im Raum. Bei lotrechten Bolzen gleich dem Grundrissabstand, bei geneigten nicht.",pinSide:"Seite",pinSideAuto:"auto",pinSideTip:'Auf welcher Seite der Stange der Bolzen MONTIERT ist. Eine Angabe der Vorrichtung, keine Messung: liest man sie aus der aktuellen Form, kippt sie, sobald ein Winkel die Stange über die Bolzenachse hinaus schickt, und der Kontakt schließt an der falschen Fläche — es wird also ein Teil gerechnet, das durch den Bolzen ging. "auto" entscheidet beim ersten Mal aus der Geometrie, so wie es vorher war.',pinState:"Zustand",pinHolding:"hält",pinEmpty:'Keine Bolzen. "Säen" verteilt einige entlang der Stange, abwechselnd von beiden Seiten anliegend — so wird eine Stange wirklich gehalten: alle auf einer Seite ließen sie darauf schwenken.',addPin:"+ Bolzen",seedPin:"Bolzen säen",clearPin:"Alle entfernen",pinNote:"Ein Bock stützt; ein Bolzen VERHINDERT. Bolzen sind auf dem Tisch verschraubt und wandern nicht mit, wenn das Teil neu gesetzt wird: es ändert sich nur, ob sie noch anliegen. Ein Bolzen mit Luft drückt nichts und wird übergangen — kein Fehler, die Vorrichtung darf mehr Bolzen tragen, als dieses Teil braucht.",pinOffNote:"Bei ausgeschalteter Spannung wird die Stange frei im Raum gerechnet. Bolzen lassen sich setzen und ansehen, verformen aber nichts.",pinNoneHold:'Kein Bolzen berührt die Stange, die Spannung ändert also nichts. Prüfe Höhe und Lage: die Spalte "Erreicht" nennt die zu kurzen, "Spalt" den Abstand, in dem sie stehen bleiben.',pinHeldN:"{n} Bolzen halten",pinTip:"Spitze",pinTipTip:"Wie weit sich das freie Ende bewegt, weil die Stange gehalten wird, verglichen mit demselben Teil frei im Raum. Das ist die messbare Folge.",pinWorstKink:"Größter Knick",pinStress:"Spannung",pinOfYield:"der Streckgrenze",pinYield:"Irgendwo überschreitet die Stange die Elastizitätsgrenze: losgelassen federt sie NICHT zurück, und das Teil, das herauskommt, ist nicht das des Modells. Bei unbestätigtem Material ist das ein Hinweis, keine Messung — der Ort stimmt aber.",pinYieldTip:"Biegespannung in der äußersten Faser gegen die Streckgrenze des Materials. Über 100 % ist die Verformung nicht mehr rückgängig.",pinOpen:"{n} Kontakt(e) offen geblieben",pinOpenTip:"Der Löser konnte die Stange nicht an diese Bolzen bringen. Das heißt meist: unmögliche Vorrichtung — zwei Bolzen verlangen die Stange gleichzeitig an zwei Orten, oder einer steht so tief, dass das Teil brechen müsste.",pinKink:"Knick °",pinCurv:"Krümmung °/m",pinSigma:"σ MPa",matRho:"Dichte",matRhoTip:"Gewicht des Materials je Kubikmeter. Nur die Durchbiegung braucht sie: sie lässt die Stange zwischen den Auflagen durchhängen. Vorläufig wie das übrige Material.",sag:"Durchbiegung",sagTip:"Wie weit die Stange unter ihrem Eigengewicht in dem Feld durchhängt, das AN diesem Bock endet, in Millimetern. Der Überstand an jedem Ende zählt als Kragarm und fällt dort am stärksten aus: die Länge geht in der vierten Potenz ein. Die Lage wiegt schwerer als die Stützweite — flach hängt sie (Breite/Dicke)² mal stärker durch als hochkant, bei 40×12 also elfmal.",sagNote:"Die Durchbiegung wird feldweise als Einfeldträger gerechnet, die Überstände als Kragarme. Ein Durchlaufträger über mehrere Auflagen ist steifer, also überschätzt dieser Wert — die sichere Seite. Jedes Feld gilt als gerade; Biegungen innerhalb eines Feldes versteifen hier nicht. Sobald eine zertifiziert gerade Stange in der Vorrichtung gescannt ist, wird das gegen die gemessene Durchbiegung geprüft und ist keine Schätzung mehr.",sagBad:"Die Durchbiegung überschreitet die Punkttoleranz. Sie geht als Fehler in die Messung ein, der KEIN Biegefehler ist: der Regelkreis wird ihn korrigieren wollen und kann es nicht. Setze eine Auflage im schlechtesten Feld oder kürze den Überstand.",sagNoMat:"Durchbiegung: Material fehlt",sagNoMatTip:"Ohne Dichte und E-Modul gibt es keine Zahl. Beide stehen auf der Registerkarte Spannung.",matE:"E-Modul",matYield:"Streckgrenze",matTip:"Wird nur gebraucht, um Verformung in Spannung umzurechnen. Die FORM einer gehaltenen Stange hängt nicht von E ab: bei konstantem Querschnitt kürzt es sich aus der Verteilung heraus, und ein Test belegt, dass eine Änderung keinen Punkt verschiebt.",matProv:'Material VORLÄUFIG: Handbuchwerte für 6061-T6, nicht die der Charge in der Werkstatt. Gut genug, um zu sehen, wo sich Spannung sammelt; für "dieses Teil liegt 12 MPa darüber" braucht es das Werkszeugnis.',mach:"Maschine",machTitle:"Maschinenbefehl",machCols:"Spalten, in dieser Reihenfolge",machAxis:"Abs. Achse",machSep:"Trennzeichen",machDec:"Dezimalstellen",machLen:"Längen",machAng:"Winkel",machSignA:"Vorzeichen Winkel",machSignR:"Vorzeichen Rollung",machSignTip:"Dreht das Vorzeichen NUR in der Datei um. Die Kinematik bleibt unangetastet: dieselben Zahlen biegen am Bildschirm weiterhin dasselbe Teil. Es steht hier, weil eine Maschine die Achse andersherum montiert haben kann, und das wird beim Schreiben korrigiert, nicht im Motor.",machRot:"Rollung geschrieben als",machRotDelta:"Drehung gegenüber der Vorstation",machRotAbs:"absolute Achslage",machRotTip:"Das Modell speichert, wie weit sich die Achse je Station DREHT, denn die Maschine hält sie zwischen den Biegungen. Manche Steuerungen wollen stattdessen die absolute Achslage. Beide beschreiben dasselbe Teil; die falsche Wahl biegt die erste Station richtig und jede weitere falsch.",machHead:"Mit Kopfzeile",machCrlf:"Zeilenende CRLF",machCrlfTip:"Viele Maschinensteuerungen lesen kein UNIX-Zeilenende. Damit endet jede Zeile so, wie es eine Windows-Steuerung erwartet.",machTail:"Zeile für das Endstück",machTailTip:"Eine letzte Zeile mit der Auslaufgeraden. Ohne sie sagt die Datei nicht, wie viel Material nach der letzten Biegung bleibt. Nicht zutreffende Spalten bleiben leer statt null: eine Null in der Winkelspalte ist eine Biegung von null Grad, also eine Anweisung.",machPrev:"Vorschau",machMore:"und {n} weitere Zeile(n).",machExport:"Befehl exportieren",machDirty:"Eine manuelle Korrektur ist eingetragen, aber nicht übernommen. Die Datei enthält den gespeicherten Befehl, nicht das, was die Kompensationstabelle zeigt: erst übernehmen, sonst fehlt die Korrektur.",machNote:"Das Format, das die Biegemaschine liest, ist angefordert und noch nicht eingetroffen, also wird hier nichts geraten: es liegt offen. Prüfe vor der ersten Stange in der Vorschau Einheiten und Vorzeichen gegen ein bekanntes Teil — das ist das Einzige an dieser Datei, was sich nicht rückgängig machen lässt. Das Profil reist im JSON des Teils mit, also lässt sich eine Maschinendatei von vor Monaten identisch neu erzeugen.",lims:"Grenzwerte",limWhat:"Schwelle",limVal:"Wert",limDef:"Werk",limState:"Zustand",limWait:"Wartet auf",limTouched:"geändert",limFactory:"Werkswert",limProv:"vorläufig · {p}",limRead:"Beim Einlesen einer Messung",limLoop:"Schutz des Regelkreises",limReset:"Zurück auf Werkswerte",limHitStraight:"Mit dieser Schwelle passen {n} Gerade(n) dieses Teils nicht.",limNote:'Diese Zahlen verschieben keinen PI: sie entscheiden, was abgelehnt wird, welchem Messwert misstraut wird und wie viel der Regelkreis auf einmal korrigieren darf. Sie reisen im JSON des Teils mit, also nennt eine gespeicherte Datei die Schwellen, nach denen sie beurteilt wurde. "Vorläufig" heißt, der Wert wurde ohne eine angeforderte Angabe gewählt: A.6 ist die reale Wiederholpräzision des Scans (σ), B.2 die Maschinengrenze. Eine 0 schaltet die Prüfung ab.',lim_axisMin:"Lesbare Achse",lim_axisMinTip:"Kleinste Auslenkung, bei der die ACHSE einer gemessenen Biegung noch lesbar ist. Darunter ist die Querrichtung Rauschen, also wird die Achse von der vorherigen Biegung übernommen statt erfunden. Die echte Regel lautet atan(3σ/Vorschub). Gilt nur für GEMESSENE Daten; in einem eingetippten Modell ist eine Biegung von 0,2° Absicht.",lim_piMin:"PI-Abstand",lim_piMinTip:"Kleinster Abstand zwischen zwei PI einer importierten Datei. Näher beieinander ergibt die Richtung reines Rauschen und daraus eine erfundene Biegung, die auch die nächste Zeile vergiftet. Die echte Regel lautet 5σ. Zwei zusammenfallende PI lehnen die ganze Datei ab: die Extraktion aus der Punktwolke ist schiefgegangen.",lim_scaleMin:"Mindestmaßstab",lim_scaleMinTip:"Anteil der Soll-PI-Schrittweite, unterhalb dessen die importierte Wolke nicht dasselbe Teil sein kann. KEINE Toleranz: fängt einen Export ab, dessen Spalten die ABWEICHUNG statt der Koordinate sind, oder Meter, die als Millimeter gelesen werden. Nur nach unten: einem Scan mit fehlenden Punkten wächst die mittlere Schrittweite, und das ist keine schlechte Datei.",lim_straightMin:"Mindestgerade",lim_straightMinTip:"Gerade zwischen den Tangentenpunkten, die das Werkzeug braucht: Spannbacke plus Kopfweg. Eine MASCHINEN-Grenze, keine des Scanners. Eine negative Gerade wird ohnehin getrennt aufgeführt: das sind zwei Werkzeuge am selben Ort.",lim_dead:"Totband (Winkel)",lim_deadTip:"Unter dieser Abweichung vom Soll korrigiert der Regelkreis nicht: das ist Messrauschen, und ihm nachzulaufen bringt das Teil zum Schwingen. 0 schaltet es ab.",lim_deadFeed:"Totband (Vorschub)",lim_deadFeedTip:"Wie das Winkel-Totband, in Millimetern und auf den Vorschub.",lim_maxStep:"Grenze je Zyklus (Winkel)",lim_maxStepTip:"Größte Korrektur, die der Regelkreis auf einmal anbringen darf. Ein größerer Sprung ist keine Prozessdrift: es sind schlechte Daten oder eine Biegung, die den Zweig gewechselt hat. Sie wird gekappt und gemeldet, statt an die Maschine zu gehen. 0 hebt die Grenze auf.",lim_maxStepFeed:"Grenze je Zyklus (Vorschub)",lim_maxStepFeedTip:"Wie die Winkelgrenze, in Millimetern und auf den Vorschub.",fabHead:"Dieses Teil lässt sich so nicht fertigen:",fabNeg:"die Gerade vor {b} ist NEGATIV: die Werkzeuge kollidieren.",fabShort:"die Gerade vor {b} erreicht die vom Werkzeug benötigten {n} mm nicht.",fabTail:"die Auslaufgerade erreicht {n} mm nicht.",fabOver:"{b} verlangt mehr als {n}° Auslenkung: die Längen dieser Zeile sind gekappt.",fileUnread:"Datei vom System nicht lesbar (verschoben, oder von einem anderen Programm geöffnet?)",csvShort:"Diese Teile enthalten WENIGER Punkte als das Modell. Die fehlenden Biegungen bleiben UNGEMESSEN und werden nicht kompensiert:",compSim:"ACHTUNG: {n} der Teile in dieser Rechnung sind SIMULIERT, nicht gemessen. Das Ergebnis beschreibt keine reale Stange.",compShort:"Nur {a} von {b} Biegungen sind gemessen. Die übrigen sind mit — markiert und werden NICHT kompensiert.",rowNoMeas:"Diese Biegung ist nicht gemessen: das Teil hatte weniger Punkte als das Modell. Der Befehl bleibt unverändert.",batchUse:"Median der sichtbaren Teile verwenden ·",batchTip:"Mit nur einem Teil korrigiert der Regelkreis auch dessen Streuung, und das nächste Teil kann schlechter ausfallen. Mit mehreren lässt der Median nur das durch, was sich wiederholt.",batchOn:"Der Regelkreis liest den Median von %n Teilen, nicht das letzte.",batchHint:"Es ist mehr als ein Teil sichtbar: Haken setzen, damit der Regelkreis den Median liest.",spread:"±σ",spreadTip:"Streuung des Winkels über die sichtbaren Teile (skalierter MAD). Groß neben einer großen Abweichung heißt schlechte Wiederholbarkeit, kein falsch eingestellter Bogen.",sbMeas:"Gemessene Rückfederung",sbUse:"Im Simulator verwenden",sbNote:"sb = 1 − gemessener Winkel / befohlener Winkel, je Orientierung. Median ± robustes σ über die Bögen der s
