Es wurde nichts geladen: der bisherige Stand bleibt. Die Zeile unten ist für die Programmbetreuung.`,dStart:"Anfangsende",dBest:"Globale beste Anpassung",formula:"neuer Befehl = aktueller Befehl + Verstärkung × (Nennwert − Messwert)",note:"Nach jeder Korrektur wird die ganze Kette neu erzeugt: die Fortpflanzung zwischen den Biegungen steckt bereits im Modell.",repTitle:"Prüf- und Kompensationsbericht",repDate:"Datum",repPiece:"Teil",ok:"In Toleranz",bad:"Außer Toleranz",piece:"Teil",orW:"Hochkantbiegung (gegen die Breite)",orT:"Flachbiegung (gegen die Dicke)",confirmNew:"Ein neues leeres Modell anlegen? Nicht Gespeichertes geht verloren.",pts:"Punkt",x:"X",y:"Y",z:"Z",variants:"Modelle",addVar:"+ Modell",dupVar:"Duplizieren",setRef:"Als Referenz verwenden",isRef:"REF",srcSim:"SIM",srcVerify:"SIM ✓",srcMeas:"MESS",srcUnk:"K.A.",impCsv:"CSV importieren",impTip:"Gemessene Teile: eine CSV je Teil, mit den Schnittpunkten in den Spalten x,y,z. Es können mehrere Dateien auf einmal gewählt werden.",csvBad:"Diese Dateien enthielten keine drei Punkte mit Koordinaten und wurden nicht importiert:",csvComma:"Dezimaltrennzeichen ist ein Komma; es muss ein Punkt sein",csvCols:"{n} numerische Spalten je Zeile: x,y,z nicht erkennbar. Exportiere nur die Koordinaten oder Index + Koordinaten",csvFew:"weniger als drei Punkte mit Koordinaten",csvScale:"die Punkte schreiten im Mittel {n} mm fort, die des Modells {m} mm: das sind keine Koordinaten der Stange. Meist wurde eine Abweichungsspalte statt der Koordinate exportiert, oder die Einheit ist nicht Millimeter",csvNear:"die Punkte {i} liegen weniger als {d} mm vom vorherigen entfernt: zwei Schnittpunkte aufeinander erfinden eine Biegung. Punktextraktion prüfen",devRowTip:"Abweichung der Biegung {b}. Enter wählt sie in der 3D-Ansicht und in der Tabelle; die Pfeile gehen auf und ab.",pins:"Spannung",lPins:"Bolzen",lHeld:"Gespannte Stange",pinOn:"Stange von den Bolzen gehalten",pinOnTip:"Aus liegt die Stange frei im Raum und das Programm verhält sich genau wie vor der Einführung der Bolzen. Ein kann das Teil nicht dorthin, wohin die Tabelle es schickt: es bleibt, wo die Bolzen es lassen, und verformt sich, um dorthin zu kommen.",pinDoRot:"Rollung gibt ebenfalls nach",pinRotTip:"Ein Bolzen drückt in der Tischebene. Wenn neben dem Winkel auch die Rollung nachgibt, verteilt sich die Verformung meist besser, aber es sind zwei Unbekannte je Station statt einer — eine physikalische Entscheidung, keine Geschwindigkeitseinstellung.",pinTol:"Kontakt",pinTolTip:"Unterhalb dieses Abstands gilt die Stange als am Bolzen anliegend, es gibt nichts zu schließen.",pinDamp:"Verteilung",pinDampTip:"Nahe 0 sammelt sich die Verformung an der nachgiebigsten Station; höhere Werte verteilen sie auf mehr Stationen. Dieselbe Rolle wie die Reglerverstärkung: voll aufgedreht schwingt es.",pinDia:"Ø",pinGap:"Spalt",pinReach:"Erreicht",pinReachTip:"Ob sie sich am KÖRPER des Bolzens treffen oder an einem seiner Enden. Ein Bolzen unterhalb der Stange berührt sie nie, so gut er auch steht, und ein zu hoch angesetzter lässt sie darunter durch: in beiden Fällen hält er nichts.",pinYes:"ja",pinNo:"nein",pinHold:"Hält",pinHoldTip:"Ein Bolzen kann montiert sein und trotzdem außen vor bleiben: ausgeschaltet bleibt er in der 3D-Ansicht sichtbar, ohne zu wirken — so findet man heraus, welcher Bolzen was verursacht.",pinMeasFree:"Es wird die FREIE Stange gezeigt und gemessen, obwohl Spannung oder Last eingeschaltet sind: diese Tabelle, die Bezugspunkte, die PI-Punkte und das Säen beziehen sich auf das Teil ohne jede Halterung, nicht auf das auf dem Tisch. Die Reaktionen nicht: sie stammen aus dem gespannten Teil. Wähle „Gehalten“ oder „Beide“ unter „Zeigen“ im Reiter Spannung, um die vorhandene Stange zu lesen.",pinShow:"Zeigen",pinShowFree:"Frei",pinShowHeld:"Gehalten",pinShowBoth:"Beide",pinShowTip:"Welche Stange gezeigt wird und wogegen ALLES gemessen wird, für alle Modelle zugleich: die freie — die Konstruktion, das Teil außerhalb der Vorrichtung — oder die, die es tatsächlich annimmt, von den Stiften gehalten und unter Eigengewicht hängend. Mit „Gehalten“ oder „Beide“ folgen der gespannten Stange beide Tabellen, die Bezugspunkte, die Durchbiegung, die PI-Punkte und ihre Beschriftungen, der Versatz zwischen Modellen, das Band, die Farben der Auflagen und wo gesäte Auflagen und Stifte entstehen. „Beide“ zeigt die freie zusätzlich als Drahtmodell. Nur zwei Dinge ändern sich nicht: wo das Teil PLATZIERT ist und wo die Auflagen stehen – sie sind auf den Tisch geschraubt.",pinTilt:"Neigung",pinTiltTip:"Wie weit der Bolzen aus der Senkrechten kippt, in Grad. 0 = lotrecht. Ein geneigter Bolzen berührt die Stange an anderer Stelle und aus anderer Richtung: der Kontakt wird zwischen beiden Achsen im Raum gelöst, nicht im Grundriss.",pinYaw:"Richtung",pinYawTip:"Wohin er kippt, im Grundriss ab +X gemessen. Ohne Neigung bedeutungslos: ein senkrechter Zylinder um die eigene Achse gedreht ist derselbe Zylinder.",pinLen:"Länge",pinLenTip:"Wie lang der Bolzen von seiner Basis aus MISST, in Millimetern. Nicht, wie hoch er sitzt: ein zu kurzer erreicht die Stange nie und hält seitlich nichts, so gut er auch steht, und ein zu langer berührt am Ende auch dort, wo er nicht soll. Zum Anheben ohne Verlängern dient die Spalte daneben.",pinZ:"Höhe",pinZTip:"In welcher Höhe über dem Tisch die Basis des Bolzens BEGINNT, in Millimetern. 0 ist der auf den Tisch geschraubte Bolzen, der Normalfall. Angehoben wird er, um eine hoch verlaufende Stange zu erreichen, ohne dass der Bolzen zusätzlich darunter berührt, wo vielleicht ein anderer Abschnitt des Teils vorbeiläuft. Was ihn dort oben hält — ein Klotz, eine Beilage, der Körper der Vorrichtung — wird weder gezeichnet noch gerechnet: das sagt, wo der Zylinder steht, nicht woran er hängt.",pinDist:"Abst.",pinDistTip:"Abstand zwischen Bolzenachse und Stangenachse an ihrer engsten Stelle, im Raum. Bei lotrechten Bolzen gleich dem Grundrissabstand, bei geneigten nicht.",pinSide:"Seite",pinSideAuto:"auto",pinSideTip:'Auf welcher Seite der Stange der Bolzen MONTIERT ist. Eine Angabe der Vorrichtung, keine Messung: liest man sie aus der aktuellen Form, kippt sie, sobald ein Winkel die Stange über die Bolzenachse hinaus schickt, und der Kontakt schließt an der falschen Fläche — es wird also ein Teil gerechnet, das durch den Bolzen ging. "auto" entscheidet beim ersten Mal aus der Geometrie, so wie es vorher war.',pinState:"Zustand",pinHolding:"hält",pinEmpty:'Keine Bolzen. "Säen" verteilt einige entlang der Stange, abwechselnd von beiden Seiten anliegend — so wird eine Stange wirklich gehalten: alle auf einer Seite ließen sie darauf schwenken.',addPin:"+ Bolzen",seedPin:"Bolzen säen",clearPin:"Alle entfernen",pinNote:"Ein Bock stützt; ein Bolzen VERHINDERT. Bolzen sind auf dem Tisch verschraubt und wandern nicht mit, wenn das Teil neu gesetzt wird: es ändert sich nur, ob sie noch anliegen. Ein Bolzen mit Luft drückt nichts und wird übergangen — kein Fehler, die Vorrichtung darf mehr Bolzen tragen, als dieses Teil braucht.",pinOffNote:"Bei ausgeschalteter Spannung wird die Stange frei im Raum gerechnet. Bolzen lassen sich setzen und ansehen, verformen aber nichts.",pinNoneHold:'Kein Bolzen berührt die Stange, die Spannung ändert also nichts. Prüfe Höhe und Lage: die Spalte "Erreicht" nennt die zu kurzen, "Spalt" den Abstand, in dem sie stehen bleiben.',pinHeldN:"{n} Bolzen halten",pinTip:"Spitze",pinTipTip:"Wie weit sich das freie Ende bewegt, weil die Stange gehalten wird, verglichen mit demselben Teil frei im Raum. Das ist die messbare Folge.",pinWorstKink:"Größter Knick",pinStress:"Spannung",pinOfYield:"der Streckgrenze",pinYield:"Irgendwo überschreitet die Stange die Elastizitätsgrenze: losgelassen federt sie NICHT zurück, und das Teil, das herauskommt, ist nicht das des Modells. Bei unbestätigtem Material ist das ein Hinweis, keine Messung — der Ort stimmt aber.",pinYieldTip:"Biegespannung in der äußersten Faser gegen die Streckgrenze des Materials. Über 100 % ist die Verformung nicht mehr rückgängig.",pinOpen:"{n} Kontakt(e) offen geblieben",pinOpenTip:"Der Löser konnte die Stange nicht an diese Bolzen bringen. Das heißt meist: unmögliche Vorrichtung — zwei Bolzen verlangen die Stange gleichzeitig an zwei Orten, oder einer steht so tief, dass das Teil brechen müsste.",pinKink:"Knick °",pinCurv:"Krümmung °/m",pinSigma:"σ MPa",matRho:"Dichte",matRhoTip:"Gewicht des Materials je Kubikmeter. Nur die Durchbiegung braucht sie: sie lässt die Stange zwischen den Auflagen durchhängen. Vorläufig wie das übrige Material.",sag:"Durchbiegung",sagTip:"Wie weit die Stange unter ihrem Eigengewicht in dem Feld durchhängt, das AN diesem Bock endet, in Millimetern. Der Überstand an jedem Ende zählt als Kragarm und fällt dort am stärksten aus: die Länge geht in der vierten Potenz ein. Die Lage wiegt schwerer als die Stützweite — flach hängt sie (Breite/Dicke)² mal stärker durch als hochkant, bei 40×12 also elfmal.",sagNote:"Die Durchbiegung wird feldweise als Einfeldträger gerechnet, die Überstände als Kragarme. Ein Durchlaufträger über mehrere Auflagen ist steifer, also überschätzt dieser Wert — die sichere Seite. Jedes Feld gilt als gerade; Biegungen innerhalb eines Feldes versteifen hier nicht. Sobald eine zertifiziert gerade Stange in der Vorrichtung gescannt ist, wird das gegen die gemessene Durchbiegung geprüft und ist keine Schätzung mehr.",sagBad:"Die Durchbiegung überschreitet die Punkttoleranz. Sie geht als Fehler in die Messung ein, der KEIN Biegefehler ist: der Regelkreis wird ihn korrigieren wollen und kann es nicht. Setze eine Auflage im schlechtesten Feld oder kürze den Überstand.",sagNoMat:"Durchbiegung: Material fehlt",sagNoMatTip:"Ohne Dichte und E-Modul gibt es keine Zahl. Beide stehen auf der Registerkarte Spannung.",matE:"E-Modul",matYield:"Streckgrenze",matTip:"Wird nur gebraucht, um Verformung in Spannung umzurechnen. Die FORM einer gehaltenen Stange hängt nicht von E ab: bei konstantem Querschnitt kürzt es sich aus der Verteilung heraus, und ein Test belegt, dass eine Änderung keinen Punkt verschiebt.",matProv:'Material VORLÄUFIG: Handbuchwerte für 6061-T6, nicht die der Charge in der Werkstatt. Gut genug, um zu sehen, wo sich Spannung sammelt; für "dieses Teil liegt 12 MPa darüber" braucht es das Werkszeugnis.',load:"Die Last",loadOn:"Das Teil hat Gewicht",loadOnTip:"Damit bleibt die Stange nicht mehr dort, wo die Tabelle sie lässt: sie fällt dorthin, wohin die Last zieht, legt sich auf die Böcke und drückt gegen die Stifte, die ihr im Weg stehen. Eine Auflage DRÜCKT, aber sie ZIEHT nicht: nimmt eine Biegung das Teil von einem Stift weg, dann geht es weg; und holt die Schwerkraft es zurück, dann kommt es zurück.",loadG:"Schwerkraft (×g)",loadGTip:"Vielfaches des Eigengewichts. 1 ist das echte Gewicht; 0 nimmt es weg und lässt nur den Druck an der Spitze; 2 zeigt, was sich bewegen würde, wäre das Teil doppelt so schwer.",loadDir:"Richtung",loadDirTip:"Wohin die Last zieht. (0, 0, −1) ist nach unten, also das, was die Schwerkraft tut. Zeigt sie woandershin, drückt sie das Teil gegen eine bestimmte Spannstelle, um zu sehen, ob diese hält.",loadTipF:"Druck an der Spitze",loadTipTip:"Eine weitere Kraft, am freien Ende und in derselben Richtung. Es ist der Finger, mit dem man prüft, ob sich das Teil bewegt, dort angesetzt, wo es am meisten ausmacht.",loadWeight:"Gewicht",loadWeightTip:"Was das ganze Teil wiegt, zuzüglich des Drucks an der Spitze. Es folgt aus Dichte und Querschnitt: eine 1,7 m lange Stange 40×12 sind rund 22 N, also 2,2 kg.",loadCarried:"Die Auflagen tragen",loadCarriedTip:"Wie viel von diesem Gewicht sich auf Böcke und Stifte verteilt: die Summe der Reaktionen, auf die Last projiziert.",loadRoot:"Die Spannzange hält",loadRootTip:"Was die Auflagen nicht tragen, bleibt am ersten Ende hängen, wo das Teil gegriffen ist. Das ist die Zahl, die beantwortet: «brauche ich mehr Böcke?». Negativ heißt, die Spannzange zieht nach UNTEN: die Auflagen tragen mehr als das ganze Teil, weil die Stange über einem von ihnen hebelt.",loadRootDown:"Die Spannzange zieht das Teil mit {n} N nach UNTEN: die Stange hebelt über einem Bock, und die Auflagen tragen mehr als das ganze Teil. Mit der Spannzange der Vorrichtung ist das möglich, heißt aber, dass sich das erste Ende ohne sie heben würde: prüfen, dass die Zange spannt und nicht nur aufliegt.",loadDrop:"Bewegt um",loadDropTip:"Wie weit sich der ungünstigste Punkt verschoben hat, gemessen gegen das freie Teil. Enthält sowohl die Wirkung der Stifte ALS AUCH die der Last: um beides zu trennen, die Last abschalten und dieselbe Zahl lesen.",loadPene:"Dringt ein",loadPeneTip:"Wie tief eine Auflage in die Stange eindringt. Der Kontakt wird mit einer sehr steifen Feder abgebildet, das sollte also im Mikrometerbereich herauskommen; erreicht es die Toleranz, war die Feder zu weich und den Reaktionen daneben ist zu misstrauen.",loadN:"Reaktion",loadNTip:'Mit welcher Kraft diese Auflage drückt, in Newton. Ein Strich heißt, dass das Teil sie nicht berührt; eine Antwort, kein Fehler. „k. A." heißt etwas ganz anderes: dass das Modell dort nichts sagen kann.',loadNd:"k. A.",glLost:"Die Grafikkarte hat die 3D-Ansicht verloren (Standby, Bildschirmwechsel oder Treiber). Daten und Tabellen sind in Ordnung. Die 3D-Ansicht kommt von selbst zurück, wenn der Browser sie wiederherstellt; falls nicht, Arbeit speichern und die Seite neu laden.",faultMsg:"Etwas ist schiefgelaufen ({e}). Die Anzeige ist möglicherweise nicht aktuell: Arbeit speichern und die Seite neu laden.",faultClose:"Hinweis schließen",clashCard:"Passt nicht in die Vorrichtung: {n} dringt {d} mm ein",clashTip:"Mit diesem Modell auf der Vorrichtung bleibt diese Auflage INNERHALB des Stabs, egal wie weit der Stab nachgibt. Das passiert, wenn das Teil nicht das ist, das die Vorrichtung hält: eine um wenige Grad andere Biegung kann den Stab auf die andere Seite eines Stifts legen, und keine elastische Verformung bringt ihn hindurch zurück. Die gezeichnete gespannte Form ist die nächstliegende, die das Modell findet, keine montierbare. In der 3D-Ansicht sitzt an jeder kollidierenden Auflage eine rote Raute.",fixLoadOn:'Hier wiegt das Teil {w} N, eingeschaltet im Reiter Spannung. Die Spalte „Reaktion" sagt, wie viel dieses Gewichts jeder Bock trägt.',colVis:"Sichtbar in 3D",xyTip:"Wo er auf dem Tisch steht, in Millimetern. Ein Werkstattmaß: es wandert nicht mit, wenn das Teil neu gesetzt wird.",pedHTip:"Wie hoch die Auflage über dem Tisch steht, in Millimetern.",pedPadTip:"Länge der Auflage, in Millimetern. Bei einer langen Auflage hebt schon ein halbes Grad zu viel Neigung die Stange an.",pedTiltTip:'Mit welcher Neigung die Auflage eingestellt ist, in Grad. Positiv, wenn sie ansteigt, wie bei „Verlangt".',pedWantTip:"Die Neigung, die die Stange direkt über dem Bock hat, in Grad. Positiv, wenn sie ansteigt.",pedD:"Δ",pedDTip:"Wie viel Neigung der Auflage zu viel oder zu wenig ist: ihre Neigung minus die, die die Stange verlangt, in Grad. Rot, wenn das die Stange am Ende der Auflage stärker anhebt als die Punkttoleranz; die Hilfe jeder Zelle nennt die Millimeter.",pedSTip:"Wo sie sich berühren, entlang der Stange vom ersten Ende aus gemessen, in Millimetern.",pedPlanTip:"Abstand im Grundriss vom Fuß zur Stangenachse, in Millimetern. Er sagt, ob der Bock unter der Stange steht oder daneben.",pedGapTip:"Luft zwischen Auflage und Unterseite der Stange, in Millimetern. Positiv: die Stange schwebt und liegt nicht auf. Negativ: der Bock steht im Weg und würde das Teil anheben.",pedSpanTip:"Abstand zum vorigen Bock entlang der Stange, in Millimetern. Er bestimmt die Durchbiegung durch Schwerkraft.",pinDiaTip:"Durchmesser des Bolzens, in Millimetern.",pinGapTip:"Luft zwischen Bolzen und Stange an ihrer engsten Stelle, in Millimetern. Positiv: die Stange erreicht den Bolzen nicht. Negativ: der Bolzen sitzt, wo die Stange wäre, und drückt sie weg.",pinStateTip:"Ob die Spannung diesen Bolzen gerade benutzt, um die Stange zu halten.",fixLoadOff:'Hier hat das Teil kein Gewicht. Die Durchbiegung nutzt schon sein Eigengewicht, aber wie viel jeder Bock trägt, ergibt sich erst mit „Das Teil hat Gewicht" im Reiter Spannung: dann erscheint die Spalte „Reaktion".',stHold:"Von den Bolzen gehalten",stLoad:"Das Teil hat Gewicht",stHoldLoad:"Gehalten und belastet",stHoldGo:"Klick: öffnet den Reiter Spannung, dort sind beide Schalter.",loadNdTip:"Hier lässt sich keine Zahl nennen. Diese Auflage liegt auf einem Abschnitt, den das Modell nicht biegen kann — die Unbekannten sind die Knicke an den Stationen — also ändert sich ihr Spalt nicht, wie sehr das Teil auch nachgibt, und eine dort ausgegebene Kraft würde nichts bedeuten. Es ist keine Null: eine Null heißt, dass das Teil sie nicht berührt.",loadNoDof:"Das Teil hat keine Stationen, also kann dieses Modell es nicht hängen lassen: was es wiegt, ist bekannt, wie sich das Gewicht auf die Auflagen verteilt, nicht. Bei einem geraden Stab hilft die Schwerkraft-Durchbiegung im Reiter Vorrichtung.",loadStuck:"Nicht gelöst",loadStuckTip:"Die Suche nach dem Gleichgewicht hielt an, bevor sie es erreichte: was daneben steht, ist der letzte Versuch und keine Lösung. Das passiert meist, wenn eine Auflage bei jedem Schritt in den Kontakt hinein- und wieder herausgeht, oder wenn zwei Auflagen um denselben Punkt streiten.",loadStuckWarn:"Die Last erreichte in {n} Schritten kein Gleichgewicht: die Zahlen unten sind der letzte Versuch und lassen sich nicht vertreten. Erhöhe die Dämpfung, oder rücke die Auflage beiseite, die genau an der Grenze zum Berühren steht.",loadNote:"Die Unbekannten sind die Knicke an den STATIONEN, also hängt in diesem Modell ein gerades Stück in der Mitte nicht durch: diesen Teil liefert die Durchbiegung auf der Registerkarte Vorrichtung. Beide betrachten Verschiedenes an derselben Stange und addieren sich nicht. Die Steifigkeit einer Station wird als EI/L angesetzt, für einen Kragarm rund viermal weicher als der exakte Wert: das ergibt Größenordnung und Richtung, keine belastbare Durchbiegung.",loadNoMat:"Ohne Dichte und ohne E-Modul gibt es keine Last zum Aufbringen. Beides wird gleich darüber beim Material eingetragen.",loadHang:"Die Auflagen tragen weniger als die Hälfte des Gewichts: das Teil hängt an seinem eigenen Ende. Zu sehen ist ein Kragarm, kein aufgelegtes Teil; entweder fehlen Böcke, oder die vorhandenen berühren es nicht.",mach:"Maschine",machTitle:"Maschinenbefehl",machCols:"Spalten, in dieser Reihenfolge",machAxis:"Abs. Achse",machSep:"Trennzeichen",machDec:"Dezimalstellen",machLen:"Längen",machAng:"Winkel",machSignA:"Vorzeichen Winkel",machSignR:"Vorzeichen Rollung",machSignTip:"Dreht das Vorzeichen NUR in der Datei um. Die Kinematik bleibt unangetastet: dieselben Zahlen biegen am Bildschirm weiterhin dasselbe Teil. Es steht hier, weil eine Maschine die Achse andersherum montiert haben kann, und das wird beim Schreiben korrigiert, nicht im Motor.",machRot:"Rollung geschrieben als",machRotDelta:"Drehung gegenüber der Vorstation",machRotAbs:"absolute Achslage",machRotTip:"Das Modell speichert, wie weit sich die Achse je Station DREHT, denn die Maschine hält sie zwischen den Biegungen. Manche Steuerungen wollen stattdessen die absolute Achslage. Beide beschreiben dasselbe Teil; die falsche Wahl biegt die erste Station richtig und jede weitere falsch.",machHead:"Mit Kopfzeile",machCrlf:"Zeilenende CRLF",machCrlfTip:"Viele Maschinensteuerungen lesen kein UNIX-Zeilenende. Damit endet jede Zeile so, wie es eine Windows-Steuerung erwartet.",machTail:"Zeile für das Endstück",machTailTip:"Eine letzte Zeile mit der Auslaufgeraden. Ohne sie sagt die Datei nicht, wie viel Material nach der letzten Biegung bleibt. Nicht zutreffende Spalten bleiben leer statt null: eine Null in der Winkelspalte ist eine Biegung von null Grad, also eine Anweisung.",machPrev:"Vorschau",machMore:"und {n} weitere Zeile(n).",machExport:"Befehl exportieren",machDirty:"Eine manuelle Korrektur ist eingetragen, aber nicht übernommen. Die Datei enthält den gespeicherten Befehl, nicht das, was die Kompensationstabelle zeigt: erst übernehmen, sonst fehlt die Korrektur.",machNote:"Das Format, das die Biegemaschine liest, ist angefordert und noch nicht eingetroffen, also wird hier nichts geraten: es liegt offen. Prüfe vor der ersten Stange in der Vorschau Einheiten und Vorzeichen gegen ein bekanntes Teil — das ist das Einzige an dieser Datei, was sich nicht rückgängig machen lässt. Das Profil reist im JSON des Teils mit, also lässt sich eine Maschinendatei von vor Monaten identisch neu erzeugen.",lims:"Grenzwerte",limWhat:"Schwelle",limVal:"Wert",limDef:"Werk",limState:"Zustand",limWait:"Wartet auf",limTouched:"geändert",limFactory:"Werkswert",limProv:"vorläufig · {p}",limRead:"Beim Einlesen einer Messung",limLoop:"Schutz des Regelkreises",limReset:"Zurück auf Werkswerte",limHitStraight:"Mit dieser Schwelle passen {n} Gerade(n) dieses Teils nicht.",limNote:'Diese Zahlen verschieben keinen PI: sie entscheiden, was abgelehnt wird, welchem Messwert misstraut wird und wie viel der Regelkreis auf einmal korrigieren darf. Sie reisen im JSON des Teils mit, also nennt eine gespeicherte Datei die Schwellen, nach denen sie beurteilt wurde. "Vorläufig" heißt, der Wert wurde ohne eine angeforderte Angabe gewählt: A.6 ist die reale Wiederholpräzision des Scans (σ), B.2 die Maschinengrenze. Eine 0 schaltet die Prüfung ab.',lim_axisMin:"Lesbare Achse",lim_axisMinTip:"Kleinste Auslenkung, bei der die ACHSE einer gemessenen Biegung noch lesbar ist. Darunter ist die Querrichtung Rauschen, also wird die Achse von der vorherigen Biegung übernommen statt erfunden. Die echte Regel lautet atan(3σ/Vorschub). Gilt nur für GEMESSENE Daten; in einem eingetippten Modell ist eine Biegung von 0,2° Absicht.",lim_piMin:"PI-Abstand",lim_piMinTip:"Kleinster Abstand zwischen zwei PI einer importierten Datei. Näher beieinander ergibt die Richtung reines Rauschen und daraus eine erfundene Biegung, die auch die nächste Zeile vergiftet. Die echte Regel lautet 5σ. Zwei zusammenfallende PI lehnen die ganze Datei ab: die Extraktion aus der Punktwolke ist schiefgegangen.",lim_scaleMin:"Mindestmaßstab",lim_scaleMinTip:"Anteil der Soll-PI-Schrittweite, unterhalb dessen die importierte Wolke nicht dasselbe Teil sein kann. KEINE Toleranz: fängt einen Export ab, dessen Spalten die ABWEICHUNG statt der Koordinate sind, oder Meter, die als Millimeter gelesen werden. Nur nach unten: einem Scan mit fehlenden Punkten wächst die mittlere Schrittweite, und das ist keine schlechte Datei.",lim_straightMin:"Mindestgerade",lim_straightMinTip:"Gerade zwischen den Tangentenpunkten, die das Werkzeug braucht: Spannbacke plus Kopfweg. Eine MASCHINEN-Grenze, keine des Scanners. Eine negative Gerade wird ohnehin getrennt aufgeführt: das sind zwei Werkzeuge am selben Ort.",lim_dead:"Totband (Winkel)",lim_deadTip:"Unter dieser Abweichung vom Soll korrigiert der Regelkreis nicht: das ist Messrauschen, und ihm nachzulaufen bringt das Teil zum Schwingen. 0 schaltet es ab.",lim_deadFeed:"Totband (Vorschub)",lim_deadFeedTip:"Wie das Winkel-Totband, in Millimetern und auf den Vorschub.",lim_maxStep:"Grenze je Zyklus (Winkel)",lim_maxStepTip:"Größte Korrektur, die der Regelkreis auf einmal anbringen darf. Ein größerer Sprung ist keine Prozessdrift: es sind schlechte Daten oder eine Biegung, die den Zweig gewechselt hat. Sie wird gekappt und gemeldet, statt an die Maschine zu gehen. 0 hebt die Grenze auf.",lim_maxStepFeed:"Grenze je Zyklus (Vorschub)",lim_maxStepFeedTip:"Wie die Winkelgrenze, in Millimetern und auf den Vorschub.",fabHead:"Dieses Teil lässt sich so nicht fertigen:",fabNeg:"die Gerade vor {b} ist NEGATIV: die Werkzeuge kollidieren.",fabShort:"die Gerade vor {b} erreicht die vom Werkzeug benötigten {n} mm nicht.",fabTail:"die Auslaufgerade erreicht {n} mm nicht.",fabOver:"{b} verlangt mehr als {n}° Auslenkung: die Längen dieser Zeile sind gekappt.",fileUnread:"Datei vom System nicht lesbar (verschoben, oder von einem anderen Programm geöffnet?)",csvShort:"Diese Teile enthalten WENIGER Punkte als das Modell. Die fehlenden Biegungen bleiben UNGEMESSEN und werden nicht kompensiert:",compSim:"ACHTUNG: {n} der Teile in dieser Rechnung sind SIMULIERT, nicht gemessen. Das Ergebnis beschreibt keine reale Stange.",compShort:"Nur {a} von {b} Biegungen sind gemessen. Die übrigen sind mit — markiert und werden NICHT kompensiert.",rowNoMeas:"Diese Biegung ist nicht gemessen: das Teil hatte weniger Punkte als das Modell. Der Befehl bleibt unverändert.",compFewN:"Der Regelkreis liest {a} Teil(e), nötig sind {n}. Mit weniger verfolgt der Befehl die Streuung dieses Teils und das nächste kann schlechter ausfallen.",batchUse:"Median der sichtbaren Teile verwenden ·",batchTip:"Mit nur einem Teil korrigiert der Regelkreis auch dessen Streuung, und das nächste Teil kann schlechter ausfallen. Mit mehreren lässt der Median nur das durch, was sich wiederholt.",batchOn:"Der Regelkreis liest den Median von %n Teilen, nicht das letzte.",batchHint:"Es ist mehr als ein Teil sichtbar: Haken setzen, damit der Regelkreis den Median liest.",spread:"±σ",spreadTip:"Streuung des Winkels über die sichtbaren Teile (skalierter MAD). Groß neben einer großen Abweichung heißt schlechte Wiederholbarkeit, kein falsch eingestellter Bogen.",sbMeas:"Gemessene Rückfederung",sbUse:"Im Simulator verwenden",sbNote:"sb = 1 − gemessener Winkel / befohlener Winkel, je Orientierung. Median ± robustes σ über die Bögen der sichtbaren Teile; nahezu gerade (<1°) bleiben draußen.",sbCircular:"Achtung: %n der sichtbaren Teile sind simuliert. Die Rückfederung aus einem erfundenen Teil zu schätzen liefert das, was unten schon steht — ein geschlossener Kreis, keine Messung.",sbSpreadTip:"Streuung über Bögen und Teile. Ist sie so groß wie der Wert selbst, ist diese Rückfederung nicht gemessen, sondern geraten.",mnFile:"Datei",mnModel:"Modelle",mnView:"Ansicht",mnPieces:"Teile",soloOn:"Nur 3D",soloOff:"Zurück",rotAxisTip:"Wie weit sich die Biegeachse an dieser Station dreht. Sie endet bei %e°.",rotHeadTip:"Drehung der Biegeachse gegenüber der vorherigen Station. Eine 0 lässt die Achse stehen: der Prozess ist sequenziell.",history:"Verlauf",undo:"Rückgängig",redo:"Wiederholen",histNote:"Macht Änderungen am Teil rückgängig: Zellen, Punkte, Modelle, Bezugspunkte, Platzierung und angewandte Kompensation. Nicht Kamera, Thema, Sprache, Ebenen oder Modus. 50 Schritte.",soloTip:"Tabelle und Seitenleiste einklappen, um das ganze Teil zu sehen (Taste F). Beim Zurückkommen steht die Tabelle, wo sie war.",expPts:"Punkte exportieren",modeModel:"Modellieren",modeMeas:"Messen",modeComp:"Kompensieren",modeModelTip:"Das Teil eingeben: die ganze Tabelle rechts und das Modell daneben.",modeMeasTip:"Das gemessene Teil ansehen: großes Modell, hohes Band und die Statistik.",modeCompTip:"Werkstattmodus: nur die Kompensationszellen sind editierbar. Befehle über die volle Breite, das 3D als Kontrollstreifen.",sbTrend:"hängt vom Winkel ab (%s %/°, r=%r)",sbTrendTip:"Die Rückfederung ändert sich mit dem befohlenen Winkel, eine einzige Konstante beschreibt den Prozess also nicht. Bei diesem Hinweis je Winkelbereich anpassen, statt eine Zahl zu übernehmen.",srcSimTip:"Vom Simulator erzeugtes Teil. Es wurde nichts gemessen.",srcVerifyTip:"Simulierte Prüfung nach der Kompensation. Ebenfalls keine Messung.",srcMeasTip:"Importiertes gemessenes Teil.",srcUnkTip:"Herkunft unbekannt: aus einer Datei, die sie nicht gespeichert hat.",anchor:"Festes Ende",aStart:"Einspannung (P0)",aEnd:"Frei (Spitze)",aBest:"Beste Anpassung",insPt:"+ Zwischenpunkt",delPt:"✕ Punkt",ptNote:"ABSOLUTE Bearbeitung: wird ein Punkt verschoben, bleiben die übrigen stehen und die LRA-Kette wird rückwärts neu berechnet. Ein neuer Punkt entsteht kollinear (Winkel 0) und ist sofort verschiebbar. Das Bearbeiten von Punkten rechnet die Δ in die Basis ein.",bake:"Δ einrechnen",zeroD:"Δ auf null",bakeAsk:`Dieses Modell hat noch nicht eingerechnete Δ.

Die Punktbearbeitung arbeitet auf der wirksamen Geometrie, deshalb werden die Δ in die Basis eingerechnet und auf null gesetzt.
