says where the cylinder is, not what it hangs from.",pinDist:"Dist.",pinDistTip:"Distance between the pin axis and the bar axis where they come closest, in space. With plumb pins it equals the plan distance; leaning, it does not.",pinSide:"Side",pinSideAuto:"auto",pinSideTip:'Which side of the bar the pin is MOUNTED on. Fixture data, not a reading: read off the current shape, the moment an angle sends the bar past the post the reading flips and the contact closes on the wrong face — that is, it solves a part that went through the pin. "auto" decides from the geometry the first time, which is what it did before.',pinState:"State",pinHolding:"holding",pinEmpty:'No pins. "Seed" lays a few along the bar touching from alternating sides, which is how a bar is really held: all on one side would let it pivot on them.',addPin:"+ Pin",seedPin:"Seed pins",clearPin:"Remove all",pinNote:"A pedestal supports; a pin PREVENTS. Pins are bolted to the table, so they do not move when the part is repositioned: what changes is whether they still touch. A pin with clearance to spare pushes nothing and is ignored — not an error, the fixture may carry more pins than this part uses.",pinOffNote:"With clamping off the bar is computed free in space. Pins can still be placed and seen in the 3D view, but they deform nothing.",pinNoneHold:'No pin is touching the bar, so clamping changes nothing. Check height and position: the "Reaches" column says which ones fall short of the bar and "Gap" how far away they stop.',pinHeldN:"{n} pin(s) holding",pinTip:"Tip",pinTipTip:"How far the free end moves because the bar is held, compared with the same part free in space. It is the consequence you can measure.",pinWorstKink:"Worst kink",pinStress:"Stress",pinOfYield:"of yield",pinYield:"Somewhere the bar goes past its elastic limit: released, it does NOT spring back, and the part that comes out is not the one the model describes. With the material unconfirmed this is a warning, not a measurement — but where it happens is real.",pinYieldTip:"Bending stress at the outermost fibre against the material yield strength. Past 100 % the deformation stops being recoverable.",pinOpen:"{n} contact(s) left open",pinOpenTip:"The solver could not bring the bar onto these pins. That usually means an impossible fixture: two pins asking for the bar in two places at once, or one set so deep the part would have to break to reach it.",pinKink:"Kink °",pinCurv:"Curvature °/m",pinSigma:"σ MPa",matRho:"Density",matRhoTip:"Weight of the material per cubic metre. Only the gravity sag uses it: it is what makes the bar hang between supports. Provisional like the rest of the material.",sag:"Sag",sagTip:"How far the bar hangs under its own weight on the span ENDING at this pedestal, in millimetres. The overhang at each end counts as a cantilever and is where it shows most: length goes to the fourth power. Orientation matters more than span — flat it hangs (width/thickness)² times more than on edge, which with 40×12 is eleven times.",sagNote:"Sag is computed span by span as a simply supported beam, with the overhangs as cantilevers. A continuous beam over several supports is STIFFER than that, so this number overestimates: it is the safe side. Each span is treated as straight — bends inside a span do not stiffen it here. Once a certified straight bar is scanned mounted in the fixture, this gets checked against the measured sag and stops being an estimate.",sagBad:"Gravity sag exceeds the point tolerance. That enters the measurement as an error that is NOT a bending error: the loop will try to correct it and cannot. Add a support on the worst span, or shorten the overhang.",sagNoMat:"Sag: material missing",sagNoMatTip:"Without density and elastic modulus there is no number to give. Both are filled in on the Clamping tab.",matE:"Modulus E",matYield:"Yield strength",matTip:"Only needed to turn deformation into stress. The SHAPE a held bar takes does not depend on E: with a constant section it cancels out of the split, and there is a test proving that changing it moves no point at all.",matProv:'Material is PROVISIONAL: handbook values for 6061-T6, not the heat sitting in the shop. Good enough to see where stress concentrates; to claim "this part is over by 12 MPa" you need the material certificate.',load:"The load",loadOn:"The part has weight",loadOnTip:"With this on the bar stops staying where the table leaves it: it falls the way the load pulls, rests on the pedestals and presses against whatever pins are in its way. A support PUSHES but never PULLS, so if a bend takes the part away from a pin, away it goes; and if gravity brings it back, back it comes.",loadSlow:"This part has {n} bends. Past {lim}, working out how it settles stops being instant: at 34 it takes about a second, at 60 more than fifteen. It is not a limit and the answer is just as good — this is here so it does not look as if the program froze. What drives it is the NUMBER of bends: neither the length of the bar nor how close together they are changes anything.",loadG:"Gravity (×g)",loadGTip:"Multiple of the self weight. 1 is the real weight; 0 removes it and leaves only the tip push; 2 shows what would move if the part were twice as heavy.",loadDir:"Direction",loadDirTip:"Which way the load pulls. (0, 0, −1) is downwards, which is what gravity does. Pointing it elsewhere pushes the part against one particular clamp, to see whether that clamp holds it.",loadTipF:"Push at the tip",loadTipTip:"One more force, at the free end and along the same direction. It is the finger you poke the part with, placed where it shows most.",loadWeight:"Weight",loadWeightTip:"What the whole part weighs, plus the tip push. It comes from the density and the section: a 1.7 m bar of 40×12 is about 22 N, that is 2.2 kg.",loadCarried:"Supports carry",loadCarriedTip:"How much of that weight is shared between pedestals and pins: the sum of the reactions, projected against the load.",loadRoot:"The grip holds",loadRootTip:"Whatever the supports do not carry stays at the first end, which is where the part is gripped. This is the number that answers «do I need more pedestals?». Negative means the grip pulls DOWN: the supports carry more than the whole part because the bar levers over one of them.",loadRootDown:"The grip pulls the part DOWN with {n} N: the bar levers over a pedestal and the supports carry more than the whole part. With the grip the fixture has, that is a possible result, but it says the first end would lift without it: check that the grip clamps and does not just rest.",loadDrop:"Moved by",loadDropTip:"How far the worst point has travelled, measured against the free part. It includes what the pins do AND what the load does: to tell them apart, switch the load off and read the same number.",loadPene:"Sinks in",loadPeneTip:"How far a support sinks into the bar. Contact is modelled with a very stiff spring, so this should come out in microns; if it reaches the tolerance, the spring was too soft and the reactions next to it deserve suspicion.",loadN:"Reaction",loadNTip:'How hard that support is pushing, in newton. A dash means the part is not touching it, which is an answer and not a failure. "n/a" means something quite different: that the model cannot say anything there. And this figure is worth what the MEASURED height is worth: one micron too much on a support puts several newton into the part, and next to the clamp it puts all of them in, because the bar cannot give there. Use it to see which support is working and which is not; it is not a load-cell reading.',loadNd:"n/a",glLost:"The graphics card dropped the 3D view (sleep, display change or driver). Data and tables are fine. The 3D view comes back on its own if the browser recovers it; if it does not, save your work and reload the page.",faultMsg:"Something went wrong ({e}). What is on screen may be out of date: save your work and reload the page.",faultClose:"Close notice",clashCard:"Does not fit the fixture: {n} goes in {d} mm",clashTip:"With this model on the fixture, that support stays INSIDE the bar however much the bar gives. It happens when the part differs from the one the fixture holds: a bend a few degrees off can leave the bar on the far side of a pin, and no elastic deformation brings it back through. The held shape drawn is the closest one the model finds, not one that can be mounted. In the 3D view there is a red diamond at every support that clashes.",fixLoadOn:'Here the part weighs {w} N, and that is switched on in the Clamping tab. The "Reaction" column says how much of that weight each pedestal carries.',colVis:"Visible in 3D",xyTip:"Where it sits on the table, in millimetres. A shop measurement: it does not move when the part is repositioned.",pedHTip:"How high the saddle rises from the table, in millimetres.",pedPadTip:"Length of the saddle, in millimetres. On a long saddle, half a degree too much tilt already lifts the bar.",pedTiltTip:'The tilt the saddle is set at, in degrees. Positive if it rises, same convention as "Wants".',pedWantTip:"The tilt the bar has right above the pedestal, in degrees. Positive if it rises.",pedD:"Δ",pedDTip:"How much tilt the saddle has too much or too little: its tilt minus the one the bar wants, in degrees. Red when that lifts the bar at the end of the saddle by more than the point tolerance; the help on each cell gives the millimetres.",pedSTip:"Where it touches, measured along the bar from the first end, in millimetres.",pedPlanTip:"Plan distance from the foot to the bar axis, in millimetres. It says whether the pedestal is under the bar or beside it.",pedGapTip:"Air between the saddle and the underside of the bar, in millimetres. Positive: the bar floats and does not rest. Negative: the pedestal is in the way and would lift the part.",pedSpanTip:"Distance to the previous pedestal along the bar, in millimetres. It is what decides the gravity sag.",pinDiaTip:"Diameter of the post, in millimetres.",pinGapTip:"Air between the post and the bar where they come closest, in millimetres. Positive: the bar does not reach the pin. Negative: the pin sits where the bar would be and pushes it.",pinStateTip:"Whether the clamping is using this pin right now to hold the bar.",fixLoadOff:'Here the part has no weight. The sag already uses its own weight, but how much each pedestal carries only comes out with "The part has weight" on, in the Clamping tab: that is when the "Reaction" column appears.',stHold:"Held by the pins",stLoad:"The part has weight",stHoldLoad:"Held and weighted",stHoldGo:"Click: opens the Clamping tab, where both switches are.",loadNdTip:"No number can be given here. This support falls on a stretch the model cannot bend — the unknowns are the elbows at the stations — so its gap does not change however much the part gives, and any reaction printed there would mean nothing. It is not a zero: a zero means the part is not touching it.",loadNoDof:"The part has no stations, so this model cannot hang it: what it weighs is known, how that weight splits between the supports is not. For a straight bar the number that helps is the gravity sag, on the Fixture tab.",loadStuck:"Not solved",loadStuckTip:"The search for equilibrium stopped before reaching it: what is next to this is the last trial and not a solution. It usually happens when a support enters and leaves contact on every step, or when two supports fight over the same point.",loadStuckWarn:"The load did not reach equilibrium in {n} steps: the numbers below are the last trial and cannot be defended. Raise the damping, or move aside the support that sits right on the edge of touching.",loadNote:"The unknowns are the kinks at the STATIONS, so in this model a straight run does not sag in the middle: that part is given by the gravity sag, on the Fixture tab. The two look at different things in the same bar and do not add up. The stiffness of a station is taken as EI/L, which for a cantilever is some four times softer than the exact one: thi lls short of {n} mm.",fabOver:"{b} asks for more than {n}° of deflection: the lengths on that row come out capped.",fabTube:"At {b} the radius is under the tube minimum: {n} diameters means R{r}.",fabTubeRect:"At {b} the radius is under the tube minimum: {n} times the measure across the bending plane means R{r}.",fileUnread:"the system would not read the file (was it moved, or is another program holding it open?)",csvShort:"These parts carry FEWER points than the model. The missing bends stay UNMEASURED and are not compensated:",compSim:"WARNING: {n} of the parts feeding this calculation are SIMULATED, not measured. What comes out of here does not describe any real bar.",compHeld:"The clamping or the load is on, so the 3D view may be showing the SETTLED part. These corrections are not: they are worked out against the free part, the one the table describes. If what you want is the shape with the fixture on, that is not what is being corrected towards yet.",compShort:"Only {a} of {b} bends are measured. The rest are marked with — and are NOT compensated.",rowNoMeas:"This bend is not measured: the part carried fewer points than the model. The command is left as is.",compFewN:"The loop reads {a} part(s) and {n} are needed. With fewer, the command chases that part’s scatter and the next one can come out worse.",batchUse:"Use the median of the visible parts ·",batchTip:"With a single part the loop also corrects what was scatter in that part, and the next one can come out worse. With several, the median only lets through what repeats.",batchOn:"The loop reads the median of %n parts, not the last one.",batchHint:"More than one part is visible: tick the box so the loop reads the median.",spread:"±σ",spreadTip:"Angle scatter across the visible parts (scaled MAD). Large next to a large deviation means poor repeatability, not a mis-set bend.",sbMeas:"Measured springback",sbUse:"Use in the simulator",sbNote:"sb = 1 − measured angle / commanded angle, per orientation. Median ± ro Ziehen: drehen · Rad: zoomen · Umschalt+Ziehen: verschieben",ribbon:"Abweichung der Gesamtauslenkung je Biegung über die Abwicklungslänge",vsRef:"Δ Auslenkung je Biegung gegenüber dem Referenzmodell",gripW:"Breite des rechten Bereichs",gripH:"Höhe der Tabelle",name:"Name",section:"Querschnitt",width:"Breite",thick:"Dicke",chamfer:"Fase",endlen:"Bearbeitetes Ende",secKind:"Form",secRect:"Rechteckig",secRound:"Rund",dia:"Durchmesser",wall:"Wandstärke",wallHint:"0 = massiv",secSolid:"massiv",secHollow:"hohl",secArea:"Fläche",secInertia:"Trägheitsmoment",secMass:"Gewicht",cutLen:"Schnittlänge",secTip:"Die Form der Stange. Sie ändert das Gewicht, den Widerstand und die Auflage.",secFig:"Die Stirnfläche der Stange, maßstäblich mit ihren Maßen gezeichnet",secChamNote:"Die Fase ist gestrichelt, weil sie gezeichnet und nicht gerechnet wird: sie nimmt Material an den Ecken weg, kann den Querschnitt also nur kleiner machen, und sie zu ignorieren meldet den Kontakt früher statt später.",secChamNone:"Die Zeichnung ist dieselbe Kontur, die das 3D ausstreicht und mit der die Kontaktrechnung antwortet.",fibre:"Neutrale Faser",fibreCenter:"Mitte",fibreDin:"DIN 6935",fibreFixed:"Feste K",kFac:"K",fibreTip:"Woher der Neutralfaser-Faktor K kommt, der bestimmt, wie viel Stange jede Biegung verbraucht. Mitte = K 0.5, die Faser ohne Verschiebung: das hat dieses Programm schon immer so gemacht. DIN 6935 = K nach dem r/t jeder Biegung, und ändert sich von Zeile zu Zeile. Feste K = die eingetippte, um die in der Werkstatt gemessene einzutragen. Die DIN gilt für Blech auf der Abkantpresse, nicht fürs Streckbiegen: sie ist eine erste Näherung, nicht die Zahl dieser Maschine.",fibreRt:"Die DIN 6935 deckt r/t unter 0.65 nicht ab: bei %n Biegungen ist K auf 0.325 gekappt.",cutLenTip:"SCHNITTLÄNGE: die gerade Stange, die in die Maschine muss. Gemessen auf der neutralen Faser, nicht auf der gezeichneten Achse, sodass sie bei K ungleich 0.5 nicht mit der Abszisse des unteren Bands übereinstimmt, das über das bereits gebogene Teil misst.",secRoundWarn:"Bei einer Rundstange sind beide Trägheitsmomente gleich: es gibt kein »flach« oder »hochkant«. Die DREHUNG sagt weiterhin, wohin gebogen wird, ändert aber nicht mehr, womit der Querschnitt widersteht, und die Verwindung des Teils ist in der 3D-Ansicht nicht beobachtbar.",secHollowWarn:"Die Grenzwerte für den Mindestradius gelten für eine MASSIVE Stange. Bei einem Rohr bestimmen das Verhältnis zwischen dem Biegemaß und der Wandstärke und die Ovalisierung beim Biegen den möglichen Radius — das beurteilt dieses Programm noch nicht: auf dem Bildschirm biegt es sich leichter als auf der Maschine.",secHollowJudged:"Rohr-Schwelle gesetzt: {n} Durchmesser. Biegungen mit kleinerem Radius werden im Reiter Modell markiert. Diese Zahl stammt aus den Grenzwerten, nicht vom Programm: das Programm kann sie nicht herleiten.",secHollowJudgedRect:"Rohr-Schwelle gesetzt: {n} mal das Maß in der Biegeebene — die Dicke bei Flachbiegungen, die Breite bei Hochkantbiegungen. Biegungen mit kleinerem Radius werden im Reiter Modell markiert. Diese Zahl stammt aus den Grenzwerten, nicht vom Programm: das Programm kann sie nicht herleiten.",tol:"Toleranzen",tolA:"Winkel",tolR:"Drehung",tolF:"Vorschub",tolP:"Punkt",bends:"Biegungen",addBend:"Biegung hinzufügen",nBend:"#",feed:"Vorschub",rot:"Rollung",ang:"Winkel",rad:"Radius",twist:"Torsion",twlen:"Torsionslänge",ori:"Or.",dcol:"Δ",straight:"Gerade",arcL:"L",cumL:"Σ L",tailRow:"Auslauf",dStraightTip:"Δ der GERADEN, in mm. Basis + Δ ist die Gerade am Teil. Gespeichert wird ein Vorschub-Δ: ein Winkel-Δ verkürzt die Gerade, ohne den Vorschub zu berühren, und hier wird das sichtbar.",tailFootTip:"Auslaufgerade, von Tangente zu Tangente wie alle anderen Längen. Gespeichert und an die Maschine geschickt wird der Vorschub von Schnittpunkt zu Schnittpunkt; der Unterschied ist der Trim der letzten Biegung.",lenNote:"Gerade = gerades Stück von Tangente zu Tangente, und die einzige Länge, die eingetippt wird — auch die des Auslaufs, die in der Fußzeile eingetippt wird. L = Bogenlänge, die die Biegung erzeugt (Radius × Auslenkung). Σ L = aufsummierte Abwicklungslänge auf der neutralen Faser: Gerade, Bogen, Gerade, Bogen. Jede editierbare Spalte steht auf der Basis und ihr Δ daneben, und beide zusammen ergeben das Teil: deshalb ist das Δ der Geraden in Millimetern GERADE und nicht in Vorschub. Und die Δ-Tabelle sagt nur das, was dort eingetippt wurde: ein Winkel- oder Radius-Δ lässt die Geraden stehen und verschiebt darunter die Vorschübe, genau wie ein geänderter Winkel oder Radius auf der Basis. Der Vorschub von Schnittpunkt zu Schnittpunkt ist das, was gespeichert und an die Maschine geschickt wird, und deshalb ist er es, der sich bewegt. L und Σ L werden auf der NEUTRALEN FASER gezählt, der Stange, die wirklich verbraucht wird; die gezeichnete Achse und das untere Band messen weiterhin durch die Mitte des Querschnitts, sodass sich die beiden Zahlen trennen, sobald K nicht mehr 0.5 ist.",kbdNote:"Tastatur: Tab / ⇧Tab bewegen waagerecht · Enter und ↑ ↓ senkrecht · Esc verwirft die Zelle · Mausrad oder Strg+↑ ↓ ändern den Wert um einen Schritt. Beim Betreten einer Zelle wird ihr Wert markiert: Tippen ersetzt ihn. Bis zu drei Nachkommastellen werden angenommen.",twnote:"Torsionslänge = gerades Stück (mm), über das die Torsion verteilt wird, mittig auf der Geraden. 0 = die ganze Gerade. Kein Schnittpunkt wird verschoben: es wird nur festgelegt, wo die Torsion stattfindet.",proc:"Simulierter Prozess (virtuelles Teil)",sbW:"Rückfederung hochkant",sbT:"Rückfederung flach",slip:"Vorschubschlupf",biasR:"Drehversatz",noise:"Scan-Rauschen",seed:"Startwert",simulate:"Gemessenes Teil erzeugen",dNone:"Kein gemessenes Teil. Simulieren Sie eines oder importieren Sie ein CSV.",deltas:"Abweichungen je Biegung",angSenseTip:"+ biegt mehr (schließt, spitzer) · − biegt zurück (öffnet, stumpfer). In Biegesinn, unabhängig vom Vorzeichen des Basiswinkels oder der Rollung.",angDevTip:"Abweichung im Biegesinn: + überbogen · − zu wenig gebogen (die verlangte Kompensation ist die entgegengesetzte).",dA:"Δ Winkel",dR:"Δ Rollung",dF:"Δ Vorschub",dP:"Abw. Ende",statMaxA:"Max. Δ Auslenkung",statRms:"RMS Auslenkung",statTip:"Abw. fernes Ende",statOut:"Außer Toleranz",gains:"Korrekturverstärkungen",gainW:"Verstärkung hochkant",gainT:"Verstärkung flach",gainR:"Verstärkung Rollung",gainF:"Verstärkung Vorschub",gainNote:"Rollung und Vorschub haben eigene Verstärkungen, weil sie nicht dieselbe Größe sind wie die Biegung. »Hochkant« und »flach« sind Rückfederungskonstanten: wie weit sich der Stab beim Loslassen öffnet. Die Rollung hat keine Feder — sie wurde ganz korrigiert, also mit Verstärkung 1,0, genau das, was beim Winkel verboten ist, weil es mit dem Messrauschen schwingt — und den Vorschub verschiebt der Schlupf, ein anderes Phänomen.",what:"Was korrigieren",cAng:"Biegewinkel",cRot:"Rollung",cFeed:"Vorschübe",apply:"Kompensation anwenden",reset:"Befehle zurücksetzen",cmdTbl:"Maschinenbefehle",cNow:"Aktuell",cNew:"Neu",cDelta:"Δ",predict:"Erwarteter Restfehler",verify:"Prüfen (2. Teil fahren)",noMeas:"Für die Kompensation wird ein gemessenes Teil benötigt.",stLen:"Abwicklungslänge",stBends:"Biegungen",stDatum:"Bezug",stMax:"Max. Abw.",stUnits:"Einheiten",stVer:"Version",stVerTip:"Laufender Build. Bei einer auffälligen Zahl mit angeben: Mit einer Kopie in der Werkstatt und einer veröffentlichten ist dies das Einzige, was sie unterscheidet. «+sucio» = auf nicht committeten Änderungen gebaut.",schemaAmbiguous:`Diese Datei ist barcomp/2.2 und gibt die verwendete Biegerichtung nicht an.

merische Spalten je Zeile: x,y,z nicht erkennbar. Exportiere nur die Koordinaten oder Index + Koordinaten",csvFew:"weniger als drei Punkte mit Koordinaten",csvScale:"die Punkte schreiten im Mittel {n} mm fort, die des Modells {m} mm: das sind keine Koordinaten der Stange. Meist wurde eine Abweichungsspalte statt der Koordinate exportiert, oder die Einheit ist nicht Millimeter",csvNear:"die Punkte {i} liegen weniger als {d} mm vom vorherigen entfernt: zwei Schnittpunkte aufeinander erfinden eine Biegung. Punktextraktion prüfen",devRowTip:"Abweichung der Biegung {b}. Enter wählt sie in der 3D-Ansicht und in der Tabelle; die Pfeile gehen auf und ab.",pins:"Spannung",lPins:"Bolzen",lHeld:"Gespannte Stange",pinOn:"Stange von den Bolzen gehalten",pinOnTip:"Aus liegt die Stange frei im Raum und das Programm verhält sich genau wie vor der Einführung der Bolzen. Ein kann das Teil nicht dorthin, wohin die Tabelle es schickt: es bleibt, wo die Bolzen es lassen, und verformt sich, um dorthin zu kommen.",pinDoRot:"Rollung gibt ebenfalls nach",pinRotTip:"Ein Bolzen drückt in der Tischebene. Wenn neben dem Winkel auch die Rollung nachgibt, verteilt sich die Verformung meist besser, aber es sind zwei Unbekannte je Station statt einer — eine physikalische Entscheidung, keine Geschwindigkeitseinstellung.",pinTol:"Kontakt",pinTolTip:"Unterhalb dieses Abstands gilt die Stange als am Bolzen anliegend, es gibt nichts zu schließen.",pinDamp:"Verteilung",pinDampTip:"Nahe 0 sammelt sich die Verformung an der nachgiebigsten Station; höhere Werte verteilen sie auf mehr Stationen. Dieselbe Rolle wie die Reglerverstärkung: voll aufgedreht schwingt es.",pinDia:"Ø",pinGap:"Spalt",pinReach:"Erreicht",pinReachTip:"Ob sie sich am KÖRPER des Bolzens treffen oder an einem seiner Enden. Ein Bolzen unterhalb der Stange berührt sie nie, so gut er auch steht, und ein zu hoch angesetzter lässt sie darunter durch: in beiden Fällen hält er nichts.",pinYes:"ja",pinNo:"nein",pinHold:"Hält",pinHoldTip:"Ein Bolzen kann montiert sein und trotzdem außen vor bleiben: ausgeschaltet bleibt er in der 3D-Ansicht sichtbar, ohne zu wirken — so findet man heraus, welcher Bolzen was verursacht.",pinMeasFree:"Es wird die FREIE Stange gezeigt und gemessen, obwohl Spannung oder Last eingeschaltet sind: diese Tabelle, die Bezugspunkte, die PI-Punkte und das Säen beziehen sich auf das Teil ohne jede Halterung, nicht auf das auf dem Tisch. Die Reaktionen nicht: sie stammen aus dem gespannten Teil. Wähle „Gehalten“ oder „Beide“ unter „Zeigen“ im Reiter Spannung, um die vorhandene Stange zu lesen.",pinShow:"Zeigen",pinShowFree:"Frei",pinShowHeld:"Gehalten",pinShowBoth:"Beide",pinShowTip:"Welche Stange gezeigt wird und wogegen ALLES gemessen wird, für alle Modelle zugleich: die freie — die Konstruktion, das Teil außerhalb der Vorrichtung — oder die, die es tatsächlich annimmt, von den Stiften gehalten und unter Eigengewicht hängend. Mit „Gehalten“ oder „Beide“ folgen der gespannten Stange beide Tabellen, die Bezugspunkte, die Durchbiegung, die PI-Punkte und ihre Beschriftungen, der Versatz zwischen Modellen, das Band, die Farben der Auflagen und wo gesäte Auflagen und Stifte entstehen. „Beide“ zeigt die freie zusätzlich als Drahtmodell. Nur zwei Dinge ändern sich nicht: wo das Teil PLATZIERT ist und wo die Auflagen stehen – sie sind auf den Tisch geschraubt.",pinTilt:"Neigung",pinTiltTip:"Wie weit der Bolzen aus der Senkrechten kippt, in Grad. 0 = lotrecht. Ein geneigter Bolzen berührt die Stange an anderer Stelle und aus anderer Richtung: der Kontakt wird zwischen beiden Achsen im Raum gelöst, nicht im Grundriss.",pinYaw:"Richtung",pinYawTip:"Wohin er kippt, im Grundriss ab +X gemessen. Ohne Neigung bedeutungslos: ein senkrechter Zylinder um die eigene Achse gedreht ist derselbe Zylinder.",pinLen:"Länge",pinLenTip:"Wie lang der Bolzen von seiner Basis aus MISST, in Millimetern. Nicht, wie hoch er sitzt: ein zu kurzer erreicht die Stange nie und hält seitlich nichts, so gut er auch steht, und ein zu langer berührt am Ende auch dort, wo er nicht soll. Zum Anheben ohne Verlängern dient die Spalte daneben.",pinZ:"Höhe",pinZTip:"In welcher Höhe über dem Tisch die Basis des Bolzens BEGINNT, in Millimetern. 0 ist der auf den Tisch geschraubte Bolzen, der Normalfall. Angehoben wird er, um eine hoch verlaufende Stange zu erreichen, ohne dass der Bolzen zusätzlich darunter berührt, wo vielleicht ein anderer Abschnitt des Teils vorbeiläuft. Was ihn dort oben hält — ein Klotz, eine Beilage, der Körper der Vorrichtung — wird weder gezeichnet noch gerechnet: das sagt, wo der Zylinder steht, nicht woran er hängt.",pinDist:"Abst.",pinDistTip:"Abstand zwischen Bolzenachse und Stangenachse an ihrer engsten Stelle, im Raum. Bei lotrechten Bolzen gleich dem Grundrissabstand, bei geneigten nicht.",pinSide:"Seite",pinSideAuto:"auto",pinSideTip:'Auf welcher Seite der Stange der Bolzen MONTIERT ist. Eine Angabe der Vorrichtung, keine Messung: liest man sie aus der aktuellen Form, kippt sie, sobald ein Winkel die Stange über die Bolzenachse hinaus schickt, und der Kontakt schließt an der falschen Fläche — es wird also ein Teil gerechnet, das durch den Bolzen ging. "auto" entscheidet beim ersten Mal aus der Geometrie, so wie es vorher war.',pinState:"Zustand",pinHolding:"hält",pinEmpty:'Keine Bolzen. "Säen" verteilt einige entlang der Stange, abwechselnd von beiden Seiten anliegend — so wird eine Stange wirklich gehalten: alle auf einer Seite ließen sie darauf schwenken.',addPin:"+ Bolzen",seedPin:"Bolzen säen",clearPin:"Alle entfernen",pinNote:"Ein Bock stützt; ein Bolzen VERHINDERT. Bolzen sind auf dem Tisch verschraubt und wandern nicht mit, wenn das Teil neu gesetzt wird: es ändert sich nur, ob sie noch anliegen. Ein Bolzen mit Luft drückt nichts und wird übergangen — kein Fehler, die Vorrichtung darf mehr Bolzen tragen, als dieses Teil braucht.",pinOffNote:"Bei ausgeschalteter Spannung wird die Stange frei im Raum gerechnet. Bolzen lassen sich setzen und ansehen, verformen aber nichts.",pinNoneHold:'Kein Bolzen berührt die Stange, die Spannung ändert also nichts. Prüfe Höhe und Lage: die Spalte "Erreicht" nennt die zu kurzen, "Spalt" den Abstand, in dem sie stehen bleiben.',pinHeldN:"{n} Bolzen halten",pinTip:"Spitze",pinTipTip:"Wie weit sich das freie Ende bewegt, weil die Stange gehalten wird, verglichen mit demselben Teil frei im Raum. Das ist die messbare Folge.",pinWorstKink:"Größter Knick",pinStress:"Spannung",pinOfYield:"der Streckgrenze",pinYield:"Irgendwo überschreitet die Stange die Elastizitätsgrenze: losgelassen federt sie NICHT zurück, und das Teil, das herauskommt, ist nicht das des Modells. Bei unbestätigtem Material ist das ein Hinweis, keine Messung — der Ort stimmt aber.",pinYieldTip:"Biegespannung in der äußersten Faser gegen die Streckgrenze des Materials. Über 100 % ist die Verformung nicht mehr rückgängig.",pinOpen:"{n} Kontakt(e) offen geblieben",pinOpenTip:"Der Löser konnte die Stange nicht an diese Bolzen bringen. Das heißt meist: unmögliche Vorrichtung — zwei Bolzen verlangen die Stange gleichzeitig an zwei Orten, oder einer steht so tief, dass das Teil brechen müsste.",pinKink:"Knick °",pinCurv:"Krümmung °/m",pinSigma:"σ MPa",matRho:"Dichte",matRhoTip:"Gewicht des Materials je Kubikmeter. Nur die Durchbiegung braucht sie: sie lässt die Stange zwischen den Auflagen durchhängen. Vorläufig wie das übrige Material.",sag:"Durchbiegung",sagTip:"Wie weit die Stange unter ihrem Eigengewicht in dem Feld durchhängt, das AN diesem Bock endet, in Millimetern. Der Überstand an jedem Ende zählt als Kragarm und fällt dort am stärksten aus: die Länge geht in der vierten Potenz ein. Die Lage wiegt schwerer als die Stützweite — flach hängt sie (Breite/Dicke)² mal stärker durch als hochkant, bei 40×12 also elfmal.",sagNote:"Die Durchbiegung wird feldweise als Einfeldträger gerechnet, die Überstände als Kragarme. Ein Durchlaufträger über mehrere Auflagen ist steifer, also überschätzt dieser Wert — die sichere Seite. Jedes Feld gilt als gerade; Biegungen innerhalb eines Feldes versteifen hier nicht. Sobald eine zertifiziert gerade Stange in der Vorrichtung gescannt ist, wird das gegen die gemessene Durchbiegung geprüft und ist keine Schätzung mehr.",sagBad:"Die Durchbiegung überschreitet die Punkttoleranz. Sie geht als Fehler in die Messung ein, der KEIN Biegefehler ist: der Regelkreis wird ihn korrigieren wollen und kann es nicht. Setze eine Auflage im schlechtesten Feld oder kürze den Überstand.",sagNoMat:"Durchbiegung: Material fehlt",sagNoMatTip:"Ohne Dichte und E-Modul gibt es keine Zahl. Beide stehen auf der Registerkarte Spannung.",matE:"E-Modul",matYield:"Streckgrenze",matTip:"Wird nur gebraucht, um Verformung in Spannung umzurechnen. Die FORM einer gehaltenen Stange hängt nicht von E ab: bei konstantem Querschnitt kürzt es sich aus der Verteilung heraus, und ein Test belegt, dass eine Änderung keinen Punkt verschiebt.",matProv:'Material VORLÄUFIG: Handbuchwerte für 6061-T6, nicht die der Charge in der Werkstatt. Gut genug, um zu sehen, wo sich Spannung sammelt; für "dieses Teil liegt 12 MPa darüber" braucht es das Werkszeugnis.',load:"Die Last",loadOn:"Das Teil hat Gewicht",loadOnTip:"Damit bleibt die Stange nicht mehr dort, wo die Tabelle sie lässt: sie fällt dorthin, wohin die Last zieht, legt sich auf die Böcke und drückt gegen die Stifte, die ihr im Weg stehen. Eine Auflage DRÜCKT, aber sie ZIEHT nicht: nimmt eine Biegung das Teil von einem Stift weg, dann geht es weg; und holt die Schwerkraft es zurück, dann kommt es zurück.",loadSlow:"Dieses Teil hat {n} Biegungen. Über {lim} hinaus ist die Berechnung der Auflage nicht mehr sofort da: bei 34 dauert sie knapp eine Sekunde, bei 60 mehr als fünfzehn. Das ist keine Grenze und das Ergebnis ist genauso gut — es steht hier, damit es nicht so aussieht, als hänge das Programm. Maßgebend ist die ANZAHL der Biegungen: weder die Länge der Stange noch ihr Abstand ändern etwas.",loadG:"Schwerkraft (×g)",loadGTip:"Vielfaches des Eigengewichts. 1 ist das echte Gewicht; 0 nimmt es weg und lässt nur den Druck an der Spitze; 2 zeigt, was sich bewegen würde, wäre das Teil doppelt so schwer.",loadDir:"Richtung",loadDirTip:"Wohin die Last zieht. (0, 0, −1) ist nach unten, also das, was die Schwerkraft tut. Zeigt sie woandershin, drückt sie das Teil gegen eine bestimmte Spannstelle, um zu sehen, ob diese hält.",loadTipF:"Druck an der Spitze",loadTipTip:"Eine weitere Kraft, am freien Ende und in derselben Richtung. Es ist der Finger, mit dem man prüft, ob sich das Teil bewegt, dort angesetzt, wo es am meisten ausmacht.",loadWeight:"Gewicht",loadWeightTip:"Was das ganze Teil wiegt, zuzüglich des Drucks an der Spitze. Es folgt aus Dichte und Querschnitt: eine 1,7 m lange Stange 40×12 sind rund 22 N, also 2,2 kg.",loadCarried:"Die Auflagen tragen",loadCarriedTip:"Wie viel von diesem Gewicht sich auf Böcke und Stifte verteilt: die Summe der Reaktionen, auf die Last projiziert.",loadRoot:"Die Spannzange hält",loadRootTip:"Was die Auflagen nicht tragen, bleibt am ersten Ende hängen, wo das Teil gegriffen ist. Das ist die Zahl, die beantwortet: «brauche ich mehr Böcke?». Negativ heißt, die Spannzange zieht nach UNTEN: die Auflagen tragen mehr als das ganze Teil, weil die Stange über einem von ihnen hebelt.",loadRootDown:"Die Spannzange zieht das Teil mit {n} N nach UNTEN: die Stange hebelt über einem Bock, und die Auflagen tragen mehr als das ganze Teil. Mit der Spannzange der Vorrichtung ist das möglich, heißt aber, dass sich das erste Ende ohne sie heben würde: prüfen, dass die Zange spannt und nicht nur aufliegt.",loadDrop:"Bewegt um",loadDropTip:"Wie weit sich der ungünstigste Punkt verschoben hat, gemessen gegen das freie Teil. Enthält sowohl die Wirkung der Stifte ALS AUCH die der Last: um beides zu trennen, die Last abschalten und dieselbe Zahl lesen.",loadPene:"Dringt ein",loadPeneTip:"Wie tief eine Auflage in die Stange eindringt. Der Kontakt wird mit einer sehr steifen Feder abgebildet, das sollte also im Mikrometerbereich herauskommen; erreicht es die Toleranz, war die Feder zu weich und den Reaktionen daneben ist zu misstrauen.",loadN:"Reaktion",loadNTip:'Mit welcher Kraft diese Auflage drückt, in Newton. Ein Strich heißt, dass das Teil sie nicht berührt; eine Antwort, kein Fehler. „k. A." heißt etwas ganz anderes: dass das Modell dort nichts sagen kann. Und dieser Wert taugt nur so viel wie die GEMESSENE Höhe: ein Mikrometer zu viel an einer Auflage bringt mehrere Newton in das Teil, und neben der Klemmung alle davon, weil der Stab dort nicht nachgeben kann. Er zeigt, welche Auflage trägt und welche nicht; er ist keine Kraftmessdose.',loadNd:"k. A.",glLost:"Die Grafikkarte hat die 3D-Ansicht verloren (Standby, Bildschirmwechsel oder Treiber). Daten und Tabellen sind in Ordnung. Die 3D-Ansicht kommt von selbst zurück, wenn der Browser sie wiederherstellt; falls nicht, Arbeit speichern und die Seite neu laden.",faultMsg:"Etwas ist schiefgelaufen ({e}). Die Anzeige ist möglicherweise nicht aktuell: Arbeit speichern und die Seite neu laden.",faultClose:"Hinweis schließen",clashCard:"Passt nicht in die Vorrichtung: {n} dringt {d} mm ein",clashTip:"Mit diesem Modell auf der Vorrichtung bleibt diese Auflage INNERHALB des Stabs, egal wie weit der Stab nachgibt. Das passiert, wenn das Teil nicht das ist, das die Vorrichtung hält: eine um wenige Grad andere Biegung kann den Stab auf die andere Seite eines Stifts legen, und keine elastische Verformung bringt ihn hindurch zurück. Die gezeichnete gespannte Form ist die nächstliegende, die das Modell findet, keine montierbare. In der 3D-Ansicht sitzt an jeder kollidierenden Auflage eine rote Raute.",fixLoadOn:'Hier wiegt das Teil {w} N, eingeschaltet im Reiter Spannung. Die Spalte „Reaktion" sagt, wie viel dieses Gewichts jeder Bock trägt.',colVis:"Sichtbar in 3D",xyTip:"Wo er auf dem Tisch steht, in Millimetern. Ein Werkstattmaß: es wandert nicht mit, wenn das Teil neu gesetzt wird.",pedHTip:"Wie hoch die Auflage über dem Tisch steht, in Millimetern.",pedPadTip:"Länge der Auflage, in Millimetern. Bei einer langen Auflage hebt schon ein halbes Grad zu viel Neigung die Stange an.",pedTiltTip:'Mit welcher Neigung die Auflage eingestellt ist, in Grad. Positiv, wenn sie ansteigt, wie bei „Verlangt".',pedWantTip:"Die Neigung, die die Stange direkt über dem Bock hat, in Grad. Positiv, wenn sie ansteigt.",pedD:"Δ",pedDTip:"Wie viel Neigung der Auflage zu viel oder zu wenig ist: ihre Neigung minus die, die die Stange verlangt, in Grad. Rot, wenn das die Stange am Ende der Auflage stärker anhebt als die Punkttoleranz; die Hilfe jeder Zelle nennt die Millimeter.",pedSTip:"Wo sie sich berühren, entlang der Stange vom ersten Ende aus gemessen, in Millimetern.",pedPlanTip:"Abstand im Grundriss vom Fuß zur Stangenachse, in Millimetern. Er sagt, ob der Bock unter der Stange steht oder daneben.",pedGapTip:"Luft zwischen Auflage und Unterseite der Stange, in Millimetern. Positiv: die Stange schwebt und liegt nicht auf. Negativ: der Bock steht im Weg und würde das Teil anheben.",pedSpanTip:"Abstand zum vorigen Bock entlang der Stange, in Millimetern. Er bestimmt die Durchbiegung durch Schwerkraft.",pinDiaTip:"Durchmesser des Bolzens, in Millimetern.",pinGapTip:"Luft zwischen Bolzen und Stange an ihrer engsten Stelle, in Millimetern. Positiv: die Stange erreicht den Bolzen nicht. Negativ: der Bolzen sitzt, wo die Stange wäre, und drückt sie weg.",pinStateTip:"Ob die Spannung diesen Bolzen gerade benutzt, um die Stange zu halten.",fixLoadOff:'Hier hat das Teil kein Gewicht. Die Durchbiegung nutzt schon sein Eigengewicht, aber wie viel jeder Bock trägt, ergibt sich erst mit „Das Teil hat Gewicht" im Reiter Spannung: dann erscheint die Spalte „Reaktion".',stHold:"Von den Bolzen gehalten",stLoad:"Das Teil hat Gewicht",stHoldLoad:"Gehalten und belastet",stHoldGo:"Klick: öffnet den Reiter Spannung, dort sind beide Schalter.",loadNdTip:"Hier lässt sich keine Zahl nennen. Diese Auflage liegt auf einem Abschnitt, den das Modell nicht biegen kann — die Unbekannten sind die Knicke an den Stationen — also ändert sich ihr Spalt nicht, wie sehr das Teil auch nachgibt, und eine dort ausgegebene Kraft würde nichts bedeuten. Es ist keine Null: eine Null heißt, dass das Teil sie nicht berührt.",loadNoDof:"Das Teil hat keine Stationen, also kann dieses Modell es nicht hängen lassen: was es wiegt, ist bekannt, wie sich das Gewicht auf die Auflagen verteilt, nicht. Bei einem geraden Stab hilft die Schwerkraft-Durchbiegung im Reiter Vorrichtung.",loadStuck:"Nicht gelöst",loadStuckTip:"Die Suche nach dem Gleichgewicht hielt an, bevor sie es erreichte: was daneben steht, ist der letzte Versuch und keine Lösung. Das passiert meist, wenn eine Auflage bei jedem Schritt in den Kontakt hinein- und wieder herausgeht, oder wenn zwei Auflagen um denselben Punkt streiten.",loadStuckWarn:"Die Last erreichte in {n} Schritten kein Gleichgewicht: die Zahlen unten sind der letzte Versuch und lassen sich nicht vertreten. Erhöhe die Dämpfung, oder rücke die Auflage beiseite, die genau an der Grenze zum Berühren steht.",loadNote:"Die Unbekannten sind die Knicke an den STATIONEN, also hängt in diesem Modell ein gerades Stück in der Mitte nicht durch: diesen Teil liefert die Durchbiegung auf der Registerkarte Vorrichtung. Beide betrachten Verschiedenes an derselben Stange und addieren sich nicht. Die Steifigkeit einer Station wird als EI/L angesetzt, für einen Kragarm rund viermal weicher als der exakte Wert: das ergibt Größenordnung und Richtung, keine belastbare Durchbiegung.",loadNoMat:"Ohne Dichte und ohne E-Modul gibt es keine Last zum Aufbringen. Beides wird gleich darüber beim Material eingetragen.",loadHang:"Die Auflagen tragen weniger als die Hälfte des Gewichts: das Teil hängt an seinem eigenen Ende. Zu sehen ist ein Kragarm, kein aufgelegtes Teil; entweder fehlen Böcke, oder die vorhandenen berühren es nicht.",mach:"Maschine",machTitle:"Maschinenbefehl",machCols:"Spalten, in dieser Reihenfolge",machAxis:"Abs. Achse",machSep:"Trennzeichen",machDec:"Dezimalstellen",machLen:"Längen",machAng:"Winkel",machSignA:"Vorzeichen Winkel",machSignR:"Vorzeichen Rollung",machSignTip:"Dreht das Vorzeichen NUR in der Datei um. Die Kinematik bleibt unangetastet: dieselben Zahlen biegen am Bildschirm weiterhin dasselbe Teil. Es steht hier, weil eine Maschine die Achse andersherum montiert haben kann, und das wird beim Schreiben korrigiert, nicht im Motor.",machRot:"Rollung geschrieben als",machRotDelta:"Drehung gegenüber der Vorstation",machRotAbs:"absolute Achslage",machRotTip:"Das Modell speichert, wie weit sich die Achse je Station DREHT, denn die Maschine hält sie zwischen den Biegungen. Manche Steuerungen wollen stattdessen die absolute Achslage. Beide beschreiben dasselbe Teil; die falsche Wahl biegt die erste Station richtig und jede weitere falsch.",machHead:"Mit Kopfzeile",machCrlf:"Zeilenende CRLF",machCrlfTip:"Viele Maschinensteuerungen lesen kein UNIX-Zeilenende. Damit endet jede Zeile so, wie es eine Windows-Steuerung erwartet.",machTail:"Zeile für das Endstück",machTailTip:"Eine letzte Zeile mit der Auslaufgeraden. Ohne sie sagt die Datei nicht, wie viel Material nach der letzten Biegung bleibt. Nicht zutreffende Spalten bleiben leer statt null: eine Null in der Winkelspalte ist eine Biegung von null Grad, also eine Anweisung.",machPrev:"Vorschau",machMore:"und {n} weitere Zeile(n).",machExport:"Befehl exportieren",machDirty:"Eine manuelle Korrektur ist eingetragen, aber nicht übernommen. Die Datei enthält den gespeicherten Befehl, nicht das, was die Kompensationstabelle zeigt: erst übernehmen, sonst fehlt die Korrektur.",machNote:"Das Format, das die Biegemaschine liest, ist angefordert und noch nicht eingetroffen, also wird hier nichts geraten: es liegt offen. Prüfe vor der ersten Stange in der Vorschau Einheiten und Vorzeichen gegen ein bekanntes Teil — das ist das Einzige an dieser Datei, was sich nicht rückgängig machen lässt. Das Profil reist im JSON des Teils mit, also lässt sich eine Maschinendatei von vor Monaten identisch neu erzeugen.",lims:"Grenzwerte",limWhat:"Schwelle",limVal:"Wert",limDef:"Werk",limState:"Zustand",limWait:"Wartet auf",limTouched:"geändert",limFactory:"Werkswert",limProv:"vorläufig · {p}",limRead:"Beim Einlesen einer Messung",limLoop:"Schutz des Regelkreises",limReset:"Zurück auf Werkswerte",limHitStraight:"Mit dieser Schwelle passen {n} Gerade(n) dieses Teils nicht.",limNote:'Diese Zahlen verschieben keinen PI: sie entscheiden, was abgelehnt wird, welchem Messwert misstraut wird und wie viel der Regelkreis auf einmal korrigieren darf. Sie reisen im JSON des Teils mit, also nennt eine gespeicherte Datei die Schwellen, nach denen sie beurteilt wurde. "Vorläufig" heißt, der Wert wurde ohne eine angeforderte Angabe gewählt: A.6 ist die reale Wiederholpräzision des Scans (σ), B.2 die Maschinengrenze. Eine 0 schaltet die Prüfung ab.',lim_axisMin:"Lesbare Achse",lim_axisMinTip:"Kleinste Auslenkung, bei der die ACHSE einer gemessenen Biegung noch lesbar ist. Darunter ist die Querrichtung Rauschen, also wird die Achse von der vorherigen Biegung übernommen statt erfunden. Die echte Regel lautet atan(3σ/Vorschub). Gilt nur für GEMESSENE Daten; in einem eingetippten Modell ist eine Biegung von 0,2° Absicht.",lim_piMin:"PI-Abstand",lim_piMinTip:"Kleinster Abstand zwischen zwei PI einer importierten Datei. Näher beieinander ergibt die Richtung reines Rauschen und daraus eine erfundene Biegung, die auch die nächste Zeile vergiftet. Die echte Regel lautet 5σ. Zwei zusammenfallende PI lehnen die ganze Datei ab: die Extraktion aus der Punktwolke ist schiefgegangen.",lim_scaleMin:"Mindestmaßstab",lim_scaleMinTip:"Anteil der Soll-PI-Schrittweite, unterhalb dessen die importierte Wolke nicht dasselbe Teil sein kann. KEINE Toleranz: fängt einen Export ab, dessen Spalten die ABWEICHUNG statt der Koordinate sind, oder Meter, die als Millimeter gelesen werden. Nur nach unten: einem Scan mit fehlenden Punkten wächst die mittlere Schrittweite, und das ist keine schlechte Datei.",lim_straightMin:"Mindestgerade",lim_straightMinTip:"Gerade zwischen den Tangentenpunkten, die das Werkzeug braucht: Spannbacke plus Kopfweg. Eine MASCHINEN-Grenze, keine des Scanners. Eine negative Gerade wird ohnehin getrennt aufgeführt: das sind zwei Werkzeuge am selben Ort.",lim_tubeRfac:"Mindestradius Rohr",lim_tubeRfacTip:"Für RUNDROHR und RECHTECKROHR: beim Rundrohr gegen den Außendurchmesser, beim Rechteckrohr gegen das Maß in der Biegeebene — die Dicke bei Flachbiegungen, die Breite bei Hochkantbiegungen. Mit 1.5 hier lässt sich ein Ø40 nicht unter R60 biegen. Startwert 0, also nicht prüfen, und das ist kein Versehen: bei einem Rohr bestimmen das Verhältnis zwischen dem Biegemaß und der Wand sowie die Ovalisierung beim Biegen den möglichen Radius, und das Programm kann das nicht herleiten. Ein Werkswert wäre eine Meinung mit dem Gesicht eines Messwerts. Hat die Werkstatt ihre eigene Regel, wird sie hier eingetragen.",lim_dead:"Totband (Winkel)",lim_deadTip:"Unter dieser Abweichung vom Soll korrigiert der Regelkreis nicht: das ist Messrauschen, und ihm nachzulaufen bringt das Teil zum Schwingen. 0 schaltet es ab.",lim_deadFeed:"Totband (Vorschub)",lim_deadFeedTip:"Wie das Winkel-Totband, in Millimetern und auf den Vorschub.",lim_maxStep:"Grenze je Zyklus (Winkel)",lim_maxStepTip:"Größte Korrektur, die der Regelkreis auf einmal anbringen darf. Ein größerer Sprung ist keine Prozessdrift: es sind schlechte Daten oder eine Biegung, die den Zweig gewechselt hat. Sie wird gekappt und gemeldet, statt an die Maschine zu gehen. 0 hebt die Grenze auf.",lim_maxStepFeed:"Grenze je Zyklus (Vorschub)",lim_maxStepFeedTip:"Wie die Winkelgrenze, in Millimetern und auf den Vorschub.",fabHead:"Dieses Teil lässt sich so nicht fertigen:",fabNeg:"die Gerade vor {b} ist NEGATIV: die Werkzeuge kollidieren.",fabShort:"die Gerade vor {b} erreicht die vom Werkzeug benötigten {n} mm nicht.",fabTail:"die Auslaufgerade erreicht {n} mm nicht.",fabOver:"{b} verlangt mehr als {n}° Auslenkung: die Längen dieser Zeile sind gekappt.",fabTube:"Bei {b} liegt der Radius unter dem Rohr-Minimum: {n} Durchmesser sind R{r}.",fabTubeRect:"Bei {b} liegt der Radius unter dem Rohr-Minimum: {n} mal das Maß in der Biegeebene ergibt R{r}.",fileUnread:"Datei vom System nicht lesbar (verschoben, oder von einem anderen Programm geöffnet?)",csvShort:"Diese Teile enthalten WENIGER Punkte als das Modell. Die fehlenden Biegungen bleiben UNGEMESSEN und werden nicht kompensiert:",compSim:"ACHTUNG: {n} der Teile in dieser Rechnung sind SIMULIERT, nicht gemessen. Das Ergebnis beschreibt keine reale Stange.",compHeld:"Spannung oder Last sind eingeschaltet, die 3D-Ansicht zeigt also möglicherweise das ABGELEGTE Teil. Diese Korrekturen nicht: sie werden gegen das freie Teil gerechnet, das die Tabelle beschreibt. Wer die Form mit aufgesetzter Vorrichtung will: dagegen wird noch nicht korrigiert.",compShort:"Nur {a} von {b} Biegungen sind gemessen. Die übrigen sind mit — markiert und werden NICHT kompensiert.",rowNoMeas:"Diese Biegung ist nicht gemessen: das Teil hatte weniger Punkte als das Modell. Der Befehl bleibt unverändert.",compFewN:"Der Regelkreis liest {a} Teil(e), nötig sind {n}. Mit weniger verfolgt der Befehl die Streuung dieses Teils und das nächste kann schlechter ausfallen.",batchUse:"Median der sichtbaren Teile verwenden ·",batchTip:"Mit nur einem Teil korrigiert der Regelkreis auch dessen Streuung, und das nächste Teil kann schlechter ausfallen. Mit mehreren lässt der Median nur das durch, was sich wiederholt.",batchOn:"Der Regelkreis liest den Median von %n Teilen, nicht das letzte.",batchHint:"Es ist mehr als ein Teil sichtbar: Haken setzen, damit der Regelkreis den Median liest.",spread:"±σ",spreadTip:"Streuung des Winkels über die sichtbaren Teile (skalierter MAD). Groß neben einer großen Abweichung heißt schlechte Wiederholbarkeit, kein falsch eingestellter Bogen.",sbMeas:"Gemessene Rückfederung",sbUse:"Im Simulator verwenden",sbNote:"sb = 1 − gemessener Winkel / befohlener Winkel, je Orientierung. Median ± robustes σ über die Bögen der sichtbaren Teile; nahezu gerade (<1°) bleiben draußen.",sbCircular:"Achtung: %n der sichtbaren Teile sind simuliert. Die Rückfederung aus einem erfundenen Teil zu schätzen liefert das, was unten schon steht — ein geschlossener Kreis, keine Messung.",sbSpreadTip:"Streuung über Bögen und Teile. Ist sie so groß wie der Wert selbst, ist diese Rückfederung nicht gemessen, sondern geraten.",mnFile:"Datei",mnModel:"Modelle",mnView:"Ansicht",mnPieces:"Teile",mnMenu:"Menü",mnClose:"Schließen",signKey:"Vorzeichen wechseln",soloOn:"Nur 3D",soloOff:"Zurück",rotAxisTip:"Wie weit sich die Biegeachse an dieser Station dreht. Sie endet bei %e°.",rotHeadTip:"Drehung der Biegeachse gegenüber der vorherigen Station. Eine 0 lässt die Achse stehen: der Prozess ist sequenziell.",history:"Verlauf",undo:"Rückgängig",redo:"Wiederholen",histNote:"Macht Änderungen am Teil rückgängig: Zellen, Punkte, Modelle, Bezugspunkte, Platzierung und angewandte Kompensation. Nicht Kamera, Thema, Sprache, Ebenen oder Modus. 50 Schritte.",soloTip:"Tabelle und Seitenleiste einklappen, um das ganze Teil zu sehen (Taste F). Beim Zurückkommen steht die Tabelle, wo sie war.",expPts:"Punkte exportieren",expStep:"Teil als STEP (.stp)",expStepTip:"Das Teil als VOLUMENKÖRPER, mit exakten Flächen —Ebenen, Zylinder und Tori, kein Netz— sowie Achse und PI als Referenz. Jedes CAD öffnet es, ohne etwas nachzubauen. Es ist die Sollform, nicht der Maschinenbefehl. Fase und Endstück sind NICHT enthalten. Bei Torsion und nicht runder Querschnittsform gibt es keinen Volumenkörper: dann kommt nur die Referenzgeometrie, und die Datei sagt warum.",stpNoSolid:"Die .stp kommt OHNE Volumenkörper: nur Achse und Profil, als Referenzgeometrie. {r}",stpNoSec:"Der Querschnitt hat keine Maße.",stpNoThick:"Der Querschnitt hat keine Dicke.",stpTwist:"Das Teil hat Torsion und der Querschnitt ist nicht rund: der Volumenkörper wäre eine andere Stange, nicht dieses Teil.",stpKink:"Es gibt eine Biegung mit Radius null, also einen Knick: es gibt keine Fläche, die ihn beschreibt.",stpNeg:"Es gibt eine Gerade mit negativer Länge: der Vorschub reicht nicht und schiebt die Stange in sich selbst hinein.",modeModel:"Modellieren",modeMeas:"Messen",modeComp:"Kompensieren",modeModelTip:"Das Teil eingeben: die ganze Tabelle rechts und das Modell daneben.",modeMeasTip:"Das gemessene Teil ansehen: großes Modell, hohes Band und die Statistik.",modeCompTip:"Werkstattmodus: nur die Kompensationszellen sind editierbar. Befehle über die volle Breite, das 3D als Kontrollstreifen.",sbTrend:"hängt vom Winkel ab (%s %/°, r=%r)",sbTrendTip:"Die Rückfederung ändert sich mit dem befohlenen Winkel, eine einzige Konstante beschreibt den Prozess also nicht. Bei diesem Hinweis je Winkelbereich anpassen, statt eine Zahl zu übernehmen.",srcSimTip:"Vom Simulator erzeugtes Teil. Es wurde nichts gemessen.",srcVerifyTip:"Simulierte Prüfung nach der Kompensation. Ebenfalls keine Messung.",srcMeasTip:"Importiertes gemessenes Teil.",srcUnkTip:"Herkunft unbekannt: aus einer Datei, die sie nicht gespeichert hat.",anchor:"Bezugspunkt",aPivot:"Bezugspunkt bei {p}",aP0:"P0 (Einspannung)",aPE:"PE (Spitze)",pivotNote:"Gemeinsamer fester Punkt für alle Modelle, Messteile, die 3D-Ansicht und die Berichte. Wählen Sie das Ende oder den PI, der in der Werkstatt gehalten wird.",aBest:"Beste Anpassung",insPt:"+ Zwischenpunkt",delPt:"✕ Punkt",ptNote:"ABSOLUTE Bearbeitung: wird ein Punkt verschoben, bleiben die übrigen stehen und die LRA-Kette wird rückwärts neu berechnet. Ein neuer Punkt entsteht kollinear (Winkel 0) und ist sofort verschiebbar. Das Bearbeiten von Punkten rechnet die Δ in die Basis ein.",bake:"Δ einrechnen",zeroD:"Δ auf null",bakeAsk:`Dieses Modell hat noch nicht eingerechnete Δ.

r die Stange stärker anhebt als die Punkttoleranz. "Spalt" ist die Luft zwischen Auflage und Unterseite: positiv schwebt die Stange, negativ steht der Bock im Weg. "Stützweite" ist der Abstand zum vorherigen Bock entlang der Stange und bestimmt die Durchbiegung.',sbFew:"Trend: zu wenige Teile",sbFewTip:"Mit weniger als %n Teilen lässt sich nicht sagen, ob die Rückfederung vom Winkel abhängt: eine Stichprobe aus reinem Rauschen löst die Warnung in einem von drei Fällen aus. Der Median oben gilt weiterhin; es fehlt nur die Berechtigung, die Abhängigkeit zu behaupten.",sbFlat:"Trend: nur eine Winkelstufe",sbFlatTip:"Die gemessenen Teile wurden nahezu auf denselben Winkel gebogen, oder ein einzelnes liegt weit entfernt und bestimmt die Gerade allein. Eine Steigung misst man zwischen zwei Stufen: mindestens %p Teile je Seite, %s° oder mehr auseinander.",mmMethod:"Methode",measCloud:"Wolke/CSV",measAngles:"Nach Winkeln",angVsPlan:"gegen Plan",angPlan:"Plan",angPlanTip:"Plan (CAD): gewünschter nomineller Innenwinkel. Nur hier editierbar; leer = Wert der Tafel.",angRep:"Bericht",angRepTip:"Bericht: vom Scanner oder Goniometer gemessener Innenwinkel. Komma oder Punkt als Dezimaltrenner.",angBoard:"Tafel",angBoardTip:"Tafel: die Werte unter Modelle, mit denen die Maschine biegt. Die Kompensation korrigiert sie in einer neuen Tafel.",angBoardNow:"Aktuelle Tafel",angBoardNew:"Tafel → neu",angDeltaTip:"Δ im Biegesinn: + überbogen · − zu wenig gebogen. Grün innerhalb der Toleranz, gelb bis zum Doppelten, rot darüber.",angFlowHint:"Δ im Biegesinn (+ überbogen · − zu wenig gebogen). Korrigiert wird die Tafel (Biegewinkel), nicht der Plan.",angBoardInfo:"Teil gefertigt mit Tafel „{b}“.",angNameOf:"Name von {b}",angPlanOf:"Plan-Innenwinkel von {b}",angNoPlanTip:"Kein Plan: Δ wurde gegen die Tafel gemessen, nicht gegen das CAD.",angPlanMissing:"{n} Biegung(en) ohne Plan: mit der Tafel verglichen.",angRecDone:"Neue Tafel erstellt und aktiviert: „{v}“. Die vorherige bleibt unter Modelle
