 consume cada doblez. Centro = K 0.5, la fibra sin correr: es lo que este programa hizo siempre. DIN 6935 = K según el r/t de cada doblez, y cambia fila a fila. K fija = la que se teclee, para meter la que se mida en el taller. La DIN es de chapa en plegadora, no de curvado por estirado: es una primera aproximación, no el número de esta máquina.",fibreRt:"La DIN 6935 no cubre r/t por debajo de 0.65: %n dobleces salen con K topada en 0.325.",cutLenTip:"Longitud de CORTE: la barra recta que hay que meter en la máquina. Se mide sobre la fibra neutra, no sobre el eje que se dibuja, así que con K distinta de 0.5 no coincide con la abscisa de la cinta de abajo, que mide sobre la pieza ya doblada.",secRoundWarn:"En una barra redonda las dos inercias son iguales: no hay «de plano» ni «de canto». El RODADO sigue diciendo hacia dónde se dobla, pero ya no cambia con qué resiste la sección, y el retorcido de la pieza no se puede observar en el 3D.",secHollowWarn:"Los umbrales de radio mínimo son los de una barra MACIZA. En un tubo el radio que admite lo mandan la relación entre la medida que se dobla y la pared, y la ovalización al doblarlo, y eso este programa todavía no lo juzga: en pantalla se dobla más fácil de lo que se dobla en la máquina.",secHollowJudged:"Umbral de tubo puesto: {n} diámetros. Los dobleces con menos radio salen marcados en la pestaña Modelo. La cifra es la que teclearon en Límites, no una del programa: el programa no sabe deducirla.",secHollowJudgedRect:"Umbral de tubo puesto: {n} veces la medida de la sección que queda en el plano de doblado — el espesor en los dobleces de plano, el ancho en los de canto. Los dobleces con menos radio salen marcados en la pestaña Modelo. La cifra es la que teclearon en Límites, no una del programa: el programa no sabe deducirla.",tol:"Tolerancias",tolA:"Ángulo",tolR:"Rotación",tolF:"Avance",tolP:"Punto",bends:"Dobleces",addBend:"Agregar doblez",nBend:"#",feed:"Avance",rot:"Rodado",ang:"Ángulo",rad:"Radio",twist:"Twist",twlen:"Long. tw.",ori:"Or.",dcol:"Δ",straight:"Recta",arcL:"L",cumL:"Σ L",tailRow:"Cola",dStraightTip:"Δ de la RECTA, en mm. Base + Δ es la recta de la pieza. Se guarda como Δ de avance: un Δ de ángulo acorta la recta sin tocar el avance, y aquí se ve.",tailFootTip:"Recta de salida, de tangencia a tangencia como el resto de las longitudes. El avance de PI a PI es lo que se guarda y se manda a la máquina; la diferencia es el trim del último doblez.",lenNote:"Recta = tramo recto de tangencia a tangencia, y es lo único que se teclea de las longitudes — también la de la cola, que se teclea en el pie. L = longitud del arco que genera el doblez (radio × desvío). Σ L = longitud desarrollada acumulada sobre el eje neutro: recta, arco, recta, arco. Cada columna editable va sobre la base y su Δ al lado, y la suma de las dos es la pieza: por eso el Δ de la Recta está en milímetros de RECTA y no de avance. Y la tabla de Δ solo dice lo que se tecleó en ella: un Δ de ángulo o de radio deja las rectas quietas y recoloca los avances por dentro, igual que cambiar un ángulo o un radio en la base. El avance de PI a PI es lo que se guarda y lo que se manda a la máquina, y por eso es él quien se mueve. L y Σ L se cuentan sobre la FIBRA NEUTRA, que es la barra que de verdad se gasta; el eje que se dibuja y la cinta de abajo siguen midiendo por el centro de la sección, así que los dos números se separan en cuanto K deja de ser 0.5.",kbdNote:"Teclado: Tab / ⇧Tab mueven en horizontal · Enter y ↑ ↓ en vertical · Esc descarta la celda · la rueda del ratón o Ctrl+↑ ↓ suben y bajan el valor un paso. Al entrar en una celda su valor queda seleccionado: teclear lo reemplaza. Se admiten hasta tres decimales.",twnote:"Long. tw. = tramo recto (mm) sobre el que se reparte la torsión, centrado en la recta. 0 = toda la recta. No mueve ningún PI: solo define dónde ocurre la torsión.",proc:"Proceso simulado (pieza virtual)",sbW:"Recuperación canto",sbT:"Recuperación plano",slip:"Deslizamiento avance",biasR:"Sesgo de rotación",noise:"Ruido de escaneo",seed:"Semilla",simulate:"Generar pieza medida",dNone:"Sin pieza medida. Simule una o importe un CSV.",deltas:"Desviaciones por doblez",dA:"Δ ángulo",dR:"Δ rodado",dF:"Δ Avance",dP:"Desv. punta",statMaxA:"Δ desvío máx.",statRms:"RMS desvío",statTip:"Desv. punta libre",statOut:"Fuera de tol.",gains:"Ganancias de corrección",gainW:"Ganancia canto",gainT:"Ganancia plano",gainR:"Ganancia rodado",gainF:"Ganancia avance",gainNote:"El rodado y el avance llevan ganancia propia porque no son la misma magnitud que el doblez. «Canto» y «plano» son constantes de recuperación elástica: cuánto se abre la barra al soltarla. El rodado no tiene resorte —se corregía entero, o sea a ganancia 1.0, que es justo lo que se prohíbe para el ángulo porque oscila con el ruido de medición— y al avance lo desvía el deslizamiento, que es otro fenómeno.",what:"Qué corregir",cAng:"Ángulos de doblez",cRot:"Rodado",cFeed:"Avances",apply:"Aplicar compensación",reset:"Restablecer comandos",cmdTbl:"Comandos de máquina",cNow:"Actual",cNew:"Nuevo",cDelta:"Δ",predict:"Residual previsto",verify:"Verificar (correr 2.ª pieza)",noMeas:"Necesita una pieza medida para calcular la compensación.",stLen:"Longitud desarrollada",stBends:"Dobleces",stDatum:"Datum",stMax:"Desv. máx.",stUnits:"Unidades",stVer:"Versión",stVerTip:"Compilación que está corriendo. Cítala al reportar un número raro: con una copia en el taller y otra publicada, es lo único que las distingue. «+sucio» = compilada sobre cambios sin confirmar.",schemaAmbiguous:`Este archivo es barcomp/2.2 y no dice con qué sentido de giro se escribió.

Se abrió tal cual, sin cambiar ningún número. Pero si se guardó antes del cambio de sentido, la pieza aparece doblada al otro lado.

COMPRUEBA LA FORMA en el 3D antes de compensar. Al guardar sale como 2.3 y deja de ser ambiguo.`,schemaMigrated:`Archivo de una versión anterior: se convirtió a la convención actual sin mover la pieza.

Los ajustes manuales y el comando de las piezas medidas no se convierten, así que llegan en cero.`,schemaUnknown:`Esquema desconocido: {s}

Este programa no sabe con qué convención se escribió, así que no lo abre en vez de arriesgarse a interpretarlo mal.`,jsonNotJson:`Este archivo no es JSON: no hay ni por dónde empezar a leerlo.

Suele pasar al elegir el CSV de puntos o el informe del escáner. Lo que se abre aquí es el .json que guarda este programa.`,jsonNotDoc:`Es un JSON válido, pero no describe una pieza: no tiene «model.bends».

Abre el .json que guardó BARCOMP. Para meter una pieza MEDIDA desde una nube de puntos está «Importar piezas», no «Abrir».`,jsonBroken:`El archivo es un documento barcomp, pero algo de dentro está roto y no se pudo abrir entero.

No se cargó nada: lo que tenías sigue como estaba. La línea de abajo es para quien mantenga el programa.`,dStart:"Extremo inicial",dBest:"Mejor ajuste global",formula:"nuevo comando = comando actual + ganancia × (nominal − medido)",note:"La cadena completa se regenera tras cada corrección: el arrastre entre dobleces ya está contenido en el modelo.",repModel:"Reporte de modelo",repPrint:"Imprimir / PDF",repTotal:"Total",repBase:"Modelo sin compensación",repAdjust:"Compensaciones",repTotals:"Totales",repSameAll:"Igual en todos los modelos",repSave:"Guardar HTML",ok:"En tolerancia",bad:"Fuera de tolerancia",piece:"Pieza",orW:"Canto (contra el ancho)",orT:"Plano (contra el espesor)",orR:"Sección redonda: no hay canto ni plano. Las dos inercias son iguales, así que se dobla igual contra cualquier cara y hay una sola constante, no dos.",gainOne:"Ganancia",sbOne:"Recuperación",secOneConst:"La barra es redonda: una sola constante. Con Iz = Iy no hay «de canto» ni «de plano», así que repartir en dos compensaría un doblez con el retorno del otro.",confirmNew:"¿Crear un modelo nuevo vacío? Se perderá lo no guardado.",pts:"Punto",x:"X",y:"Y",z:"Z",gizmoClamp:"Ejes de la sección en el amarre: X el eje de la barra, Y el espesor, Z el ancho. Elige un doblez en la tabla para verlos ahí.",gizmoBend:"Ejes de la sección al salir del doblez %b: X el eje de la barra ahí, Y el espesor, Z el ancho.",variants:"Modelos",addVar:"+ Modelo",dupVar:"Duplicar",setRef:"Usar como referencia",isRef:"REF",srcSim:"SIM",srcVerify:"SIM ✓",srcMeas:"MED",srcUnk:"S/D",impCsv:"Importar CSV",impTip:"Piezas medidas: un CSV por pieza, con los PI en columnas x,y,z. Se pueden elegir varios archivos a la vez.",csvBad:"Estos archivos no traían al menos tres puntos con coordenadas y no se importaron:",csvComma:"los decimales van con coma; hacen falta con punto",csvCols:"{n} columnas numéricas por línea: no se sabe cuáles son x,y,z. Exporta solo las coordenadas, o índice + coordenadas",csvFew:"menos de tres puntos con coordenadas",csvScale:"los puntos avanzan {n} mm de media y los del modelo {m} mm: esto no son coordenadas de la barra. Suele ser una columna de desviación exportada en lugar de la coordenada, o unidades que no son milímetros",csvNear:"los puntos {i} están a menos de {d} mm del anterior: dos PI pegados inventan un doblez. Revisa la extracción de la nube",devRowTip:"Desviación del doblez {b}. Enter la selecciona en el 3D y en la tabla; las flechas suben y bajan.",pins:"Amarre",lPins:"Pines",lHeld:"Barra sujeta",pinOn:"Barra sujeta por los pines",pinOnTip:"Apagado, la barra está libre en el espacio y el programa se comporta exactamente como antes de que los pines existieran. Encendido, la pieza no puede irse a donde la manda la tabla: se queda donde la dejan los pines y se deforma para llegar ahí.",pinDoRot:"El rodado también cede",pinRotTip:"Un pin empuja en el plano de la mesa. Dejar que el rodado ceda además del ángulo suele repartir mejor la deformación, pero son dos incógnitas por estación en vez de una y es una decisión física, no un ajuste de velocidad.",pinTol:"Contacto",pinTolTip:"Por debajo de esta distancia se considera que la barra toca el pin y no hay nada que cerrar.",pinDamp:"Reparto",pinDampTip:"Cerca de 0 la deformación se concentra en la estación más flexible; subiéndolo se reparte entre más estaciones. Es el mismo papel que la ganancia del lazo: al máximo de agresividad, oscila.",pinDia:"Ø",pinGap:"Hueco",pinReach:"Llega",pinReachTip:"Si se tocan por el CUERPO del poste o por uno de sus cabos. Un pin que se queda por debajo de la barra no la toca por mucho que esté en su sitio, y uno levantado por encima la deja pasar por debajo: en los dos casos no sujeta nada.",pinYes:"sí",pinNo:"no",pinHold:"Sujeta",pinHoldTip:"Un pin puede estar montado y no querer contarse: apagarlo deja verlo en el 3D sin que entre en la cuenta, que es como se comprueba qué pin está causando qué.",pinMeasFree:"Se está viendo y midiendo la barra LIBRE con el amarre o la carga puestos: esta tabla, las cotas, los puntos y el sembrado contestan sobre la pieza que habría sin nada que la sujetara, no sobre la que hay encima de la mesa. Las reacciones no: salen del reparto de la pieza sujeta y siguen siendo las suyas. Elige «Sujeta» o «Las dos» en «Ver», en la pestaña Amarre, para leer la barra que hay.",pinShow:"Ver",pinShowFree:"Libre",pinShowHeld:"Sujeta",pinShowBoth:"Las dos",pinShowTip:"Qué barra se ve y contra cuál se mide TODO, en todos los modelos a la vez: la libre —el diseño, la pieza fuera del fixture— o la que de verdad queda sujeta por los pines y colgando de su peso. Con «Sujeta» o «Las dos» van con la sujeta las dos tablas, las cotas, la flecha, los puntos PI y sus etiquetas, el desplazamiento entre modelos, la cinta, los colores de los apoyos y dónde nacen los pedestales y pines sembrados. «Las dos» añade la libre en alambre como referencia. Lo único que no cambia es dónde se COLOCA la pieza ni dónde están los apoyos, que están atornillados a la mesa.",pinTilt:"Inclin.",pinTiltTip:"Cuánto se tumba el poste respecto de la vertical, en grados. 0 = a plomo. Un pin inclinado toca la barra en un punto distinto y con otra dirección: el contacto se resuelve entre los dos ejes en el espacio, no en planta.",pinYaw:"Rumbo",pinYawTip:"Hacia dónde se tumba, medido en planta desde +X. Sin inclinación no significa nada: un cilindro vertical girado sobre su propio eje es el mismo cilindro.",pinLen:"Largo",pinLenTip:"Lo que MIDE el poste desde su base, en milímetros. No es a qué altura está puesto: uno que se queda corto no llega a la barra y no sujeta de lado por bien colocado que esté, y uno demasiado largo acaba tocando también por donde no debe. Para subirlo sin alargarlo está la columna de al lado.",pinZ:"Altura",pinZTip:"A qué altura sobre la mesa ARRANCA la base del poste, en milímetros. 0 es el pin atornillado a la mesa, que es lo normal. Se levanta para llegar a una barra que pasa alta sin que el poste toque además por debajo, donde a lo mejor pasa otro tramo de la pieza. Lo que lo sostiene ahí arriba —un dado, un suplemento, el propio cuerpo del fixture— no se dibuja ni entra en la cuenta: esto dice dónde está el cilindro, no de qué cuelga.",pinDist:"Dist.",pinDistTip:"Distancia entre el eje del pin y el eje de la barra donde más se acercan, en el espacio. Con los pines a plomo coincide con la distancia en planta; inclinados, no.",pinSide:"Lado",pinSideAuto:"auto",pinSideTip:"De qué lado de la barra está MONTADO el pin. Es dato del fixture, no una lectura: si se lee de la forma de cada momento, en cuanto un ángulo manda la barra más allá del eje del poste la lectura sale invertida y el contacto se cierra por la cara equivocada — o sea, se resuelve una pieza que atravesó el pin. «auto» lo decide por la geometría la primera vez, que es lo que hacía antes.",pinState:"Estado",pinHolding:"sujetando",pinEmpty:"Sin pines. «Sembrar» reparte unos cuantos tocando de lado y alternando de lado, que es como se sujeta una barra de verdad: todos del mismo lado la dejarían girar sobre ellos.",addPin:"+ Pin",seedPin:"Sembrar pines",clearPin:"Quitar todos",pinNote:"Un pedestal sostiene; un pin IMPIDE. Los pines están atornillados a la mesa, así que no se mueven cuando la pieza se recoloca: lo que cambia es si siguen tocando. Un pin con hueco a favor no empuja nada y se ignora — no es un error, el fixture puede tener más pines de los que esta pieza usa.",pinOffNote:"Con el amarre apagado la barra se calcula libre en el espacio. Los pines se pueden colocar y ver en el 3D, pero no deforman nada.",pinNoneHold:"Ningún pin está tocando la barra, así que el amarre no cambia nada. Revisa la altura y la posición: la columna «Llega» dice cuáles no alcanzan la barra y «Hueco» a qué distancia se quedan.",pinHeldN:"{n} pin(es) sujetando",pinTip:"Punta",pinTipTip:"Cuánto se mueve el extremo libre por estar la barra sujeta, comparado con la misma pieza libre en el espacio. Es la consecuencia que se mide.",pinWorstKink:"Peor codo",pinStress:"Esfuerzo",pinOfYield:"del límite",pinYield:"En algún punto la barra pasa del límite elástico: al soltarla NO vuelve, y la pieza que sale no es la que dice el modelo. Con el material sin confirmar esto es un aviso, no una medida — pero el sitio donde ocurre sí es real.",pinYieldTip:"Tensión de flexión en la fibra más alejada, comparada con el límite elástico del material. Por encima del 100 % la deformación deja de ser recuperable.",pinOpen:"{n} contacto(s) sin cerrar",pinOpenTip:"El solver no pudo llevar la barra a tocar estos pines. Suele significar un fixture imposible: dos pines que piden la barra en dos sitios a la vez, o uno metido tan adentro que la pieza tendría que romperse para llegar.",pinKink:"Codo °",pinCurv:"Curvatura °/m",pinSigma:"σ MPa",matRho:"Densidad",matRhoTip:"Peso del material por metro cúbico. Solo la usa la flecha por gravedad: es lo que hace que la barra se cuelgue entre apoyos. Provisional como el resto del material.",sag:"Flecha",sagTip:"Cuánto se cuelga la barra por su propio peso en el tramo que ACABA en este pedestal, en milímetros. El voladizo de cada punta cuenta como ménsula y es donde más se nota: la longitud va a la cuarta potencia. La orientación manda más que el vano — de plano se cuelga (ancho/espesor)² veces más que de canto, que con 40×12 son once veces.",sagNote:"La flecha se calcula tramo a tramo como viga biapoyada, y los voladizos como ménsula. Una viga continua sobre varios apoyos es MÁS rígida que eso, así que este número sobreestima: es el lado seguro. Cada tramo se trata como recto — los dobleces dentro de un vano no rigidizan aquí. Cuando llegue el escaneo de una barra recta certificada montada en el fixture, esto se contrasta contra la flecha medida y deja de ser una estimación.",sagBad:"La flecha por gravedad pasa de la tolerancia de punto. Eso entra en la medición como un error que NO es de doblado: el lazo intentará corregirlo y no podrá. Añade un apoyo en el tramo peor, o acorta el voladizo.",sagNoMat:"Flecha: falta el material",sagNoMatTip:"Sin densidad y sin módulo elástico no hay número que dar. Se rellenan en la pestaña Amarre.",matE:"Módulo E",matYield:"Límite elástico",matTip:"Solo hace falta para pasar de deformación a esfuerzo. La FORMA que toma la barra sujeta no depende de E: con sección constante se cancela en el reparto, y hay una prueba de que cambiarlo no mueve un solo punto.",matProv:"Material PROVISIONAL: son valores de manual de un 6061-T6, no los de la colada que está en el taller. Sirven para ver dónde se concentra el esfuerzo; para afirmar «esta pieza se pasa por 12 MPa» hace falta el certificado del material.",load:"La carga",loadOn:"La pieza pesa",loadOnTip:"Con esto puesto la barra deja de quedarse donde la deja la tabla: se cae hacia donde tira la carga, se apoya en los pedestales y aprieta contra los pines que le queden en el camino. Un apoyo EMPUJA pero no TIRA, así que si un doblez separa la pieza de un pin, se separa; y si la gravedad la devuelve a él, vuelve.",loadSlow:"Esta pieza tiene {n} dobleces. Por encima de {lim}, calcular cómo se asienta deja de ser instantáneo: con 34 tarda cerca de un segundo y con 60 pasa de los quince. No es un límite y el resultado es igual de bueno —se dice para que no parezca que el programa se coló—. Lo que manda es el NÚMERO de dobleces: ni el largo de la barra ni lo juntos que vayan cambian nada.",loadG:"Gravedad (×g)",loadGTip:"Múltiplo del peso propio. 1 es el peso de verdad; 0 lo quita y deja solo el empuje de la punta; 2 sirve para ver qué se movería si la pieza pesara el doble.",loadDir:"Dirección",loadDirTip:"Hacia dónde tira la carga. (0, 0, −1) es hacia abajo, que es lo que hace la gravedad. Apuntando a otro lado se empuja la pieza contra un amarre concreto, para ver si ese amarre la aguanta.",loadTipF:"Empuje en la punta",loadTipTip:"Una fuerza más, en el extremo libre y en la misma dirección. Es el dedo con el que uno prueba si la pieza se mueve, puesto donde más se nota.",loadWeight:"Peso",loadWeightTip:"Lo que pesa la pieza entera, más el empuje de la punta. Sale de la densidad y de la sección: una barra de 1.7 m de 40×12 son unos 22 N, o sea 2.2 kg.",loadCarried:"Los apoyos llevan",loadCarriedTip:"Cuánto de ese peso se reparte entre pedestales y pines: la suma de las reacciones, proyectada contra la carga.",loadRoot:"La mordaza aguanta",loadRootTip:"Lo que no llevan los apoyos se queda en el primer extremo, que es por donde la pieza está agarrada. Es el número que contesta «¿me hacen falta más pedestales?». Negativo quiere decir que la mordaza tira hacia ABAJO: los apoyos llevan más que la pieza entera porque la barra hace palanca sobre alguno.",loadRootDown:"La mordaza tira de la pieza hacia ABAJO con {n} N: la barra hace palanca sobre un pedestal y los apoyos llevan más que la pieza entera. Con la mordaza que tiene el fixture es un resultado posible, pero dice que sin ella el primer extremo se levantaría: comprueba que la mordaza aprieta y no solo apoya.",loadDrop:"Se movió",loadDropTip:"Cuánto se ha desplazado el punto que más, medido contra la pieza libre. Incluye lo que hacen los pines Y lo que hace la carga: para separarlas, quita la carga y mira el mismo número.",loadPene:"Se hunde",loadPeneTip:"Cuánto se mete un apoyo dentro de la barra. El contacto se modela con un muelle muy duro, así que esto tiene que salir en micras; si llega a la tolerancia, el muelle se quedó corto y las reacciones de al lado hay que mirarlas con recelo.",loadN:"Reacción",loadNTip:"Con cuánta fuerza empuja ese apoyo, en newton. Un guion quiere decir que la pieza no lo está tocando, que es una respuesta y no un fallo. «n/d» quiere decir otra cosa muy distinta: que ahí el modelo no puede decir nada. Y esta cifra vale lo que valga el alto MEDIDO: una micra de más en un apoyo mete varios newton en la pieza, y junto a la mordaza los mete enteros porque ahí la barra no puede ceder. Sirve para ver qué apoyo trabaja y cuál no; no es la lectura de una célula de carga.",loadNd:"n/d",glLost:"La tarjeta gráfica ha soltado el 3D (suspensión, cambio de pantalla o controlador). Los datos y las tablas siguen bien. El 3D vuelve solo si el navegador lo recupera; si no vuelve, guarda el trabajo y recarga la página.",faultMsg:"Algo ha fallado ({e}). Lo que hay en pantalla puede no estar al día: guarda el trabajo y recarga la página.",faultClose:"Cerrar aviso",clashCard:"No cabe en el fixture: {n} se mete {d} mm",clashTip:"Con este modelo encima del fixture, ese apoyo queda DENTRO de la barra por muchos milímetros que la barra ceda. Pasa cuando la pieza es distinta de la que el fixture sujeta: un doblez unos grados distinto puede dejar la barra al otro lado de un pin, y ninguna deformación elástica la devuelve atravesándolo. La forma sujeta que se dibuja es la más cercana que el modelo encuentra, no una que se pueda montar. En el 3D hay un rombo rojo en cada apoyo que choca.",fixLoadOn:"Aquí la pieza pesa {w} N, y eso se enciende en la pestaña Amarre. La columna «Reacción» dice cuánto de ese peso lleva cada pedestal.",fixLoadOff:"Aquí la pieza no pesa. La flecha ya usa su peso propio, pero cuánto carga cada pedestal solo sale con «La pieza pesa» puesto, en la pestaña Amarre: entonces aparece la columna «Reacción».",colVis:"Visible en el 3D",xyTip:"Dónde está sobre la mesa, en milímetros. Es una medida del taller: no se mueve cuando la pieza se recoloca.",pedHTip:"Cuánto sube la cuna desde la mesa, en milímetros.",pedPadTip:"Largo de la cuna, en milímetros. Con una cuna larga, medio grado de inclinación de más ya levanta la barra.",pedTiltTip:"Con qué inclinación está puesta la cuna, en grados. Positiva si sube, con el mismo criterio que «Pide».",pedWantTip:"La inclinación que tiene la barra justo encima del pedestal, en grados. Positiva si sube.",pedD:"Δ",pedDTip:"Lo que le sobra o le falta a la cuna: su inclinación menos la que pide la barra, en grados. Se pinta en rojo cuando eso levanta la barra en la punta de la cuna más que la tolerancia de punto; la ayuda de cada celda dice cuántos milímetros.",pedSTip:"Dónde toca, medido a lo largo de la barra desde el primer extremo, en milímetros.",pedPlanTip:"Distancia en planta del pie al eje de la barra, en milímetros. Dice si el pedestal está debajo de la barra o al lado.",pedGapTip:"Aire entre la cuna y la cara de abajo de la barra, en milímetros. Positivo: la barra vuela y no apoya. Negativo: el pedestal estorba y levantaría la pieza.",pedSpanTip:"Distancia al pedestal anterior a lo largo de la barra, en milímetros. Es lo que decide la flecha por gravedad.",pinDiaTip:"Diámetro del poste, en milímetros.",pinGapTip:"Aire entre el poste y la barra donde más se acercan, en milímetros. Positivo: la barra no llega al pin. Negativo: el pin está metido donde iría la barra y la empuja.",pinStateTip:"Si el amarre está usando este pin ahora mismo para sujetar la barra.",stHold:"Sujeta por los pines",stLoad:"La pieza pesa",stHoldLoad:"Sujeta y pesando",stHoldGo:"Clic: abre la pestaña Amarre, que es donde están los dos interruptores.",loadNdTip:"Aquí no se puede dar un número. Este apoyo cae en un tramo que el modelo no sabe doblar —las incógnitas son los codos de las estaciones— así que su hueco no cambia por mucho que la pieza ceda, y la reacción que saliera no querría decir nada. No es un cero: un cero significa que la pieza no lo está tocando.",loadNoDof:"La pieza no tiene ninguna estación, así que este modelo no la sabe colgar: lo que pesa sí se sabe, cómo se reparte entre los apoyos no. Para una barra recta el número que sirve es la flecha por gravedad, en la pestaña Fixture.",loadStuck:"Sin resolver",loadStuckTip:"La búsqueda del equilibrio se paró antes de llegar a él: lo que hay al lado es el último tanteo y no una solución. Suele pasar cuando un apoyo entra y sale del contacto en cada paso, o cuando dos apoyos se pelean por el mismo punto.",loadStuckWarn:"La carga no llegó al equilibrio en {n} pasos: los números de abajo son el último tanteo y no se pueden defender. Sube el amortiguado, o aparta el apoyo que esté justo en el límite de tocar.",loadNote:"Las incógnitas son los codos de las ESTACIONES, así que en este modelo un tramo recto no se cuelga por el medio: esa parte la da la flecha por gravedad, en la pestaña Fixture. Las dos miran cosas distintas de la misma barra y no se suman. La rigidez de una estación se toma como EI/L, que para un voladizo es unas cuatro veces más blanda que la exacta: esto da el orden y la dirección, no una flecha certificada.",loadNoMat:"Sin densidad y sin módulo elástico no hay carga que aplicar. Los dos se rellenan aquí arriba, en el material.",loadHang:"Los apoyos llevan menos de la mitad del peso: la pieza está colgando de su propio extremo. Lo que se ve es un voladizo, no una pieza montada; o faltan pedestales, o los que hay no la están tocando.",mach:"Máquina",machTitle:"Comando de máquina",machCols:"Columnas, en este orden",machAxis:"Eje abs.",machSep:"Separador",machDec:"Decimales",machLen:"Longitudes",machAng:"Ángulos",machSignA:"Signo del ángulo",machSignR:"Signo del rodado",machSignTip:"Invierte el signo SOLO en el archivo. La cinemática no se toca: los mismos números siguen doblando la misma pieza en pantalla. Está aquí porque una máquina puede tener el eje montado al revés, y eso se corrige al escribir, no en el motor.",machRot:"Rodado como",machRotDelta:"giro respecto al anterior",machRotAbs:"posición absoluta del eje",machRotTip:"El modelo guarda cuánto GIRA el eje en cada estación, porque la máquina lo sostiene entre dobleces. Hay controles que quieren en cambio la posición absoluta del eje. Las dos describen la misma pieza; elegir la equivocada dobla bien la primera estación y mal todas las demás.",machHead:"Con encabezado",machCrlf:"Fin de línea CRLF",machCrlfTip:"Muchos controles de máquina no leen un fin de línea de UNIX. Con esto el archivo termina cada línea como espera un control de Windows.",machTail:"Fila de la cola",machTailTip:"Una última fila con la recta de salida. Sin ella el archivo no dice cuánto material queda después del último doblez, y las columnas que no le corresponden salen vacías, no en cero: un cero en la columna del ángulo es un doblez de cero grados, o sea una instrucción.",machPrev:"Vista previa",machMore:"y {n} fila(s) más.",machExport:"Exportar comando",machDirty:"Hay un ajuste manual escrito y sin aplicar. El archivo lleva el comando guardado, no lo que muestra la tabla de compensación: aplica primero, o el ajuste no sale.",machNote:"El formato que lee la dobladora está pedido y no ha llegado, así que aquí no se adivina: se deja a la vista. Antes de mandar una barra, comprueba en la vista previa las unidades y los signos contra una pieza que ya conozcas — es lo único de este archivo que no se puede deshacer. El perfil viaja en el JSON de la pieza, así que un archivo de máquina de hace meses se puede volver a generar igual.",lims:"Límites",limWhat:"Umbral",limVal:"Valor",limDef:"Fábrica",limState:"Estado",limWait:"Espera",limTouched:"tocado",limFactory:"de fábrica",limProv:"provisional · {p}",limRead:"Al leer un dato medido",limLoop:"Guardas del lazo",limReset:"Volver a los de fábrica",limHitStraight:"Con este umbral, {n} recta(s) de esta pieza no caben.",limNote:"Estos números no mueven ningún PI: deciden qué se rechaza, de qué dato se desconfía y cuánto puede corregir el lazo de una vez. Viajan en el JSON de la pieza, así que un archivo guardado dice con qué umbrales se juzgó. «Provisional» significa que el valor se eligió a falta de un dato que está pedido: A.6 es la repetibilidad real del escaneo (σ) y B.2 la cota de la máquina. Un 0 apaga esa vigilancia.",lim_axisMin:"Eje legible",lim_axisMinTip:"Desvío mínimo para creerle el EJE a un doblez medido. Por debajo, la dirección lateral es ruido: el eje se hereda del doblez anterior en vez de inventarlo. La regla real es atan(3σ/avance). Solo se aplica a lo MEDIDO; en un modelo tecleado un doblez de 0.2° es deliberado.",lim_piMin:"PI separados",lim_piMinTip:"Distancia mínima entre dos PI de un archivo importado. Dos puntos más juntos dan una dirección de puro ruido y de ahí un doblez inventado que además envenena la fila siguiente. La regla real es 5σ. Con dos PI pegados se rechaza el archivo entero: significa que la extracción de la nube salió mal.",lim_scaleMin:"Escala mínima",lim_scaleMinTip:"Fracción del paso nominal por debajo de la cual la nube importada no puede ser la misma pieza. NO es una tolerancia: caza un export cuyas columnas son la DESVIACIÓN y no la coordenada, o metros leídos como milímetros. Solo por abajo: a un escaneo con puntos de menos el paso medio le SUBE, y eso no es un archivo malo.",lim_straightMin:"Recta mínima",lim_straightMinTip:"Recta entre tangencias que hace falta para que quepan los herramentales: mordaza más carrera del cabezal. Es una cota de la MÁQUINA, no del escáner. Una recta negativa se lista aparte pase lo que pase: son dos herramentales en el mismo sitio.",lim_tubeRfac:"Radio mínimo de tubo",lim_tubeRfacTip:"Para tubo REDONDO y RECTANGULAR: en el redondo se mide contra el diámetro exterior; en el rectangular, contra la medida que queda en el plano de doblado, el espesor en los dobleces de plano y el ancho en los de canto. Con 1.5 aquí, un Ø40 no se dobla por debajo de R60. Nace en 0, que significa no vigilar esto, y no es un descuido: en un tubo el radio que aguanta lo mandan la relación entre la medida que se dobla y la pared, y la ovalización al doblarlo, y este programa no tiene con qué deducirlo. Poner una cifra de fábrica sería darle cara de dato a una opinión. Si el taller tiene su norma, aquí se teclea.",lim_dead:"Banda muerta (ángulo)",lim_deadTip:"Por debajo de esta diferencia contra el nominal, el lazo no corrige: es ruido de medición y perseguirlo hace oscilar la pieza. 0 la apaga.",lim_deadFeed:"Banda muerta (avance)",lim_deadFeedTip:"Lo mismo que la banda muerta del ángulo, en milímetros y sobre el avance.",lim_maxStep:"Tope por ciclo (ángulo)",lim_maxStepTip:"Corrección máxima que el lazo puede aplicar de una vez. Un salto mayor no es una desviación de proceso: es un dato malo o un doblez que cruzó de rama. Se recorta y se sigue, en vez de mandarlo a la máquina. 0 quita el tope.",lim_maxStepFeed:"Tope por ciclo (avance)",lim_maxStepFeedTip:"Lo mismo que el tope del ángulo, en milímetros y sobre el avance.",fabHead:"Esta pieza no se puede fabricar como está:",fabNeg:"la recta que entra a {b} es NEGATIVA: los herramentales se cruzan.",fabShort:"la recta que entra a {b} no llega a {n} mm, que es lo que necesita el herramental.",fabTail:"la recta de salida no llega a {n} mm.",fabOver:"{b} pide más de {n}° de desvío: los largos de esa fila salen topados.",fabTube:"En {b} el radio no llega al mínimo de tubo: {n} diámetros son R{r}.",fabTubeRect:"En {b} el radio no llega al mínimo de tubo: {n} veces la medida que queda en el plano de doblado son R{r}.",fileUnread:"el sistema no dejó leer el archivo (¿se movió, o lo tiene abierto otro programa?)",csvShort:"Estas piezas traen MENOS puntos que el modelo. Los dobleces que faltan quedan SIN MEDIR y no se compensan:",compSim:"CUIDADO: {n} de las piezas que alimentan este cálculo son SIMULADAS, no medidas. Lo que salga de aquí no describe ninguna barra real.",compHeld:"El amarre o la carga están puestos, así que el 3D puede estar enseñando la pieza ASENTADA. Estas correcciones NO: se calculan contra la pieza libre, que es la que describe la tabla. Si lo que se quiere es la forma con el fixture puesto, todavía no se corrige contra eso.",compShort:"Solo {a} de {b} dobleces están medidos. Los que faltan salen marcados con — y NO se compensan.",rowNoMeas:"Este doblez no está medido: la pieza traía menos puntos que el modelo. El comando se deja como está.",compFewN:"El lazo lee {a} pieza(s) y hacen falta {n}. Con menos, el comando persigue la dispersión de esa pieza y la siguiente puede salir peor.",batchUse:"Usar la mediana de las piezas visibles ·",batchTip:"Con una sola pieza, el lazo corrige también lo que fue dispersión de esa pieza y la siguiente puede salir peor. Con varias, la mediana deja pasar solo lo que se repite.",batchOn:"El lazo lee la mediana de %n piezas, no la última.",batchHint:"Hay más de una pieza visible: marque la casilla para que el lazo lea la mediana.",spread:"±σ",spreadTip:"Dispersión del ángulo entre las piezas visibles (MAD escalado). Grande junto a una desviación grande = mala puntería, no un doblez mal ajustado.",sbMeas:"Resorte medido",sbUse:"Usar en el simulador",sbNote:"sb = 1 − ángulo medido / ángulo comandado, por orientación. Mediana ± σ robusta sobre los dobleces de las piezas visibles; los casi rectos (<1°) no entran.",sbCircular:"Aviso: %n de las piezas visibles son simuladas. Estimar el resorte de una pieza inventada devuelve lo que ya está escrito abajo — es un ciclo cerrado, no una medición.",sbSpreadTip:"Dispersión entre dobleces y entre piezas. Si es del tamaño del propio valor, ese resorte no está medido: está adivinado.",mnFile:"Archivo",mnModel:"Modelos",mnView:"Vista",mnPieces:"Piezas",mnMenu:"Menú",mnClose:"Cerrar",signKey:"Cambiar el signo",soloOn:"Solo 3D",soloOff:"Volver",rotAxisTip:"Cuánto gira el eje de doblado en esta estación. Queda en %e°.",rotHeadTip:"Giro del eje de doblado respecto a la estación anterior. Un 0 deja el eje donde estaba: el proceso es secuencial.",history:"Historial",undo:"Deshacer",redo:"Rehacer",histNote:"Deshace ediciones de la pieza: celdas, puntos, modelos, cotas, colocación y compensación aplicada. No deshace la cámara, el tema, el idioma, las capas ni el modo. 50 pasos.",soloTip:"Plegar la tabla y el lateral para ver la pieza entera (tecla F). Al volver, la tabla sigue donde estaba.",expPts:"Exportar puntos",expStep:"Pieza a STEP (.stp)",expStepTip:"La pieza como SÓLIDO, con caras exactas —planos, cilindros y toros, sin mallado— más el eje y los PI como referencia. Lo abre cualquier CAD sin reconstruir nada. Sale el nominal, no el comando. NO lleva el chaflán ni el tocho de los cabos. Con torsión y sección no redonda no hay sólido: sale solo la geometría de referencia, y el archivo dice por qué.",stpNoSolid:"El .stp saldrá SIN sólido: solo el eje y el perfil, como geometría de referencia. {r}",stpNoSec:"La sección no tiene medidas.",stpNoThick:"La sección no tiene espesor.",stpTwist:"La pieza lleva torsión y la sección no es redonda: barrer daría una barra distinta de esta pieza.",stpKink:"Hay un doblez de radio cero, o sea un pliegue: no hay superficie barrida que lo describa.",stpNeg:"Hay una recta de longitud negativa: el avance se queda corto y mete la barra dentro de sí misma.",modeModel:"Modelar",modeMeas:"Medir",modeComp:"Compensar",modeModelTip:"Teclear la pieza: la tabla entera a la derecha y el modelo al lado.",modeMeasTip:"Mirar la pieza medida: el modelo grande, la cinta alta y las estadísticas.",modeCompTip:"Modo taller: solo se editan las celdas de compensación. Los comandos a todo el ancho y el 3D como banda de comprobación.",sbTrend:"depende del ángulo (%s %/°, r=%r)",sbTrendTip:"El resorte cambia con el ángulo comandado, así que una constante única no describe el proceso. Con esta señal, ajuste por rango de ángulo en vez de adoptar un solo número.",srcSimTip:"Pieza inventada por el simulador. No se ha medido nada.",srcVerifyTip:"Verificación simulada tras aplicar la compensación. Tampoco es una medida.",srcMeasTip:"Pieza medida importada.",srcUnkTip:"Procedencia desconocida: viene de un archivo que no la guardaba.",anchor:"Extremo fijo",aStart:"Amarre (P0)",aEnd:"Libre (punta)",aBest:"Mejor ajuste",insPt:"+ Punto intermedio",delPt:"✕ Punto",ptNote:"Edición ABSOLUTA: al mover un punto los demás se quedan donde están y la cadena LRA se recalcula por inversa. Un punto nuevo nace colineal (ángulo 0), listo para moverse. Editar puntos funde los Δ en la base.",bake:"Fundir Δ",zeroD:"Δ a cero",bakeAsk:`Este modelo tiene Δ sin fundir.

¿Continuar?`,dTip:"Δ punta vs ref",dblz:"dbl",place:"Colocación",pivot:"Pivote",plX:"Mover X",plY:"Mover Y",plZ:"Mover Z",plRX:"Giro X",plRY:"Giro Y",plRZ:"Giro Z",plReset:"Restablecer colocación",plNote:"Mueve y gira la PIEZA sobre un suelo quieto, alrededor del PI que elijas como origen: la cuadrícula y la cámara no se mueven. Los pedestales la siguen, apoyando siempre en el suelo. No toca ningún avance, ángulo ni radio.",lMarks:"Puntos de referencia",marks:"Puntos de referencia",addMark:"+ Punto",nearPi:"PI",distPi:"Dist.",markNote:"Cotas sueltas en el espacio: el punto se une con el PI más cercano del modelo activo y la cifra dice a cuánto quedó. Sirve para acotar contra el fixture o un datum de taller. «+ Punto» lo crea sobre el doblez seleccionado.",cCalc:"Δ calc.",cAdj:"Δ aplicada",zeroTw:"Δ manual a cero",cellNote:"La celda Δ aplicada se escribe como en una hoja de cálculo, y hay tres formas. RELATIVO A LO QUE VES: un operador al principio opera sobre lo que muestra la celda — «+2» le suma 2, «-0.3» le quita tres décimas, «*1.1» le pone un 10 % más. RELATIVO AL LAZO: lo que calculó se llama c — «c», «c+2», «(c+1)/2». ABSOLUTO: un número suelto reemplaza, y «=» lo fuerza, que es como se escribe un negativo suelto — «=-3». El resto de la tabla es de solo lectura.",cellBad:`No se entendió lo que escribiste, así que no se guardó nada.

, negativo el pedestal estorba. «Vano» es la distancia al pedestal anterior a lo largo de la barra, que es lo que decide la flecha por gravedad.",sbFew:"tendencia: faltan piezas",sbFewTip:"Con menos de %n piezas no se puede decir si el resorte depende del ángulo: una muestra de puro ruido dispara el aviso una de cada tres veces. La mediana de arriba sí vale; lo que falta es poder afirmar la dependencia.",sbFlat:"tendencia: un solo nivel de ángulo",sbFlatTip:"Las piezas medidas se doblaron casi al mismo ángulo, o hay una sola lejos del resto arrastrando la recta ella sola. Una pendiente se mide entre dos niveles: hacen falta al menos %p piezas a cada lado, separadas %s° o más.",mmMethod:"Método",measCloud:"Nube/CSV",measAngles:"Por ángulos",angVsPlan:"contra Plano",angPlan:"Plano",angPlanTip:"Plano (CAD): ángulo interno nominal que se quiere. Se edita solo aquí; vacío = se usa el del tablero.",angRep:"Reporte",angRepTip:"Reporte: ángulo interno medido por el escáner o el goniómetro. Acepta coma o punto decimal.",angBoard:"Tablero",angBoardTip:"Tablero: los valores de Modelos con los que dobla la máquina. La compensación los corrige en un tablero nuevo.",angBoardNow:"Tablero actual",angBoardNew:"Tablero → nuevo",angDeltaTip:"Δ = Reporte − Plano. Verde dentro de tolerancia, ámbar hasta el doble, rojo más allá.",angFlowHint:"Δ = Reporte − Plano. Se corrige el Tablero (ángulo de doblado), no el Plano.",angBoardInfo:"Pieza hecha con el tablero «{b}».",angNameOf:"Nombre de {b}",angPlanOf:"Ángulo interno de plano de {b}",angNoPlanTip:"Sin plano: el Δ se midió contra el tablero, no contra el CAD.",angPiece:"Pieza",angLot:"Lote ({n})",angLotTip:"Mediana de las piezas hechas con este mismo tablero.",angPlanMissing:"{n} doblez(ces) sin plano: se compararon con el tablero.",angRecDone:"Tablero nuevo creado y activado: «{v}». El anterior se conserva en Modelos.",repAngIntro:"Tres juegos de valores de la misma pieza. Plano: ángulo interno nominal del CAD. Reporte: ángulo interno m nt to the machine, and that is why it is the one that moves. L and Σ L are counted on the NEUTRAL FIBRE, the bar that truly gets consumed; the axis that gets drawn and the ribbon below still measure through the centre of the section, so the two numbers part ways as soon as K stops being 0.5.",kbdNote:"Keyboard: Tab / ⇧Tab move across · Enter and ↑ ↓ move down and up · Esc discards the cell · mouse wheel or Ctrl+↑ ↓ step the value. Entering a cell selects its value: typing replaces it. Up to three decimals are accepted.",twnote:"Twist len = straight run (mm) the torsion is spread over, centred on the straight. 0 = whole straight. It moves no PI: it only sets where the torsion happens.",proc:"Simulated process (virtual part)",sbW:"Springback hard way",sbT:"Springback easy way",slip:"Feed slip",biasR:"Rotation bias",noise:"Scan noise",seed:"Seed",simulate:"Generate measured part",dNone:"No measured part. Simulate one or import a CSV.",deltas:"Per-bend deviations",dA:"Δ angle",dR:"Δ roll",dF:"Δ Feed",dP:"Tip dev.",statMaxA:"Max Δ deflection",statRms:"Deflection RMS",statTip:"Free-end deviation",statOut:"Out of tol.",gains:"Correction gains",gainW:"Hard-way gain",gainT:"Easy-way gain",gainR:"Roll gain",gainF:"Feed gain",gainNote:'Roll and feed carry their own gain because they are not the same quantity as the bend. "Hard way" and "easy way" are springback constants: how far the bar opens when released. Roll has no spring — it was corrected in full, that is at gain 1.0, exactly what is forbidden for the angle because it oscillates with measurement noise — and feed is thrown off by slip, which is a different phenomenon.',what:"What to correct",cAng:"Bend angles",cRot:"Roll",cFeed:"Feeds",apply:"Apply compensation",reset:"Reset commands",cmdTbl:"Machine commands",cNow:"Current",cNew:"New",cDelta:"Δ",predict:"Predicted residual",verify:"Verify (run 2nd part)",noMeas:"A measured part is required to compute compensation.",stLen:"Developed length",stBends:"Bends",stDatum:"Datum re the cylinder is, not what it hangs from.",pinDist:"Dist.",pinDistTip:"Distance between the pin axis and the bar axis where they come closest, in space. With plumb pins it equals the plan distance; leaning, it does not.",pinSide:"Side",pinSideAuto:"auto",pinSideTip:'Which side of the bar the pin is MOUNTED on. Fixture data, not a reading: read off the current shape, the moment an angle sends the bar past the post the reading flips and the contact closes on the wrong face — that is, it solves a part that went through the pin. "auto" decides from the geometry the first time, which is what it did before.',pinState:"State",pinHolding:"holding",pinEmpty:'No pins. "Seed" lays a few along the bar touching from alternating sides, which is how a bar is really held: all on one side would let it pivot on them.',addPin:"+ Pin",seedPin:"Seed pins",clearPin:"Remove all",pinNote:"A pedestal supports; a pin PREVENTS. Pins are bolted to the table, so they do not move when the part is repositioned: what changes is whether they still touch. A pin with clearance to spare pushes nothing and is ignored — not an error, the fixture may carry more pins than this part uses.",pinOffNote:"With clamping off the bar is computed free in space. Pins can still be placed and seen in the 3D view, but they deform nothing.",pinNoneHold:'No pin is touching the bar, so clamping changes nothing. Check height and position: the "Reaches" column says which ones fall short of the bar and "Gap" how far away they stop.',pinHeldN:"{n} pin(s) holding",pinTip:"Tip",pinTipTip:"How far the free end moves because the bar is held, compared with the same part free in space. It is the consequence you can measure.",pinWorstKink:"Worst kink",pinStress:"Stress",pinOfYield:"of yield",pinYield:"Somewhere the bar goes past its elastic limit: released, it does NOT spring back, and the part that comes out is not the one the model describes. With the material unconfirmed this is a warning, not a measurement — but where it happens is real.",pinYieldTip:"Bending stress at the outermost fibre against the material yield strength. Past 100 % the deformation stops being recoverable.",pinOpen:"{n} contact(s) left open",pinOpenTip:"The solver could not bring the bar onto these pins. That usually means an impossible fixture: two pins asking for the bar in two places at once, or one set so deep the part would have to break to reach it.",pinKink:"Kink °",pinCurv:"Curvature °/m",pinSigma:"σ MPa",matRho:"Density",matRhoTip:"Weight of the material per cubic metre. Only the gravity sag uses it: it is what makes the bar hang between supports. Provisional like the rest of the material.",sag:"Sag",sagTip:"How far the bar hangs under its own weight on the span ENDING at this pedestal, in millimetres. The overhang at each end counts as a cantilever and is where it shows most: length goes to the fourth power. Orientation matters more than span — flat it hangs (width/thickness)² times more than on edge, which with 40×12 is eleven times.",sagNote:"Sag is computed span by span as a simply supported beam, with the overhangs as cantilevers. A continuous beam over several supports is STIFFER than that, so this number overestimates: it is the safe side. Each span is treated as straight — bends inside a span do not stiffen it here. Once a certified straight bar is scanned mounted in the fixture, this gets checked against the measured sag and stops being an estimate.",sagBad:"Gravity sag exceeds the point tolerance. That enters the measurement as an error that is NOT a bending error: the loop will try to correct it and cannot. Add a support on the worst span, or shorten the overhang.",sagNoMat:"Sag: material missing",sagNoMatTip:"Without density and elastic modulus there is no number to give. Both are filled in on the Clamping tab.",matE:"Modulus E",matYield:"Yield strength",matTip:"Only needed to turn deformation into stress. The SHAPE a held bar takes does not depend on E: with a constant section it cancels out of the supports do not carry stays at the first end, which is where the part is gripped. This is the number that answers «do I need more pedestals?». Negative means the grip pulls DOWN: the supports carry more than the whole part because the bar levers over one of them.",loadRootDown:"The grip pulls the part DOWN with {n} N: the bar levers over a pedestal and the supports carry more than the whole part. With the grip the fixture has, that is a possible result, but it says the first end would lift without it: check that the grip clamps and does not just rest.",loadDrop:"Moved by",loadDropTip:"How far the worst point has travelled, measured against the free part. It includes what the pins do AND what the load does: to tell them apart, switch the load off and read the same number.",loadPene:"Sinks in",loadPeneTip:"How far a support sinks into the bar. Contact is modelled with a very stiff spring, so this should come out in microns; if it reaches the tolerance, the spring was too soft and the reactions next to it deserve suspicion.",loadN:"Reaction",loadNTip:'How hard that support is pushing, in newton. A dash means the part is not touching it, which is an answer and not a failure. "n/a" means something quite different: that the model cannot say anything there. And this figure is worth what the MEASURED height is worth: one micron too much on a support puts several newton into the part, and next to the clamp it puts all of them in, because the bar cannot give there. Use it to see which support is working and which is not; it is not a load-cell reading.',loadNd:"n/a",glLost:"The graphics card dropped the 3D view (sleep, display change or driver). Data and tables are fine. The 3D view comes back on its own if the browser recovers it; if it does not, save your work and reload the page.",faultMsg:"Something went wrong ({e}). What is on screen may be out of date: save your work and reload the page.",faultClose:"Close notice",clashCard:"Does not fit the fixture: {n} goes in {d} the bar where they come closest, in millimetres. Positive: the bar does not reach the pin. Negative: the pin sits where the bar would be and pushes it.",pinStateTip:"Whether the clamping is using this pin right now to hold the bar.",fixLoadOff:'Here the part has no weight. The sag already uses its own weight, but how much each pedestal carries only comes out with "The part has weight" on, in the Clamping tab: that is when the "Reaction" column appears.',stHold:"Held by the pins",stLoad:"The part has weight",stHoldLoad:"Held and weighted",stHoldGo:"Click: opens the Clamping tab, where both switches are.",loadNdTip:"No number can be given here. This support falls on a stretch the model cannot bend — the unknowns are the elbows at the stations — so its gap does not change however much the part gives, and any reaction printed there would mean nothing. It is not a zero: a zero means the part is not touching it.",loadNoDof:"The part has no stations, so this model cannot hang it: what it weighs is known, how that weight splits between the supports is not. For a straight bar the number that helps is the gravity sag, on the Fixture tab.",loadStuck:"Not solved",loadStuckTip:"The search for equilibrium stopped before reaching it: what is next to this is the last trial and not a solution. It usually happens when a support enters and leaves contact on every step, or when two supports fight over the same point.",loadStuckWarn:"The load did not reach equilibrium in {n} steps: the numbers below are the last trial and cannot be defended. Raise the damping, or move aside the support that sits right on the edge of touching.",loadNote:"The unknowns are the kinks at the STATIONS, so in this model a straight run does not sag in the middle: that part is given by the gravity sag, on the Fixture tab. The two look at different things in the same bar and do not add up. The stiffness of a station is taken as EI/L, which for a cantilever is some four times softer than the exact one: this gives the order and the direction, not a certified deflection.",loadNoMat:"Without density and without an elastic modulus there is no load to apply. Both are filled in just above, in the material.",loadHang:"The supports carry less than half the weight: the part is hanging from its own end. What you are looking at is a cantilever, not a mounted part; either pedestals are missing, or the ones there are not touching it.",mach:"Machine",machTitle:"Machine command",machCols:"Columns, in this order",machAxis:"Abs. axis",machSep:"Separator",machDec:"Decimals",machLen:"Lengths",machAng:"Angles",machSignA:"Angle sign",machSignR:"Roll sign",machSignTip:"Flips the sign in the FILE only. The kinematics are untouched: the same numbers still bend the same part on screen. It lives here because a machine may have its axis mounted the other way round, and that is fixed on write, not in the engine.",machRot:"Roll written as",machRotDelta:"turn from the previous station",machRotAbs:"absolute axis position",machRotTip:"The model stores how much the axis TURNS at each station, because the machine holds it between bends. Some controls want the absolute axis position instead. Both describe the same part; picking the wrong one bends the first station right and every later one wrong.",machHead:"With header",machCrlf:"CRLF line endings",machCrlfTip:"Many machine controls will not read a UNIX line ending. This ends every line the way a Windows control expects.",machTail:"Tail row",machTailTip:"A last row carrying the exit straight. Without it the file never says how much stock is left after the final bend. Columns that do not apply to it come out empty rather than zero: a zero in the angle column is a zero-degree bend, which is an instruction.",machPrev:"Preview",machMore:"and {n} more row(s).",machExport:"Export command",machDirty:"A manual adjustment is typed but not applied. The file carries the stored command, not what the compensation table shows: apply first or the adjustment will not be in it.",machNote:"The format the bender reads has been requested and has not arrived, so nothing is guessed here: it is left in plain sight. Before sending a bar, check units and signs in the preview against a part you already know — it is the one thing in this file that cannot be undone. The profile travels inside the part JSON, so a machine file from months ago can be regenerated identically.",lims:"Limits",limWhat:"Threshold",limVal:"Value",limDef:"Factory",limState:"State",limWait:"Waiting on",limTouched:"changed",limFactory:"factory",limProv:"provisional · awaiting {p}",limRead:"When reading a measurement",limLoop:"Loop guards",limReset:"Back to factory values",limHitStraight:"At this threshold, {n} straight(s) on this part do not fit.",limNote:'These numbers move no PI: they decide what gets rejected, which reading is distrusted, and how much the loop may correct at once. They travel inside the part JSON, so a saved file states the thresholds it was judged by. "Provisional" means the value was picked while a requested figure is still missing: A.6 is the real scan repeatability (σ), B.2 the machine limit. A 0 turns that check off.',lim_axisMin:"Readable axis",lim_axisMinTip:"Smallest deflection at which a measured bend still has a readable AXIS. Below it the lateral direction is noise, so the axis is inherited from the previous bend instead of invented. The real rule is atan(3σ/feed). Applies only to MEASURED data; in a typed model a 0.2° bend is deliberate.",lim_piMin:"PI spacing",lim_piMinTip:"Smallest distance between two PI in an imported file. Closer points give a direction that is pure noise, hence an invented bend that also poisons the next row. The real rule is 5σ. Two coincident PI reject the whole file: it means the cloud extraction went wrong.",lim_scaleMin:"Minimum scale",lim_scaleMinTip:"Fraction of the nominal PI step below which the imported cloud cannot be the same part. NOT a tolerance: it catches an export whose columns are the DEVIATION rather than the coordinate, or metres read as millimetres. One-sided: a scan missing points has a LARGER mean step, and that is not a bad file.",lim_straightMin:"Minimum straight",lim_straightMinTip:"Straight between tangency points needed for the tooling to fit: clamp plus head travel. A MACHINE limit, not a scanner one. A negative straight is listed separately regardless: that is two tools in the same place.",lim_tubeRfac:"Tube minimum radius",lim_tubeRfacTip:"Round and rectangular TUBE alike: measured against the outside diameter on a round tube, and against the measure across the bending plane on a rectangular one — the thickness on flat bends, the width on edge bends. With 1.5 here, a Ø40 will not bend under R60. It starts at 0, meaning do not watch this, and that is not an oversight: in a tube the radius it takes is driven by the ratio between the bending measure and the wall, and by ovalisation while bending, and this program has nothing to work that out from. A factory figure would be an opinion wearing the face of data. If the shop has its own rule, type it here.",lim_dead:"Dead band (angle)",lim_deadTip:"Below this difference against nominal the loop does not correct: it is measurement noise, and chasing it makes the part oscillate. 0 turns it off.",lim_deadFeed:"Dead band (feed)",lim_deadFeedTip:"Same as the angle dead band, in millimetres and on the feed.",lim_maxStep:"Per-cycle cap (angle)",lim_maxStepTip:"Largest correction the loop may apply at once. A bigger jump is not process drift: it is bad data or a bend that crossed branches. It is clipped and reported rather than sent to the machine. 0 removes the cap.",lim_maxStepFeed:"Per-cycle cap (feed)",lim_maxStepFeedTip:"Same as the angle cap, in millimetres and on the feed.",fabHead:"This part cannot be made as it stands:",fabNeg:"the straight feeding {b} is NEGATIVE: the tools would collide.",fabShort:"the straight feeding {b} falls short of the {n} mm the tooling needs.",fabTail:"the exit straight falls short of {n} mm.",fabOver:"{b} asks for more than {n}° of deflection: the lengths on that row come out capped.",fabTube:"At {b} the radius is under the tube minimum: {n} diameters means R{r}.",fabTubeRect:"At {b} the radius is under the tube minimum: {n} times the measure across the bending plane means R{r}.",fileUnread:"the system would not read the file (was it moved, or is another program holding it open?)",csvShort:"These parts carry FEWER points than the model. The missing bends stay UNMEASURED and are not compensated:",compSim:"WARNING: {n} of the parts feeding this calculation are SIMULATED, not measured. What comes out of here does not describe any real bar.",compHeld:"The clamping or the load is on, so the 3D view may be showing the SETTLED part. These corrections are not: they are worked out against the free part, the one the table describes. If what you want is the shape with the fixture on, that is not what is being corrected towards yet.",compShort:"Only {a} of {b} bends are measured. The rest are marked with — and are NOT compensated.",rowNoMeas:"This bend is not measured: the part carried fewer points than the model. The command is left as is.",compFewN:"The loop reads {a} part(s) and {n} are needed. With fewer, the command chases that part’s scatter and the next one can come out worse.",batchUse:"Use the median of the visible parts ·",batchTip:"With a single part the loop also corrects what was scatter in that part, and the next one can come out worse. With several, the median only lets through what repeats.",batchOn:"The loop reads the median of %n parts, not the last one.",batchHint:"More than one part is visible: tick the box so the loop reads the median.",spread:"±σ",spreadTip:"Angle scatter across the visible parts (scaled MAD). Large next to a large deviation means poor repeatability, not a mis-set bend.",sbMeas:"Measured springback",sbUse:"Use in the simulator",sbNote:"sb = 1 − measured angle / commanded angle, per orientation. Median ± robust σ over the bends of the visible parts; near-straight ones (<1°) are left out.",sbCircular:"Warning: %n of the visible parts are simulated. Estimating springback from an invented part returns what is already written below — that is a closed loop, not a measurement.",sbSpreadTip:"Scatter across bends and parts. If it is as large as the value itself, that springback is not measured: it is guessed.",mnFile:"File",mnModel:"Models",mnView:"View",mnPieces:"Parts",mnMenu:"Menu",mnClose:"Close",signKey:"Flip the sign",soloOn:"3D only",soloOff:"Back",rotAxisTip:"How much the bending axis turns at this station. It ends at %e°.",rotHeadTip:"Turn of the bending axis relative to the previous station. A 0 leaves the axis where it was: the process is sequential.",history:"History",undo:"Undo",redo:"Redo",histNote:"Undoes edits to the part: cells, points, models, reference points, placement and applied compensation. It does not undo the camera, theme, language, layers or mode. 50 steps.",soloTip:"Fold the table and the sidebar away to see the whole part (F key). On the way back, the table is where you left it.",expPts:"Export points",expStep:"Part to STEP (.stp)",expStepTip:"The part as a SOLID, with exact faces —planes, cylinders and tori, no mesh— plus the centreline and the PIs as reference. Any CAD opens it without rebuilding anything. This is the nominal, not the machine command. It does NOT carry the chamfer or the machined end. With twist and a non-round section there is no solid: only the reference geometry comes out, and the file says why.",stpNoSolid:"The .stp will come out WITHOUT a solid: only the centreline and the profile, as reference geometry. {r}",stpNoSec:"The section has no measurements.",stpNoThick:"The section has no thickness.",stpTwist:"The part has twist and the section is not round: sweeping would give a different bar, not this part.",stpKink:"There is a zero-radius bend, i.e. a kink: no swept surface can describe it.",stpNeg:"There is a negative-length straight: the feed falls short and drives the bar into itself.",modeModel:"Model",modeMeas:"Measure",modeComp:"Compensate",modeModelTip:"Type the part: the whole table on the right and the model beside it.",modeMeasTip:"Look at the measured part: big model, tall ribbon and the statistics.",modeCompTip:"Shop-floor mode: only the compensation cells can be edited. Commands full width and the 3D as a check strip.",sbTrend:"depends on the angle (%s %/°, r=%r)",sbTrendTip:"Springback changes with the commanded angle, so a single constant does not describe the process. With this flag, fit per angle range instead of adopting one number.",srcSimTip:"Part invented by the simulator. Nothing was measured.",srcVerifyTip:"Simulated check after applying compensation. Not a measurement either.",srcMeasTip:"Imported measured part.",srcUnkTip:"Unknown origin: it comes from a file that did not record it.",anchor:"Fixed end",aStart:"Clamp (P0)",aEnd:"Free (tip)",aBest:"Best fit",insPt:"+ Midpoint",delPt:"✕ Point",ptNote:"ABSOLUTE editing: moving a point leaves the others where they are and the LRA chain is re-derived by inverse kinematics. A new point is born collinear (angle 0), ready to be moved. Editing points bakes the deltas into the base.",bake:"Bake Δ",zeroD:"Zero Δ",bakeAsk:`This model has unbaked deltas.

Continue?`,dTip:"Δ tip vs ref",dblz:"bends",place:"Placement",pivot:"Pivot",plX:"Move X",plY:"Move Y",plZ:"Move Z",plRX:"Rot X",plRY:"Rot Y",plRZ:"Rot Z",plReset:"Reset placement",plNote:"Moves and rotates the PART over a still floor, about the PI you pick as origin: the grid and the camera stay put. The pedestals follow it, always resting on the floor. It touches no feed, angle or radius.",lMarks:"Reference points",marks:"Reference points",addMark:"+ Point",nearPi:"PI",distPi:"Dist.",markNote:'Loose dimensions in space: each point is joined to the nearest PI of the active model and the figure says how far it landed. Use it to dimension against the fixture or a shop datum. "+ Point" creates it on the selected bend.',cCalc:"Δ calc",cAdj:"Δ applied",zeroTw:"Zero manual Δ",cellNote:'The Δ applied cell works like a spreadsheet, and there are three forms. RELATIVE TO WHAT YOU SEE: a leading operator works on what the cell shows — "+2" adds 2, "-0.3" takes three tenths off, "*1.1" gives it 10 % more. RELATIVE TO THE LOOP: what it computed is called c — "c", "c+2", "(c+1)/2". ABSOLUTE: a bare number replaces, and "=" forces it, which is how a lone negative is written — "=-3". The rest of the table is read-only.',cellBad:`What you typed was not understood, so nothing was saved.

Accepted: a bare number (2), arithmetic on what you see (+2, -0.3, *1.1), arithmetic on what the loop computed (c+2), or an absolute with = (=-3).`,tweakOn:"manually adjusted",fixture:"Fixture",pedH:"Height",pedPad:"Saddle",pedTilt:"Tilt",pedYaw:"Heading",pedDYaw:"Δ head.",pedWant:"Wants",pedS:"Touches",pedPlan:"Offset",pedGap:"Gap",pedSpan:"Span",pedWorst:"Longest span",pedOff:"the bar does not pass over it",pedOffN:"{n} unsupported",pedOffTip:"The foot sits farther from the bar axis than half the saddle plus half the section width: this pedestal holds nothing. Move X and Y until the bar passes over it.",pedLiftTip:"At this tilt the bar lifts {v} mm off the end of the saddle. Compared against the point tolerance.",pedYawTip:"Where the long axis of the saddle points, in plan and from +x, in degrees. Fixture data, not a reading: the saddle sits where someone bolted it and does NOT aim itself at the part. Half a turn is the same plate, so 30 and 210 say the same.",pedDYawTip:"How much heading the saddle has too much or too little: its own minus the one the bar wants, in degrees and between −90 and 90. Red when the bar runs off the plate sideways; the help on each cell gives the millimetres it drifts.",pedSlipTip:"At this heading the bar drifts {v} mm off the saddle axis at its end, against {w} mm of half plate width.",addPed:"+ Pedestal",seedPed:"Seed {n}",clearPed:"Clear",fixEmpty:'No pedestals. "Seed" spreads a few under the part with the height and tilt it asks for at each place; from there they are corrected with the real fixture measurements.',fixNote:`The fixture is bolted to the table: X, Y, height and saddle belong to the shop and do not move when the part is repositioned. "Wants" is the tilt the bar has right above; Δ is the pedestal's excess, shown red when it lifts the bar more than the point tolerance. "Gap" is the air between saddle and underside: positive the bar floats, negative the pedestal is in the way. "Span" is the distance to the previous pedestal along the bar, which is what drives the gravity sag.`,sbFew:"trend: not enough parts",sbFewTip:"With fewer than %n parts there is no telling whether springback depends on the angle: a sample of pure noise trips the warning one time in three. The median above still holds; what is missing is the right to claim the dependence.",sbFlat:"trend: a single angle level",sbFlatTip:"The measured parts were bent at nearly the same angle, or a single one sits far from the rest and drives the line on its own. A slope is measured between two levels: at least %p parts on each side, %s° apart or more.",mmMethod:"Method",measCloud:"Cloud/CSV",measAngles:"By angles",angVsPlan:"vs Plan",angPlan:"Plan",angPlanTip:"Plan (CAD): the nominal internal angle you want. Edited only here; empty = the board value is used.",angRep:"Report",angRepTip:"Report: internal angle measured by the scanner or goniometer. Accepts comma or dot decimals.",angBoard:"Board",angBoardTip:"Board: the values in Models the machine bends with. Compensation corrects them into a new board.",angBoardNow:"Current board",angBoardNew:"Board → new",angDeltaTip:"Δ = Report − Plan. Green within tolerance, amber up to double, red beyond.",angFlowHint:"Δ = Report − Plan. The Board (bend angle) is corrected, not the Plan.",angBoardInfo:'Part made with board "{b}".',angNameOf:"Name of {b}",angPlanOf:"Plan internal angle of {b}",angNoPlanTip:"No plan: Δ was measured against the board, not the CAD.",angPiece:"Part",angLot:"Batch ({n})",angLotTip:"Median of the parts made with this same board.",angPlanMissing:"{n} bend(s) without plan: compared with the board.",angRecDone:'New board created and activated: "{v}". The previous one is kept in Models.',repAngIntro:"Three sets of values for the same part. Plan: nominal internal angle from CAD. Report: measured internal angle. Board: values in Models the machine bends with. Δ = Report − Plan; the correction goes to the Board.",repAngBoard:"Board",angNameCol:"Name",angApply:"Create compensated board",angRecApplyTip:"Creates a new board with the recommended angle on the measured bends and activates it; the current one is kept.",angTitle:"Measure by angles",angName:"Measured part name",angDefName:"Angle measurement",angMeasOf:"Measured internal angle of {b}",angCorr:"Adj.",angCreate:"Create measurement",angMaxAbs:"Max |Δ|",angMean:"Mean (bias)",angN:"Measured",angChart:"Δ per bend",angChartTip:"Internal angle deviation per bend, with the tolerance band.",angNoneTyped:"Enter at least one measured angle.",repAngles:"Angle comparison",repAngPiece:"Measured part",repAngDate:"Date",repAngOk:"OK",repAngOut:"OUT",repAngState:"Status",angOneNote:"A single measurement cannot tell correction from noise: apply the recommendation with care, ideally after repeating the measurement.",angRange:"Out of range: the internal angle goes from 0 to 180°."};var m0={sub:"Biegekompensation · Alpha",bNew:"Neues Modell",bOpen:"JSON öffnen",bSave:"JSON speichern",bRep:"Bericht",bDemo:"Demo laden",layers:"Ebenen",datasets:"Gemessene Teile",model:"Modell",meas:"Messung",thSys:"Systemfarbschema",thLight:"Helles Farbschema",thDark:"Dunkles Farbschema",comp:"Kompensation",points:"Punkte",lNom:"Nennstange",lVar:"Andere Modelle",lDiff:"Versatz zwischen Modellen",lMeas:"Gemessene Stange",lPred:"Korrigierte Vorhersage",lDev:"Abweichungsvektoren",lPts:"Schnittpunkte",lLbl:"Beschriftungen",lGrid:"Raster",lFix:"Auflageböcke",addSim:"Teil simulieren",del:"Löschen",view:"Ansicht",vIso:"ISO",vTop:"Draufsicht",vFront:"Vorderansicht",vSide:"Seitenansicht",vFit:"Einpassen",exag:"Überhöhung",cmode:"Farbe",cSolid:"Massiv",cDev:"Abweichung",legend:"Legende",devscale:"Punktabweichung",hint:"Ziehen: drehen · Rad: zoomen · Umschalt+Ziehen: verschieben",ribbon:"Abweichung der Gesamtauslenkung je Biegung über die Abwicklungslänge",vsRef:"Δ Auslenkung je Biegung gegenüber dem Referenzmodell",gripW:"Breite des rechten Bereichs",gripH:"Höhe der Tabelle",name:"Name",section:"Querschnitt",width:"Breite",thick:"Dicke",chamfer:"Fase",endlen:"Bearbeitetes Ende",secKind:"Form",secRect:"Rechteckig",secRound:"Rund",dia:"Durchmesser",wall:"Wandstärke",wallHint:"0 = massiv",secSolid:"massiv",secHollow:"hohl",secArea:"Fläche",secInertia:"Trägheitsmoment",secMass:"Gewicht",cutLen:"Schnittlänge",secTip:"Die Form der Stange. Sie ändert das Gewicht, den Widerstand und die Auflage.",secFig:"Die Stirnfläche der Stange, maßstäblich mit ihren Maßen gezeichnet",secChamNote:"Die Fase ist gestrichelt, weil sie gezeichnet und nicht gerechnet wird: sie nimmt Material an den Ecken weg, kann den Querschnitt also nur kleiner machen, und sie zu ignorieren meldet den Kontakt früher statt später.",secChamNone:"Die Zeichnung ist dieselbe Kontur, die das 3D ausstreicht und mit der die Kontaktrechnung antwortet.",fibre:"Neutrale Faser",fibreCenter:"Mitte",fibreDin:"DIN 6935",fibreFixed:"Feste K",kFac:"K",fibreTip:"Woher der Neutralfaser-Faktor K kommt, der bestimmt, wie viel Stange jede Biegung verbraucht. Mitte = K 0.5, die Faser ohne Verschiebung: das hat dieses Programm schon immer so gemacht. DIN 6935 = K nach dem r/t jeder Biegung, und ändert sich von Zeile zu Zeile. Feste K = die eingetippte, um die in der Werkstatt gemessene einzutragen. Die DIN gilt für Blech auf der Abkantpresse, nicht fürs Streckbiegen: sie ist eine erste Näherung, nicht die Zahl dieser Maschine.",fibreRt:"Die DIN 6935 deckt r/t unter 0.65 nicht ab: bei %n Biegungen ist K auf 0.325 gekappt.",cutLenTip:"SCHNITTLÄNGE: die gerade Stange, die in die Maschine muss. Gemessen auf der neutralen Faser, nicht auf der gezeichneten Achse, sodass sie bei K ungleich 0.5 nicht mit der Abszisse des unteren Bands übereinstimmt, das über das bereits gebogene Teil misst.",secRoundWarn:"Bei einer Rundstange sind beide Trägheitsmomente gleich: es gibt kein »flach« oder »hochkant«. Die DREHUNG sagt weiterhin, wohin gebogen wird, ändert aber nicht mehr, womit der Querschnitt widersteht, und die Verwindung des Teils ist in der 3D-Ansicht nicht beobachtbar.",secHollowWarn:"Die Grenzwerte für den Mindestradius gelten für eine MASSIVE Stange. Bei einem Rohr bestimmen das Verhältnis zwischen dem Biegemaß und der Wandstärke und die Ovalisierung beim Biegen den möglichen Radius — das beurteilt dieses Programm noch nicht: auf dem Bildschirm biegt es sich leichter als auf der Maschine.",secHollowJudged:"Rohr-Schwelle gesetzt: {n} Durchmesser. Biegungen mit kleinerem Radius werden im Reiter Modell markiert. Diese Zahl stammt aus den Grenzwerten, nicht vom Programm: das Programm kann sie nicht herleiten.",secHollowJudgedRect:"Rohr-Schwelle gesetzt: {n} mal das Maß in der Biegeebene — die Dicke bei Flachbiegungen, die Breite bei Hochkantbiegungen. Biegungen mit kleinerem Radius werden im Reiter Modell markiert. Diese Zahl stammt aus den Grenzwerten, nicht vom Programm: das Programm kann sie nicht herleiten.",tol:"Toleranzen",tolA:"Winkel",tolR:"Drehung",tolF:"Vorschub",tolP:"Punkt",bends:"Biegungen",addBend:"Biegung hinzufügen",nBend:"#",feed:"Vorschub",rot:"Rollung",ang:"Winkel",rad:"Radius",twist:"Torsion",twlen:"Torsionslänge",ori:"Or.",dcol:"Δ",straight:"Gerade",arcL:"L",cumL:"Σ L",tailRow:"Auslauf",dStraightTip:"Δ der GERADEN, in mm. Basis + Δ ist die Gerade am Teil. Gespeichert wird ein Vorschub-Δ: ein Winkel-Δ verkürzt die Gerade, ohne den Vorschub zu berühren, und hier wird das sichtbar.",tailFootTip:"Auslaufgerade, von Tangente zu Tangente wie alle anderen Längen. Gespeichert und an die Maschine geschickt wird der Vorschub von Schnittpunkt zu Schnittpunkt; der Unterschied ist der Trim der letzten Biegung.",lenNote:"Gerade = gerades Stück von Tangente zu Tangente, und die einzige Länge, die eingetippt wird — auch die des Auslaufs, die in der Fußzeile eingetippt wird. L = Bogenlänge, die die Biegung erzeugt (Radius × Auslenkung). Σ L = aufsummierte Abwicklungslänge auf der neutralen Faser: Gerade, Bogen, Gerade, Bogen. Jede editierbare Spalte steht auf der Basis und ihr Δ daneben, und beide zusammen ergeben das Teil: deshalb ist das Δ der Geraden in Millimetern GERADE und nicht in Vorschub. Und die Δ-Tabelle sagt nur das, was dort eingetippt wurde: ein Winkel- oder Radius-Δ lässt die Geraden stehen und verschiebt darunter die Vorschübe, genau wie ein geänderter Winkel oder Radius auf der Basis. Der Vorschub von Schnittpunkt zu Schnittpunkt ist das, was gespeichert und an die Maschine geschickt wird, und deshalb ist er es, der sich bewegt. L und Σ L werden auf der NEUTRALEN FASER gezählt, der Stange, die wirklich verbraucht wird; die gezeichnete Achse und das untere Band messen weiterhin durch die Mitte des Querschnitts, sodass sich die beiden Zahlen trennen, sobald K nicht mehr 0.5 ist.",kbdNote:"Tastatur: Tab / ⇧Tab bewegen waagerecht · Enter und ↑ ↓ senkrecht · Esc verwirft die Zelle · Mausrad oder Strg+↑ ↓ ändern den Wert um einen Schritt. Beim Betreten einer Zelle wird ihr Wert markiert: Tippen ersetzt ihn. Bis zu drei Nachkommastellen werden angenommen.",twnote:"Torsionslänge = gerades Stück (mm), über das die Torsion verteilt wird, mittig auf der Geraden. 0 = die ganze Gerade. Kein Schnittpunkt wird verschoben: es wird nur festgelegt, wo die Torsion stattfindet.",proc:"Simulierter Prozess (virtuelles Teil)",sbW:"Rückfederung hochkant",sbT:"Rückfederung flach",slip:"Vorschubschlupf",biasR:"Drehversatz",noise:"Scan-Rauschen",seed:"Startwert",simulate:"Gemessenes Teil erzeugen",dNone:"Kein gemessenes Teil. Simulieren Sie eines oder importieren Sie ein CSV.",deltas:"Abweichungen je Biegung",dA:"Δ Winkel",dR:"Δ Rollung",dF:"Δ Vorschub",dP:"Abw. Spitze",statMaxA:"Max. Δ Auslenkung",statRms:"RMS Auslenkung",statTip:"Abweichung freies Ende",statOut:"Außer Toleranz",gains:"Korrekturverstärkungen",gainW:"Verstärkung hochkant",gainT:"Verstärkung flach",gainR:"Verstärkung Rollung",gainF:"Verstärkung Vorschub",gainNote:"Rollung und Vorschub haben eigene Verstärkungen, weil sie nicht dieselbe Größe sind wie die Biegung. »Hochkant« und »flach« sind Rückfederungskonstanten: wie weit sich der Stab beim Loslassen öffnet. Die Rollung hat keine Feder — sie wurde ganz korrigiert, also mit Verstärkung 1,0, genau das, was beim Winkel verboten ist, weil es mit dem Messrauschen schwingt — und den Vorschub verschiebt der Schlupf, ein anderes Phänomen.",what:"Was korrigieren",cAng:"Biegewinkel",cRot:"Rollung",cFeed:"Vorschübe",apply:"Kompensation anwenden",reset:"Befehle zurücksetzen",cmdTbl:"Maschinenbefehle",cNow:"Aktuell",cNew:"Neu",cDelta:"Δ",predict:"Erwarteter Restfehler",verify:"Prüfen (2. Teil fahren)",noMeas:"Für die Kompensation wird ein gemessenes Teil benötigt.",stLen:"Abwicklungslänge",stBends:"Biegungen",stDatum:"Bezug",stMax:"Max. Abw.",stUnits:"Einheiten",stVer:"Version",stVerTip:"Laufender Build. Bei einer auffälligen Zahl mit angeben: Mit einer Kopie in der Werkstatt und einer veröffentlichten ist dies das Einzige, was sie unterscheidet. «+sucio» = auf nicht committeten Änderungen gebaut.",schemaAmbiguous:`Diese Datei ist barcomp/2.2 und gibt die verwendete Biegerichtung nicht an.

Sie wurde unverändert geöffnet, ohne eine Zahl zu ändern. Wurde sie vor der Richtungsänderung gespeichert, erscheint das Teil zur anderen Seite gebogen.

PRÜFE DIE FORM in der 3D-Ansicht vor dem Kompensieren. Beim Speichern wird sie 2.3 und ist nicht mehr mehrdeutig.`,schemaMigrated:`Datei einer älteren Version: auf die aktuelle Konvention umgestellt, ohne das Teil zu bewegen.

Manuelle Korrekturen und der Befehl gemessener Teile werden nicht umgestellt und kommen als Null an.`,schemaUnknown:`Unbekanntes Schema: {s}
