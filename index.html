Nothing was loaded: what you had is still there. The line below is for whoever maintains the program.`,dStart:"Start end",dBest:"Global best fit",formula:"new command = current command + gain × (nominal − measured)",note:"The whole chain is regenerated after each correction: downstream carry-over is already in the model.",repTitle:"Inspection & compensation report",repDate:"Date",repPiece:"Part",ok:"In tolerance",bad:"Out of tolerance",piece:"Part",orW:"Hard way (across width)",orT:"Easy way (across thickness)",orR:"Round section: there is no hard or easy way. Both inertias are equal, so it bends the same against any face and there is one constant, not two.",gainOne:"Gain",sbOne:"Springback",secOneConst:"The bar is round: one single constant. With Iz = Iy there is no «hard way» or «easy way», so splitting it in two would compensate one bend with the other one’s springback.",confirmNew:"Create a new empty model? Unsaved work will be lost.",pts:"Point",x:"X",y:"Y",z:"Z",variants:"Models",addVar:"+ Model",dupVar:"Duplicate",setRef:"Use as reference",isRef:"REF",srcSim:"SIM",srcVerify:"SIM ✓",srcMeas:"MEAS",srcUnk:"N/A",impCsv:"Import CSV",impTip:"Measured parts: one CSV per part, with the PIs in x,y,z columns. Several files can be picked at once.",csvBad:"These files did not carry at least three points with coordinates and were not imported:",csvComma:"decimals use a comma; they must use a period",csvCols:"{n} numeric columns per line: cannot tell which are x,y,z. Export only the coordinates, or index + coordinates",csvFew:"fewer than three points with coordinates",csvScale:"the points advance {n} mm on average and the model {m} mm: these are not coordinates of the bar. Usually a deviation column exported instead of the coordinate, or units that are not millimetres",csvNear:"points {i} sit less than {d} mm from the previous one: two PI on top of each other invent a bend. Check the point extraction",devRowTip:"Deviation of bend {b}. Enter selects it in the 3D view and the table; the arrows move up and down.",pins:"Clamping",lPins:"Pins",lHeld:"Clamped bar",pinOn:"Bar held by the pins",pinOnTip:"Off, the bar is free in space and the program behaves exactly as it did before pins existed. On, the part cannot go where the table sends it: it stays where the pins leave it and deforms to get there.",pinDoRot:"Roll gives as well",pinRotTip:"A pin pushes in the table plane. Letting the roll give as well as the angle usually spreads the deformation better, but it is two unknowns per station instead of one, and it is a physical decision, not a speed setting.",pinTol:"Contact",pinTolTip:"Below this distance the bar counts as touching the pin and there is nothing to close.",pinDamp:"Spread",pinDampTip:"Near 0 the deformation piles onto the most flexible station; raising it spreads the load over more stations. Same role as the loop gain: at full aggression it oscillates.",pinDia:"Ø",pinGap:"Gap",pinReach:"Reaches",pinReachTip:"Whether they meet along the BODY of the post or at one of its ends. A pin that falls below the bar never touches it, however well placed it is, and one raised above it lets the bar pass underneath: either way it holds nothing.",pinYes:"yes",pinNo:"no",pinHold:"Holds",pinHoldTip:"A pin can be mounted and still be left out of the count: switching it off keeps it visible in the 3D view without letting it act, which is how you find out which pin causes what.",pinMeasFree:"The FREE bar is being shown and measured while the restraint or the load is on: this table, the reference points, the PI points and seeding answer about the part that would exist with nothing holding it, not the one on the table. The reactions do not: they come from the held part and are still its own. Choose “Held” or “Both” under “Show”, in the Restraint tab, to read the bar that is there.",pinShow:"Show",pinShowFree:"Free",pinShowHeld:"Held",pinShowBoth:"Both",pinShowTip:"Which bar is shown and what EVERYTHING is measured against, for every model at once: the free one — the design, the part outside the fixture — or the one it actually takes held by the pins and hanging under its own weight. With “Held” or “Both”, the held one carries both tables, the reference points, the sag, the PI points and their labels, the offset between models, the ribbon, the support colours and where seeded pedestals and pins are born. “Both” adds the free one as a wireframe reference. The only things that do not change are where the part is PLACED and where the supports are: they are bolted to the table.",pinTilt:"Tilt",pinTiltTip:"How far the post leans from vertical, in degrees. 0 = plumb. A leaning pin touches the bar at a different point and from a different direction: the contact is solved between the two axes in space, not in plan.",pinYaw:"Heading",pinYawTip:"Which way it leans, measured in plan from +X. Meaningless without tilt: a vertical cylinder spun about its own axis is the same cylinder.",pinLen:"Length",pinLenTip:"How long the post MEASURES from its base, in millimetres. Not how high it sits: one that falls short never reaches the bar and holds nothing sideways however well placed it is, and one too long ends up touching where it should not. To raise it without lengthening it, use the next column.",pinZ:"Height",pinZTip:"How high above the table the base of the post STARTS, in millimetres. 0 is the pin bolted to the table, which is the usual case. Raise it to reach a bar that runs high without the post also touching underneath, where another stretch of the part may pass. Whatever holds it up there — a block, a spacer, the body of the fixture — is neither drawn nor counted: this says where the cylinder is, not what it hangs from.",pinDist:"Dist.",pinDistTip:"Distance between the pin axis and the bar axis where they come closest, in space. With plumb pins it equals the plan distance; leaning, it does not.",pinSide:"Side",pinSideAuto:"auto",pinSideTip:'Which side of the bar the pin is MOUNTED on. Fixture data, not a reading: read off the current shape, the moment an angle sends the bar past the post the reading flips and the contact closes on the wrong face — that is, it solves a part that went through the pin. "auto" decides from the geometry the first time, which is what it did before.',pinState:"State",pinHolding:"holding",pinEmpty:'No pins. "Seed" lays a few along the bar touching from alternating sides, which is how a bar is really held: all on one side would let it pivot on them.',addPin:"+ Pin",seedPin:"Seed pins",clearPin:"Remove all",pinNote:"A pedestal supports; a pin PREVENTS. Pins are bolted to the table, so they do not move when the part is repositioned: what changes is whether they still touch. A pin with clearance to spare pushes nothing and is ignored — not an error, the fixture may carry more pins than this part uses.",pinOffNote:"With clamping off the bar is computed free in space. Pins can still be placed and seen in the 3D view, but they deform nothing.",pinNoneHold:'No pin is touching the bar, so clamping changes nothing. Check height and position: the "Reaches" column says which ones fall short of the bar and "Gap" how far away they stop.',pinHeldN:"{n} pin(s) holding",pinTip:"Tip",pinTipTip:"How far the free end moves because the bar is held, compared with the same part free in space. It is the consequence you can measure.",pinWorstKink:"Worst kink",pinStress:"Stress",pinOfYield:"of yield",pinYield:"Somewhere the bar goes past its elastic limit: released, it does NOT spring back, and the part that comes out is not the one the model describes. With the material unconfirmed this is a warning, not a measurement — but where it happens is real.",pinYieldTip:"Bending stress at the outermost fibre against the material yield strength. Past 100 % the deformation stops being recoverable.",pinOpen:"{n} contact(s) left open",pinOpenTip:"The solver could not bring the bar onto these pins. That usually means an impossible fixture: two pins asking for the bar in two places at once, or one set so deep the part would have to break to reach it.",pinKink:"Kink °",pinCurv:"Curvature °/m",pinSigma:"σ MPa",matRho:"Density",matRhoTip:"Weight of the material per cubic metre. Only the gravity sag uses it: it is what makes the bar hang between supports. Provisional like the rest of the material.",sag:"Sag",sagTip:"How far the bar hangs under its own weight on the span ENDING at this pedestal, in millimetres. The overhang at each end counts as a cantilever and is where it shows most: length goes to the fourth power. Orientation matters more than span — flat it hangs (width/thickness)² times more than on edge, which with 40×12 is eleven times.",sagNote:"Sag is computed span by span as a simply supported beam, with the overhangs as cantilevers. A continuous beam over several supports is STIFFER than that, so this number overestimates: it is the safe side. Each span is treated as straight — bends inside a span do not stiffen it here. Once a certified straight bar is scanned mounted in the fixture, this gets checked against the measured sag and stops being an estimate.",sagBad:"Gravity sag exceeds the point tolerance. That enters the measurement as an error that is NOT a bending error: the loop will try to correct it and cannot. Add a support on the worst span, or shorten the overhang.",sagNoMat:"Sag: material missing",sagNoMatTip:"Without density and elastic modulus there is no number to give. Both are filled in on the Clamping tab.",matE:"Modulus E",matYield:"Yield strength",matTip:"Only needed to turn deformation into stress. The SHAPE a held bar takes does not depend on E: with a constant section it cancels out of the split, and there is a test proving that changing it moves no point at all.",matProv:'Material is PROVISIONAL: handbook values for 6061-T6, not the heat sitting in the shop. Good enough to see where stress concentrates; to claim "this part is over by 12 MPa" you need the material certificate.',load:"The load",loadOn:"The part has weight",loadOnTip:"With this on the bar stops staying where the table leaves it: it falls the way the load pulls, rests on the pedestals and presses against whatever pins are in its way. A support PUSHES but never PULLS, so if a bend takes the part away from a pin, away it goes; and if gravity brings it back, back it comes.",loadSlow:"This part has {n} bends. Past {lim}, working out how it settles stops being instant: at 34 it takes about a second, at 60 more than fifteen. It is not a limit and the answer is just as good — this is here so it does not look as if the program froze. What drives it is the NUMBER of bends: neither the length of the bar nor how close together they are changes anything.",loadG:"Gravity (×g)",loadGTip:"Multiple of the self weight. 1 is the real weight; 0 removes it and leaves only the tip push; 2 shows what would move if the part were twice as heavy.",loadDir:"Direction",loadDirTip:"Which way the load pulls. (0, 0, −1) is downwards, which is what gravity does. Pointing it elsewhere pushes the part against one particular clamp, to see whether that clamp holds it.",loadTipF:"Push at the tip",loadTipTip:"One more force, at the free end and along the same direction. It is the finger you poke the part with, placed where it shows most.",loadWeight:"Weight",loadWeightTip:"What the whole part weighs, plus the tip push. It comes from the density and the section: a 1.7 m bar of 40×12 is about 22 N, that is 2.2 kg.",loadCarried:"Supports carry",loadCarriedTip:"How much of that weight is shared between pedestals and pins: the sum of the reactions, projected against the load.",loadRoot:"The grip holds",loadRootTip:"Whatever the supports do not carry stays at the first end, which is where the part is gripped. This is the number that answers «do I need more pedestals?». Negative means the grip pulls DOWN: the supports carry more than the whole part because the bar levers over one of them.",loadRootDown:"The grip pulls the part DOWN with {n} N: the bar levers over a pedestal and the supports carry more than the whole part. With the grip the fixture has, that is a possible result, but it says the first end would lift without it: check that the grip clamps and does not just rest.",loadDrop:"Moved by",loadDropTip:"How far the worst point has travelled, measured against the free part. It includes what the pins do AND what the load does: to tell them apart, switch the load off and read the same number.",loadPene:"Sinks in",loadPeneTip:"How far a support sinks into the bar. Contact is modelled with a very stiff spring, so this should come out in microns; if it reaches the tolerance, the spring was too soft and the reactions next to it deserve suspicion.",loadN:"Reaction",loadNTip:'How hard that support is pushing, in newton. A dash means the part is not touching it, which is an answer and not a failure. "n/a" means something quite different: that the model cannot say anything there. And this figure is worth what the MEASURED height is worth: one micron too much on a support puts several newton into the part, and next to the clamp it puts all of them in, because the bar cannot give there. Use it to see which support is working and which is not; it is not a load-cell reading.',loadNd:"n/a",glLost:"The graphics card dropped the 3D view (sleep, display change or driver). Data and tables are fine. The 3D view comes back on its own if the browser recovers it; if it does not, save your work and reload the page.",faultMsg:"Something went wrong ({e}). What is on screen may be out of date: save your work and reload the page.",faultClose:"Close notice",clashCard:"Does not fit the fixture: {n} goes in {d} mm",clashTip:"With this model on the fixture, that support stays INSIDE the bar however much the bar gives. It happens when the part differs from the one the fixture holds: a bend a few degrees off can leave the bar on the far side of a pin, and no elastic deformation brings it back through. The held shape drawn is the closest one the model finds, not one that can be mounted. In the 3D view there is a red diamond at every support that clashes.",fixLoadOn:'Here the part weighs {w} N, and that is switched on in the Clamping tab. The "Reaction" column says how much of that weight each pedestal carries.',colVis:"Visible in 3D",xyTip:"Where it sits on the table, in millimetres. A shop measurement: it does not move when the part is repositioned.",pedHTip:"How high the saddle rises from the table, in millimetres.",pedPadTip:"Length of the saddle, in millimetres. On a long saddle, half a degree too much tilt already lifts the bar.",pedTiltTip:'The tilt the saddle is set at, in degrees. Positive if it rises, same convention as "Wants".',pedWantTip:"The tilt the bar has right above the pedestal, in degrees. Positive if it rises.",pedD:"Δ",pedDTip:"How much tilt the saddle has too much or too little: its tilt minus the one the bar wants, in degrees. Red when that lifts the bar at the end of the saddle by more than the point tolerance; the help on each cell gives the millimetres.",pedSTip:"Where it touches, measured along the bar from the first end, in millimetres.",pedPlanTip:"Plan distance from the foot to the bar axis, in millimetres. It says whether the pedestal is under the bar or beside it.",pedGapTip:"Air between the saddle and the underside of the bar, in millimetres. Positive: the bar floats and does not rest. Negative: the pedestal is in the way and would lift the part.",pedSpanTip:"Distance to the previous pedestal along the bar, in millimetres. It is what decides the gravity sag.",pinDiaTip:"Diameter of the post, in millimetres.",pinGapTip:"Air between the post and the bar where they come closest, in millimetres. Positive: the bar does not reach the pin. Negative: the pin sits where the bar would be and pushes it.",pinStateTip:"Whether the clamping is using this pin right now to hold the bar.",fixLoadOff:'Here the part has no weight. The sag already uses its own weight, but how much each pedestal carries only comes out with "The part has weight" on, in the Clamping tab: that is when the "Reaction" column appears.',stHold:"Held by the pins",stLoad:"The part has weight",stHoldLoad:"Held and weighted",stHoldGo:"Click: opens the Clamping tab, where both switches are.",loadNdTip:"No number can be given here. This support falls on a stretch the model cannot bend — the unknowns are the elbows at the stations — so its gap does not change however much the part gives, and any reaction printed there would mean nothing. It is not a zero: a zero means the part is not touching it.",loadNoDof:"The part has no stations, so this model cannot hang it: what it weighs is known, how that weight splits between the supports is not. For a straight bar the number that helps is the gravity sag, on the Fixture tab.",loadStuck:"Not solved",loadStuckTip:"The search for equilibrium stopped before reaching it: what is next to this is the last trial and not a solution. It usually happens when a support enters and leaves contact on every step, or when two supports fight over the same point.",loadStuckWarn:"The load did not reach equilibrium in {n} steps: the numbers below are the last trial and cannot be defended. Raise the damping, or move aside the support that sits right on the edge of touching.",loadNote:"The unknowns are the kinks at the STATIONS, so in this model a straight run does not sag in the middle: that part is given by the gravity sag, on the Fixture tab. The two look at different things in the same bar and do not add up. The stiffness of a station is taken as EI/L, which for a cantilever is some four times softer than the exact one: this gives the order and the direction, not a certified deflection.",loadNoMat:"Without density and without an elastic modulus there is no load to apply. Both are filled in just above, in the material.",loadHang:"The supports carry less than half the weight: the part is hanging from its own end. What you are looking at is a cantilever, not a mounted part; either pedestals are missing, or the ones there are not touching it.",mach:"Machine",machTitle:"Machine command",machCols:"Columns, in this order",machAxis:"Abs. axis",machSep:"Separator",machDec:"Decimals",machLen:"Lengths",machAng:"Angles",machSignA:"Angle sign",machSignR:"Roll sign",machSignTip:"Flips the sign in the FILE only. The kinematics are untouched: the same numbers still bend the same part on screen. It lives here because a machine may have its axis mounted the other way round, and that is fixed on write, not in the engine.",machRot:"Roll written as",machRotDelta:"turn from the previous station",machRotAbs:"absolute axis position",machRotTip:"The model stores how much the axis TURNS at each station, because the machine holds it between bends. Some controls want the absolute axis position instead. Both describe the same part; picking the wrong one bends the first station right and every later one wrong.",machHead:"With header",machCrlf:"CRLF line endings",machCrlfTip:"Many machine controls will not read a UNIX line ending. This ends every line the way a Windows control expects.",machTail:"Tail row",machTailTip:"A last row carrying the exit straight. Without it the file never says how much stock is left after the final bend. Columns that do not apply to it come out empty rather than zero: a zero in the angle column is a zero-degree bend, which is an instruction.",machPrev:"Preview",machMore:"and {n} more row(s).",machExport:"Export command",machDirty:"A manual adjustment is typed but not applied. The file carries the stored command, not what the compensation table shows: apply first or the adjustment will not be in it.",machNote:"The format the bender reads has been requested and has not arrived, so nothing is guessed here: it is left in plain sight. Before sending a bar, check units and signs in the preview against a part you already know — it is the one thing in this file that cannot be undone. The profile travels inside the part JSON, so a machine file from months ago can be regenerated identically.",lims:"Limits",limWhat:"Threshold",limVal:"Value",limDef:"Factory",limState:"State",limWait:"Waiting on",limTouched:"changed",limFactory:"factory",limProv:"provisional · awaiting {p}",limRead:"When reading a measurement",limLoop:"Loop guards",limReset:"Back to factory values",limHitStraight:"At this threshold, {n} straight(s) on this part do not fit.",limNote:'These numbers move no PI: they decide what gets rejected, which reading is distrusted, and how much the loop may correct at once. They travel inside the part JSON, so a saved file states the thresholds it was judged by. "Provisional" means the value was picked while a requested figure is still missing: A.6 is the real scan repeatability (σ), B.2 the machine limit. A 0 turns that check off.',lim_axisMin:"Readable axis",lim_axisMinTip:"Smallest deflection at which a measured bend still has a readable AXIS. Below it the lateral direction is noise, so the axis is inherited from the previous bend instead of invented. The real rule is atan(3σ/feed). Applies only to MEASURED data; in a typed model a 0.2° bend is deliberate.",lim_piMin:"PI spacing",lim_piMinTip:"Smallest distance between two PI in an imported file. Closer points give a direction that is pure noise, hence an invented bend that also poisons the next row. The real rule is 5σ. Two coincident PI reject the whole file: it means the cloud extraction went wrong.",lim_scaleMin:"Minimum scale",lim_scaleMinTip:"Fraction of the nominal PI step below which the imported cloud cannot be the same part. NOT a tolerance: it catches an export whose columns are the DEVIATION rather than the coordinate, or metres read as millimetres. One-sided: a scan missing points has a LARGER mean step, and that is not a bad file.",lim_straightMin:"Minimum straight",lim_straightMinTip:"Straight between tangency points needed for the tooling to fit: clamp plus head travel. A MACHINE limit, not a scanner one. A negative straight is listed separately regardless: that is two tools in the same place.",lim_tubeRfac:"Tube minimum radius",lim_tubeRfacTip:"Round TUBE only, in outside diameters: with 1.5 here, a Ø40 will not bend under R60. It starts at 0, meaning do not watch this, and that is not an oversight: in a tube the radius it takes is driven by the diameter-to-wall ratio and by ovalisation while bending, and this program has nothing to work that out from. A factory figure would be an opinion wearing the face of data. If the shop has its own rule, type it here.",lim_dead:"Dead band (angle)",lim_deadTip:"Below this difference against nominal the loop does not correct: it is measurement noise, and chasing it makes the part oscillate. 0 turns it off.",lim_deadFeed:"Dead band (feed)",lim_deadFeedTip:"Same as the angle dead band, in millimetres and on the feed.",lim_maxStep:"Per-cycle cap (angle)",lim_maxStepTip:"Largest correction the loop may apply at once. A bigger jump is not process drift: it is bad data or a bend that crossed branches. It is clipped and reported rather than sent to the machine. 0 removes the cap.",lim_maxStepFeed:"Per-cycle cap (feed)",lim_maxStepFeedTip:"Same as the angle cap, in millimetres and on the feed.",fabHead:"This part cannot be made as it stands:",fabNeg:"the straight feeding {b} is NEGATIVE: the tools would collide.",fabShort:"the straight feeding {b} falls short of the {n} mm the tooling needs.",fabTail:"the exit straight falls short of {n} mm.",fabOver:"{b} asks for more than {n}° of deflection: the lengths on that row come out capped.",fabTube:"At {b} the radius is under the tube minimum: {n} diameters means R{r}.",fileUnread:"the system would not read the file (was it moved, or is another program holding it open?)",csvShort:"These parts carry FEWER points than the model. The missing bends stay UNMEASURED and are not compensated:",compSim:"WARNING: {n} of the parts feeding this calculation are SIMULATED, not measured. What comes out of here does not describe any real bar.",compHeld:"The clamping or the load is on, so the 3D view may be showing the SETTLED part. These corrections are not: they are worked out against the free part, the one the table describes. If what you want is the shape with the fixture on, that is not what is being corrected towards yet.",compShort:"Only {a} of {b} bends are measured. The rest are marked with — and are NOT compensated.",rowNoMeas:"This bend is not measured: the part carried fewer points than the model. The command is left as is.",compFewN:"The loop reads {a} part(s) and {n} are needed. With fewer, the command chases that part’s scatter and the next one can come out worse.",batchUse:"Use the median of the visible parts ·",batchTip:"With a single part the loop also corrects what was scatter in that part, and the next one can come out worse. With several, the median only lets through what repeats.",batchOn:"The loop reads the median of %n parts, not the last one.",batchHint:"More than one part is visible: tick the box so the loop reads the median.",spread:"±σ",spreadTip:"Angle scatter across the visible parts (scaled MAD). Large next to a large deviation means poor repeatability, not a mis-set bend.",sbMeas:"Measured springback",sbUse:"Use in the simulator",sbNote:"sb = 1 − measured angle / commanded angle, per orientation. Median ± robust σ over the bends of the visible parts; near-straight ones (<1°) are left out.",sbCircular:"Warning: %n of the visible parts are simulated. Estimating springback from an invented part returns what is already written below — that is a closed loop, not a measurement.",sbSpreadTip:"Scatter across bends and parts. If it is as large as the value itself, that springback is not measured: it is guessed.",mnFile:"File",mnModel:"Models",mnView:"View",mnPieces:"Parts",soloOn:"3D only",soloOff:"Back",rotAxisTip:"How much the bending axis turns at this station. It ends at %e°.",rotHeadTip:"Turn of the bending axis relative to the previous station. A 0 leaves the axis where hin, wohin gebogen wird, ändert aber nicht mehr, womit der Querschnitt widersteht, und die Verwindung des Teils ist in der 3D-Ansicht nicht beobachtbar.",secHollowWarn:"Die Grenzwerte für den Mindestradius gelten für eine MASSIVE Stange. Bei einem Rohr bestimmen das Verhältnis Durchmesser/Wandstärke und die Ovalisierung beim Biegen den möglichen Radius — das beurteilt dieses Programm noch nicht: auf dem Bildschirm biegt es sich leichter als auf der Maschine.",secHollowJudged:"Rohr-Schwelle gesetzt: {n} Durchmesser. Biegungen mit kleinerem Radius werden im Reiter Modell markiert. Diese Zahl stammt aus den Grenzwerten, nicht vom Programm: das Programm kann sie nicht herleiten.",tol:"Toleranzen",tolA:"Winkel",tolR:"Drehung",tolF:"Vorschub",tolP:"Punkt",bends:"Biegungen",addBend:"Biegung hinzufügen",nBend:"#",feed:"Vorschub",rot:"Rollung",ang:"Winkel",rad:"Radius",twist:"Torsion",twlen:"Torsionslänge",ori:"Or.",dcol:"Δ",straight:"Gerade",arcL:"L",cumL:"Σ L",tailRow:"Auslauf",lenNote:"Gerade = gerades Stück von Tangente zu Tangente, und die einzige Länge, die eingetippt wird. L = Bogenlänge, die die Biegung erzeugt (Radius × Auslenkung). Σ L = aufsummierte Abwicklungslänge auf der neutralen Faser: Gerade, Bogen, Gerade, Bogen. Ein geänderter Radius oder Winkel lässt die Geraden stehen; der Vorschub von Schnittpunkt zu Schnittpunkt wird darunter neu berechnet und ist das, was gespeichert und an die Maschine geschickt wird.",kbdNote:"Tastatur: Tab / ⇧Tab bewegen waagerecht · Enter und ↑ ↓ senkrecht · Esc verwirft die Zelle · Mausrad oder Strg+↑ ↓ ändern den Wert um einen Schritt. Beim Betreten einer Zelle wird ihr Wert markiert: Tippen ersetzt ihn. Bis zu drei Nachkommastellen werden angenommen.",twnote:"Torsionslänge = gerades Stück (mm), über das die Torsion verteilt wird, mittig auf der Geraden. 0 = die ganze Gerade. Kein Schnittpunkt wird verschoben: es wird nur festgelegt, wo die Torsion stattfindet.",proc:"Simulierter Prozess (virtuelles Teil)",sbW:"Rückfederung hochkant",sbT:"Rückfederung flach",slip:"Vorschubschlupf",biasR:"Drehversatz",noise:"Scan-Rauschen",seed:"Startwert",simulate:"Gemessenes Teil erzeugen",dNone:"Kein gemessenes Teil. Simulieren Sie eines oder importieren Sie ein CSV.",deltas:"Abweichungen je Biegung",dA:"Δ Winkel",dR:"Δ Rollung",dF:"Δ Vorschub",dP:"Abw. Spitze",statMaxA:"Max. Δ Auslenkung",statRms:"RMS Auslenkung",statTip:"Abweichung freies Ende",statOut:"Außer Toleranz",gains:"Korrekturverstärkungen",gainW:"Verstärkung hochkant",gainT:"Verstärkung flach",gainR:"Verstärkung Rollung",gainF:"Verstärkung Vorschub",gainNote:"Rollung und Vorschub haben eigene Verstärkungen, weil sie nicht dieselbe Größe sind wie die Biegung. »Hochkant« und »flach« sind Rückfederungskonstanten: wie weit sich der Stab beim Loslassen öffnet. Die Rollung hat keine Feder — sie wurde ganz korrigiert, also mit Verstärkung 1,0, genau das, was beim Winkel verboten ist, weil es mit dem Messrauschen schwingt — und den Vorschub verschiebt der Schlupf, ein anderes Phänomen.",what:"Was korrigieren",cAng:"Biegewinkel",cRot:"Rollung",cFeed:"Vorschübe",apply:"Kompensation anwenden",reset:"Befehle zurücksetzen",cmdTbl:"Maschinenbefehle",cNow:"Aktuell",cNew:"Neu",cDelta:"Δ",predict:"Erwarteter Restfehler",verify:"Prüfen (2. Teil fahren)",noMeas:"Für die Kompensation wird ein gemessenes Teil benötigt.",stLen:"Abwicklungslänge",stBends:"Biegungen",stDatum:"Bezug",stMax:"Max. Abw.",stUnits:"Einheiten",engine:"Rechenkern",stVer:"Version",stVerTip:"Laufender Build. Bei einer auffälligen Zahl mit angeben: Mit einer Kopie in der Werkstatt und einer veröffentlichten ist dies das Einzige, was sie unterscheidet. «+sucio» = auf nicht committeten Änderungen gebaut.",schemaAmbiguous:`Diese Datei ist barcomp/2.2 und gibt die verwendete Biegerichtung nicht an.

Punkte {i} liegen weniger als {d} mm vom vorherigen entfernt: zwei Schnittpunkte aufeinander erfinden eine Biegung. Punktextraktion prüfen",devRowTip:"Abweichung der Biegung {b}. Enter wählt sie in der 3D-Ansicht und in der Tabelle; die Pfeile gehen auf und ab.",pins:"Spannung",lPins:"Bolzen",lHeld:"Gespannte Stange",pinOn:"Stange von den Bolzen gehalten",pinOnTip:"Aus liegt die Stange frei im Raum und das Programm verhält sich genau wie vor der Einführung der Bolzen. Ein kann das Teil nicht dorthin, wohin die Tabelle es schickt: es bleibt, wo die Bolzen es lassen, und verformt sich, um dorthin zu kommen.",pinDoRot:"Rollung gibt ebenfalls nach",pinRotTip:"Ein Bolzen drückt in der Tischebene. Wenn neben dem Winkel auch die Rollung nachgibt, verteilt sich die Verformung meist besser, aber es sind zwei Unbekannte je Station statt einer — eine physikalische Entscheidung, keine Geschwindigkeitseinstellung.",pinTol:"Kontakt",pinTolTip:"Unterhalb dieses Abstands gilt die Stange als am Bolzen anliegend, es gibt nichts zu schließen.",pinDamp:"Verteilung",pinDampTip:"Nahe 0 sammelt sich die Verformung an der nachgiebigsten Station; höhere Werte verteilen sie auf mehr Stationen. Dieselbe Rolle wie die Reglerverstärkung: voll aufgedreht schwingt es.",pinDia:"Ø",pinGap:"Spalt",pinReach:"Erreicht",pinReachTip:"Ob sie sich am KÖRPER des Bolzens treffen oder an einem seiner Enden. Ein Bolzen unterhalb der Stange berührt sie nie, so gut er auch steht, und ein zu hoch angesetzter lässt sie darunter durch: in beiden Fällen hält er nichts.",pinYes:"ja",pinNo:"nein",pinHold:"Hält",pinHoldTip:"Ein Bolzen kann montiert sein und trotzdem außen vor bleiben: ausgeschaltet bleibt er in der 3D-Ansicht sichtbar, ohne zu wirken — so findet man heraus, welcher Bolzen was verursacht.",pinMeasFree:"Es wird die FREIE Stange gezeigt und gemessen, obwohl Spannung oder Last eingeschaltet sind: diese Tabelle, die Bezugspunkte, die PI-Punkte und das Säen beziehen sich auf das Teil ohne jede Halterung, nicht auf das auf dem Tisch. Die Reaktionen nicht: sie stammen aus dem gespannten Teil. Wähle „Gehalten“ oder „Beide“ unter „Zeigen“ im Reiter Spannung, um die vorhandene Stange zu lesen.",pinShow:"Zeigen",pinShowFree:"Frei",pinShowHeld:"Gehalten",pinShowBoth:"Beide",pinShowTip:"Welche Stange gezeigt wird und wogegen ALLES gemessen wird, für alle Modelle zugleich: die freie — die Konstruktion, das Teil außerhalb der Vorrichtung — oder die, die es tatsächlich annimmt, von den Stiften gehalten und unter Eigengewicht hängend. Mit „Gehalten“ oder „Beide“ folgen der gespannten Stange beide Tabellen, die Bezugspunkte, die Durchbiegung, die PI-Punkte und ihre Beschriftungen, der Versatz zwischen Modellen, das Band, die Farben der Auflagen und wo gesäte Auflagen und Stifte entstehen. „Beide“ zeigt die freie zusätzlich als Drahtmodell. Nur zwei Dinge ändern sich nicht: wo das Teil PLATZIERT ist und wo die Auflagen stehen – sie sind auf den Tisch geschraubt.",pinTilt:"Neigung",pinTiltTip:"Wie weit der Bolzen aus der Senkrechten kippt, in Grad. 0 = lotrecht. Ein geneigter Bolzen berührt die Stange an anderer Stelle und aus anderer Richtung: der Kontakt wird zwischen beiden Achsen im Raum gelöst, nicht im Grundriss.",pinYaw:"Richtung",pinYawTip:"Wohin er kippt, im Grundriss ab +X gemessen. Ohne Neigung bedeutungslos: ein senkrechter Zylinder um die eigene Achse gedreht ist derselbe Zylinder.",pinLen:"Länge",pinLenTip:"Wie lang der Bolzen von seiner Basis aus MISST, in Millimetern. Nicht, wie hoch er sitzt: ein zu kurzer erreicht die Stange nie und hält seitlich nichts, so gut er auch steht, und ein zu langer berührt am Ende auch dort, wo er nicht soll. Zum Anheben ohne Verlängern dient die Spalte daneben.",pinZ:"Höhe",pinZTip:"In welcher Höhe über dem Tisch die Basis des Bolzens BEGINNT, in Millimetern. 0 ist der auf den Tisch geschraubte Bolzen, der Normalfall. Angehoben wird er, um eine hoch verlaufende Stange zu erreichen, ohne dass der Bolzen zusätzlich darunter berührt, wo vielleicht ein anderer Abschnitt des Teils vorbeiläuft. Was ihn dort oben hält — ein Klotz, eine Beilage, der Körper der Vorrichtung — wird weder gezeichnet noch gerechnet: das sagt, wo der Zylinder steht, nicht woran er hängt.",pinDist:"Abst.",pinDistTip:"Abstand zwischen Bolzenachse und Stangenachse an ihrer engsten Stelle, im Raum. Bei lotrechten Bolzen gleich dem Grundrissabstand, bei geneigten nicht.",pinSide:"Seite",pinSideAuto:"auto",pinSideTip:'Auf welcher Seite der Stange der Bolzen MONTIERT ist. Eine Angabe der Vorrichtung, keine Messung: liest man sie aus der aktuellen Form, kippt sie, sobald ein Winkel die Stange über die Bolzenachse hinaus schickt, und der Kontakt schließt an der falschen Fläche — es wird also ein Teil gerechnet, das durch den Bolzen ging. "auto" entscheidet beim ersten Mal aus der Geometrie, so wie es vorher war.',pinState:"Zustand",pinHolding:"hält",pinEmpty:'Keine Bolzen. "Säen" verteilt einige entlang der Stange, abwechselnd von beiden Seiten anliegend — so wird eine Stange wirklich gehalten: alle auf einer Seite ließen sie darauf schwenken.',addPin:"+ Bolzen",seedPin:"Bolzen säen",clearPin:"Alle entfernen",pinNote:"Ein Bock stützt; ein Bolzen VERHINDERT. Bolzen sind auf dem Tisch verschraubt und wandern nicht mit, wenn das Teil neu gesetzt wird: es ändert sich nur, ob sie noch anliegen. Ein Bolzen mit Luft drückt nichts und wird übergangen — kein Fehler, die Vorrichtung darf mehr Bolzen tragen, als dieses Teil braucht.",pinOffNote:"Bei ausgeschalteter Spannung wird die Stange frei im Raum gerechnet. Bolzen lassen sich setzen und ansehen, verformen aber nichts.",pinNoneHold:'Kein Bolzen berührt die Stange, die Spannung ändert also nichts. Prüfe Höhe und Lage: die Spalte "Erreicht" nennt die zu kurzen, "Spalt" den Abstand, in dem sie stehen bleiben.',pinHeldN:"{n} Bolzen halten",pinTip:"Spitze",pinTipTip:"Wie weit sich das freie Ende bewegt, weil die Stange gehalten wird, verglichen mit demselben Teil frei im Raum. Das ist die messbare Folge.",pinWorstKink:"Größter Knick",pinStress:"Spannung",pinOfYield:"der Streckgrenze",pinYield:"Irgendwo überschreitet die Stange die Elastizitätsgrenze: losgelassen federt sie NICHT zurück, und das Teil, das herauskommt, ist nicht das des Modells. Bei unbestätigtem Material ist das ein Hinweis, keine Messung — der Ort stimmt aber.",pinYieldTip:"Biegespannung in der äußersten Faser gegen die Streckgrenze des Materials. Über 100 % ist die Verformung nicht mehr rückgängig.",pinOpen:"{n} Kontakt(e) offen geblieben",pinOpenTip:"Der Löser konnte die Stange nicht an diese Bolzen bringen. Das heißt meist: unmögliche Vorrichtung — zwei Bolzen verlangen die Stange gleichzeitig an zwei Orten, oder einer steht so tief, dass das Teil brechen müsste.",pinKink:"Knick °",pinCurv:"Krümmung °/m",pinSigma:"σ MPa",matRho:"Dichte",matRhoTip:"Gewicht des Materials je Kubikmeter. Nur die Durchbiegung braucht sie: sie lässt die Stange zwischen den Auflagen durchhängen. Vorläufig wie das übrige Material.",sag:"Durchbiegung",sagTip:"Wie weit die Stange unter ihrem Eigengewicht in dem Feld durchhängt, das AN diesem Bock endet, in Millimetern. Der Überstand an jedem Ende zählt als Kragarm und fällt dort am stärksten aus: die Länge geht in der vierten Potenz ein. Die Lage wiegt schwerer als die Stützweite — flach hängt sie (Breite/Dicke)² mal stärker durch als hochkant, bei 40×12 also elfmal.",sagNote:"Die Durchbiegung wird feldweise als Einfeldträger gerechnet, die Überstände als Kragarme. Ein Durchlaufträger über mehrere Auflagen ist steifer, also überschätzt dieser Wert — die sichere Seite. Jedes Feld gilt als gerade; Biegungen innerhalb eines Feldes versteifen hier nicht. Sobald eine zertifiziert gerade Stange in der Vorrichtung gescannt ist, wird das gegen die gemessene Durchbiegung geprüft und ist keine Schätzung mehr.",sagBad:"Die Durchbiegung überschreitet die Punkttoleranz. Sie geht als Fehler in die Messung ein, der KEIN Biegefehler ist: der Regelkreis wird ihn korrigieren wollen und kann es nicht. Setze eine Auflage im schlechtesten Feld oder kürze den Überstand.",sagNoMat:"Durchbiegung: Material fehlt",sagNoMatTip:"Ohne Dichte und E-Modul gibt es keine Zahl. Beide stehen auf der Registerkarte Spannung.",matE:"E-Modul",matYield:"Streckgrenze",matTip:"Wird nur gebraucht, um Verformung in Spannung umzurechnen. Die FORM einer gehaltenen Stange hängt nicht von E ab: bei konstantem Querschnitt kürzt es sich aus der Verteilung heraus, und ein Test belegt, dass eine Änderung keinen Punkt verschiebt.",matProv:'Material VORLÄUFIG: Handbuchwerte für 6061-T6, nicht die der Charge in der Werkstatt. Gut genug, um zu sehen, wo sich Spannung sammelt; für "dieses Teil liegt 12 MPa darüber" braucht es das Werkszeugnis.',load:"Die Last",loadOn:"Das Teil hat Gewicht",loadOnTip:"Damit bleibt die Stange nicht mehr dort, wo die Tabelle sie lässt: sie fällt dorthin, wohin die Last zieht, legt sich auf die Böcke und drückt gegen die Stifte, die ihr im Weg stehen. Eine Auflage DRÜCKT, aber sie ZIEHT nicht: nimmt eine Biegung das Teil von einem Stift weg, dann geht es weg; und holt die Schwerkraft es zurück, dann kommt es zurück.",loadSlow:"Dieses Teil hat {n} Biegungen. Über {lim} hinaus ist die Berechnung der Auflage nicht mehr sofort da: bei 34 dauert sie knapp eine Sekunde, bei 60 mehr als fünfzehn. Das ist keine Grenze und das Ergebnis ist genauso gut — es steht hier, damit es nicht so aussieht, als hänge das Programm. Maßgebend ist die ANZAHL der Biegungen: weder die Länge der Stange noch ihr Abstand ändern etwas.",loadG:"Schwerkraft (×g)",loadGTip:"Vielfaches des Eigengewichts. 1 ist das echte Gewicht; 0 nimmt es weg und lässt nur den Druck an der Spitze; 2 zeigt, was sich bewegen würde, wäre das Teil doppelt so schwer.",loadDir:"Richtung",loadDirTip:"Wohin die Last zieht. (0, 0, −1) ist nach unten, also das, was die Schwerkraft tut. Zeigt sie woandershin, drückt sie das Teil gegen eine bestimmte Spannstelle, um zu sehen, ob diese hält.",loadTipF:"Druck an der Spitze",loadTipTip:"Eine weitere Kraft, am freien Ende und in derselben Richtung. Es ist der Finger, mit dem man prüft, ob sich das Teil bewegt, dort angesetzt, wo es am meisten ausmacht.",loadWeight:"Gewicht",loadWeightTip:"Was das ganze Teil wiegt, zuzüglich des Drucks an der Spitze. Es folgt aus Dichte und Querschnitt: eine 1,7 m lange Stange 40×12 sind rund 22 N, also 2,2 kg.",loadCarried:"Die Auflagen tragen",loadCarriedTip:"Wie viel von diesem Gewicht sich auf Böcke und Stifte verteilt: die Summe der Reaktionen, auf die Last projiziert.",loadRoot:"Die Spannzange hält",loadRootTip:"Was die Auflagen nicht tragen, bleibt am ersten Ende hängen, wo das Teil gegriffen ist. Das ist die Zahl, die beantwortet: «brauche ich mehr Böcke?». Negativ heißt, die Spannzange zieht nach UNTEN: die Auflagen tragen mehr als das ganze Teil, weil die Stange über einem von ihnen hebelt.",loadRootDown:"Die Spannzange zieht das Teil mit {n} N nach UNTEN: die Stange hebelt über einem Bock, und die Auflagen tragen mehr als das ganze Teil. Mit der Spannzange der Vorrichtung ist das möglich, heißt aber, dass sich das erste Ende ohne sie heben würde: prüfen, dass die Zange spannt und nicht nur aufliegt.",loadDrop:"Bewegt um",loadDropTip:"Wie weit sich der ungünstigste Punkt verschoben hat, gemessen gegen das freie Teil. Enthält sowohl die Wirkung der Stifte ALS AUCH die der Last: um beides zu trennen, die Last abschalten und dieselbe Zahl lesen.",loadPene:"Dringt ein",loadPeneTip:"Wie tief eine Auflage in die Stange eindringt. Der Kontakt wird mit einer sehr steifen Feder abgebildet, das sollte also im Mikrometerbereich herauskommen; erreicht es die Toleranz, war die Feder zu weich und den Reaktionen daneben ist zu misstrauen.",loadN:"Reaktion",loadNTip:'Mit welcher Kraft diese Auflage drückt, in Newton. Ein Strich heißt, dass das Teil sie nicht berührt; eine Antwort, kein Fehler. „k. A." heißt etwas ganz anderes: dass das Modell dort nichts sagen kann. Und dieser Wert taugt nur so viel wie die GEMESSENE Höhe: ein Mikrometer zu viel an einer Auflage bringt mehrere Newton in das Teil, und neben der Klemmung alle davon, weil der Stab dort nicht nachgeben kann. Er zeigt, welche Auflage trägt und welche nicht; er ist keine Kraftmessdose.',loadNd:"k. A.",glLost:"Die Grafikkarte hat die 3D-Ansicht verloren (Standby, Bildschirmwechsel oder Treiber). Daten und Tabellen sind in Ordnung. Die 3D-Ansicht kommt von selbst zurück, wenn der Browser sie wiederherstellt; falls nicht, Arbeit speichern und die Seite neu laden.",faultMsg:"Etwas ist schiefgelaufen ({e}). Die Anzeige ist möglicherweise nicht aktuell: Arbeit speichern und die Seite neu laden.",faultClose:"Hinweis schließen",clashCard:"Passt nicht in die Vorrichtung: {n} dringt {d} mm ein",clashTip:"Mit diesem Modell auf der Vorrichtung bleibt diese Auflage INNERHALB des Stabs, egal wie weit der Stab nachgibt. Das passiert, wenn das Teil nicht das ist, das die Vorrichtung hält: eine um wenige Grad andere Biegung kann den Stab auf die andere Seite eines Stifts legen, und keine elastische Verformung bringt ihn hindurch zurück. Die gezeichnete gespannte Form ist die nächstliegende, die das Modell findet, keine montierbare. In der 3D-Ansicht sitzt an jeder kollidierenden Auflage eine rote Raute.",fixLoadOn:'Hier wiegt das Teil {w} N, eingeschaltet im Reiter Spannung. Die Spalte „Reaktion" sagt, wie viel dieses Gewichts jeder Bock trägt.',colVis:"Sichtbar in 3D",xyTip:"Wo er auf dem Tisch steht, in Millimetern. Ein Werkstattmaß: es wandert nicht mit, wenn das Teil neu gesetzt wird.",pedHTip:"Wie hoch die Auflage über dem Tisch steht, in Millimetern.",pedPadTip:"Länge der Auflage, in Millimetern. Bei einer langen Auflage hebt schon ein halbes Grad zu viel Neigung die Stange an.",pedTiltTip:'Mit welcher Neigung die Auflage eingestellt ist, in Grad. Positiv, wenn sie ansteigt, wie bei „Verlangt".',pedWantTip:"Die Neigung, die die Stange direkt über dem Bock hat, in Grad. Positiv, wenn sie ansteigt.",pedD:"Δ",pedDTip:"Wie viel Neigung der Auflage zu viel oder zu wenig ist: ihre Neigung minus die, die die Stange verlangt, in Grad. Rot, wenn das die Stange am Ende der Auflage stärker anhebt als die Punkttoleranz; die Hilfe jeder Zelle nennt die Millimeter.",pedSTip:"Wo sie sich berühren, entlang der Stange vom ersten Ende aus gemessen, in Millimetern.",pedPlanTip:"Abstand im Grundriss vom Fuß zur Stangenachse, in Millimetern. Er sagt, ob der Bock unter der Stange steht oder daneben.",pedGapTip:"Luft zwischen Auflage und Unterseite der Stange, in Millimetern. Positiv: die Stange schwebt und liegt nicht auf. Negativ: der Bock steht im Weg und würde das Teil anheben.",pedSpanTip:"Abstand zum vorigen Bock entlang der Stange, in Millimetern. Er bestimmt die Durchbiegung durch Schwerkraft.",pinDiaTip:"Durchmesser des Bolzens, in Millimetern.",pinGapTip:"Luft zwischen Bolzen und Stange an ihrer engsten Stelle, in Millimetern. Positiv: die Stange erreicht den Bolzen nicht. Negativ: der Bolzen sitzt, wo die Stange wäre, und drückt sie weg.",pinStateTip:"Ob die Spannung diesen Bolzen gerade benutzt, um die Stange zu halten.",fixLoadOff:'Hier hat das Teil kein Gewicht. Die Durchbiegung nutzt schon sein Eigengewicht, aber wie viel jeder Bock trägt, ergibt sich erst mit „Das Teil hat Gewicht" im Reiter Spannung: dann erscheint die Spalte „Reaktion".',stHold:"Von den Bolzen gehalten",stLoad:"Das Teil hat Gewicht",stHoldLoad:"Gehalten und belastet",stHoldGo:"Klick: öffnet den Reiter Spannung, dort sind beide Schalter.",loadNdTip:"Hier lässt sich keine Zahl nennen. Diese Auflage liegt auf einem Abschnitt, den das Modell nicht biegen kann — die Unbekannten sind die Knicke an den Stationen — also ändert sich ihr Spalt nicht, wie sehr das Teil auch nachgibt, und eine dort ausgegebene Kraft würde nichts bedeuten. Es ist keine Null: eine Null heißt, dass das Teil sie nicht berührt.",loadNoDof:"Das Teil hat keine Stationen, also kann dieses Modell es nicht hängen lassen: was es wiegt, ist bekannt, wie sich das Gewicht auf die Auflagen verteilt, nicht. Bei einem geraden Stab hilft die Schwerkraft-Durchbiegung im Reiter Vorrichtung.",loadStuck:"Nicht gelöst",loadStuckTip:"Die Suche nach dem Gleichgewicht hielt an, bevor sie es erreichte: was daneben steht, ist der letzte Versuch und keine Lösung. Das passiert meist, wenn eine Auflage bei jedem Schritt in den Kontakt hinein- und wieder herausgeht, oder wenn zwei Auflagen um denselben Punkt streiten.",loadStuckWarn:"Die Last erreichte in {n} Schritten kein Gleichgewicht: die Zahlen unten sind der letzte Versuch und lassen sich nicht vertreten. Erhöhe die Dämpfung, oder rücke die Auflage beiseite, die genau an der Grenze zum Berühren steht.",loadNote:"Die Unbekannten sind die Knicke an den STATIONEN, also hängt in diesem Modell ein gerades Stück in der Mitte nicht durch: diesen Teil liefert die Durchbiegung auf der Registerkarte Vorrichtung. Beide betrachten Verschiedenes an derselben Stange und addieren sich nicht. Die Steifigkeit einer Station wird als EI/L angesetzt, für einen Kragarm rund viermal weicher als der exakte Wert: das ergibt Größenordnung und Richtung, keine belastbare Durchbiegung.",loadNoMat:"Ohne Dichte und ohne E-Modul gibt es keine Last zum Aufbringen. Beides wird gleich darüber beim Material eingetragen.",loadHang:"Die Auflagen tragen weniger als die Hälfte des Gewichts: das Teil hängt an seinem eigenen Ende. Zu sehen ist ein Kragarm, kein aufgelegtes Teil; entweder fehlen Böcke, oder die vorhandenen berühren es nicht.",mach:"Maschine",machTitle:"Maschinenbefehl",machCols:"Spalten, in dieser Reihenfolge",machAxis:"Abs. Achse",machSep:"Trennzeichen",machDec:"Dezimalstellen",machLen:"Längen",machAng:"Winkel",machSignA:"Vorzeichen Winkel",machSignR:"Vorzeichen Rollung",machSignTip:"Dreht das Vorzeichen NUR in der Datei um. Die Kinematik bleibt unangetastet: dieselben Zahlen biegen am Bildschirm weiterhin dasselbe Teil. Es steht hier, weil eine Maschine die Achse andersherum montiert haben kann, und das wird beim Schreiben korrigiert, nicht im Motor.",machRot:"Rollung geschrieben als",machRotDelta:"Drehung gegenüber der Vorstation",machRotAbs:"absolute Achslage",machRotTip:"Das Modell speichert, wie weit sich die Achse je Station DREHT, denn die Maschine hält sie zwischen den Biegungen. Manche Steuerungen wollen stattdessen die absolute Achslage. Beide beschreiben dasselbe Teil; die falsche Wahl biegt die erste Station richtig und jede weitere falsch.",machHead:"Mit Kopfzeile",machCrlf:"Zeilenende CRLF",machCrlfTip:"Viele Maschinensteuerungen lesen kein UNIX-Zeilenende. Damit endet jede Zeile so, wie es eine Windows-Steuerung erwartet.",machTail:"Zeile für das Endstück",machTailTip:"Eine letzte Zeile mit der Auslaufgeraden. Ohne sie sagt die Datei nicht, wie viel Material nach der letzten Biegung bleibt. Nicht zutreffende Spalten bleiben leer statt null: eine Null in der Winkelspalte ist eine Biegung von null Grad, also eine Anweisung.",machPrev:"Vorschau",machMore:"und {n} weitere Zeile(n).",machExport:"Befehl exportieren",machDirty:"Eine manuelle Korrektur ist eingetragen, aber nicht übernommen. Die Datei enthält den gespeicherten Befehl, nicht das, was die Kompensationstabelle zeigt: erst übernehmen, sonst fehlt die Korrektur.",machNote:"Das Format, das die Biegemaschine liest, ist angefordert und noch nicht eingetroffen, also wird hier nichts geraten: es liegt offen. Prüfe vor der ersten Stange in der Vorschau Einheiten und Vorzeichen gegen ein bekanntes Teil — das ist das Einzige an dieser Datei, was sich nicht rückgängig machen lässt. Das Profil reist im JSON des Teils mit, also lässt sich eine Maschinendatei von vor Monaten identisch neu erzeugen.",lims:"Grenzwerte",limWhat:"Schwelle",limVal:"Wert",limDef:"Werk",limState:"Zustand",limWait:"Wartet auf",limTouched:"geändert",limFactory:"Werkswert",limProv:"vorläufig · {p}",limRead:"Beim Einlesen einer Messung",limLoop:"Schutz des Regelkreises",limReset:"Zurück auf Werkswerte",limHitStraight:"Mit dieser Schwelle passen {n} Gerade(n) dieses Teils nicht.",limNote:'Diese Zahlen verschieben keinen PI: sie entscheiden, was abgelehnt wird, welchem Messwert misstraut wird und wie viel der Regelkreis auf einmal korrigieren darf. Sie reisen im JSON des Teils mit, also nennt eine gespeicherte Datei die Schwellen, nach denen sie beurteilt wurde. "Vorläufig" heißt, der Wert wurde ohne eine angeforderte Angabe gewählt: A.6 ist die reale Wiederholpräzision des Scans (σ), B.2 die Maschinengrenze. Eine 0 schaltet die Prüfung ab.',lim_axisMin:"Lesbare Achse",lim_axisMinTip:"Kleinste Auslenkung, bei der die ACHSE einer gemessenen Biegung noch lesbar ist. Darunter ist die Querrichtung Rauschen, also wird die Achse von der vorherigen Biegung übernommen statt erfunden. Die echte Regel lautet atan(3σ/Vorschub). Gilt nur für GEMESSENE Daten; in einem eingetippten Modell ist eine Biegung von 0,2° Absicht.",lim_piMin:"PI-Abstand",lim_piMinTip:"Kleinster Abstand zwischen zwei PI einer importierten Datei. Näher beieinander ergibt die Richtung reines Rauschen und daraus eine erfundene Biegung, die auch die nächste Zeile vergiftet. Die echte Regel lautet 5σ. Zwei zusammenfallende PI lehnen die ganze Datei ab: die Extraktion aus der Punktwolke ist schiefgegangen.",lim_scaleMin:"Mindestmaßstab",lim_scaleMinTip:"Anteil der Soll-PI-Schrittweite, unterhalb dessen die importierte Wolke nicht dasselbe Teil sein kann. KEINE Toleranz: fängt einen Export ab, dessen Spalten die ABWEICHUNG statt der Koordinate sind, oder Meter, die als Millimeter gelesen werden. Nur nach unten: einem Scan mit fehlenden Punkten wächst die mittlere Schrittweite, und das ist keine schlechte Datei.",lim_straightMin:"Mindestgerade",lim_straightMinTip:"Gerade zwischen den Tangentenpunkten, die das Werkzeug braucht: Spannbacke plus Kopfweg. Eine MASCHINEN-Grenze, keine des Scanners. Eine negative Gerade wird ohnehin getrennt aufgeführt: das sind zwei Werkzeuge am selben Ort.",lim_tubeRfac:"Mindestradius Rohr",lim_tubeRfacTip:"Nu
