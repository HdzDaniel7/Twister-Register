<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BARCOMP α — Compensación de dobleces</title>
<style>:root{
  --bg:#0B0E13; --panel:#12161D; --panel2:#171C25; --panel3:#1D2430;
  --line:#242C39; --line2:#303A4A;
  /* --dim2 NO es decorativo: lo llevan la ayuda de las celdas, los rótulos de
     sección y las columnas de solo lectura de las tablas, que son datos. Estaba
     a 3.1:1 en oscuro y 3.2:1 en claro, bajo el 4.5:1 que pide WCAG 1.4.3 para
     texto normal, y estas tipografías son de 10 px. Los dos temas suben hasta
     pasar ese umbral medido contra --panel2, el fondo más apretado en el que
     aparece. Queda muy cerca de --dim: al exigir legibilidad a los dos, la
     jerarquía entre ellos ya no la lleva el color sino el tamaño y la caja. */
  --txt:#D8DFE9; --dim:#7E8A9C; --dim2:#78849A;
  --nominal:#3FA9F5; --measured:#F0A02E; --corrected:#3FD68C;
  --ok:#3FD68C; --warn:#FFC53D; --bad:#FF4D5E;
  --warnTxt:#F0D48A; --warnBd:#8A6A24; --warnBg:#FFC53D14;
  /* violeta: la pieza NO es real. No comparte familia con ningún otro
     color semántico justamente para que no se confunda con una medida. */
  --synthetic:#C08AF0;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  --sans:"Inter","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --h:44px; --ribbon:74px; --statusH:26px; --rtW:360px; --lfW:250px; --btH:340px;
  /* MODELAR: ancho de la tabla a la derecha. COMPENSAR: alto de la banda 3D. */
  --btW:760px; --compVP:250px;

  /* Todo lo que antes iba en crudo dentro del CSS, de scene/ y de ribbon.ts.
     El 3D y la cinta LEEN estos tokens en tiempo de ejecución, así que aquí
     está el color de la aplicación entera, tema por tema. */
  --vpbg:#080A0E; --grid1:#2A3546; --grid2:#1A212C; --fixture:#3A4658;
  /* el pin lateral, y la forma que toma la barra al quedar sujeta por él */
  --pincol:#57C8D6; --held:#F5A9E0;
  --inputbg:#0C1017; --inputbg2:#0E141D; --inputHovBd:#3C4759;
  --sel:#12324B; --selBd:#1E5C86; --selTxt:#9FD4FA; --selHov:#17415F;
  --btnHov:#28313F; --btnHovBd:#455065; --dcolbg:#0F1620;
  --oriW:#C9A5F5; --oriWbd:#6B4B9E; --oriT:#7FD8C4; --oriTbd:#3B7A6C;
  --hd1:#151A23; --hd2:#10141B; --scroll:#465268;
  --lblbg:#0B0E13CC; --floatbg:#0B0E13D9; --hintbg:#0B0E13B0;
  /* texto de las etiquetas del 3D. Iban en --dim y en un #fff a pelo, y
     en tema claro el blanco sobre blanco no se leía. */
  --lblTxt:#AEB9C8; --lblSel:#FFFFFF;
  --ring:#3FA9F533; --grip:#3FA9F544; --selRing:#3FA9F540;
}

/* ---------- tema claro ----------
   Los colores NO cambian de familia: --nominal sigue siendo azul, --measured
   ámbar, --corrected verde, y la escala de desviación sigue yendo de verde a
   ámbar a rojo. Lo que cambia es la luminosidad, para que se lean sobre blanco.
   El bloque va dos veces: bajo [data-theme="light"] (elección explícita) y bajo
   la preferencia del sistema, esta guardada contra una elección de oscuro. */
:root[data-theme="light"]{
  --bg:#F4F6F9; --panel:#FFFFFF; --panel2:#F0F3F7; --panel3:#E7ECF2;
  --line:#D7DDE6; --line2:#BFC8D4;
  --txt:#18202C; --dim:#5B6778; --dim2:#5F6E85;
  --nominal:#0D6FC4; --measured:#A96400; --corrected:#0F7A52;
  --ok:#0F7A52; --warn:#9A6B00; --bad:#C42133; --synthetic:#7A3FB0;
  --warnTxt:#6B4A00; --warnBd:#C79A2E; --warnBg:#FFC53D24;
  --vpbg:#EDF0F4; --grid1:#C2CBD8; --grid2:#D9DFE7; --fixture:#AEB9C8;
  --pincol:#1E8FA0; --held:#B33C8C;
  --inputbg:#FFFFFF; --inputbg2:#F7F9FC; --inputHovBd:#A6B2C2;
  --sel:#D5E7F8; --selBd:#8CBCE4; --selTxt:#0A4B87; --selHov:#C2DCF4;
  --btnHov:#DCE3EC; --btnHovBd:#A6B2C2; --dcolbg:#EDF3F9;
  --oriW:#6A38A2; --oriWbd:#B49BDE; --oriT:#0C6A58; --oriTbd:#84C9BB;
  --hd1:#FFFFFF; --hd2:#F1F4F9; --scroll:#B4BDCA;
  --lblbg:#FFFFFFD9; --floatbg:#FFFFFFE6; --hintbg:#FFFFFFCC;
  --lblTxt:#3B475A; --lblSel:#0A4B87;
  --ring:#0D6FC433; --grip:#0D6FC444; --selRing:#0D6FC440;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#F4F6F9; --panel:#FFFFFF; --panel2:#F0F3F7; --panel3:#E7ECF2;
    --line:#D7DDE6; --line2:#BFC8D4;
    --txt:#18202C; --dim:#5B6778; --dim2:#5F6E85;
    --nominal:#0D6FC4; --measured:#A96400; --corrected:#0F7A52;
    --ok:#0F7A52; --warn:#9A6B00; --bad:#C42133; --synthetic:#7A3FB0;
    --warnTxt:#6B4A00; --warnBd:#C79A2E; --warnBg:#FFC53D24;
    --vpbg:#EDF0F4; --grid1:#C2CBD8; --grid2:#D9DFE7; --fixture:#AEB9C8;
    --pincol:#1E8FA0; --held:#B33C8C;
    --inputbg:#FFFFFF; --inputbg2:#F7F9FC; --inputHovBd:#A6B2C2;
    --sel:#D5E7F8; --selBd:#8CBCE4; --selTxt:#0A4B87; --selHov:#C2DCF4;
    --btnHov:#DCE3EC; --btnHovBd:#A6B2C2; --dcolbg:#EDF3F9;
    --oriW:#6A38A2; --oriWbd:#B49BDE; --oriT:#0C6A58; --oriTbd:#84C9BB;
    --hd1:#FFFFFF; --hd2:#F1F4F9; --scroll:#B4BDCA;
    --lblbg:#FFFFFFD9; --floatbg:#FFFFFFE6; --hintbg:#FFFFFFCC;
    --lblTxt:#3B475A; --lblSel:#0A4B87;
    --ring:#0D6FC433; --grip:#0D6FC444; --selRing:#0D6FC440;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--txt);font-family:var(--mono);font-size:12px;
  -webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:var(--scroll)}
:focus-visible{outline:2px solid var(--nominal);outline-offset:1px}
/* Una fila de la tabla de desviacion enfocada. El outline va HACIA DENTRO
   (offset negativo): hacia fuera lo recorta el contenedor .tw, que tiene
   overflow, y el anillo se veria a medias justo en la fila de arriba y en la
   de abajo. */
tbody tr[tabindex]:focus-visible{outline:2px solid var(--nominal);outline-offset:-2px}

/* ---------- shell ---------- */
/* Tres bandas apiladas: la de arriba se reparte en tres columnas (paneles,
   3D, desviación), y abajo van la cinta —horizontal por naturaleza, mide la
   longitud desarrollada— y la tabla a todo el ancho, que es lo que necesita
   con sus 14 columnas. El alto de la tabla lo pone #btgrip. */
/* ---------- LA DISTRIBUCIÓN, POR MODO DE TRABAJO ----------
   El programa hace tres trabajos y cada uno quiere la pantalla para otra cosa.
   Antes los tres compartían un reparto fijo y ninguno cabía: la tabla de 13
   columnas enseñaba dos filas y el 3D se quedaba con un tercio de la pantalla.
   Ahora la clase del #app manda sobre la rejilla entera.

     m-model   MODELAR    la tabla a la derecha, entera y de arriba abajo,
                          con el 3D AL LADO — no debajo, que es lo que la
                          ahogaba— y la cinta bajo el 3D.
     m-meas    MEDIR      el modelo grande, la cinta alta y las estadísticas
                          en el lateral. No hay tabla que teclear.
     m-comp    COMPENSAR  ganancias en una tira y los comandos a todo el
                          ancho; el 3D queda como banda de comprobación.
                          Es además el modo taller: si en pantalla no hay nada
                          que no sea compensación, no hace falta un
                          interruptor de bloqueo aparte.

   Lo que un modo no usa se oculta con `display:none`, y su render se salta:
   ver renderPanels() en panels/render.ts.                                  */
#app{display:grid;height:100vh}
#hd{grid-area:hd}#ct{grid-area:ct}#rt{grid-area:rt}
#rb{grid-area:rb}#bt{grid-area:bt}#st{grid-area:st}

/* --- MODELAR: teclear ángulos sin desplazar --- */
#app.m-model{
  grid-template-columns:minmax(320px,1fr) var(--btW);
  grid-template-rows:var(--h) minmax(200px,1fr) var(--ribbon) var(--statusH);
  grid-template-areas:"hd hd" "ct bt" "rb bt" "st st"}
#app.m-model #rt{display:none}

/* --- MEDIR: mirar la pieza --- */
#app.m-meas{
  grid-template-columns:minmax(320px,1fr) var(--rtW);
  grid-template-rows:var(--h) minmax(200px,1fr) calc(var(--ribbon) + 46px) var(--statusH);
  grid-template-areas:"hd hd" "ct rt" "rb rb" "st st"}
#app.m-meas #bt{display:none}

/* --- COMPENSAR: la tabla de comandos manda, y no hay nada más --- */
#app.m-comp{
  grid-template-columns:1fr;
  grid-template-rows:var(--h) minmax(200px,1fr) var(--ribbon) var(--compVP) var(--statusH);
  grid-template-areas:"hd" "bt" "rb" "ct" "st"}
#app.m-comp #rt{display:none}
/* ---------- el 3D a pantalla completa ----------
   Pliega la tabla, el lateral y la cinta sin salir del modo: la tabla sigue
   donde estaba y el sitio en ella no se pierde. Es para mirar la pieza, que
   es la mitad del trabajo y la que peor llevaba compartir la pantalla. */
#app.solo{grid-template-columns:1fr;
  grid-template-rows:var(--h) 1fr var(--statusH);
  grid-template-areas:"hd" "ct" "st"}
#app.solo #bt,#app.solo #rt,#app.solo #rb,#app.solo #rtgrip{display:none}

/* Los dos tiradores siguen ahí en los tres modos, pero cada modo les da otro
   trabajo (ver bindGrips en app/events/grips.ts):

     #rtgrip   MODELAR el ancho de la tabla · MEDIR el ancho del lateral
               COMPENSAR nada: no hay columna a la derecha, y se esconde
     #btgrip   COMPENSAR el alto de la banda 3D · los demás el alto de la cinta

   Sin esto el tirador de la izquierda movía --rtW en un modo donde el lateral
   no existe, y no pasaba nada al arrastrarlo. */
#app.m-comp #rtgrip{display:none}

/* ---------- header ---------- */
#hd{display:flex;align-items:center;gap:14px;padding:0 12px;
  background:linear-gradient(180deg,var(--hd1),var(--hd2));border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:8px;font-family:var(--sans)}
.brand b{font-size:15px;font-weight:700;letter-spacing:.16em}
.brand .v{font-size:9px;letter-spacing:.18em;color:var(--nominal);
  border:1px solid var(--nominal);border-radius:2px;padding:1px 4px;opacity:.85}
.brand .sub{font-size:10px;color:var(--dim2);letter-spacing:.06em;margin-left:4px}
.hspace{flex:1}
.hbtns{display:flex;gap:5px}
.btn{background:var(--panel3);border:1px solid var(--line2);border-radius:3px;
  padding:5px 10px;cursor:pointer;color:var(--txt);white-space:nowrap;transition:.12s}
.btn:hover{background:var(--btnHov);border-color:var(--btnHovBd)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--sel);border-color:var(--selBd);color:var(--selTxt)}
.btn.pri:hover{background:var(--selHov)}
.btn.sm{padding:3px 7px;font-size:11px}
.seg{display:flex;border:1px solid var(--line2);border-radius:3px;overflow:hidden}
.seg button{background:var(--panel3);border:0;padding:5px 9px;cursor:pointer;color:var(--dim)}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--sel);color:var(--selTxt)}

/* ---------- panels ---------- */
#rt{background:var(--panel);overflow-y:auto;overflow-x:hidden}
/* ---------- el cajón de menú ----------
   Flota bajo la barra, encima del 3D. Está FUERA de la rejilla a propósito:
   así abrirlo no reparte la pantalla otra vez ni obliga a un onResize(), y el
   3D y la tabla no dan un salto cada vez que alguien mira las capas. */
#lf{position:fixed;top:var(--h);left:0;width:var(--lfW);z-index:30;
  max-height:calc(100vh - var(--h) - var(--statusH));
  background:var(--panel);border-right:1px solid var(--line2);
  border-bottom:1px solid var(--line2);
  box-shadow:6px 6px 18px #0006;overflow-y:auto;overflow-x:hidden}
#lf[hidden]{display:none}

/* ---------- la barra de menús ---------- */
.menubar{display:flex;gap:2px}
.mn{background:none;border:1px solid transparent;border-radius:3px;padding:5px 11px;
  cursor:pointer;color:var(--dim);font-family:var(--sans);font-size:12px;
  letter-spacing:.02em;transition:.12s}
.mn:hover{color:var(--txt);background:var(--panel3)}
.mn.on{color:var(--txt);background:var(--panel3);border-color:var(--line2)}
.col{display:flex;flex-direction:column;gap:5px}
#rt{border-left:1px solid var(--line);position:relative;z-index:2;background:var(--panel)}
.grp{border-bottom:1px solid var(--line)}
.eyebrow{font-family:var(--sans);font-size:9.5px;font-weight:600;letter-spacing:.15em;
  text-transform:uppercase;color:var(--dim2);padding:10px 11px 6px;display:flex;
  align-items:center;justify-content:space-between;gap:6px}
.eyebrow .n{color:var(--dim2);opacity:.6}
.grp .body{padding:0 8px 10px}

/* layers */
.layer{display:flex;align-items:center;gap:7px;padding:4px 3px;border-radius:3px;cursor:default}
.layer:hover{background:var(--panel2)}
.layer .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px}
/* La casilla en si no puede crecer sin desmontar la lista de capas, asi que
   quien crece es la FILA: el area sensible de un <label> es la etiqueta
   entera, y con 24 px de alto la casilla de 14 se puede pulsar con el dedo o
   con un raton impreciso. */
.layer{min-height:24px}
.layer input[type=checkbox]{accent-color:var(--nominal);width:14px;height:14px;cursor:pointer;
  flex:none}
.sw{width:15px;height:15px;border-radius:3px;border:1px solid #0006;cursor:pointer;
  padding:0;flex:none;overflow:hidden}
.sw::-webkit-color-swatch-wrapper{padding:0}.sw::-webkit-color-swatch{border:0;border-radius:2px}
/* Blanco de clic de 24x24, que es el minimo de WCAG 2.5.8 (AA). El glifo
   sigue siendo pequenio —la X y el simbolo de duplicar se leen mejor finos—
   pero la zona que responde es la caja entera: antes eran ~10x12 px, y fallar
   el boton de borrar en una lista de trece piezas es una prueba y error con
   consecuencias. El ancho que esto le quita al nombre del modelo se recupera
   con min-width:0 en el campo, que ya estaba. */
.xbtn{background:none;border:0;color:var(--dim2);cursor:pointer;padding:0;line-height:1;
  min-width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;
  border-radius:3px;flex:none}
.xbtn:hover{color:var(--bad);background:var(--panel3)}

/* datasets */
.ds{border:1px solid var(--line);border-radius:4px;padding:6px 7px;margin-bottom:6px;
  background:var(--panel2)}
.ds.act{border-color:var(--nominal);box-shadow:0 0 0 1px var(--selRing) inset}
.ds .top{display:flex;align-items:center;gap:6px}
/* el nombre del modelo se edita aquí mismo: campo sin marco hasta que se toca,
   para que la tarjeta siga leyéndose como una ficha y no como un formulario */
.ds input.nm{flex:1;min-width:0;font-size:11.5px;padding:2px 4px;width:auto;
  background:transparent;border-color:transparent;border-radius:3px}
.ds input.nm:hover{border-color:var(--line2);background:var(--inputbg)}
.ds input.nm:focus{border-color:var(--nominal);background:var(--inputbg)}
.ds .meta{display:flex;gap:9px;margin-top:4px;font-size:10px;color:var(--dim)}
.ds .meta b{font-weight:400;color:var(--txt)}
/* el modelo no cabe en el fixture: en rojo y debajo de sus cifras, que es donde
   se mira al comparar */
.ds .clash{margin-top:4px;font-size:10px;color:var(--bad);cursor:help}

/* ---------- viewport ---------- */
/* overflow:hidden es lo que impide que el lienzo 3D se monte sobre el panel
   derecho mientras se arrastra #rtgrip. El otro medio freno es onResize(). */
#ct{position:relative;display:flex;flex-direction:column;background:var(--vpbg);
  min-width:0;overflow:hidden}
#vpwrap{position:relative;flex:1;min-height:0}
#vp{position:absolute;inset:0;display:block}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-50%);font-size:10px;padding:1px 4px;
  border-radius:2px;background:var(--lblbg);border:1px solid var(--line2);white-space:nowrap;
  letter-spacing:.03em;color:var(--lblTxt)}
.lbl.sel{color:var(--lblSel);border-color:currentColor}
/* La cota lleva su color en un punto, no en el texto: un color de identidad
   elegido sobre fondo oscuro se lava sobre fondo claro, y lo que hay que poder
   leer es la cifra. */
.lbl .swatch{display:inline-block;width:6px;height:6px;border-radius:1px;
  margin-right:4px;vertical-align:baseline}
#vptool{position:absolute;top:8px;left:8px;display:flex;gap:5px;align-items:center;
  background:var(--floatbg);border:1px solid var(--line);border-radius:4px;padding:5px 7px;
  backdrop-filter:blur(6px);flex-wrap:wrap;
  /* deja sitio a la leyenda, que está fija arriba a la derecha: con las
     palabras alemanas la barra llegaba a meterse debajo. El reserva casa
     con el max-width de #vplegend más los dos márgenes de 8 px. */
  max-width:calc(100% - 234px)}
#vplegend{position:absolute;top:8px;right:8px;background:var(--floatbg);border:1px solid var(--line);
  border-radius:4px;padding:7px 9px;backdrop-filter:blur(6px);font-size:10.5px;
  min-width:132px;max-width:210px}
#vplegend .row{display:flex;align-items:center;gap:6px;padding:1.5px 0}
#vplegend .dot{width:9px;height:3px;border-radius:2px;flex:none}
.scalebar{margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}
.scalebar .grad{height:7px;border-radius:2px;margin:3px 0 2px;
  background:linear-gradient(90deg,var(--ok),var(--warn),var(--bad))}
.scalebar .ends{display:flex;justify-content:space-between;color:var(--dim);font-size:9.5px}
.tag{font-size:9.5px;color:var(--dim2);letter-spacing:.1em;text-transform:uppercase;
  font-family:var(--sans);font-weight:600}
#hint{position:absolute;bottom:8px;left:8px;font-size:10px;color:var(--dim2);
  background:var(--hintbg);padding:3px 7px;border-radius:3px}
/* aviso sobre el 3D: la gráfica soltó el contexto o algo falló. Centrado bajo
   la barra de vista y por encima de las etiquetas, que no deben taparlo. El
   `[hidden]` va explícito porque el `display:flex` de aquí le gana al del
   navegador y el aviso no se escondería nunca. */
#vpnote{position:absolute;top:48px;left:50%;transform:translateX(-50%);z-index:5;
  max-width:min(560px,calc(100% - 32px));display:flex;gap:8px;align-items:flex-start;
  background:var(--floatbg);border:1px solid var(--warnBd);color:var(--warnTxt);
  border-radius:4px;padding:6px 8px;font-size:11px;line-height:1.4;backdrop-filter:blur(6px)}
#vpnote[hidden]{display:none}
/* indicador de ejes: esquina inferior derecha, libre (#hint va abajo a la
   izquierda y #vplegend arriba a la derecha) */
#gizmo{position:absolute;bottom:8px;right:8px;width:68px;height:68px;
  pointer-events:none;opacity:.92}
/* tirador para ensanchar el panel derecho */
#rtgrip{position:absolute;top:0;bottom:0;right:-3px;width:7px;z-index:12;
  cursor:col-resize;background:transparent}
#rtgrip:hover,#rtgrip.drag{background:var(--grip)}

/* ---------- ribbon (signature) ---------- */
#rb{border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  background:var(--panel);position:relative;min-height:0;overflow:hidden}
#rbc{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer}
#rbtitle{position:absolute;top:6px;left:10px;font-family:var(--sans);font-size:9px;
  font-weight:600;letter-spacing:.15em;color:var(--dim2);pointer-events:none;text-transform:uppercase}

/* tirador para subir y bajar la tabla de abajo. Va en el borde superior de la
   cinta: se arrastra el bloque entero (cinta + tabla). */
#btgrip{position:absolute;top:-3px;left:0;right:0;height:7px;z-index:12;
  cursor:row-resize;background:transparent}
#btgrip:hover,#btgrip.drag{background:var(--grip)}

/* ---------- bloque de abajo: pestañas + tabla a todo el ancho ---------- */
#bt{display:flex;flex-direction:column;background:var(--panel);min-height:0;
  overflow:hidden;border-top:1px solid var(--line)}
#panes{flex:1;min-height:0;overflow:auto}

/* ---------- tabs ---------- */
#tabs{display:flex;border-bottom:1px solid var(--line);background:var(--panel2);position:sticky;top:0;z-index:5}
#tabs button{background:none;border:0;border-bottom:2px solid transparent;
  padding:9px 18px;cursor:pointer;color:var(--dim);font-family:var(--sans);font-size:10px;
  font-weight:600;letter-spacing:.11em;text-transform:uppercase}
#tabs button.on{color:var(--txt);border-bottom-color:var(--nominal);background:var(--panel3)}
.pane{display:none}.pane.on{display:block}

/* ---------- forms ---------- */
/* Sin flechas nativas: robaban ancho y tapaban las cifras.
   Sustitutos: teclas Flecha arriba/abajo y rueda del ratón sobre el campo
   enfocado (ver el manejador `wheel` en bind()).                          */
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

/* Un par etiqueta/campo NO crece con la pantalla. En una banda de 1600 px, un
   solo par estirado dejaba la etiqueta pegada al borde izquierdo y su campo al
   derecho con un metro de vacío en medio; lo que se quiere ahí son varios
   pares por renglón. `auto-fit` los reparte y `max-width` impide que el
   último superviviente se estire. */
.fgrid{display:grid;grid-template-columns:1fr 112px;gap:6px 10px;align-items:center;padding:2px 0;
  max-width:460px}
.fgrid label{font-size:11.5px;color:var(--dim)}
.fgrid.w3{grid-template-columns:1fr 72px 72px}
/* dos pares etiqueta/campo por renglón: la cabecera del modelo tiene que caber
   en una banda baja, o empuja la tabla fuera de la pantalla */
.fgrid.pair{grid-template-columns:auto 82px auto 82px;gap:5px 10px;max-width:none}
/* La tira de ajustes de COMPENSAR va a todo el ancho, pero repartida en
   columnas de ancho fijo en vez de un par estirado por renglón. */
#app.m-comp #panes .grp .body{display:flex;flex-wrap:wrap;gap:6px 28px;align-items:flex-start}
#app.m-comp #panes .grp .body > *{flex:0 1 auto}
#app.m-comp #panes .grp .body > .tw{flex:1 1 100%}
#app.m-comp #panes .grp .body > .hintline{flex:1 1 100%}
/* un botón de acción no tiene por qué medir 1460 px */
#panes .row .btn.grow{max-width:420px}
/* ni una celda de compensación 700 px: la tabla crece con las columnas que
   estén activas y para de crecer cuando ya caben todas */
#app.m-comp #panes table.cmd{max-width:1150px}
.mhead{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;padding-top:8px}
.mhead .eyebrow{padding:0 0 5px}
.mcol{min-width:210px}
.mcol.nm{flex:1;min-width:220px;max-width:420px}
input[type=text],input[type=number],select{background:var(--inputbg);border:1px solid var(--line2);
  border-radius:3px;padding:6px 8px;width:100%;font-size:12.5px;line-height:1.2;
  font-variant-numeric:tabular-nums}
input[type=number]{text-align:right}
input:hover,select:hover{border-color:var(--inputHovBd)}
input:focus,select:focus{border-color:var(--nominal);outline:0;
  box-shadow:0 0 0 2px var(--ring);background:var(--inputbg2)}
input[type=range]{width:100%;accent-color:var(--nominal);height:16px}
.rangerow{display:grid;grid-template-columns:1fr 62px;gap:8px;align-items:center}
.rangerow .val{text-align:right;color:var(--nominal);font-variant-numeric:tabular-nums}
/* La guía de cada pestaña. Estaba a 10 px en --dim2, el texto más pequeño de la
   pantalla, y ahí vive la explicación de lo que dicen las tablas. */
.hintline{font-size:11.5px;color:var(--dim);line-height:1.5;padding:4px 0 2px}
/* El estado VACÍO no es una nota al pie: sin nada puesto es lo único que dice
   qué hacer, así que va con el color del texto y no con el de la ayuda. */
.emptynote{font-size:12px;color:var(--txt);line-height:1.5;padding:8px 0 4px}
/* La unidad de un encabezado. Los encabezados van en mayúsculas, y «(MM)» ya
   no se lee como milímetros. */
th .u{text-transform:none;letter-spacing:0;font-weight:500}

/* ---------- tables ---------- */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:4px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{background:var(--panel3);font-family:var(--sans);font-size:9px;font-weight:600;
  letter-spacing:.09em;text-transform:uppercase;color:var(--dim);padding:6px 5px;
  text-align:right;white-space:nowrap;position:sticky;top:0}
th:first-child,td:first-child{text-align:left}
td{padding:2px 4px;text-align:right;border-top:1px solid var(--line);white-space:nowrap;font-size:12px}
tbody tr:hover{background:var(--panel2)}
tbody tr.sel{background:var(--sel)}
tbody tr.clk{cursor:pointer}
/* El ancho de una celda editable se mide en DÍGITOS: box-sizing es border-box,
   así que del min-width hay que descontar los 12 px de padding. Con la mono a
   12.5 px un dígito son ~7 px, y de ahí salen los números de abajo. */
td input{padding:5px 6px;font-size:12.5px;border-color:transparent;background:transparent;
  min-width:59px}
/* la tabla de comandos aprieta dos dígitos más: sus celdas llevan cifras más
   cortas (un Δ, no una longitud de tres enteros y tres decimales) */
table.cmd td input{min-width:52px}
td input:hover{border-color:var(--line2);background:var(--inputbg)}
td input:focus{border-color:var(--nominal);background:var(--inputbg);box-shadow:0 0 0 2px var(--ring)}
/* la tabla LRA no se comprime: si no cabe, el contenedor .tw desplaza en X
   y el panel derecho se puede ensanchar arrastrando #rtgrip.              */
table.lra{min-width:910px}
/* las dos últimas son de leer, no de teclear: sitio propio para que Σ L no
   quede pegada al borde ni bajo la barra de desplazamiento */
table.lra th:nth-child(n+12),table.lra td:nth-child(n+12){min-width:76px}
table.lra th:last-child,table.lra td:last-child{padding-right:12px}
tfoot tr.foot td{border-top:1px solid var(--line2);color:var(--dim);
  background:var(--panel3)}
tfoot tr.foot td:first-child{font-family:var(--sans);font-size:9px;letter-spacing:.09em;
  text-transform:uppercase}
/* el ancho de la tabla de comandos lo pone paneComp() según cuántos
   parámetros se estén corrigiendo: con uno solo tiene que caber sin desplazar,
   porque la celda de Δ aplicada es la única editable. */
table.marks{min-width:540px}
td.dcol input[type=text]{text-align:right}
.marks td:first-child{white-space:nowrap;display:flex;gap:5px;align-items:center}
.ori{display:inline-block;width:15px;text-align:center;border-radius:2px;font-size:9.5px;
  padding:0 3px;border:1px solid}
.ori.W{color:var(--oriW);border-color:var(--oriWbd)}
.ori.T{color:var(--oriT);border-color:var(--oriTbd)}
.v-ok{color:var(--ok)}.v-warn{color:var(--warn)}.v-bad{color:var(--bad)}
/* WCAG 1.4.1: fuera de tolerancia NO puede decirse solo con el color.
   Una de cada doce personas no distingue el rojo del verde, y estas tablas
   además se fotocopian y se imprimen en blanco y negro para llevarlas a la
   máquina. Un signo detrás de la cifra viaja por los tres canales.
   `!` = pasada de tolerancia, `!!` = más del doble. No es adorno: es la MISMA
   escala que `cls()`, que ya reparte en tres. */
.v-warn::after,.v-bad::after{content:'!';font-weight:700;font-size:.82em;
  margin-left:3px;vertical-align:.08em}
.v-bad::after{content:'!!'}
/* El sello de versión usa v-bad para decir «compilado sobre cambios sin
   confirmar». Eso no es una tolerancia y el signo ahí sobra: el texto ya dice
   «+sucio». */
#st .ver::after{content:none}
/* Un <input> no admite ::after —los elementos reemplazados no tienen caja de
   contenido donde ponerlo— así que la recta por debajo del mínimo se marca con
   el TRAZO del borde, que es el otro canal que no es color. */
input.v-bad,input.v-warn{border-style:dashed}
.v-dim{color:var(--dim2)}
/* «n/d» no es una cifra fuera de tolerancia: es la AUSENCIA de cifra, y hay
   sitios donde el modelo no puede dar ninguna. Va en el color del aviso para
   que nadie la lea como un dato, pero sin el `!` de v-warn, que promete un
   umbral rebasado que aquí no existe. El texto ya viaja por los tres canales:
   dice «n/d» y no un número. */
.v-nd{color:var(--warn)}
.chip{display:inline-block;padding:0 5px;border-radius:8px;font-size:10px;border:1px solid}
.chip.ok{color:var(--ok);border-color:#2C6B4C;background:#3FD68C14}
.chip.bad{color:var(--bad);border-color:#7A2C36;background:#FF4D5E14}
/* Un chip que ES un botón —el del amarre en la barra de estado—: sin el aspecto
   de botón del navegador, pero con cursor de enlace, porque lleva a alguna
   parte y eso tiene que notarse antes de pulsarlo. */
button.chip{font:inherit;font-size:10px;color:inherit;background:none;cursor:pointer}

/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:7px 9px}
.stat .k{font-family:var(--sans);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim2)}
.stat .v{font-size:16px;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .u{font-size:10px;color:var(--dim);margin-left:2px}

/* status */
#st{display:flex;align-items:center;gap:0;background:var(--panel2);
  border-top:1px solid var(--line);font-size:10.5px;color:var(--dim);overflow:hidden}
#st .c{padding:0 11px;border-right:1px solid var(--line);white-space:nowrap;
  height:100%;display:flex;align-items:center;gap:5px}
#st b{font-weight:400;color:var(--txt);font-variant-numeric:tabular-nums}
/* El sello de compilación se empuja al extremo y no roba atención, pero tiene
   que estar SIEMPRE visible: es lo único que distingue la copia del taller de
   la publicada cuando alguien reporta un número raro. */
#st .ver{margin-left:auto;border-right:0;border-left:1px solid var(--line)}
#st .ver b{color:var(--dim)}
#st .ver.v-bad b{color:var(--bad)}

.row{display:flex;gap:5px;align-items:center}
.row.wrap{flex-wrap:wrap}
.mt6{margin-top:6px}.mt10{margin-top:10px}.mb6{margin-bottom:6px}
.grow{flex:1}
.divider{height:1px;background:var(--line);margin:9px 0}
/* El aviso es una SALVAGUARDA: si no se lee, no sirve. Estaba con tres
   literales fuera del sistema de tokens y en tema claro quedaba a ~1.7:1 sobre
   el panel, muy por debajo del 4.5:1 que pide WCAG 1.4.3. Ahora usa tokens
   propios, definidos en los dos temas como todo lo demás. */
.warnbox{border:1px solid var(--warnBd);background:var(--warnBg);border-radius:4px;padding:6px 8px;
  font-size:10.5px;color:var(--warnTxt);line-height:1.45}

@media (max-width:1180px){#app{grid-template-columns:206px 1fr 300px}}

/* ---------- modelos (variantes) ---------- */
.refbadge{font-family:var(--sans);font-size:8px;font-weight:700;letter-spacing:.12em;
  color:var(--nominal);border:1px solid var(--nominal);border-radius:2px;padding:0 3px;
  flex:none;opacity:.9}
/* Procedencia de una pieza. Una pieza inventada por el simulador y una medida
   se veían igual, y con eso se puede compensar contra números que no existen. */
.srcbadge{font-family:var(--sans);font-size:8px;font-weight:700;letter-spacing:.12em;
  border:1px solid currentColor;border-radius:2px;padding:0 3px;flex:none;opacity:.9;
  cursor:help}
.srcbadge.sim{color:var(--synthetic)}
.srcbadge.meas{color:var(--measured)}
.srcbadge.unk{color:var(--dim2)}

/* ---------- resorte medido ----------
   Una cifra sola no dice si vale: al lado van la dispersión y el n, y en
   ámbar el aviso de que el resorte depende del ángulo comandado. */
.sbrow{display:flex;align-items:baseline;gap:6px;padding:2px 0;
  font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums}
.sbrow .k{flex:1;color:var(--dim);font-family:var(--sans);font-size:10px;letter-spacing:.06em}
.sbrow .v{color:var(--txt);font-size:13px}
.sbrow .v .u{color:var(--dim);font-size:9px;margin-left:1px}
.sbrow .pm{color:var(--dim2);cursor:help}
.sbrow .n{color:var(--dim2);font-size:10px}
.sbrow .warn{flex-basis:100%;color:var(--warn);font-family:var(--sans);font-size:9.5px;cursor:help}
.linkbtn{background:none;border:0;color:var(--dim2);cursor:pointer;padding:3px 0 0;
  font-family:var(--sans);font-size:9.5px;letter-spacing:.06em;text-align:left;width:100%}
.linkbtn:hover{color:var(--nominal);text-decoration:underline}
.layer input[type=radio]{accent-color:var(--nominal);width:13px;height:13px;cursor:pointer}
.ds .meta b{font-variant-numeric:tabular-nums}

/* La columna Δ va PEGADA a su parámetro: la corrección se escribe al lado del
   dato sin perder el valor original. Fondo propio para que se lean como par. */
td.dcol,th.dcol{background:var(--dcolbg)}
td.dcol input{color:var(--corrected);min-width:56px}
td.dcol input.z{color:var(--dim2)}
/* Una celda que NO se entendió. El texto rechazado se queda a la vista en rojo
   en vez de esfumarse: antes volvía al valor de antes, que es lo mismo que se
   ve cuando el ajuste sí se acepta y no mueve nada. Va después de `.z` a
   propósito, misma especificidad, para ganar cuando la celda estaba en cero. */
td.dcol input.badcell,input.badcell{color:var(--bad);border-color:var(--bad)}
th.dcol{color:var(--corrected);opacity:.75}
tbody tr.hasd td:first-child{box-shadow:inset 2px 0 0 var(--corrected)}
.dv{color:var(--corrected)}
/* 12 columnas no caben en el panel: se desplaza en X dentro de .tw y el panel
   se puede ensanchar arrastrando #rtgrip. */


/* Un doblez SIN MEDIR no es un doblez que salió perfecto. La tabla los pintaba
   igual —«+0.000»— y esa es la lectura natural: «ese está bien». Se atenúan, se
   rayan en diagonal y el número se sustituye por un guion, que no se puede
   confundir con un cero. */
tr.nomeas td{opacity:.55}
tr.nomeas td:first-child{border-left:2px solid var(--dim2)}
td.nomeas{text-align:center;color:var(--dim2);font-weight:600}
</style>

re modelos, la cinta, los colores de los apoyos y dónde nacen los pedestales y pines sembrados. «Las dos» añade la libre en alambre como referencia. Lo único que no cambia es dónde se COLOCA la pieza ni dónde están los apoyos, que están atornillados a la mesa.",pinTilt:"Inclin.",pinTiltTip:"Cuánto se tumba el poste respecto de la vertical, en grados. 0 = a plomo. Un pin inclinado toca la barra en un punto distinto y con otra dirección: el contacto se resuelve entre los dos ejes en el espacio, no en planta.",pinYaw:"Rumbo",pinYawTip:"Hacia dónde se tumba, medido en planta desde +X. Sin inclinación no significa nada: un cilindro vertical girado sobre su propio eje es el mismo cilindro.",pinLen:"Largo",pinLenTip:"Lo que MIDE el poste desde su base, en milímetros. No es a qué altura está puesto: uno que se queda corto no llega a la barra y no sujeta de lado por bien colocado que esté, y uno demasiado largo acaba tocando también por donde no debe. Para subirlo sin alargarlo está la columna de al lado.",pinZ:"Altura",pinZTip:"A qué altura sobre la mesa ARRANCA la base del poste, en milímetros. 0 es el pin atornillado a la mesa, que es lo normal. Se levanta para llegar a una barra que pasa alta sin que el poste toque además por debajo, donde a lo mejor pasa otro tramo de la pieza. Lo que lo sostiene ahí arriba —un dado, un suplemento, el propio cuerpo del fixture— no se dibuja ni entra en la cuenta: esto dice dónde está el cilindro, no de qué cuelga.",pinDist:"Dist.",pinDistTip:"Distancia entre el eje del pin y el eje de la barra donde más se acercan, en el espacio. Con los pines a plomo coincide con la distancia en planta; inclinados, no.",pinSide:"Lado",pinSideAuto:"auto",pinSideTip:"De qué lado de la barra está MONTADO el pin. Es dato del fixture, no una lectura: si se lee de la forma de cada momento, en cuanto un ángulo manda la barra más allá del eje del poste la lectura sale invertida y el contacto se cierra por la cara equivocada — o sea, se resuelve una pieza que atravesó el pin. «auto» lo decide por la geometría la primera vez, que es lo que hacía antes.",pinState:"Estado",pinHolding:"sujetando",pinEmpty:"Sin pines. «Sembrar» reparte unos cuantos tocando de lado y alternando de lado, que es como se sujeta una barra de verdad: todos del mismo lado la dejarían girar sobre ellos.",addPin:"+ Pin",seedPin:"Sembrar pines",clearPin:"Quitar todos",pinNote:"Un pedestal sostiene; un pin IMPIDE. Los pines están atornillados a la mesa, así que no se mueven cuando la pieza se recoloca: lo que cambia es si siguen tocando. Un pin con hueco a favor no empuja nada y se ignora — no es un error, el fixture puede tener más pines de los que esta pieza usa.",pinOffNote:"Con el amarre apagado la barra se calcula libre en el espacio. Los pines se pueden colocar y ver en el 3D, pero no deforman nada.",pinNoneHold:"Ningún pin está tocando la barra, así que el amarre no cambia nada. Revisa la altura y la posición: la columna «Llega» dice cuáles no alcanzan la barra y «Hueco» a qué distancia se quedan.",pinHeldN:"{n} pin(es) sujetando",pinTip:"Punta",pinTipTip:"Cuánto se mueve el extremo libre por estar la barra sujeta, comparado con la misma pieza libre en el espacio. Es la consecuencia que se mide.",pinWorstKink:"Peor codo",pinStress:"Esfuerzo",pinOfYield:"del límite",pinYield:"En algún punto la barra pasa del límite elástico: al soltarla NO vuelve, y la pieza que sale no es la que dice el modelo. Con el material sin confirmar esto es un aviso, no una medida — pero el sitio donde ocurre sí es real.",pinYieldTip:"Tensión de flexión en la fibra más alejada, comparada con el límite elástico del material. Por encima del 100 % la deformación deja de ser recuperable.",pinOpen:"{n} contacto(s) sin cerrar",pinOpenTip:"El solver no pudo llevar la barra a tocar estos pines. Suele significar un fixture imposible: dos pines que piden la barra en dos sitios a la vez, o uno metido tan adentro que la pieza tendría que romperse para llegar.",pinKink:"Codo °",pinCurv:"Curvatura °/m",pinSigma:"σ MPa",matRho:"Densidad",matRhoTip:"Peso del material por metro cúbico. Solo la usa la flecha por gravedad: es lo que hace que la barra se cuelgue entre apoyos. Provisional como el resto del material.",sag:"Flecha",sagTip:"Cuánto se cuelga la barra por su propio peso en el tramo que ACABA en este pedestal, en milímetros. El voladizo de cada punta cuenta como ménsula y es donde más se nota: la longitud va a la cuarta potencia. La orientación manda más que el vano — de plano se cuelga (ancho/espesor)² veces más que de canto, que con 40×12 son once veces.",sagNote:"La flecha se calcula tramo a tramo como viga biapoyada, y los voladizos como ménsula. Una viga continua sobre varios apoyos es MÁS rígida que eso, así que este número sobreestima: es el lado seguro. Cada tramo se trata como recto — los dobleces dentro de un vano no rigidizan aquí. Cuando llegue el escaneo de una barra recta certificada montada en el fixture, esto se contrasta contra la flecha medida y deja de ser una estimación.",sagBad:"La flecha por gravedad pasa de la tolerancia de punto. Eso entra en la medición como un error que NO es de doblado: el lazo intentará corregirlo y no podrá. Añade un apoyo en el tramo peor, o acorta el voladizo.",sagNoMat:"Flecha: falta el material",sagNoMatTip:"Sin densidad y sin módulo elástico no hay número que dar. Se rellenan en la pestaña Amarre.",matE:"Módulo E",matYield:"Límite elástico",matTip:"Solo hace falta para pasar de deformación a esfuerzo. La FORMA que toma la barra sujeta no depende de E: con sección constante se cancela en el reparto, y hay una prueba de que cambiarlo no mueve un solo punto.",matProv:"Material PROVISIONAL: son valores de manual de un 6061-T6, no los de la colada que está en el taller. Sirven para ver dónde se concentra el esfuerzo; para afirmar «esta pieza se pasa por 12 MPa» hace falta el certificado del material.",load:"La carga",loadOn:"La pieza pesa",loadOnTip:"Con esto puesto la barra deja de quedarse donde la deja la tabla: se cae hacia donde tira la carga, se apoya en los pedestales y aprieta contra los pines que le queden en el camino. Un apoyo EMPUJA pero no TIRA, así que si un doblez separa la pieza de un pin, se separa; y si la gravedad la devuelve a él, vuelve.",loadG:"Gravedad (×g)",loadGTip:"Múltiplo del peso propio. 1 es el peso de verdad; 0 lo quita y deja solo el empuje de la punta; 2 sirve para ver qué se movería si la pieza pesara el doble.",loadDir:"Dirección",loadDirTip:"Hacia dónde tira la carga. (0, 0, −1) es hacia abajo, que es lo que hace la gravedad. Apuntando a otro lado se empuja la pieza contra un amarre concreto, para ver si ese amarre la aguanta.",loadTipF:"Empuje en la punta",loadTipTip:"Una fuerza más, en el extremo libre y en la misma dirección. Es el dedo con el que uno prueba si la pieza se mueve, puesto donde más se nota.",loadWeight:"Peso",loadWeightTip:"Lo que pesa la pieza entera, más el empuje de la punta. Sale de la densidad y de la sección: una barra de 1.7 m de 40×12 son unos 22 N, o sea 2.2 kg.",loadCarried:"Los apoyos llevan",loadCarriedTip:"Cuánto de ese peso se reparte entre pedestales y pines: la suma de las reacciones, proyectada contra la carga.",loadRoot:"La mordaza aguanta",loadRootTip:"Lo que no llevan los apoyos se queda en el primer extremo, que es por donde la pieza está agarrada. Es el número que contesta «¿me hacen falta más pedestales?». Negativo quiere decir que la mordaza tira hacia ABAJO: los apoyos llevan más que la pieza entera porque la barra hace palanca sobre alguno.",loadRootDown:"La mordaza tira de la pieza hacia ABAJO con {n} N: la barra hace palanca sobre un pedestal y los apoyos llevan más que la pieza entera. Con la mordaza que tiene el fixture es un resultado posible, pero dice que sin ella el primer extremo se levantaría: comprueba que la mordaza aprieta y no solo apoya.",loadDrop:"Se movió",loadDropTip:"Cuánto se ha desplazado el punto que más, medido contra la pieza libre. Incluye lo que hacen los pines Y lo que hace la carga: para separarlas, quita la carga y mira el mismo número.",loadPene:"Se hunde",loadPeneTip:"Cuánto se mete un apoyo dentro de la barra. El contacto se modela con un muelle muy duro, así que esto tiene que salir en micras; si llega a la tolerancia, el muelle se quedó corto y las reacciones de al lado hay que mirarlas con recelo.",loadN:"Reacción",loadNTip:"Con cuánta fuerza empuja ese apoyo, en newton. Un guion quiere decir que la pieza no lo está tocando, que es una respuesta y no un fallo. «n/d» quiere decir otra cosa muy distinta: que ahí el modelo no puede decir nada.",loadNd:"n/d",glLost:"La tarjeta gráfica ha soltado el 3D (suspensión, cambio de pantalla o controlador). Los datos y las tablas siguen bien. El 3D vuelve solo si el navegador lo recupera; si no vuelve, guarda el trabajo y recarga la página.",faultMsg:"Algo ha fallado ({e}). Lo que hay en pantalla puede no estar al día: guarda el trabajo y recarga la página.",faultClose:"Cerrar aviso",clashCard:"No cabe en el fixture: {n} se mete {d} mm",clashTip:"Con este modelo encima del fixture, ese apoyo queda DENTRO de la barra por muchos milímetros que la barra ceda. Pasa cuando la pieza es distinta de la que el fixture sujeta: un doblez unos grados distinto puede dejar la barra al otro lado de un pin, y ninguna deformación elástica la devuelve atravesándolo. La forma sujeta que se dibuja es la más cercana que el modelo encuentra, no una que se pueda montar. En el 3D hay un rombo rojo en cada apoyo que choca.",fixLoadOn:"Aquí la pieza pesa {w} N, y eso se enciende en la pestaña Amarre. La columna «Reacción» dice cuánto de ese peso lleva cada pedestal.",fixLoadOff:"Aquí la pieza no pesa. La flecha ya usa su peso propio, pero cuánto carga cada pedestal solo sale con «La pieza pesa» puesto, en la pestaña Amarre: entonces aparece la columna «Reacción».",colVis:"Visible en el 3D",xyTip:"Dónde está sobre la mesa, en milímetros. Es una medida del taller: no se mueve cuando la pieza se recoloca.",pedHTip:"Cuánto sube la cuna desde la mesa, en milímetros.",pedPadTip:"Largo de la cuna, en milímetros. Con una cuna larga, medio grado de inclinación de más ya levanta la barra.",pedTiltTip:"Con qué inclinación está puesta la cuna, en grados. Positiva si sube, con el mismo criterio que «Pide».",pedWantTip:"La inclinación que tiene la barra justo encima del pedestal, en grados. Positiva si sube.",pedD:"Δ",pedDTip:"Lo que le sobra o le falta a la cuna: su inclinación menos la que pide la barra, en grados. Se pinta en rojo cuando eso levanta la barra en la punta de la cuna más que la tolerancia de punto; la ayuda de cada celda dice cuántos milímetros.",pedSTip:"Dónde toca, medido a lo largo de la barra desde el primer extremo, en milímetros.",pedPlanTip:"Distancia en planta del pie al eje de la barra, en milímetros. Dice si el pedestal está debajo de la barra o al lado.",pedGapTip:"Aire entre la cuna y la cara de abajo de la barra, en milímetros. Positivo: la barra vuela y no apoya. Negativo: el pedestal estorba y levantaría la pieza.",pedSpanTip:"Distancia al pedestal anterior a lo largo de la barra, en milímetros. Es lo que decide la flecha por gravedad.",pinDiaTip:"Diámetro del poste, en milímetros.",pinGapTip:"Aire entre el poste y la barra donde más se acercan, en milímetros. Positivo: la barra no llega al pin. Negativo: el pin está metido donde iría la barra y la empuja.",pinStateTip:"Si el amarre está usando este pin ahora mismo para sujetar la barra.",stHold:"Sujeta por los pines",stLoad:"La pieza pesa",stHoldLoad:"Sujeta y pesando",stHoldGo:"Clic: abre la pestaña Amarre, que es donde están los dos interruptores.",loadNdTip:"Aquí no se puede dar un número. Este apoyo cae en un tramo que el modelo no sabe doblar —las incógnitas son los codos de las estaciones— así que su hueco no cambia por mucho que la pieza ceda, y la reacción que saliera no querría decir nada. No es un cero: un cero significa que la pieza no lo está tocando.",loadNoDof:"La pieza no or",machRotAbs:"posición absoluta del eje",machRotTip:"El modelo guarda cuánto GIRA el eje en cada estación, porque la máquina lo sostiene entre dobleces. Hay controles que quieren en cambio la posición absoluta del eje. Las dos describen la misma pieza; elegir la equivocada dobla bien la primera estación y mal todas las demás.",machHead:"Con encabezado",machCrlf:"Fin de línea CRLF",machCrlfTip:"Muchos controles de máquina no leen un fin de línea de UNIX. Con esto el archivo termina cada línea como espera un control de Windows.",machTail:"Fila de la cola",machTailTip:"Una última fila con la recta de salida. Sin ella el archivo no dice cuánto material queda después del último doblez, y las columnas que no le corresponden salen vacías, no en cero: un cero en la columna del ángulo es un doblez de cero grados, o sea una instrucción.",machPrev:"Vista previa",machMore:"y {n} fila(s) más.",machExport:"Exportar comando",machDirty:"Hay un ajuste manual escrito y sin aplicar. El archivo lleva el comando guardado, no lo que muestra la tabla de compensación: aplica primero, o el ajuste no sale.",machNote:"El formato que lee la dobladora está pedido y no ha llegado, así que aquí no se adivina: se deja a la vista. Antes de mandar una barra, comprueba en la vista previa las unidades y los signos contra una pieza que ya conozcas — es lo único de este archivo que no se puede deshacer. El perfil viaja en el JSON de la pieza, así que un archivo de máquina de hace meses se puede volver a generar igual.",lims:"Límites",limWhat:"Umbral",limVal:"Valor",limDef:"Fábrica",limState:"Estado",limWait:"Espera",limTouched:"tocado",limFactory:"de fábrica",limProv:"provisional · {p}",limRead:"Al leer un dato medido",limLoop:"Guardas del lazo",limReset:"Volver a los de fábrica",limHitStraight:"Con este umbral, {n} recta(s) de esta pieza no caben.",limNote:"Estos números no mueven ningún PI: deciden qué se rechaza, de qué dato se desconfía y cuánto puede corregir el lazo de una vez. Viajan en el JSON "A pin pushes in the table plane. Letting the roll give as well as the angle usually spreads the deformation better, but it is two unknowns per station instead of one, and it is a physical decision, not a speed setting.",pinTol:"Contact",pinTolTip:"Below this distance the bar counts as touching the pin and there is nothing to close.",pinDamp:"Spread",pinDampTip:"Near 0 the deformation piles onto the most flexible station; raising it spreads the load over more stations. Same role as the loop gain: at full aggression it oscillates.",pinDia:"Ø",pinGap:"Gap",pinReach:"Reaches",pinReachTip:"Whether they meet along the BODY of the post or at one of its ends. A pin that falls below the bar never touches it, however well placed it is, and one raised above it lets the bar pass underneath: either way it holds nothing.",pinYes:"yes",pinNo:"no",pinHold:"Holds",pinHoldTip:"A pin can be mounted and still be left out of the count: switching it off keeps it visible in the 3D view without letting it act, which is how you find out which pin causes what.",pinMeasFree:"The FREE bar is being shown and measured while the restraint or the load is on: this table, the reference points, the PI points and seeding answer about the part that would exist with nothing holding it, not the one on the table. The reactions do not: they come from the held part and are still its own. Choose “Held” or “Both” under “Show”, in the Restraint tab, to read the bar that is there.",pinShow:"Show",pinShowFree:"Free",pinShowHeld:"Held",pinShowBoth:"Both",pinShowTip:"Which bar is shown and what EVERYTHING is measured against, for every model at once: the free one — the design, the part outside the fixture — or the one it actually takes held by the pins and hanging under its own weight. With “Held” or “Both”, the held one carries both tables, the reference points, the sag, the PI points and their labels, the offset between models, the ribbon, the support colours and where seeded pedestals and pins are born. “Both” adds the free one as a wireframe reference. The only things that do not change are where the part is PLACED and where the supports are: they are bolted to the table.",pinTilt:"Tilt",pinTiltTip:"How far the post leans from vertical, in degrees. 0 = plumb. A leaning pin touches the bar at a different point and from a different direction: the contact is solved between the two axes in space, not in plan.",pinYaw:"Heading",pinYawTip:"Which way it leans, measured in plan from +X. Meaningless without tilt: a vertical cylinder spun about its own axis is the same cylinder.",pinLen:"Length",pinLenTip:"How long the post MEASURES from its base, in millimetres. Not how high it sits: one that falls short never reaches the bar and holds nothing sideways however well placed it is, and one too long ends up touching where it should not. To raise it without lengthening it, use the next column.",pinZ:"Height",pinZTip:"How high above the table the base of the post STARTS, in millimetres. 0 is the pin bolted to the table, which is the usual case. Raise it to reach a bar that runs high without the post also touching underneath, where another stretch of the part may pass. Whatever holds it up there — a block, a spacer, the body of the fixture — is neither drawn nor counted: this says where the cylinder is, not what it hangs from.",pinDist:"Dist.",pinDistTip:"Distance between the pin axis and the bar axis where they come closest, in space. With plumb pins it equals the plan distance; leaning, it does not.",pinSide:"Side",pinSideAuto:"auto",pinSideTip:'Which side of the bar the pin is MOUNTED on. Fixture data, not a reading: read off the current shape, the moment an angle sends the bar past the post the reading flips and the contact closes on the wrong face — that is, it solves a part that went through the pin. "auto" decides from the geometry the first time, which is what it did before.',pinState:"State",pinHolding:"holding",pinEmpty:'No pins. "Seed" lays a few along the bar touching from alternating sides, which is how a bar is really held: all on one side would let it pivot on them.',addPin:"+ Pin",seedPin:"Seed pins",clearPin:"Remove all",pinNote:"A pedestal supports; a pin PREVENTS. Pins are bolted to the table, so they do not move when the part is repositioned: what changes is whether they still touch. A pin with clearance to spare pushes nothing and is ignored — not an error, the fixture may carry more pins than this part uses.",pinOffNote:"With clamping off the bar is computed free in space. Pins can still be placed and seen in the 3D view, but they deform nothing.",pinNoneHold:'No pin is touching the bar, so clamping changes nothing. Check height and position: the "Reaches" column says which ones fall short of the bar and "Gap" how far away they stop.',pinHeldN:"{n} pin(s) holding",pinTip:"Tip",pinTipTip:"How far the free end moves because the bar is held, compared with the same part free in space. It is the consequence you can measure.",pinWorstKink:"Worst kink",pinStress:"Stress",pinOfYield:"of yield",pinYield:"Somewhere the bar goes past its elastic limit: released, it does NOT spring back, and the part that comes out is not the one the model describes. With the material unconfirmed this is a warning, not a measurement — but where it happens is real.",pinYieldTip:"Bending stress at the outermost fibre against the material yield strength. Past 100 % the deformation stops being recoverable.",pinOpen:"{n} contact(s) left open",pinOpenTip:"The solver could not bring the bar onto these pins. That usually means an impossible fixture: two pins asking for the bar in two places at once, or one set so deep the part would have to break to reach it.",pinKink:"Kink °",pinCurv:"Curvature °/m",pinSigma:"σ MPa",matRho:"Density",matRhoTip:"Weight of the material per cubic metre. Only the gravity sag uses it: it is what makes the bar hang between supports. Provisional like the rest of the material.",sag:"Sag",sagTip:"How far the bar hangs under its own weight on the span ENDING at this pedestal, in millimetres. The overhang at each end counts as a cantilever and is where it shows most: length goes to the fourth power. Orientation matters more than span — flat it hangs (width/thickness)² times more than on edge, which with 40×12 is eleven times.",sagNote:"Sag is computed span by span as a simply supported beam, with the overhangs as cantilevers. A continuous beam over several supports is STIFFER than that, so this number overestimates: it is the safe side. Each span is treated as straight — bends inside a span do not stiffen it here. Once a certified straight bar is scanned mounted in the fixture, this gets checked against the measured sag and stops being an estimate.",sagBad:"Gravity sag exceeds the point tolerance. That enters the measurement as an error that is NOT a bending error: the loop will try to correct it and cannot. Add a support on the worst span, or shorten the overhang.",sagNoMat:"Sag: material missing",sagNoMatTip:"Without density and elastic modulus there is no number to give. Both are filled in on the Clamping tab.",matE:"Modulus E",matYield:"Yield strength",matTip:"Only needed to turn deformation into stress. The SHAPE a held bar takes does not depend on E: with a constant section it cancels out of the split, and there is a test proving that changing it moves no point at all.",matProv:'Material is PROVISIONAL: handbook values for 6061-T6, not the heat sitting in the shop. Good enough to see where stress concentrates; to claim "this part is over by 12 MPa" you need the material certificate.',load:"The load",loadOn:"The part has weight",loadOnTip:"With this on the bar stops staying where the table leaves it: it falls the way the load pulls, rests on the pedestals and presses against whatever pins are in its way. A support PUSHES but never PULLS, so if a bend takes the part away from a pin, away it goes; and if gravity brings it back, back it comes.",loadG:"Gravity (×g)",loadGTip:"Multiple of the self weight. 1 is the real weight; 0 removes it and leaves only the tip push; 2 shows what would move if the part were twice as heavy.",loadDir:"Direction",loadDirTip:"Which way the load pulls. (0, 0, −1) is downwards, which is what gravity does. Pointing it elsewhere pushes the part against one particular clamp, to see whether that clamp holds it.",loadTipF:"Push at the tip",loadTipTip:"One more force, at the free end and along the same direction. It is the finger you poke the part with, placed where it shows most.",loadWeight:"Weight",loadWeightTip:"What the whole part weighs, plus the tip push. It comes from the density and the section: a 1.7 m bar of 40×12 is about 22 N, that is 2.2 kg.",loadCarried:"Supports carry",loadCarriedTip:"How much of that weight is shared between pedestals and pins: the sum of the reactions, projected against the load.",loadRoot:"The grip holds",loadRootTip:"Whatever the supports do not carry stays at the first end, which is where the part is gripped. This is the number that answers «do I need more pedestals?». Negative means the grip pulls DOWN: the supports carry more than the whole part because the bar levers over one of them.",loadRootDown:"The grip pulls the part DOWN with {n} N: the bar levers over a pedestal and the supports carry more than the whole part. With the grip the fixture has, that is a possible result, but it says the first end would lift without it: check that the grip clamps and does not just rest.",loadDrop:"Moved by",loadDropTip:"How far the worst point has travelled, measured against the free part. It includes what the pins do AND what the load does: to tell them apart, switch the load off and read the same number.",loadPene:"Sinks in",loadPeneTip:"How far a support sinks into the bar. Contact is modelled with a very stiff spring, so this should come out in microns; if it reaches the tolerance, the spring was too soft and the reactions next to it deserve suspicion.",loadN:"Reaction",loadNTip:'How hard that support is pushing, in newton. A dash means the part is not touching it, which is an answer and not a failure. "n/a" means something quite different: that the model cannot say anything there.',loadNd:"n/a",glLost:"The graphics card dropped the 3D view (sleep, display change or driver). Data and tables are fine. The 3D view comes back on its own if the browser recovers it; if it does not, save your work and reload the page.",faultMsg:"Something went wrong ({e}). What is on screen may be out of date: save your work and reload the page.",faultClose:"Close notice",clashCard:"Does not fit the fixture: {n} goes in {d} mm",clashTip:"With this model on the fixture, that support stays INSIDE the bar however much the bar gives. It happens when the part differs from the one the fixture holds: a bend a few degrees off can leave the bar on the far side of a pin, and no elastic deformation brings it back through. The held shape drawn is the closest one the model finds, not one that can be mounted. In the 3D view there is a red diamond at every support that clashes.",fixLoadOn:'Here the part weighs {w} N, and that is switched on in the Clamping tab. The "Reaction" column says how much of that weight each pedestal carries.',colVis:"Visible in 3D",xyTip:"Where it sits on the table, in millimetres. A shop measurement: it does not move when the part is repositioned.",pedHTip:"How high the saddle rises from the table, in millimetres.",pedPadTip:"Length of the saddle, in millimetres. On a long saddle, half a degree too much tilt already lifts the bar.",pedTiltTip:'The tilt the saddle is set at, in degrees. Positive if it rises, same convention as "Wants".',pedWantTip:"The tilt the bar has right above the pedestal, in degrees. Positive if it rises.",pedD:"Δ",pedDTip:"How much tilt the saddle has too much or too little: its tilt minus the one the bar wants, in degrees. Red when that lifts the bar at the end of the saddle by more than the point tolerance; the help on each cell gives the millimetres.", ing. This ends every line the way a Windows control expects.",machTail:"Tail row",machTailTip:"A last row carrying the exit straight. Without it the file never says how much stock is left after the final bend. Columns that do not apply to it come out empty rather than zero: a zero in the angle column is a zero-degree bend, which is an instruction.",machPrev:"Preview",machMore:"and {n} more row(s).",machExport:"Export command",machDirty:"A manual adjustment is typed but not applied. The file carries the stored command, not what the compensation table shows: apply first or the adjustment will not be in it.",machNote:"The format the bender reads has been requested and has not arrived, so nothing is guessed here: it is left in plain sight. Before sending a bar, check units and signs in the preview against a part you already know — it is the one thing in this file that cannot be undone. The profile travels inside the part JSON, so a machine file from months ago can be regenerated identically.",lims:"Limits",limWhat:"Threshold",limVal:"Value",limDef:"Factory",limState:"State",limWait:"Waiting on",limTouched:"changed",limFactory:"factory",limProv:"provisional · awaiting {p}",limRead:"When reading a measurement",limLoop:"Loop guards",limReset:"Back to factory values",limHitStraight:"At this threshold, {n} straight(s) on this part do not fit.",limNote:'These numbers move no PI: they decide what gets rejected, which reading is distrusted, and how much the loop may correct at once. They travel inside the part JSON, so a saved file states the thresholds it was judged by. "Provisional" means the value was picked while a requested figure is still missing: A.6 is the real scan repeatability (σ), B.2 the machine limit. A 0 turns that check off.',lim_axisMin:"Readable axis",lim_axisMinTip:"Smallest deflection at which a measured bend still has a readable AXIS. Below it the lateral direction is noise, so the axis is inherited from the previous bend instead of invented. The real rule is atan(3σ/feed). Applies only to MEASURED data; in a typed model a 0.2° bend is deliberate.",lim_piMin:"PI spacing",lim_piMinTip:"Smallest distance between two PI in an imported file. Closer points give a direction that is pure noise, hence an invented bend that also poisons the next row. The real rule is 5σ. Two coincident PI reject the whole file: it means the cloud extraction went wrong.",lim_scaleMin:"Minimum scale",lim_scaleMinTip:"Fraction of the nominal PI step below which the imported cloud cannot be the same part. NOT a tolerance: it catches an export whose columns are the DEVIATION rather than the coordinate, or metres read as millimetres. One-sided: a scan missing points has a LARGER mean step, and that is not a bad file.",lim_straightMin:"Minimum straight",lim_straightMinTip:"Straight between tangency points needed for the tooling to fit: clamp plus head travel. A MACHINE limit, not a scanner one. A negative straight is listed separately regardless: that is two tools in the same place.",lim_dead:"Dead band (angle)",lim_deadTip:"Below this difference against nominal the loop does not correct: it is measurement noise, and chasing it makes the part oscillate. 0 turns it off.",lim_deadFeed:"Dead band (feed)",lim_deadFeedTip:"Same as the angle dead band, in millimetres and on the feed.",lim_maxStep:"Per-cycle cap (angle)",lim_maxStepTip:"Largest correction the loop may apply at once. A bigger jump is not process drift: it is bad data or a bend that crossed branches. It is clipped and reported rather than sent to the machine. 0 removes the cap.",lim_maxStepFeed:"Per-cycle cap (feed)",lim_maxStepFeedTip:"Same as the angle cap, in millimetres and on the feed.",fabHead:"This part cannot be made as it stands:",fabNeg:"the straight feeding {b} is NEGATIVE: the tools would collide.",fabShort:"the straight feeding {b} falls short of the {n} mm the tooling needs.",fabTail:"the exit straight falls short of {n} mm.",fabOver:"{b} asks for more than {n}° of deflection: t istory:"History",undo:"Undo",redo:"Redo",histNote:"Undoes edits to the part: cells, points, models, reference points, placement and applied compensation. It does not undo the camera, theme, language, layers or mode. 50 steps.",soloTip:"Fold the table and the sidebar away to see the whole part (F key). On the way back, the table is where you left it.",expPts:"Export points",modeModel:"Model",modeMeas:"Measure",modeComp:"Compensate",modeModelTip:"Type the part: the whole table on the right and the model beside it.",modeMeasTip:"Look at the measured part: big model, tall ribbon and the statistics.",modeCompTip:"Shop-floor mode: only the compensation cells can be edited. Commands full width and the 3D as a check strip.",sbTrend:"depends on the angle (%s %/°, r=%r)",sbTrendTip:"Springback changes with the commanded angle, so a single constant does not describe the process. With this flag, fit per angle range instead of adopting one number.",srcSimTip:"Part invented by the simulator. Nothing was measured.",srcVerifyTip:"Simulated check after applying compensation. Not a measurement either.",srcMeasTip:"Imported measured part.",srcUnkTip:"Unknown origin: it comes from a file that did not record it.",anchor:"Fixed end",aStart:"Clamp (P0)",aEnd:"Free (tip)",aBest:"Best fit",insPt:"+ Midpoint",delPt:"✕ Point",ptNote:"ABSOLUTE editing: moving a point leaves the others where they are and the LRA chain is re-derived by inverse kinematics. A new point is born collinear (angle 0), ready to be moved. Editing points bakes the deltas into the base.",bake:"Bake Δ",zeroD:"Zero Δ",bakeAsk:`This model has unbaked deltas.

Accepted: a bare number (2), arithmetic on what you see (+2, -0.3, *1.1), arithmetic on what the loop computed (c+2), or an absolute with = (=-3).`,tweakOn:"manually adjusted",fixture:"Fixture",pedH:"Height",pedPad:"Saddle",pedTilt:"Tilt",pedWant:"Wants",pedS:"Touches",pedPlan:"Offset",pedGap:"Gap",pedSpan:"Span",pedWorst:"Longest span",pedOff:"the bar does not pass over it",pedOffN:"{n} unsupported",pedOffTip:"The foot sits farther from the bar axis than half the saddle plus half the section width: this pedestal holds nothing. Move X and Y until the bar passes over it.",pedLiftTip:"At this tilt the bar lifts {v} mm off the end of the saddle. Compared against the point tolerance.",addPed:"+ Pedestal",seedPed:"Seed {n}",clearPed:"Clear",fixEmpty:'No pedestals. "Seed" spreads a few under the part with the height and tilt it asks for at each place; from there they are corrected with the real fixture measurements.',fixNote:`The fixture is bolted to the table: X, Y, height and saddle belong to the shop and do not move when the part is repositioned. "Wants" is the tilt the bar has right above; Δ is the pedestal's excess, shown red when it lifts the bar more than the point tolerance. "Gap" is the air between saddle and underside: positive the bar floats, negative the pedestal is in the way. "Span" is the distance to the previous pedestal along the bar, which is what drives the gravity sag.`,sbFew:"trend: not enough parts",sbFewTip:"With fewer than %n parts there is no telling whether springback depends on the angle: a sample of pure noise trips the warning one time in three. The median above still holds; what is missing is the right to claim the dependence.",sbFlat:"trend: a single angle level",sbFlatTip:"The measured parts were bent at nearly the same angle, or a single one sits far from the rest and drives the line on its own. A slope is measured between two levels: at least %p parts on each side, %s° apart or more."};var Fg={sub:"Biegekompensation · Alpha",bNew:"Neues Modell",bOpen:"JSON öffnen",bSave:"JSON speichern",bRep:"Bericht",bDemo:"Demo laden",layers:"Ebenen",datasets:"Gemessene Teile",model:"Modell",meas:"Messung",thSys:"Systemfarbschema",thLight:"Helles Farbschema",thDark:"Dunkles Farbschema",comp:"Kompensation",points:"Punkte",lNom:"Nennstange",lVar:"Andere Modelle",lDiff:"Versatz zwischen Modellen",lMeas:"Gemessene Stange",lPred:"Korrigierte Vorhersage",lDev:"Abweichungsvektoren",lPts:"Schnittpunkte",lLbl:"Beschriftungen",lGrid:"Raster",lFix:"Auflageböcke",addSim:"Teil simulieren",del:"Löschen",view:"Ansicht",vIso:"ISO",vTop:"Draufsicht",vFront:"Vorderansicht",vSide:"Seitenansicht",vFit:"Einpassen",exag:"Überhöhung",cmode:"Farbe",cSolid:"Massiv",cDev:"Abweichung",legend:"Legende",devscale:"Punktabweichung",hint:"Ziehen: drehen · Rad: zoomen · Umschalt+Ziehen: verschieben",ribbon:"Abweichung der Gesamtauslenkung je Biegung über die Abwicklungslänge",vsRef:"Δ Auslenkung je Biegung gegenüber dem Referenzmodell",gripW:"Breite des rechten Bereichs",gripH:"Höhe der Tabelle",name:"Name",section:"Querschnitt",width:"Breite",thick:"Dicke",chamfer:"Fase",endlen:"Bearbeitetes Ende",tail:"Auslauf",tol:"Toleranzen",tolA:"Winkel",tolR:"Drehung",tolF:"Vorschub",tolP:"Punkt",bends:"Biegungen",addBend:"Biegung hinzufügen",nBend:"#",feed:"Vorschub",rot:"Rollung",ang:"Winkel",rad:"Radius",twist:"Torsion",twlen:"Torsionslänge",ori:"Or.",dcol:"Δ",straight:"Gerade",arcL:"L",cumL:"Σ L",tailRow:"Auslauf",lenNote:"Gerade = gerades Stück von Tangente zu Tangente, und die einzige Länge, die eingetippt wird. L = Bogenlänge, die die Biegung erzeugt (Radius × Auslenkung). Σ L = aufsummierte Abwicklungslänge auf der neutralen Faser: Gerade, Bogen, Gerade, Bogen. Ein geänderter Radius oder Winkel lässt die Geraden stehen; der Vorschub von Schnittpunkt zu Schnittpunkt wird darunter neu berechnet und ist das, was gespeichert und an die Maschine geschickt wird.",kbdNote:"Tastatur: Tab / ⇧Tab bewegen waagerecht · Enter und ↑ ↓ senkrecht · Esc verwirft die Zelle · Mausrad oder Strg+↑ ↓ ändern den Wert um einen Schritt. Beim Betreten einer Zelle wird ihr Wert markiert: Tippen ersetzt ihn. Bis zu drei Nachkommastellen werden angenommen.",twnote:"Torsionslänge = gerades Stück (mm), über das die Torsion verteilt wird, mittig auf der Geraden. 0 = die ganze Gerade. Kein Schnittpunkt wird verschoben: es wird nur festgelegt, wo die Torsion stattfindet.",proc:"Simulierter Prozess (virtuelles Teil)",sbW:"Rückfederung hochkant",sbT:"Rückfederung flach",slip:"Vorschubschlupf",biasR:"Drehversatz",noise:"Scan-Rauschen",seed:"Startwert",simulate:"Gemessenes Teil erzeugen",dNone:"Kein gemessenes Teil. Simulieren Sie eines oder importieren Sie ein CSV.",deltas:"Abweichungen je Biegung",dA:"Δ Winkel",dR:"Δ Rollung",dF:"Δ Vorschub",dP:"Abw. Spitze",statMaxA:"Max. Δ Auslenkung",statRms:"RMS Auslenkung",statTip:"Abweichung freies Ende",statOut:"Außer Toleranz",gains:"Korrekturverstärkungen",gainW:"Verstärkung hochkant",gainT:"Verstärkung flach",gainR:"Verstärkung Rollung",gainF:"Verstärkung Vorschub",gainNote:"Rollung und Vorschub haben eigene Verstärkungen, weil sie nicht dieselbe Größe sind wie die Biegung. »Hochkant« und »flach« sind Rückfederungskonstanten: wie weit sich der Stab beim Loslassen öffnet. Die Rollung hat keine Feder — sie wurde ganz korrigiert, also mit Verstärkung 1,0, genau das, was beim Winkel verboten ist, weil es mit dem Messrauschen schwingt — und den Vorschub verschiebt der Schlupf, ein anderes Phänomen.",what:"Was korrigieren",cAng:"Biegewinkel",cRot:"Rollung",cFeed:"Vorschübe",apply:"Kompensation anwenden",reset:"Befehle zurücksetzen",cmdTbl:"Maschinenbefehle",cNow:"Aktuell",cNew:"Neu",cDelta:"Δ",predict:"Erwarteter Restfehler",verify:"Prüfen (2. Teil fahren)",noMeas:"Für die Kompensation wird ein gemessenes Teil benötigt.",stLen:"Abwicklungslänge",stBends:"Biegungen",stDatum:"Bezug",stMax:"Max. Abw.",stUnits:"Einheiten",engine:"Rechenkern",stVer:"Version",stVerTip:"Laufender Build. Bei einer auffälligen Zahl mit angeben: Mit einer Kopie in der Werkstatt und einer veröffentlichten ist dies das Einzige, was sie unterscheidet. «+sucio» = auf nicht committeten Änderungen gebaut.",schemaAmbiguous:`Diese Datei ist barcomp/2.2 und gibt die verwendete Biegerichtung nicht an.
