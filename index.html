Nothing was loaded: what you had is still there. The line below is for whoever maintains the program.`,dStart:"Start end",dBest:"Global best fit",formula:"new command = current command + gain × (nominal − measured)",note:"The whole chain is regenerated after each correction: downstream carry-over is already in the model.",repTitle:"Inspection & compensation report",repDate:"Date",repPiece:"Part",ok:"In tolerance",bad:"Out of tolerance",piece:"Part",orW:"Hard way (across width)",orT:"Easy way (across thickness)",confirmNew:"Create a new empty model? Unsaved work will be lost.",pts:"Point",x:"X",y:"Y",z:"Z",variants:"Models",addVar:"+ Model",dupVar:"Duplicate",setRef:"Use as reference",isRef:"REF",srcSim:"SIM",srcVerify:"SIM ✓",srcMeas:"MEAS",srcUnk:"N/A",impCsv:"Import CSV",impTip:"Measured parts: one CSV per part, with the PIs in x,y,z columns. Several files can be picked at once.",csvBad:"These files did not carry at least three points with coordinates and were not imported:",csvComma:"decimals use a comma; they must use a period",csvCols:"{n} numeric columns per line: cannot tell which are x,y,z. Export only the coordinates, or index + coordinates",csvFew:"fewer than three points with coordinates",csvScale:"the points advance {n} mm on average and the model {m} mm: these are not coordinates of the bar. Usually a deviation column exported instead of the coordinate, or units that are not millimetres",csvNear:"points {i} sit less than {d} mm from the previous one: two PI on top of each other invent a bend. Check the point extraction",devRowTip:"Deviation of bend {b}. Enter selects it in the 3D view and the table; the arrows move up and down.",pins:"Clamping",lPins:"Pins",lHeld:"Clamped bar",pinOn:"Bar held by the pins",pinOnTip:"Off, the bar is free in space and the program behaves exactly as it did before pins existed. On, the part cannot go where the table sends it: it stays where the pins leave it and deforms to get there.",pinDoRot:"Roll gives as well",pinRotTip:"A pin pushes in the table plane. Letting the roll give as well as the angle usually spreads the deformation better, but it is two unknowns per station instead of one, and it is a physical decision, not a speed setting.",pinTol:"Contact",pinTolTip:"Below this distance the bar counts as touching the pin and there is nothing to close.",pinDamp:"Spread",pinDampTip:"Near 0 the deformation piles onto the most flexible station; raising it spreads the load over more stations. Same role as the loop gain: at full aggression it oscillates.",pinDia:"Ø",pinGap:"Gap",pinReach:"Reaches",pinReachTip:"Whether they meet along the BODY of the post or at one of its ends. A pin that falls below the bar never touches it, however well placed it is, and one raised above it lets the bar pass underneath: either way it holds nothing.",pinYes:"yes",pinNo:"no",pinHold:"Holds",pinHoldTip:"A pin can be mounted and still be left out of the count: switching it off keeps it visible in the 3D view without letting it act, which is how you find out which pin causes what.",pinRef:"Measure against",pinRefTip:"Which bar EVERYTHING that reads the shape of the part is measured against: the free one — the design, the part outside the fixture — or the one it actually takes held by the pins and hanging under its own weight. It moves both tables (fixture and restraint), the reference points, the sag, the support colours in the 3D view, where seeded pedestals and pins are born, and the figures on every model card. Both questions are legitimate: the free one says how the designs differ and where the part would sit with nothing holding it; the held one says what is happening on the table. The one thing it does not move is where the part is PLACED: that is always anchored against the free reference, because anchoring against the held one closes a loop and moving one pedestal walks the whole bar.",pinMeasFree:"Measuring against the FREE bar while the restraint or the load is on: this table, the reference points and seeding are answering about the part that would exist with nothing holding it, not about the one on the table. Reactions are not: they come out of the held part and stay its own. Pick «Held» under «Measure against», in the Restraint tab, to read the bar that is there.",pinShow:"Show",pinShowFree:"Free",pinShowHeld:"Held",pinShowBoth:"Both",pinShowTip:"Which bar gets drawn: the one the table describes (free in space), the one it actually settles into when the pins hold it, or both overlaid to watch them separate. Alone, a bar is drawn solid; with both on, the held one goes wireframe — two solids inside each other read as mud.",pinTilt:"Tilt",pinTiltTip:"How far the post leans from vertical, in degrees. 0 = plumb. A leaning pin touches the bar at a different point and from a different direction: the contact is solved between the two axes in space, not in plan.",pinYaw:"Heading",pinYawTip:"Which way it leans, measured in plan from +X. Meaningless without tilt: a vertical cylinder spun about its own axis is the same cylinder.",pinLen:"Length",pinLenTip:"How long the post MEASURES from its base, in millimetres. Not how high it sits: one that falls short never reaches the bar and holds nothing sideways however well placed it is, and one too long ends up touching where it should not. To raise it without lengthening it, use the next column.",pinZ:"Height",pinZTip:"How high above the table the base of the post STARTS, in millimetres. 0 is the pin bolted to the table, which is the usual case. Raise it to reach a bar that runs high without the post also touching underneath, where another stretch of the part may pass. Whatever holds it up there — a block, a spacer, the body of the fixture — is neither drawn nor counted: this says where the cylinder is, not what it hangs from.",pinDist:"Dist.",pinDistTip:"Distance between the pin axis and the bar axis where they come closest, in space. With plumb pins it equals the plan distance; leaning, it does not.",pinSide:"Side",pinSideAuto:"auto",pinSideTip:'Which side of the bar the pin is MOUNTED on. Fixture data, not a reading: read off the current shape, the moment an angle sends the bar past the post the reading flips and the contact closes on the wrong face — that is, it solves a part that went through the pin. "auto" decides from the geometry the first time, which is what it did before.',pinState:"State",pinHolding:"holding",pinEmpty:'No pins. "Seed" lays a few along the bar touching from alternating sides, which is how a bar is really held: all on one side would let it pivot on them.',addPin:"+ Pin",seedPin:"Seed pins",clearPin:"Remove all",pinNote:"A pedestal supports; a pin PREVENTS. Pins are bolted to the table, so they do not move when the part is repositioned: what changes is whether they still touch. A pin with clearance to spare pushes nothing and is ignored — not an error, the fixture may carry more pins than this part uses.",pinOffNote:"With clamping off the bar is computed free in space. Pins can still be placed and seen in the 3D view, but they deform nothing.",pinNoneHold:'No pin is touching the bar, so clamping changes nothing. Check height and position: the "Reaches" column says which ones fall short of the bar and "Gap" how far away they stop.',pinHeldN:"{n} pin(s) holding",pinTip:"Tip",pinTipTip:"How far the free end moves because the bar is held, compared with the same part free in space. It is the consequence you can measure.",pinWorstKink:"Worst kink",pinStress:"Stress",pinOfYield:"of yield",pinYield:"Somewhere the bar goes past its elastic limit: released, it does NOT spring back, and the part that comes out is not the one the model describes. With the material unconfirmed this is a warning, not a measurement — but where it happens is real.",pinYieldTip:"Bending stress at the outermost fibre against the material yield strength. Past 100 % the deformation stops being recoverable.",pinOpen:"{n} contact(s) left open",pinOpenTip:"The solver could not bring the bar onto these pins. That usually means an impossible fixture: two pins asking for the bar in two places at once, or one set so deep the part would have to break to reach it.",pinKink:"Kink °",pinCurv:"Curvature °/m",pinSigma:"σ MPa",matRho:"Density",matRhoTip:"Weight of the material per cubic metre. Only the gravity sag uses it: it is what makes the bar hang between supports. Provisional like the rest of the material.",sag:"Sag",sagTip:"How far the bar hangs under its own weight on the span ENDING at this pedestal, in millimetres. The overhang at each end counts as a cantilever and is where it shows most: length goes to the fourth power. Orientation matters more than span — flat it hangs (width/thickness)² times more than on edge, which with 40×12 is eleven times.",sagNote:"Sag is computed span by span as a simply supported beam, with the overhangs as cantilevers. A continuous beam over several supports is STIFFER than that, so this number overestimates: it is the safe side. Each span is treated as straight — bends inside a span do not stiffen it here. Once a certified straight bar is scanned mounted in the fixture, this gets checked against the measured sag and stops being an estimate.",sagBad:"Gravity sag exceeds the point tolerance. That enters the measurement as an error that is NOT a bending error: the loop will try to correct it and cannot. Add a support on the worst span, or shorten the overhang.",sagNoMat:"Sag: material missing",sagNoMatTip:"Without density and elastic modulus there is no number to give. Both are filled in on the Clamping tab.",matE:"Modulus E",matYield:"Yield strength",matTip:"Only needed to turn deformation into stress. The SHAPE a held bar takes does not depend on E: with a constant section it cancels out of the split, and there is a test proving that changing it moves no point at all.",matProv:'Material is PROVISIONAL: handbook values for 6061-T6, not the heat sitting in the shop. Good enough to see where stress concentrates; to claim "this part is over by 12 MPa" you need the material certificate.',load:"The load",loadOn:"The part has weight",loadOnTip:"With this on the bar stops staying where the table leaves it: it falls the way the load pulls, rests on the pedestals and presses against whatever pins are in its way. A support PUSHES but never PULLS, so if a bend takes the part away from a pin, away it goes; and if gravity brings it back, back it comes.",loadG:"Gravity (×g)",loadGTip:"Multiple of the self weight. 1 is the real weight; 0 removes it and leaves only the tip push; 2 shows what would move if the part were twice as heavy.",loadDir:"Direction",loadDirTip:"Which way the load pulls. (0, 0, −1) is downwards, which is what gravity does. Pointing it elsewhere pushes the part against one particular clamp, to see whether that clamp holds it.",loadTipF:"Push at the tip",loadTipTip:"One more force, at the free end and along the same direction. It is the finger you poke the part with, placed where it shows most.",loadWeight:"Weight",loadWeightTip:"What the whole part weighs, plus the tip push. It comes from the density and the section: a 1.7 m bar of 40×12 is about 22 N, that is 2.2 kg.",loadCarried:"Supports carry",loadCarriedTip:"How much of that weight is shared between pedestals and pins: the sum of the reactions, projected against the load.",loadRoot:"The grip holds",loadRootTip:"Whatever the supports do not carry stays at the first end, which is where the part is gripped. This is the number that answers «do I need more pedestals?».",loadDrop:"Moved by",loadDropTip:"How far the worst point has travelled, measured against the free part. It includes what the pins do AND what the load does: to tell them apart, switch the load off and read the same number.",loadPene:"Sinks in",loadPeneTip:"How far a support sinks into the bar. Contact is modelled with a very stiff spring, so this should come out in microns; if it reaches the tolerance, the spring was too soft and the reactions next to it deserve suspicion.",loadN:"Reaction",loadNTip:'How hard that support is pushing, in newton. A dash means the part is not touching it, which is an answer and not a failure. "n/a" means something quite different: that the model cannot say anything there.',loadNd:"n/a",clashCard:"Does not fit the fixture: {n} goes in {d} mm",clashTip:"With this model on the fixture, that support stays INSIDE the bar however much the bar gives. It happens when the part differs from the one the fixture holds: a bend a few degrees off can leave the bar on the far side of a pin, and no elastic deformation brings it back through. The held shape drawn is the closest one the model finds, not one that can be mounted. In the 3D view there is a red diamond at every support that clashes.",fixLoadOn:'Here the part weighs {w} N, and that is switched on in the Clamping tab. The "Reaction" column says how much of that weight each pedestal carries.',fixLoadOff:'Here the part has no weight. The sag already uses its own weight, but how much each pedestal carries only comes out with "The part has weight" on, in the Clamping tab: that is when the "Reaction" column appears.',stHold:"Held by the pins",stLoad:"The part has weight",stHoldLoad:"Held and weighted",stHoldGo:"Click: opens the Clamping tab, where both switches are.",loadNdTip:"No number can be given here. This support falls on a stretch the model cannot bend — the unknowns are the elbows at the stations — so its gap does not change however much the part gives, and any reaction printed there would mean nothing. It is not a zero: a zero means the part is not touching it.",loadNoDof:"The part has no stations, so this model cannot hang it: what it weighs is known, how that weight splits between the supports is not. For a straight bar the number that helps is the gravity sag, on the Fixture tab.",loadStuck:"Not solved",loadStuckTip:"The search for equilibrium stopped before reaching it: what is next to this is the last trial and not a solution. It usually happens when a support enters and leaves contact on every step, or when two supports fight over the same point.",loadStuckWarn:"The load did not reach equilibrium in {n} steps: the numbers below are the last trial and cannot be defended. Raise the damping, or move aside the support that sits right on the edge of touching.",loadNote:"The unknowns are the kinks at the STATIONS, so in this model a straight run does not sag in the middle: that part is given by the gravity sag, on the Fixture tab. The two look at different things in the same bar and do not add up. The stiffness of a station is taken as EI/L, which for a cantilever is some four times softer than the exact one: this gives the order and the direction, not a certified deflection.",loadNoMat:"Without density and without an elastic modulus there is no load to apply. Both are filled in just above, in the material.",loadHang:"The supports carry less than half the weight: the part is hanging from its own end. What you are looking at is a cantilever, not a mounted part; either pedestals are missing, or the ones there are not touching it.",mach:"Machine",machTitle:"Machine command",machCols:"Columns, in this order",machAxis:"Abs. axis",machSep:"Separator",machDec:"Decimals",machLen:"Lengths",machAng:"Angles",machSignA:"Angle sign",machSignR:"Roll sign",machSignTip:"Flips the sign in the FILE only. The kinematics are untouched: the same numbers still bend the same part on screen. It lives here because a machine may have its axis mounted the other way round, and that is fixed on write, not in the engine.",machRot:"Roll written as",machRotDelta:"turn from the previous station",machRotAbs:"absolute axis position",machRotTip:"The model stores how much the axis TURNS at each station, because the machine holds it between bends. Some controls want the absolute axis position instead. Both describe the same part; picking the wrong one bends the first station right and every later one wrong.",machHead:"With header",machCrlf:"CRLF line endings",machCrlfTip:"Many machine controls will not read a UNIX line ending. This ends every line the way a Windows control expects.",machTail:"Tail row",machTailTip:"A last row carrying the exit straight. Without it the file never says how much stock is left after the final bend. Columns that do not apply to it come out empty rather than zero: a zero in the angle column is a zero-degree bend, which is an instruction.",machPrev:"Preview",machMore:"and {n} more row(s).",machExport:"Export command",machDirty:"A manual adjustment is typed but not applied. The file carries the stored command, not what the compensation table shows: apply first or the adjustment will not be in it.",machNote:"The format the bender reads has been requested and has not arrived, so nothing is guessed here: it is left in plain sight. Before sending a bar, check units and signs in the preview against a part you already know — it is the one thing in this file that cannot be undone. The profile travels inside the part JSON, so a machine file from months ago can be regenerated identically.",lims:"Limits",limWhat:"Threshold",limVal:"Value",limDef:"Factory",limState:"State",limWait:"Waiting on",limTouched:"changed",limFactory:"factory",limProv:"provisional · awaiting {p}",limRead:"When reading a measurement",limLoop:"Loop guards",limReset:"Back to factory values",limHitStraight:"At this threshold, {n} straight(s) on this part do not fit.",limNote:'These numbers move no PI: they decide what gets rejected, which reading is distrusted, and how much the loop may correct at once. They travel inside the part JSON, so a saved file states the thresholds it was judged by. "Provisional" means the value was picked while a requested figure is still missing: A.6 is the real scan repeatability (σ), B.2 the machine limit. A 0 turns that check off.',lim_axisMin:"Readable axis",lim_axisMinTip:"Smallest deflection at which a measured bend still has a readable AXIS. Below it the lateral direction is noise, so the axis is inherited from the previous bend instead of invented. The real rule is atan(3σ/feed). Applies only to MEASURED data; in a typed model a 0.2° bend is deliberate.",lim_piMin:"PI spacing",lim_piMinTip:"Smallest distance between two PI in an imported file. Closer points give a direction that is pure noise, hence an invented bend that also poisons the next row. The real rule is 5σ. Two coincident PI reject the whole file: it means the cloud extraction went wrong.",lim_scaleMin:"Minimum scale",lim_scaleMinTip:"Fraction of the nominal PI step below which the imported cloud cannot be the same part. NOT a tolerance: it catches an export whose columns are the DEVIATION rather than the coordinate, or metres read as millimetres. One-sided: a scan missing points has a LARGER mean step, and that is not a bad file.",lim_straightMin:"Minimum straight",lim_straightMinTip:"Straight between tangency points needed for the tooling to fit: clamp plus head travel. A MACHINE limit, not a scanner one. A negative straight is listed separately regardless: that is two tools in the same place.",lim_dead:"Dead band (angle)",lim_deadTip:"Below this difference against nominal the loop does not correct: it is measurement noise, and chasing it makes the part oscillate. 0 turns it off.",lim_deadFeed:"Dead band (feed)",lim_deadFeedTip:"Same as the angle dead band, in millimetres and on the feed.",lim_maxStep:"Per-cycle cap (angle)",lim_maxStepTip:"Largest correction the loop may apply at once. A bigger jump is not process drift: it is bad data or a bend that crossed branches. It is clipped and reported rather than sent to the machine. 0 removes the cap.",lim_maxStepFeed:"Per-cycle cap (feed)",lim_maxStepFeedTip:"Same as the angle cap, in millimetres and on the feed.",fabHead:"This part cannot be made as it stands:",fabNeg:"the straight feeding {b} is NEGATIVE: the tools would collide.",fabShort:"the straight feeding {b} falls short of the {n} mm the tooling needs.",fabTail:"the exit straight falls short of {n} mm.",fabOver:"{b} asks for more than {n}° of deflection: the lengths on that row come out capped.",fileUnread:"the system would not read the file (was it moved, or is another program holding it open?)",csvShort:"These parts carry FEWER points than the model. The missing bends stay UNMEASURED and are not compensated:",compSim:"WARNING: {n} of the parts feeding this calculation are SIMULATED, not measured. What comes out of here does not describe any real bar.",compShort:"Only {a} of {b} bends are measured. The rest are marked with — and are NOT compensated.",rowNoMeas:"This bend is not measured: the part carried fewer points than the model. The command is left as is.",batchUse:"Use the median of the visible parts ·",batchTip:"With a single part the loop also corrects what was scatter in that part, and the next one can come out worse. With several, the median only lets through what repeats.",batchOn:"The loop reads the median of %n parts, not the last one.",batchHint:"More than one part is visible: tick the box so the loop reads the median.",spread:"±σ",spreadTip:"Angle scatter across the visible parts (scaled MAD). Large next to a large deviation means poor repeatability, not a mis-set bend.",sbMeas:"Measured springback",sbUse:"Use in the simulator",sbNote:"sb = 1 − measured angle / commanded angle, per orientation. Median ± robust σ over the bends of the visible parts; near-straight ones (<1°) are left out.",sbCircular:"Warning: %n of the visible parts are simulated. Estimating springback from an invented part returns what is already written below — that is a closed loop, not a measurement.",sbSpreadTip:"Scatter across bends and parts. If it is as large as the value itself, that springback is not measured: it is guessed.",mnFile:"File",mnModel:"Models",mnView:"View",mnPieces:"Parts",soloOn:"3D only",soloOff:"Back",rotAxisTip:"How much the bending axis turns at this station. It ends at %e°.",rotHeadTip:"Turn of the bending axis relative to the previous station. A 0 leaves the axis where it was: the process is sequential.",history:"History",undo:"Undo",redo:"Redo",histNote:"Undoes edits to the part: cells, points, models, reference points, placement and applied compensation. It does not undo the camera, theme, language, layers or mode. 50 steps.",soloTip:"Fold the table and the sidebar away to see the whole part (F key). On the way back, the table is where you left it.",expPts:"Export points",modeModel:"Model",modeMeas:"Measure",modeComp:"Compensate",modeModelTip:"Type the part: the whole table on the right and the model beside it.",modeMeasTip:"Look at the measured part: big model, tall ribbon and the statistics.",modeCompTip:"Shop-floor mode: only the compensation cells can be edited. Commands full width and the 3D as a check strip.",sbTrend:"depends on the angle (%s %/°, r=%r)",sbTrendTip:"Springback changes with the commanded angle, so a single constant does not describe the process. With this flag, fit per angle range instead of adopting one number.",srcSimTip:"Part invented by the simulator. Nothing was measured.",srcVerifyTip:"Simulated check after applying compensation. Not a measurement either.",srcMeasTip:"Imported measured part.",srcUnkTip:"Unknown origin: it comes from a file that did not record it.",anchor:"Fixed end",aStart:"Clamp (P0)",aEnd:"Free (tip)",aBest:"Best fit",insPt:"+ Midpoint",delPt:"✕ Point",ptNote:"ABSOLUTE editing: moving a point leaves the others where they are and the LRA chain is re-derived by inverse kinematics. A new point is born collinear (angle 0), ready to be moved. Editing points bakes the deltas into the base.",bake:"Bake Δ",zeroD:"Zero Δ",bakeAsk:`This model has unbaked deltas.

Es wurde nichts geladen: der bisherige Stand bleibt. Die Zeile unten ist für die Programmbetreuung.`,dStart:"Anfangsende",dBest:"Globale beste Anpassung",formula:"neuer Befehl = aktueller Befehl + Verstärkung × (Nennwert − Messwert)",note:"Nach jeder Korrektur wird die ganze Kette neu erzeugt: die Fortpflanzung zwischen den Biegungen steckt bereits im Modell.",repTitle:"Prüf- und Kompensationsbericht",repDate:"Datum",repPiece:"Teil",ok:"In Toleranz",bad:"Außer Toleranz",piece:"Teil",orW:"Hochkantbiegung (gegen die Breite)",orT:"Flachbiegung (gegen die Dicke)",confirmNew:"Ein neues leeres Modell anlegen? Nicht Gespeichertes geht verloren.",pts:"Punkt",x:"X",y:"Y",z:"Z",variants:"Modelle",addVar:"+ Modell",dupVar:"Duplizieren",setRef:"Als Referenz verwenden",isRef:"REF",srcSim:"SIM",srcVerify:"SIM ✓",srcMeas:"MESS",srcUnk:"K.A.",impCsv:"CSV importieren",impTip:"Gemessene Teile: eine CSV je Teil, mit den Schnittpunkten in den Spalten x,y,z. Es können mehrere Dateien auf einmal gewählt werden.",csvBad:"Diese Dateien enthielten keine drei Punkte mit Koordinaten und wurden nicht importiert:",csvComma:"Dezimaltrennzeichen ist ein Komma; es muss ein Punkt sein",csvCols:"{n} numerische Spalten je Zeile: x,y,z nicht erkennbar. Exportiere nur die Koordinaten oder Index + Koordinaten",csvFew:"weniger als drei Punkte mit Koordinaten",csvScale:"die Punkte schreiten im Mittel {n} mm fort, die des Modells {m} mm: das sind keine Koordinaten der Stange. Meist wurde eine Abweichungsspalte statt der Koordinate exportiert, oder die Einheit ist nicht Millimeter",csvNear:"die Punkte {i} liegen weniger als {d} mm vom vorherigen entfernt: zwei Schnittpunkte aufeinander erfinden eine Biegung. Punktextraktion prüfen",devRowTip:"Abweichung der Biegung {b}. Enter wählt sie in der 3D-Ansicht und in der Tabelle; die Pfeile gehen auf und ab.",pins:"Spannung",lPins:"Bolzen",lHeld:"Gespannte Stange",pinOn:"Stange von den Bolzen gehalten",pinOnTip:"Aus liegt die Stange frei im Raum und das Programm verhält sich genau wie vor der Einführung der Bolzen. Ein kann das Teil nicht dorthin, wohin die Tabelle es schickt: es bleibt, wo die Bolzen es lassen, und verformt sich, um dorthin zu kommen.",pinDoRot:"Rollung gibt ebenfalls nach",pinRotTip:"Ein Bolzen drückt in der Tischebene. Wenn neben dem Winkel auch die Rollung nachgibt, verteilt sich die Verformung meist besser, aber es sind zwei Unbekannte je Station statt einer — eine physikalische Entscheidung, keine Geschwindigkeitseinstellung.",pinTol:"Kontakt",pinTolTip:"Unterhalb dieses Abstands gilt die Stange als am Bolzen anliegend, es gibt nichts zu schließen.",pinDamp:"Verteilung",pinDampTip:"Nahe 0 sammelt sich die Verformung an der nachgiebigsten Station; höhere Werte verteilen sie auf mehr Stationen. Dieselbe Rolle wie die Reglerverstärkung: voll aufgedreht schwingt es.",pinDia:"Ø",pinGap:"Spalt",pinReach:"Erreicht",pinReachTip:"Ob sie sich am KÖRPER des Bolzens treffen oder an einem seiner Enden. Ein Bolzen unterhalb der Stange berührt sie nie, so gut er auch steht, und ein zu hoch angesetzter lässt sie darunter durch: in beiden Fällen hält er nichts.",pinYes:"ja",pinNo:"nein",pinHold:"Hält",pinHoldTip:"Ein Bolzen kann montiert sein und trotzdem außen vor bleiben: ausgeschaltet bleibt er in der 3D-Ansicht sichtbar, ohne zu wirken — so findet man heraus, welcher Bolzen was verursacht.",pinRef:"Messen gegen",pinRefTip:"Gegen welche Stange ALLES gemessen wird, was die Form des Teils liest: die freie — den Entwurf, das Teil außerhalb der Vorrichtung — oder die, die es unter den Bolzen und unter dem eigenen Gewicht tatsächlich annimmt. Es bewegt beide Tabellen (Vorrichtung und Spannung), die Messpunkte, die Durchbiegung, die Farbe der Auflagen in der 3D-Ansicht, wo gesäte Böcke und Bolzen entstehen, und die Werte auf jeder Modellkarte. Beide Fragen sind berechtigt: die freie sagt, wie sich die Entwürfe unterscheiden und wo das Teil ohne Halt läge; die gehaltene sagt, was auf dem Tisch geschieht. Nur eines bewegt es nicht: wo das Teil GESETZT wird. Das wird immer gegen die freie Referenz ausgerichtet, denn gegen die gehaltene schließt sich eine Schleife und ein verschobener Bock verschiebt die ganze Stange.",pinMeasFree:"Es wird gegen die FREIE Stange gemessen, obwohl Spannung oder Last eingeschaltet sind: diese Tabelle, die Messpunkte und das Säen antworten über das Teil, das es ohne jeden Halt gäbe, nicht über das auf dem Tisch. Die Reaktionen nicht: die stammen aus dem gehaltenen Teil und bleiben dessen eigene. Wähle «Gehalten» unter «Messen gegen» im Reiter Spannung, um die Stange zu lesen, die da ist.",pinShow:"Zeigen",pinShowFree:"Frei",pinShowHeld:"Gehalten",pinShowBoth:"Beide",pinShowTip:"Welche Stange gezeichnet wird: die der Tabelle (frei im Raum), die tatsächliche unter den Bolzen, oder beide übereinander, um sie auseinanderlaufen zu sehen. Allein wird eine Stange massiv gezeichnet; bei beiden geht die gehaltene ins Drahtgitter — zwei ineinander liegende Volumen sehen matschig aus.",pinTilt:"Neigung",pinTiltTip:"Wie weit der Bolzen aus der Senkrechten kippt, in Grad. 0 = lotrecht. Ein geneigter Bolzen berührt die Stange an anderer Stelle und aus anderer Richtung: der Kontakt wird zwischen beiden Achsen im Raum gelöst, nicht im Grundriss.",pinYaw:"Richtung",pinYawTip:"Wohin er kippt, im Grundriss ab +X gemessen. Ohne Neigung bedeutungslos: ein senkrechter Zylinder um die eigene Achse gedreht ist derselbe Zylinder.",pinLen:"Länge",pinLenTip:"Wie lang der Bolzen von seiner Basis aus MISST, in Millimetern. Nicht, wie hoch er sitzt: ein zu kurzer erreicht die Stange nie und hält seitlich nichts, so gut er auch steht, und ein zu langer berührt am Ende auch dort, wo er nicht soll. Zum Anheben ohne Verlängern dient die Spalte daneben.",pinZ:"Höhe",pinZTip:"In welcher Höhe über dem Tisch die Basis des Bolzens BEGINNT, in Millimetern. 0 ist der auf den Tisch geschraubte Bolzen, der Normalfall. Angehoben wird er, um eine hoch verlaufende Stange zu erreichen, ohne dass der Bolzen zusätzlich darunter berührt, wo vielleicht ein anderer Abschnitt des Teils vorbeiläuft. Was ihn dort oben hält — ein Klotz, eine Beilage, der Körper der Vorrichtung — wird weder gezeichnet noch gerechnet: das sagt, wo der Zylinder steht, nicht woran er hängt.",pinDist:"Abst.",pinDistTip:"Abstand zwischen Bolzenachse und Stangenachse an ihrer engsten Stelle, im Raum. Bei lotrechten Bolzen gleich dem Grundrissabstand, bei geneigten nicht.",pinSide:"Seite",pinSideAuto:"auto",pinSideTip:'Auf welcher Seite der Stange der Bolzen MONTIERT ist. Eine Angabe der Vorrichtung, keine Messung: liest man sie aus der aktuellen Form, kippt sie, sobald ein Winkel die Stange über die Bolzenachse hinaus schickt, und der Kontakt schließt an der falschen Fläche — es wird also ein Teil gerechnet, das durch den Bolzen ging. "auto" entscheidet beim ersten Mal aus der Geometrie, so wie es vorher war.',pinState:"Zustand",pinHolding:"hält",pinEmpty:'Keine Bolzen. "Säen" verteilt einige entlang der Stange, abwechselnd von beiden Seiten anliegend — so wird eine Stange wirklich gehalten: alle auf einer Seite ließen sie darauf schwenken.',addPin:"+ Bolzen",seedPin:"Bolzen säen",clearPin:"Alle entfernen",pinNote:"Ein Bock stützt; ein Bolzen VERHINDERT. Bolzen sind auf dem Tisch verschraubt und wandern nicht mit, wenn das Teil neu gesetzt wird: es ändert sich nur, ob sie noch anliegen. Ein Bolzen mit Luft drückt nichts und wird übergangen — kein Fehler, die Vorrichtung darf mehr Bolzen tragen, als dieses Teil braucht.",pinOffNote:"Bei ausgeschalteter Spannung wird die Stange frei im Raum gerechnet. Bolzen lassen sich setzen und ansehen, verformen aber nichts.",pinNoneHold:'Kein Bolzen berührt die Stange, die Spannung ändert also nichts. Prüfe Höhe und Lage: die Spalte "Erreicht" nennt die zu kurzen, "Spalt" den Abstand, in dem sie stehen bleiben.',pinHeldN:"{n} Bolzen halten",pinTip:"Spitze",pinTipTip:"Wie weit sich das freie Ende bewegt, weil die Stange gehalten wird, verglichen mit demselben Teil frei im Raum. Das ist die messbare Folge.",pinWorstKink:"Größter Knick",pinStress:"Spannung",pinOfYield:"der Streckgrenze",pinYield:"Irgendwo überschreitet die Stange die Elastizitätsgrenze: losgelassen federt sie NICHT zurück, und das Teil, das herauskommt, ist nicht das des Modells. Bei unbestätigtem Material ist das ein Hinweis, keine Messung — der Ort stimmt aber.",pinYieldTip:"Biegespannung in der äußersten Faser gegen die Streckgrenze des Materials. Über 100 % ist die Verformung nicht mehr rückgängig.",pinOpen:"{n} Kontakt(e) offen geblieben",pinOpenTip:"Der Löser konnte die Stange nicht an diese Bolzen bringen. Das heißt meist: unmögliche Vorrichtung — zwei Bolzen verlangen die Stange gleichzeitig an zwei Orten, oder einer steht so tief, dass das Teil brechen müsste.",pinKink:"Knick °",pinCurv:"Krümmung °/m",pinSigma:"σ MPa",matRho:"Dichte",matRhoTip:"Gewicht des Materials je Kubikmeter. Nur die Durchbiegung braucht sie: sie lässt die Stange zwischen den Auflagen durchhängen. Vorläufig wie das übrige Material.",sag:"Durchbiegung",sagTip:"Wie weit die Stange unter ihrem Eigengewicht in dem Feld durchhängt, das AN diesem Bock endet, in Millimetern. Der Überstand an jedem Ende zählt als Kragarm und fällt dort am stärksten aus: die Länge geht in der vierten Potenz ein. Die Lage wiegt schwerer als die Stützweite — flach hängt sie (Breite/Dicke)² mal stärker durch als hochkant, bei 40×12 also elfmal.",sagNote:"Die Durchbiegung wird feldweise als Einfeldträger gerechnet, die Überstände als Kragarme. Ein Durchlaufträger über mehrere Auflagen ist steifer, also überschätzt dieser Wert — die sichere Seite. Jedes Feld gilt als gerade; Biegungen innerhalb eines Feldes versteifen hier nicht. Sobald eine zertifiziert gerade Stange in der Vorrichtung gescannt ist, wird das gegen die gemessene Durchbiegung geprüft und ist keine Schätzung mehr.",sagBad:"Die Durchbiegung überschreitet die Punkttoleranz. Sie geht als Fehler in die Messung ein, der KEIN Biegefehler ist: der Regelkreis wird ihn korrigieren wollen und kann es nicht. Setze eine Auflage im schlechtesten Feld oder kürze den Überstand.",sagNoMat:"Durchbiegung: Material fehlt",sagNoMatTip:"Ohne Dichte und E-Modul gibt es keine Zahl. Beide stehen auf der Registerkarte Spannung.",matE:"E-Modul",matYield:"Streckgrenze",matTip:"Wird nur gebraucht, um Verformung in Spannung umzurechnen. Die FORM einer gehaltenen Stange hängt nicht von E ab: bei konstantem Querschnitt kürzt es sich aus der Verteilung heraus, und ein Test belegt, dass eine Änderung keinen Punkt verschiebt.",matProv:'Material VORLÄUFIG: Handbuchwerte für 6061-T6, nicht die der Charge in der Werkstatt. Gut genug, um zu sehen, wo sich Spannung sammelt; für "dieses Teil liegt 12 MPa darüber" braucht es das Werkszeugnis.',load:"Die Last",loadOn:"Das Teil hat Gewicht",loadOnTip:"Damit bleibt die Stange nicht mehr dort, wo die Tabelle sie lässt: sie fällt dorthin, wohin die Last zieht, legt sich auf die Böcke und drückt gegen die Stifte, die ihr im Weg stehen. Eine Auflage DRÜCKT, aber sie ZIEHT nicht: nimmt eine Biegung das Teil von einem Stift weg, dann geht es weg; und holt die Schwerkraft es zurück, dann kommt es zurück.",loadG:"Schwerkraft (×g)",loadGTip:"Vielfaches des Eigengewichts. 1 ist das echte Gewicht; 0 nimmt es weg und lässt nur den Druck an der Spitze; 2 zeigt, was sich bewegen würde, wäre das Teil doppelt so schwer.",loadDir:"Richtung",loadDirTip:"Wohin die Last zieht. (0, 0, −1) ist nach unten, also das, was die Schwerkraft tut. Zeigt sie woandershin, drückt sie das Teil gegen eine bestimmte Spannstelle, um zu sehen, ob diese hält.",loadTipF:"Druck an der Spitze",loadTipTip:"Eine weitere Kraft, am freien Ende und in derselben Richtung. Es ist der Finger, mit dem man prüft, ob sich das Teil bewegt, dort angesetzt, wo es am meisten ausmacht.",loadWeight:"Gewicht",loadWeightTip:"Was das ganze Teil wiegt, zuzüglich des Drucks an der Spitze. Es folgt aus Dichte und Querschnitt: eine 1,7 m lange Stange 40×12 sind rund 22 N, also 2,2 kg.",loadCarried:"Die Auflagen tragen",loadCarriedTip:"Wie viel von diesem Gewicht sich auf Böcke und Stifte verteilt: die Summe der Reaktionen, auf die Last projiziert.",loadRoot:"Die Spannzange hält",loadRootTip:"Was die Auflagen nicht tragen, bleibt am ersten Ende hängen, wo das Teil gegriffen ist. Das ist die Zahl, die beantwortet: «brauche ich mehr Böcke?».",loadDrop:"Bewegt um",loadDropTip:"Wie weit sich der ungünstigste Punkt verschoben hat, gemessen gegen das freie Teil. Enthält sowohl die Wirkung der Stifte ALS AUCH die der Last: um beides zu trennen, die Last abschalten und dieselbe Zahl lesen.",loadPene:"Dringt ein",loadPeneTip:"Wie tief eine Auflage in die Stange eindringt. Der Kontakt wird mit einer sehr steifen Feder abgebildet, das sollte also im Mikrometerbereich herauskommen; erreicht es die Toleranz, war die Feder zu weich und den Reaktionen daneben ist zu misstrauen.",loadN:"Reaktion",loadNTip:'Mit welcher Kraft diese Auflage drückt, in Newton. Ein Strich heißt, dass das Teil sie nicht berührt; eine Antwort, kein Fehler. „k. A." heißt etwas ganz anderes: dass das Modell dort nichts sagen kann.',loadNd:"k. A.",clashCard:"Passt nicht in die Vorrichtung: {n} dringt {d} mm ein",clashTip:"Mit diesem Modell auf der Vorrichtung bleibt diese Auflage INNERHALB des Stabs, egal wie weit der Stab nachgibt. Das passiert, wenn das Teil nicht das ist, das die Vorrichtung hält: eine um wenige Grad andere Biegung kann den Stab auf die andere Seite eines Stifts legen, und keine elastische Verformung bringt ihn hindurch zurück. Die gezeichnete gespannte Form ist die nächstliegende, die das Modell findet, keine montierbare. In der 3D-Ansicht sitzt an jeder kollidierenden Auflage eine rote Raute.",fixLoadOn:'Hier wiegt das Teil {w} N, eingeschaltet im Reiter Spannung. Die Spalte „Reaktion" sagt, wie viel dieses Gewichts jeder Bock trägt.',fixLoadOff:'Hier hat das Teil kein Gewicht. Die Durchbiegung nutzt schon sein Eigengewicht, aber wie viel jeder Bock trägt, ergibt sich erst mit „Das Teil hat Gewicht" im Reiter Spannung: dann erscheint die Spalte „Reaktion".',stHold:"Von den Bolzen gehalten",stLoad:"Das Teil hat Gewicht",stHoldLoad:"Gehalten und belastet",stHoldGo:"Klick: öffnet den Reiter Spannung, dort sind beide Schalter.",loadNdTip:"Hier lässt sich keine Zahl nennen. Diese Auflage liegt auf einem Abschnitt, den das Modell nicht biegen kann — die Unbekannten sind die Knicke an den Stationen — also ändert sich ihr Spalt nicht, wie sehr das Teil auch nachgibt, und eine dort ausgegebene Kraft würde nichts bedeuten. Es ist keine Null: eine Null heißt, dass das Teil sie nicht berührt.",loadNoDof:"Das Teil hat keine Stationen, also kann dieses Modell es nicht hängen lassen: was es wiegt, ist bekannt, wie sich das Gewicht auf die Auflagen verteilt, nicht. Bei einem geraden Stab hilft die Schwerkraft-Durchbiegung im Reiter Vorrichtung.",loadStuck:"Nicht gelöst",loadStuckTip:"Die Suche nach dem Gleichgewicht hielt an, bevor sie es erreichte: was daneben steht, ist der letzte Versuch und keine Lösung. Das passiert meist, wenn eine Auflage bei jedem Schritt in den Kontakt hinein- und wieder herausgeht, oder wenn zwei Auflagen um denselben Punkt streiten.",loadStuckWarn:"Die Last erreichte in {n} Schritten kein Gleichgewicht: die Zahlen unten sind der letzte Versuch und lassen sich nicht vertreten. Erhöhe die Dämpfung, oder rücke die Auflage beiseite, die genau an der Grenze zum Berühren steht.",loadNote:"Die Unbekannten sind die Knicke an den STATIONEN, also hängt in diesem Modell ein gerades Stück in der Mitte nicht durch: diesen Teil liefert die Durchbiegung auf der Registerkarte Vorrichtung. Beide betrachten Verschiedenes an derselben Stange und addieren sich nicht. Die Steifigkeit einer Station wird als EI/L angesetzt, für einen Kragarm rund viermal weicher als der exakte Wert: das ergibt Größenordnung und Richtung, keine belastbare Durchbiegung.",loadNoMat:"Ohne Dichte und ohne E-Modul gibt es keine Last zum Aufbringen. Beides wird gleich darüber beim Material eingetragen.",loadHang:"Die Auflagen tragen weniger als die Hälfte des Gewichts: das Teil hängt an seinem eigenen Ende. Zu sehen ist ein Kragarm, kein aufgelegtes Teil; entweder fehlen Böcke, oder die vorhandenen berühren es nicht.",mach:"Maschine",machTitle:"Maschinenbefehl",machCols:"Spalten, in dieser Reihenfolge",machAxis:"Abs. Achse",machSep:"Trennzeichen",machDec:"Dezimalstellen",machLen:"Längen",machAng:"Winkel",machSignA:"Vorzeichen Winkel",machSignR:"Vorzeichen Rollung",machSignTip:"Dreht das Vorzeichen NUR in der Datei um. Die Kinematik bleibt unangetastet: dieselben Zahlen biegen am Bildschirm weiterhin dasselbe Teil. Es steht hier, weil eine Maschine die Achse andersherum montiert haben kann, und das wird beim Schreiben korrigiert, nicht im Motor.",machRot:"Rollung geschrieben als",machRotDelta:"Drehung gegenüber der Vorstation",machRotAbs:"absolute Achslage",machRotTip:"Das Modell speichert, wie weit sich die Achse je Station DREHT, denn die Maschine hält sie zwischen den Biegungen. Manche Steuerungen wollen stattdessen die absolute Achslage. Beide beschreiben dasselbe Teil; die falsche Wahl biegt die erste Station richtig und jede weitere falsch.",machHead:"Mit Kopfzeile",machCrlf:"Zeilenende CRLF",machCrlfTip:"Viele Maschinensteuerungen lesen kein UNIX-Zeilenende. Damit endet jede Zeile so, wie es eine Windows-Steuerung erwartet.",machTail:"Zeile für das Endstück",machTailTip:"Eine letzte Zeile mit der Auslaufgeraden. Ohne sie sagt die Datei nicht, wie viel Material nach der letzten Biegung bleibt. Nicht zutreffende Spalten bleiben leer statt null: eine Null in der Winkelspalte ist eine Biegung von null Grad, also eine Anweisung.",machPrev:"Vorschau",machMore:"und {n} weitere Zeile(n).",machExport:"Befehl exportieren",machDirty:"Eine manuelle Korrektur ist eingetragen, aber nicht übernommen. Die Datei enthält den gespeicherten Befehl, nicht das, was die Kompensationstabelle zeigt: erst übernehmen, sonst fehlt die Korrektur.",machNote:"Das Format, das die Biegemaschine liest, ist angefordert und noch nicht eingetroffen, also wird hier nichts geraten: es liegt offen. Prüfe vor der ersten Stange in der Vorschau Einheiten und Vorzeichen gegen ein bekanntes Teil — das ist das Einzige an dieser Datei, was sich nicht rückgängig machen lässt. Das Profil reist im JSON des Teils mit, also lässt sich eine Maschinendatei von vor Monaten identisch neu erzeugen.",lims:"Grenzwerte",limWhat:"Schwelle",limVal:"Wert",limDef:"Werk",limState:"Zustand",limWait:"Wartet auf",limTouched:"geändert",limFactory:"Werkswert",limProv:"vorläufig · {p}",limRead:"Beim Einlesen einer Messung",limLoop:"Schutz des Regelkreises",limReset:"Zurück auf Werkswerte",limHitStraight:"Mit dieser Schwelle passen {n} Gerade(n) dieses Teils nicht.",limNote:'Diese Zahlen verschieben keinen PI: sie entscheiden, was abgelehnt wird, welchem Messwert misstraut wird und wie viel der Regelkreis auf einmal korrigieren darf. Sie reisen im JSON des Teils mit, also nennt eine gespeicherte Datei die Schwellen, nach denen sie beurteilt wurde. "Vorläufig" heißt, der Wert wurde ohne eine angeforderte Angabe gewählt: A.6 ist die reale Wiederholpräzision des Scans (σ), B.2 die Maschinengrenze. Eine 0 schaltet die Prüfung ab.',lim_axisMin:"Lesbare Achse",lim_axisMinTip:"Kleinste Auslenkung, bei der die ACHSE einer gemessenen Biegung noch lesbar ist. Darunter ist die Querrichtung Rauschen, also wird die Achse von der vorherigen Biegung übernommen statt erfunden. Die echte Regel lautet atan(3σ/Vorschub). Gilt nur für GEMESSENE Daten; in einem eingetippten Modell ist eine Biegung von 0,2° Absicht.",lim_piMin:"PI-Abstand",lim_piMinTip:"Kleinster Abstand zwischen zwei PI einer importierten Datei. Näher beieinander ergibt die Richtung reines Rauschen und daraus eine erfundene Biegung, die auch die nächste Zeile vergiftet. Die echte Regel lautet 5σ. Zwei zusammenfallende PI lehnen die ganze Datei ab: die Extraktion aus der Punktwolke ist schiefgegangen.",lim_scaleMin:"Mindestmaßstab",lim_scaleMinTip:"Anteil der Soll-PI-Schrittweite, unterhalb dessen die importierte Wolke nicht dasselbe Teil sein kann. KEINE Toleranz: fängt einen Export ab, dessen Spalten die ABWEICHUNG statt der Koordinate sind, oder Meter, die als Millimeter gelesen werden. Nur nach unten: einem Scan mit fehlenden Punkten wächst die mittlere Schrittweite, und das ist keine schlechte Datei.",lim_straightMin:"Mindestgerade",lim_straightMinTip:"Gerade zwischen den Tangentenpunkten, die das Werkzeug braucht: Spannbacke plus Kopfweg. Eine MASCHINEN-Grenze, keine des Scanners. Eine negative Gerade wird ohnehin getrennt aufgeführt: das sind zwei Werkzeuge am selben Ort.",lim_dead:"Totband (Winkel)",lim_deadTip:"Unter dieser Abweichung vom Soll korrigiert der Regelkreis nicht: das ist Messrauschen, und ihm nachzulaufen bringt das Teil zum Schwingen. 0 schaltet es ab.",lim_deadFeed:"Totband (Vorschub)",lim_deadFeedTip:"Wie das Winkel-Totband, in Millimetern und auf den Vorschub.",lim_maxStep:"Grenze je Zyklus (Winkel)",lim_maxStepTip:"Größte Korrektur, die der Regelkreis auf einmal anbringen darf. Ein größerer Sprung ist keine Prozessdrift: es sind schlechte Daten oder eine Biegung, die den Zweig gewechselt hat. Sie wird gekappt und gemeldet, statt an die Maschine zu gehen. 0 hebt die Grenze auf.",lim_maxStepFeed:"Grenze je Zyklus (Vorschub)",lim_maxStepFeedTip:"Wie die Winkelgrenze, in Millimetern und auf den Vorschub.",fabHead:"Dieses Teil lässt sich so nicht fertigen:",fabNeg:"die Gerade vor {b} ist NEGATIV: die Werkzeuge kollidieren.",fabShort:"die Gerade vor {b} erreicht die vom Werkzeug benötigten {n} mm nicht.",fabTail:"die Auslaufgerade erreicht {n} mm nicht.",fabOver:"{b} verlangt mehr als {n}° Auslenkung: die Längen dieser Zeile sind gekappt.",fileUnread:"Datei vom System nicht lesbar (verschoben, oder von einem anderen Programm geöffnet?)",csvShort:"Diese Teile enthalten WENIGER Punkte als das Modell. Die fehlenden Biegung
