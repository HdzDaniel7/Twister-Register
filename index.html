<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BARCOMP α — Compensación de dobleces</title>
<style>:root{
  --bg:#0B0E13; --panel:#12161D; --panel2:#171C25; --panel3:#1D2430;
  --line:#242C39; --line2:#303A4A;
  /* --dim2 NO es decorativo: lo llevan la ayuda de las celdas, los rótulos de
     sección y las columnas de solo lectura de las tablas, que son datos. Estaba
     a 3.1:1 en oscuro y 3.2:1 en claro, bajo el 4.5:1 que pide WCAG 1.4.3 para
     texto normal, y estas tipografías son de 10 px. Los dos temas suben hasta
     pasar ese umbral medido contra --panel2, el fondo más apretado en el que
     aparece. Queda muy cerca de --dim: al exigir legibilidad a los dos, la
     jerarquía entre ellos ya no la lleva el color sino el tamaño y la caja. */
  --txt:#D8DFE9; --dim:#7E8A9C; --dim2:#78849A;
  --nominal:#3FA9F5; --measured:#F0A02E; --corrected:#3FD68C;
  --ok:#3FD68C; --warn:#FFC53D; --bad:#FF4D5E;
  --warnTxt:#F0D48A; --warnBd:#8A6A24; --warnBg:#FFC53D14;
  /* violeta: la pieza NO es real. No comparte familia con ningún otro
     color semántico justamente para que no se confunda con una medida. */
  --synthetic:#C08AF0;
  --mono:ui-monospace,"SF Mono","Cascadia Mono","Roboto Mono",Menlo,Consolas,monospace;
  --sans:"Inter","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --h:44px; --ribbon:74px; --statusH:26px; --rtW:360px; --lfW:250px; --btH:340px;
  /* MODELAR: ancho de la tabla a la derecha. COMPENSAR: alto de la banda 3D. */
  --btW:760px; --compVP:250px;

  /* Todo lo que antes iba en crudo dentro del CSS, de scene/ y de ribbon.ts.
     El 3D y la cinta LEEN estos tokens en tiempo de ejecución, así que aquí
     está el color de la aplicación entera, tema por tema. */
  --vpbg:#080A0E; --grid1:#2A3546; --grid2:#1A212C; --fixture:#3A4658;
  /* el pin lateral, y la forma que toma la barra al quedar sujeta por él */
  --pincol:#57C8D6; --held:#F5A9E0;
  --inputbg:#0C1017; --inputbg2:#0E141D; --inputHovBd:#3C4759;
  --sel:#12324B; --selBd:#1E5C86; --selTxt:#9FD4FA; --selHov:#17415F;
  --btnHov:#28313F; --btnHovBd:#455065; --dcolbg:#0F1620;
  --oriW:#C9A5F5; --oriWbd:#6B4B9E; --oriT:#7FD8C4; --oriTbd:#3B7A6C;
  --hd1:#151A23; --hd2:#10141B; --scroll:#465268;
  --lblbg:#0B0E13CC; --floatbg:#0B0E13D9; --hintbg:#0B0E13B0;
  /* texto de las etiquetas del 3D. Iban en --dim y en un #fff a pelo, y
     en tema claro el blanco sobre blanco no se leía. */
  --lblTxt:#AEB9C8; --lblSel:#FFFFFF;
  --ring:#3FA9F533; --grip:#3FA9F544; --selRing:#3FA9F540;
}

/* ---------- tema claro ----------
   Los colores NO cambian de familia: --nominal sigue siendo azul, --measured
   ámbar, --corrected verde, y la escala de desviación sigue yendo de verde a
   ámbar a rojo. Lo que cambia es la luminosidad, para que se lean sobre blanco.
   El bloque va dos veces: bajo [data-theme="light"] (elección explícita) y bajo
   la preferencia del sistema, esta guardada contra una elección de oscuro. */
:root[data-theme="light"]{
  --bg:#F4F6F9; --panel:#FFFFFF; --panel2:#F0F3F7; --panel3:#E7ECF2;
  --line:#D7DDE6; --line2:#BFC8D4;
  --txt:#18202C; --dim:#5B6778; --dim2:#5F6E85;
  --nominal:#0D6FC4; --measured:#A96400; --corrected:#0F7A52;
  --ok:#0F7A52; --warn:#9A6B00; --bad:#C42133; --synthetic:#7A3FB0;
  --warnTxt:#6B4A00; --warnBd:#C79A2E; --warnBg:#FFC53D24;
  --vpbg:#EDF0F4; --grid1:#C2CBD8; --grid2:#D9DFE7; --fixture:#AEB9C8;
  --pincol:#1E8FA0; --held:#B33C8C;
  --inputbg:#FFFFFF; --inputbg2:#F7F9FC; --inputHovBd:#A6B2C2;
  --sel:#D5E7F8; --selBd:#8CBCE4; --selTxt:#0A4B87; --selHov:#C2DCF4;
  --btnHov:#DCE3EC; --btnHovBd:#A6B2C2; --dcolbg:#EDF3F9;
  --oriW:#6A38A2; --oriWbd:#B49BDE; --oriT:#0C6A58; --oriTbd:#84C9BB;
  --hd1:#FFFFFF; --hd2:#F1F4F9; --scroll:#B4BDCA;
  --lblbg:#FFFFFFD9; --floatbg:#FFFFFFE6; --hintbg:#FFFFFFCC;
  --lblTxt:#3B475A; --lblSel:#0A4B87;
  --ring:#0D6FC433; --grip:#0D6FC444; --selRing:#0D6FC440;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#F4F6F9; --panel:#FFFFFF; --panel2:#F0F3F7; --panel3:#E7ECF2;
    --line:#D7DDE6; --line2:#BFC8D4;
    --txt:#18202C; --dim:#5B6778; --dim2:#5F6E85;
    --nominal:#0D6FC4; --measured:#A96400; --corrected:#0F7A52;
    --ok:#0F7A52; --warn:#9A6B00; --bad:#C42133; --synthetic:#7A3FB0;
    --warnTxt:#6B4A00; --warnBd:#C79A2E; --warnBg:#FFC53D24;
    --vpbg:#EDF0F4; --grid1:#C2CBD8; --grid2:#D9DFE7; --fixture:#AEB9C8;
    --pincol:#1E8FA0; --held:#B33C8C;
    --inputbg:#FFFFFF; --inputbg2:#F7F9FC; --inputHovBd:#A6B2C2;
    --sel:#D5E7F8; --selBd:#8CBCE4; --selTxt:#0A4B87; --selHov:#C2DCF4;
    --btnHov:#DCE3EC; --btnHovBd:#A6B2C2; --dcolbg:#EDF3F9;
    --oriW:#6A38A2; --oriWbd:#B49BDE; --oriT:#0C6A58; --oriTbd:#84C9BB;
    --hd1:#FFFFFF; --hd2:#F1F4F9; --scroll:#B4BDCA;
    --lblbg:#FFFFFFD9; --floatbg:#FFFFFFE6; --hintbg:#FFFFFFCC;
    --lblTxt:#3B475A; --lblSel:#0A4B87;
    --ring:#0D6FC433; --grip:#0D6FC444; --selRing:#0D6FC440;
  }
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--txt);font-family:var(--mono);font-size:12px;
  -webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:var(--scroll)}
:focus-visible{outline:2px solid var(--nominal);outline-offset:1px}
/* Una fila de la tabla de desviacion enfocada. El outline va HACIA DENTRO
   (offset negativo): hacia fuera lo recorta el contenedor .tw, que tiene
   overflow, y el anillo se veria a medias justo en la fila de arriba y en la
   de abajo. */
tbody tr[tabindex]:focus-visible{outline:2px solid var(--nominal);outline-offset:-2px}

/* ---------- shell ---------- */
/* Tres bandas apiladas: la de arriba se reparte en tres columnas (paneles,
   3D, desviación), y abajo van la cinta —horizontal por naturaleza, mide la
   longitud desarrollada— y la tabla a todo el ancho, que es lo que necesita
   con sus 14 columnas. El alto de la tabla lo pone #btgrip. */
/* ---------- LA DISTRIBUCIÓN, POR MODO DE TRABAJO ----------
   El programa hace tres trabajos y cada uno quiere la pantalla para otra cosa.
   Antes los tres compartían un reparto fijo y ninguno cabía: la tabla de 13
   columnas enseñaba dos filas y el 3D se quedaba con un tercio de la pantalla.
   Ahora la clase del #app manda sobre la rejilla entera.

     m-model   MODELAR    la tabla a la derecha, entera y de arriba abajo,
                          con el 3D AL LADO — no debajo, que es lo que la
                          ahogaba— y la cinta bajo el 3D.
     m-meas    MEDIR      el modelo grande, la cinta alta y las estadísticas
                          en el lateral. No hay tabla que teclear.
     m-comp    COMPENSAR  ganancias en una tira y los comandos a todo el
                          ancho; el 3D queda como banda de comprobación.
                          Es además el modo taller: si en pantalla no hay nada
                          que no sea compensación, no hace falta un
                          interruptor de bloqueo aparte.

   Lo que un modo no usa se oculta con `display:none`, y su render se salta:
   ver renderPanels() en panels/render.ts.                                  */
#app{display:grid;height:100vh}
#hd{grid-area:hd}#ct{grid-area:ct}#rt{grid-area:rt}
#rb{grid-area:rb}#bt{grid-area:bt}#st{grid-area:st}

/* --- MODELAR: teclear ángulos sin desplazar --- */
#app.m-model{
  grid-template-columns:minmax(320px,1fr) var(--btW);
  grid-template-rows:var(--h) minmax(200px,1fr) var(--ribbon) var(--statusH);
  grid-template-areas:"hd hd" "ct bt" "rb bt" "st st"}
#app.m-model #rt{display:none}

/* --- MEDIR: mirar la pieza --- */
#app.m-meas{
  grid-template-columns:minmax(320px,1fr) var(--rtW);
  grid-template-rows:var(--h) minmax(200px,1fr) calc(var(--ribbon) + 46px) var(--statusH);
  grid-template-areas:"hd hd" "ct rt" "rb rb" "st st"}
#app.m-meas #bt{display:none}

/* --- COMPENSAR: la tabla de comandos manda, y no hay nada más --- */
#app.m-comp{
  grid-template-columns:1fr;
  grid-template-rows:var(--h) minmax(200px,1fr) var(--ribbon) var(--compVP) var(--statusH);
  grid-template-areas:"hd" "bt" "rb" "ct" "st"}
#app.m-comp #rt{display:none}
/* ---------- el 3D a pantalla completa ----------
   Pliega la tabla, el lateral y la cinta sin salir del modo: la tabla sigue
   donde estaba y el sitio en ella no se pierde. Es para mirar la pieza, que
   es la mitad del trabajo y la que peor llevaba compartir la pantalla. */
#app.solo{grid-template-columns:1fr;
  grid-template-rows:var(--h) 1fr var(--statusH);
  grid-template-areas:"hd" "ct" "st"}
#app.solo #bt,#app.solo #rt,#app.solo #rb,#app.solo #rtgrip{display:none}

/* Los dos tiradores siguen ahí en los tres modos, pero cada modo les da otro
   trabajo (ver bindGrips en app/events/grips.ts):

     #rtgrip   MODELAR el ancho de la tabla · MEDIR el ancho del lateral
               COMPENSAR nada: no hay columna a la derecha, y se esconde
     #btgrip   COMPENSAR el alto de la banda 3D · los demás el alto de la cinta

   Sin esto el tirador de la izquierda movía --rtW en un modo donde el lateral
   no existe, y no pasaba nada al arrastrarlo. */
#app.m-comp #rtgrip{display:none}

/* ---------- header ---------- */
#hd{display:flex;align-items:center;gap:14px;padding:0 12px;
  background:linear-gradient(180deg,var(--hd1),var(--hd2));border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:baseline;gap:8px;font-family:var(--sans)}
.brand b{font-size:15px;font-weight:700;letter-spacing:.16em}
.brand .v{font-size:9px;letter-spacing:.18em;color:var(--nominal);
  border:1px solid var(--nominal);border-radius:2px;padding:1px 4px;opacity:.85}
.brand .sub{font-size:10px;color:var(--dim2);letter-spacing:.06em;margin-left:4px}
.hspace{flex:1}
.btn{background:var(--panel3);border:1px solid var(--line2);border-radius:3px;
  padding:5px 10px;cursor:pointer;color:var(--txt);white-space:nowrap;transition:.12s}
.btn:hover{background:var(--btnHov);border-color:var(--btnHovBd)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--sel);border-color:var(--selBd);color:var(--selTxt)}
.btn.pri:hover{background:var(--selHov)}
.btn.sm{padding:3px 7px;font-size:11px}
.seg{display:flex;border:1px solid var(--line2);border-radius:3px;overflow:hidden}
.seg button{background:var(--panel3);border:0;padding:5px 9px;cursor:pointer;color:var(--dim)}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--sel);color:var(--selTxt)}

/* ---------- panels ---------- */
#rt{background:var(--panel);overflow-y:auto;overflow-x:hidden}
/* ---------- el cajón de menú ----------
   Flota bajo la barra, encima del 3D. Está FUERA de la rejilla a propósito:
   así abrirlo no reparte la pantalla otra vez ni obliga a un onResize(), y el
   3D y la tabla no dan un salto cada vez que alguien mira las capas. */
#lf{position:fixed;top:var(--h);left:0;width:var(--lfW);z-index:30;
  max-height:calc(100vh - var(--h) - var(--statusH));
  background:var(--panel);border-right:1px solid var(--line2);
  border-bottom:1px solid var(--line2);
  box-shadow:6px 6px 18px #0006;overflow-y:auto;overflow-x:hidden}
#lf[hidden]{display:none}

/* ---------- la barra de menús ---------- */
.menubar{display:flex;gap:2px}
.mn{background:none;border:1px solid transparent;border-radius:3px;padding:5px 11px;
  cursor:pointer;color:var(--dim);font-family:var(--sans);font-size:12px;
  letter-spacing:.02em;transition:.12s}
.mn:hover{color:var(--txt);background:var(--panel3)}
.mn.on{color:var(--txt);background:var(--panel3);border-color:var(--line2)}
.col{display:flex;flex-direction:column;gap:5px}
#rt{border-left:1px solid var(--line);position:relative;z-index:2;background:var(--panel)}
.grp{border-bottom:1px solid var(--line)}
.eyebrow{font-family:var(--sans);font-size:9.5px;font-weight:600;letter-spacing:.15em;
  text-transform:uppercase;color:var(--dim2);padding:10px 11px 6px;display:flex;
  align-items:center;justify-content:space-between;gap:6px}
.eyebrow .n{color:var(--dim2);opacity:.6}
.grp .body{padding:0 8px 10px}

/* layers */
.layer{display:flex;align-items:center;gap:7px;padding:4px 3px;border-radius:3px;cursor:default}
.layer:hover{background:var(--panel2)}
.layer .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11.5px}
/* La casilla en si no puede crecer sin desmontar la lista de capas, asi que
   quien crece es la FILA: el area sensible de un <label> es la etiqueta
   entera, y con 24 px de alto la casilla de 14 se puede pulsar con el dedo o
   con un raton impreciso. */
.layer{min-height:24px}
.layer input[type=checkbox]{accent-color:var(--nominal);width:14px;height:14px;cursor:pointer;
  flex:none}
.sw{width:15px;height:15px;border-radius:3px;border:1px solid #0006;cursor:pointer;
  padding:0;flex:none;overflow:hidden}
.sw::-webkit-color-swatch-wrapper{padding:0}.sw::-webkit-color-swatch{border:0;border-radius:2px}
/* Blanco de clic de 24x24, que es el minimo de WCAG 2.5.8 (AA). El glifo
   sigue siendo pequenio —la X y el simbolo de duplicar se leen mejor finos—
   pero la zona que responde es la caja entera: antes eran ~10x12 px, y fallar
   el boton de borrar en una lista de trece piezas es una prueba y error con
   consecuencias. El ancho que esto le quita al nombre del modelo se recupera
   con min-width:0 en el campo, que ya estaba. */
.xbtn{background:none;border:0;color:var(--dim2);cursor:pointer;padding:0;line-height:1;
  min-width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;
  border-radius:3px;flex:none}
.xbtn:hover{color:var(--bad);background:var(--panel3)}

/* datasets */
.ds{border:1px solid var(--line);border-radius:4px;padding:6px 7px;margin-bottom:6px;
  background:var(--panel2)}
.ds.act{border-color:var(--nominal);box-shadow:0 0 0 1px var(--selRing) inset}
.ds .top{display:flex;align-items:center;gap:6px}
/* el nombre del modelo se edita aquí mismo: campo sin marco hasta que se toca,
   para que la tarjeta siga leyéndose como una ficha y no como un formulario */
.ds input.nm{flex:1;min-width:0;font-size:11.5px;padding:2px 4px;width:auto;
  background:transparent;border-color:transparent;border-radius:3px}
.ds input.nm:hover{border-color:var(--line2);background:var(--inputbg)}
.ds input.nm:focus{border-color:var(--nominal);background:var(--inputbg)}
.ds .meta{display:flex;gap:9px;margin-top:4px;font-size:10px;color:var(--dim)}
.ds .meta b{font-weight:400;color:var(--txt)}
/* el modelo no cabe en el fixture: en rojo y debajo de sus cifras, que es donde
   se mira al comparar */
.ds .clash{margin-top:4px;font-size:10px;color:var(--bad);cursor:help}

/* ---------- viewport ---------- */
/* overflow:hidden es lo que impide que el lienzo 3D se monte sobre el panel
   derecho mientras se arrastra #rtgrip. El otro medio freno es onResize(). */
#ct{position:relative;display:flex;flex-direction:column;background:var(--vpbg);
  min-width:0;overflow:hidden}
#vpwrap{position:relative;flex:1;min-height:0}
#vp{position:absolute;inset:0;display:block}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.lbl{position:absolute;transform:translate(-50%,-50%);font-size:10px;padding:1px 4px;
  border-radius:2px;background:var(--lblbg);border:1px solid var(--line2);white-space:nowrap;
  letter-spacing:.03em;color:var(--lblTxt)}
.lbl.sel{color:var(--lblSel);border-color:currentColor}
/* La cota lleva su color en un punto, no en el texto: un color de identidad
   elegido sobre fondo oscuro se lava sobre fondo claro, y lo que hay que poder
   leer es la cifra. */
.lbl .swatch{display:inline-block;width:6px;height:6px;border-radius:1px;
  margin-right:4px;vertical-align:baseline}
#vptool{position:absolute;top:8px;left:8px;display:flex;gap:5px;align-items:center;
  background:var(--floatbg);border:1px solid var(--line);border-radius:4px;padding:5px 7px;
  backdrop-filter:blur(6px);flex-wrap:wrap;
  /* deja sitio a la leyenda, que está fija arriba a la derecha: con las
     palabras alemanas la barra llegaba a meterse debajo. El reserva casa
     con el max-width de #vplegend más los dos márgenes de 8 px. */
  max-width:calc(100% - 234px)}
#vplegend{position:absolute;top:8px;right:8px;background:var(--floatbg);border:1px solid var(--line);
  border-radius:4px;padding:7px 9px;backdrop-filter:blur(6px);font-size:10.5px;
  min-width:132px;max-width:210px}
#vplegend .row{display:flex;align-items:center;gap:6px;padding:1.5px 0}
#vplegend .dot{width:9px;height:3px;border-radius:2px;flex:none}
.scalebar{margin-top:6px;padding-top:6px;border-top:1px solid var(--line)}
.scalebar .grad{height:7px;border-radius:2px;margin:3px 0 2px;
  background:linear-gradient(90deg,var(--ok),var(--warn),var(--bad))}
.scalebar .ends{display:flex;justify-content:space-between;color:var(--dim);font-size:9.5px}
.tag{font-size:9.5px;color:var(--dim2);letter-spacing:.1em;text-transform:uppercase;
  font-family:var(--sans);font-weight:600}
#hint{position:absolute;bottom:8px;left:8px;font-size:10px;color:var(--dim2);
  background:var(--hintbg);padding:3px 7px;border-radius:3px}
/* aviso sobre el 3D: la gráfica soltó el contexto o algo falló. Centrado bajo
   la barra de vista y por encima de las etiquetas, que no deben taparlo. El
   `[hidden]` va explícito porque el `display:flex` de aquí le gana al del
   navegador y el aviso no se escondería nunca. */
#vpnote{position:absolute;top:48px;left:50%;transform:translateX(-50%);z-index:5;
  max-width:min(560px,calc(100% - 32px));display:flex;gap:8px;align-items:flex-start;
  background:var(--floatbg);border:1px solid var(--warnBd);color:var(--warnTxt);
  border-radius:4px;padding:6px 8px;font-size:11px;line-height:1.4;backdrop-filter:blur(6px)}
#vpnote[hidden]{display:none}
/* indicador de ejes: esquina inferior derecha, libre (#hint va abajo a la
   izquierda y #vplegend arriba a la derecha) */
#gizmo{position:absolute;bottom:8px;right:8px;width:68px;height:68px;
  pointer-events:none;opacity:.92}
/* tirador para ensanchar el panel derecho */
#rtgrip{position:absolute;top:0;bottom:0;right:-3px;width:7px;z-index:12;
  cursor:col-resize;background:transparent}
#rtgrip:hover,#rtgrip.drag{background:var(--grip)}

/* ---------- ribbon (signature) ---------- */
#rb{border-top:1px solid var(--line);border-bottom:1px solid var(--line);
  background:var(--panel);position:relative;min-height:0;overflow:hidden}
#rbc{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:pointer}
#rbtitle{position:absolute;top:6px;left:10px;font-family:var(--sans);font-size:9px;
  font-weight:600;letter-spacing:.15em;color:var(--dim2);pointer-events:none;text-transform:uppercase}

/* tirador para subir y bajar la tabla de abajo. Va en el borde superior de la
   cinta: se arrastra el bloque entero (cinta + tabla). */
#btgrip{position:absolute;top:-3px;left:0;right:0;height:7px;z-index:12;
  cursor:row-resize;background:transparent}
#btgrip:hover,#btgrip.drag{background:var(--grip)}

/* ---------- bloque de abajo: pestañas + tabla a todo el ancho ---------- */
#bt{display:flex;flex-direction:column;background:var(--panel);min-height:0;
  overflow:hidden;border-top:1px solid var(--line)}
#panes{flex:1;min-height:0;overflow:auto}

/* ---------- tabs ---------- */
#tabs{display:flex;border-bottom:1px solid var(--line);background:var(--panel2);position:sticky;top:0;z-index:5}
#tabs button{background:none;border:0;border-bottom:2px solid transparent;
  padding:9px 18px;cursor:pointer;color:var(--dim);font-family:var(--sans);font-size:10px;
  font-weight:600;letter-spacing:.11em;text-transform:uppercase}
#tabs button.on{color:var(--txt);border-bottom-color:var(--nominal);background:var(--panel3)}
.pane{display:none}.pane.on{display:block}

/* ---------- forms ---------- */
/* Sin flechas nativas: robaban ancho y tapaban las cifras.
   Sustitutos: teclas Flecha arriba/abajo y rueda del ratón sobre el campo
   enfocado (ver el manejador `wheel` en bind()).                          */
input[type=number]{-moz-appearance:textfield;appearance:textfield}
input[type=number]::-webkit-outer-spin-button,
input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}

/* Un par etiqueta/campo NO crece con la pantalla. En una banda de 1600 px, un
   solo par estirado dejaba la etiqueta pegada al borde izquierdo y su campo al
   derecho con un metro de vacío en medio; lo que se quiere ahí son varios
   pares por renglón. `auto-fit` los reparte y `max-width` impide que el
   último superviviente se estire. */
.fgrid{display:grid;grid-template-columns:1fr 112px;gap:6px 10px;align-items:center;padding:2px 0;
  max-width:460px}
.fgrid label{font-size:11.5px;color:var(--dim)}
/* dos pares etiqueta/campo por renglón: la cabecera del modelo tiene que caber
   en una banda baja, o empuja la tabla fuera de la pantalla */
.fgrid.pair{grid-template-columns:auto 82px auto 82px;gap:5px 10px;max-width:none}
/* La tira de ajustes de COMPENSAR va a todo el ancho, pero repartida en
   columnas de ancho fijo en vez de un par estirado por renglón. */
#app.m-comp #panes .grp .body{display:flex;flex-wrap:wrap;gap:6px 28px;align-items:flex-start}
#app.m-comp #panes .grp .body > *{flex:0 1 auto}
#app.m-comp #panes .grp .body > .tw{flex:1 1 100%}
#app.m-comp #panes .grp .body > .hintline{flex:1 1 100%}
/* un botón de acción no tiene por qué medir 1460 px */
#panes .row .btn.grow{max-width:420px}
/* ni una celda de compensación 700 px: la tabla crece con las columnas que
   estén activas y para de crecer cuando ya caben todas */
#app.m-comp #panes table.cmd{max-width:1150px}
.mhead{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap;padding-top:8px}
.mhead .eyebrow{padding:0 0 5px}
.mcol{min-width:210px}
.mcol.nm{flex:1;min-width:220px;max-width:420px}
input[type=text],input[type=number],select{background:var(--inputbg);border:1px solid var(--line2);
  border-radius:3px;padding:6px 8px;width:100%;font-size:12.5px;line-height:1.2;
  font-variant-numeric:tabular-nums}
input[type=number]{text-align:right}
input:hover,select:hover{border-color:var(--inputHovBd)}
input:focus,select:focus{border-color:var(--nominal);outline:0;
  box-shadow:0 0 0 2px var(--ring);background:var(--inputbg2)}
input[type=range]{width:100%;accent-color:var(--nominal);height:16px}
.rangerow{display:grid;grid-template-columns:1fr 62px;gap:8px;align-items:center}
.rangerow .val{text-align:right;color:var(--nominal);font-variant-numeric:tabular-nums}
/* La guía de cada pestaña. Estaba a 10 px en --dim2, el texto más pequeño de la
   pantalla, y ahí vive la explicación de lo que dicen las tablas. */
.hintline{font-size:11.5px;color:var(--dim);line-height:1.5;padding:4px 0 2px}
/* El estado VACÍO no es una nota al pie: sin nada puesto es lo único que dice
   qué hacer, así que va con el color del texto y no con el de la ayuda. */
.emptynote{font-size:12px;color:var(--txt);line-height:1.5;padding:8px 0 4px}
/* La unidad de un encabezado. Los encabezados van en mayúsculas, y «(MM)» ya
   no se lee como milímetros. */
th .u{text-transform:none;letter-spacing:0;font-weight:500}

/* ---------- tables ---------- */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:4px}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th{background:var(--panel3);font-family:var(--sans);font-size:9px;font-weight:600;
  letter-spacing:.09em;text-transform:uppercase;color:var(--dim);padding:6px 5px;
  text-align:right;white-space:nowrap;position:sticky;top:0}
th:first-child,td:first-child{text-align:left}
td{padding:2px 4px;text-align:right;border-top:1px solid var(--line);white-space:nowrap;font-size:12px}
tbody tr:hover{background:var(--panel2)}
tbody tr.sel{background:var(--sel)}
tbody tr.clk{cursor:pointer}
/* El ancho de una celda editable se mide en DÍGITOS: box-sizing es border-box,
   así que del min-width hay que descontar los 12 px de padding. Con la mono a
   12.5 px un dígito son ~7 px, y de ahí salen los números de abajo. */
td input{padding:5px 6px;font-size:12.5px;border-color:transparent;background:transparent;
  min-width:59px}
/* la tabla de comandos aprieta dos dígitos más: sus celdas llevan cifras más
   cortas (un Δ, no una longitud de tres enteros y tres decimales) */
table.cmd td input{min-width:52px}
td input:hover{border-color:var(--line2);background:var(--inputbg)}
td input:focus{border-color:var(--nominal);background:var(--inputbg);box-shadow:0 0 0 2px var(--ring)}
/* la tabla LRA no se comprime: si no cabe, el contenedor .tw desplaza en X
   y el panel derecho se puede ensanchar arrastrando #rtgrip.              */
table.lra{min-width:910px}
/* las dos últimas son de leer, no de teclear: sitio propio para que Σ L no
   quede pegada al borde ni bajo la barra de desplazamiento */
table.lra th:nth-child(n+12),table.lra td:nth-child(n+12){min-width:76px}
table.lra th:last-child,table.lra td:last-child{padding-right:12px}
tfoot tr.foot td{border-top:1px solid var(--line2);color:var(--dim);
  background:var(--panel3)}
tfoot tr.foot td:first-child{font-family:var(--sans);font-size:9px;letter-spacing:.09em;
  text-transform:uppercase}
/* el ancho de la tabla de comandos lo pone paneComp() según cuántos
   parámetros se estén corrigiendo: con uno solo tiene que caber sin desplazar,
   porque la celda de Δ aplicada es la única editable. */
table.marks{min-width:540px}
td.dcol input[type=text]{text-align:right}
.marks td:first-child{white-space:nowrap;display:flex;gap:5px;align-items:center}
.ori{display:inline-block;width:15px;text-align:center;border-radius:2px;font-size:9.5px;
  padding:0 3px;border:1px solid}
.ori.W{color:var(--oriW);border-color:var(--oriWbd)}
.ori.T{color:var(--oriT);border-color:var(--oriTbd)}
.ori.R{color:var(--dim);border-color:var(--line2)}
.v-ok{color:var(--ok)}.v-warn{color:var(--warn)}.v-bad{color:var(--bad)}
/* WCAG 1.4.1: fuera de tolerancia NO puede decirse solo con el color.
   Una de cada doce personas no distingue el rojo del verde, y estas tablas
   además se fotocopian y se imprimen en blanco y negro para llevarlas a la
   máquina. Un signo detrás de la cifra viaja por los tres canales.
   `!` = pasada de tolerancia, `!!` = más del doble. No es adorno: es la MISMA
   escala que `cls()`, que ya reparte en tres. */
.v-warn::after,.v-bad::after{content:'!';font-weight:700;font-size:.82em;
  margin-left:3px;vertical-align:.08em}
.v-bad::after{content:'!!'}
/* El sello de versión usa v-bad para decir «compilado sobre cambios sin
   confirmar». Eso no es una tolerancia y el signo ahí sobra: el texto ya dice
   «+sucio». */
#st .ver::after{content:none}
/* Un <input> no admite ::after —los elementos reemplazados no tienen caja de
   contenido donde ponerlo— así que la recta por debajo del mínimo se marca con
   el TRAZO del borde, que es el otro canal que no es color. */
input.v-bad,input.v-warn{border-style:dashed}
.v-dim{color:var(--dim2)}
/* «n/d» no es una cifra fuera de tolerancia: es la AUSENCIA de cifra, y hay
   sitios donde el modelo no puede dar ninguna. Va en el color del aviso para
   que nadie la lea como un dato, pero sin el `!` de v-warn, que promete un
   umbral rebasado que aquí no existe. El texto ya viaja por los tres canales:
   dice «n/d» y no un número. */
.v-nd{color:var(--warn)}
.chip{display:inline-block;padding:0 5px;border-radius:8px;font-size:10px;border:1px solid}
.chip.ok{color:var(--ok);border-color:#2C6B4C;background:#3FD68C14}
.chip.bad{color:var(--bad);border-color:#7A2C36;background:#FF4D5E14}
/* Un chip que ES un botón —el del amarre en la barra de estado—: sin el aspecto
   de botón del navegador, pero con cursor de enlace, porque lleva a alguna
   parte y eso tiene que notarse antes de pulsarlo. */
button.chip{font:inherit;font-size:10px;color:inherit;background:none;cursor:pointer}

/* stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:8px 0}
.stat{background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:7px 9px}
.stat .k{font-family:var(--sans);font-size:8.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim2)}
.stat .v{font-size:16px;margin-top:2px;font-variant-numeric:tabular-nums}
.stat .u{font-size:10px;color:var(--dim);margin-left:2px}

/* status */
#st{display:flex;align-items:center;gap:0;background:var(--panel2);
  border-top:1px solid var(--line);font-size:10.5px;color:var(--dim);overflow:hidden}
#st .c{padding:0 11px;border-right:1px solid var(--line);white-space:nowrap;
  height:100%;display:flex;align-items:center;gap:5px}
#st b{font-weight:400;color:var(--txt);font-variant-numeric:tabular-nums}
/* El sello de compilación se empuja al extremo y no roba atención, pero tiene
   que estar SIEMPRE visible: es lo único que distingue la copia del taller de
   la publicada cuando alguien reporta un número raro. */
#st .ver{margin-left:auto;border-right:0;border-left:1px solid var(--line)}
#st .ver b{color:var(--dim)}
#st .ver.v-bad b{color:var(--bad)}

.row{display:flex;gap:5px;align-items:center}
.row.wrap{flex-wrap:wrap}
.secwrap{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-start}
.secfig{flex:1 1 300px;min-width:240px;max-width:460px}
.secfields{flex:1 1 250px;min-width:230px}
/* El SVG va en milímetros y se estira con CSS: la escala del dibujo ES la de
   la barra. Los trazos no pueden escalar con ella o un tubo de 12 mm sale con
   el borde más grueso que la pared — de ahí vector-effect. */
.secsvg{width:100%;height:auto;display:block;max-height:260px;
  background:var(--inputbg);border:1px solid var(--line);border-radius:4px;padding:6px}
.secsvg *{vector-effect:non-scaling-stroke}
.secout{fill:var(--nominal);fill-opacity:.16;stroke:var(--nominal);stroke-width:1.4}
.sechole{fill:var(--inputbg);stroke:var(--nominal);stroke-width:1.1}
.secchamfer line{stroke:var(--dim);stroke-width:1;stroke-dasharray:4 3}
.secaxis{stroke:var(--line2);stroke-width:1;stroke-dasharray:6 3 1 3}
.secdim line{stroke:var(--dim2);stroke-width:1}
.secdim text{fill:var(--txt);font-family:var(--mono);text-anchor:middle}
.mt6{margin-top:6px}.mt10{margin-top:10px}.mb6{margin-bottom:6px}
.grow{flex:1}
/* El aviso es una SALVAGUARDA: si no se lee, no sirve. Estaba con tres
   literales fuera del sistema de tokens y en tema claro quedaba a ~1.7:1 sobre
   el panel, muy por debajo del 4.5:1 que pide WCAG 1.4.3. Ahora usa tokens
   propios, definidos en los dos temas como todo lo demás. */
.warnbox{border:1px solid var(--warnBd);background:var(--warnBg);border-radius:4px;padding:6px 8px;
  font-size:10.5px;color:var(--warnTxt);line-height:1.45}

@media (max-width:1180px){#app{grid-template-columns:206px 1fr 300px}}

/* ---------- modelos (variantes) ---------- */
.refbadge{font-family:var(--sans);font-size:8px;font-weight:700;letter-spacing:.12em;
  color:var(--nominal);border:1px solid var(--nominal);border-radius:2px;padding:0 3px;
  flex:none;opacity:.9}
/* Procedencia de una pieza. Una pieza inventada por el simulador y una medida
   se veían igual, y con eso se puede compensar contra números que no existen. */
.srcbadge{font-family:var(--sans);font-size:8px;font-weight:700;letter-spacing:.12em;
  border:1px solid currentColor;border-radius:2px;padding:0 3px;flex:none;opacity:.9;
  cursor:help}
.srcbadge.sim{color:var(--synthetic)}
.srcbadge.meas{color:var(--measured)}
.srcbadge.unk{color:var(--dim2)}

/* ---------- resorte medido ----------
   Una cifra sola no dice si vale: al lado van la dispersión y el n, y en
   ámbar el aviso de que el resorte depende del ángulo comandado. */
.sbrow{display:flex;align-items:baseline;gap:6px;padding:2px 0;
  font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums}
.sbrow .k{flex:1;color:var(--dim);font-family:var(--sans);font-size:10px;letter-spacing:.06em}
.sbrow .v{color:var(--txt);font-size:13px}
.sbrow .v .u{color:var(--dim);font-size:9px;margin-left:1px}
.sbrow .pm{color:var(--dim2);cursor:help}
.sbrow .n{color:var(--dim2);font-size:10px}
.sbrow .warn{flex-basis:100%;color:var(--warn);font-family:var(--sans);font-size:9.5px;cursor:help}
.linkbtn{background:none;border:0;color:var(--dim2);cursor:pointer;padding:3px 0 0;
  font-family:var(--sans);font-size:9.5px;letter-spacing:.06em;text-align:left;width:100%}
.linkbtn:hover{color:var(--nominal);text-decoration:underline}
.layer input[type=radio]{accent-color:var(--nominal);width:13px;height:13px;cursor:pointer}
.ds .meta b{font-variant-numeric:tabular-nums}

/* La columna Δ va PEGADA a su parámetro: la corrección se escribe al lado del
   dato sin perder el valor original. Fondo propio para que se lean como par. */
td.dcol,th.dcol{background:var(--dcolbg)}
td.dcol input{color:var(--corrected);min-width:56px}
td.dcol input.z{color:var(--dim2)}
/* Una celda que NO se entendió. El texto rechazado se queda a la vista en rojo
   en vez de esfumarse: antes volvía al valor de antes, que es lo mismo que se
   ve cuando el ajuste sí se acepta y no mueve nada. Va después de `.z` a
   propósito, misma especificidad, para ganar cuando la celda estaba en cero. */
td.dcol input.badcell,input.badcell{color:var(--bad);border-color:var(--bad)}
th.dcol{color:var(--corrected);opacity:.75}
tbody tr.hasd td:first-child{box-shadow:inset 2px 0 0 var(--corrected)}
.dv{color:var(--corrected)}
/* 12 columnas no caben en el panel: se desplaza en X dentro de .tw y el panel
   se puede ensanchar arrastrando #rtgrip. */


/* Un doblez SIN MEDIR no es un doblez que salió perfecto. La tabla los pintaba
   igual —«+0.000»— y esa es la lectura natural: «ese está bien». Se atenúan, se
   rayan en diagonal y el número se sustituye por un guion, que no se puede
   confundir con un cero. */
tr.nomeas td{opacity:.55}
tr.nomeas td:first-child{border-left:2px solid var(--dim2)}
td.nomeas{text-align:center;color:var(--dim2);font-weight:600}
</style>
</head>

n del doblez {b}. Enter la selecciona en el 3D y en la tabla; las flechas suben y bajan.",pins:"Amarre",lPins:"Pines",lHeld:"Barra sujeta",pinOn:"Barra sujeta por los pines",pinOnTip:"Apagado, la barra está libre en el espacio y el programa se comporta exactamente como antes de que los pines existieran. Encendido, la pieza no puede irse a donde la manda la tabla: se queda donde la dejan los pines y se deforma para llegar ahí.",pinDoRot:"El rodado también cede",pinRotTip:"Un pin empuja en el plano de la mesa. Dejar que el rodado ceda además del ángulo suele repartir mejor la deformación, pero son dos incógnitas por estación en vez de una y es una decisión física, no un ajuste de velocidad.",pinTol:"Contacto",pinTolTip:"Por debajo de esta distancia se considera que la barra toca el pin y no hay nada que cerrar.",pinDamp:"Reparto",pinDampTip:"Cerca de 0 la deformación se concentra en la estación más flexible; subiéndolo se reparte entre más estaciones. Es el mismo papel que la ganancia del lazo: al máximo de agresividad, oscila.",pinDia:"Ø",pinGap:"Hueco",pinReach:"Llega",pinReachTip:"Si se tocan por el CUERPO del poste o por uno de sus cabos. Un pin que se queda por debajo de la barra no la toca por mucho que esté en su sitio, y uno levantado por encima la deja pasar por debajo: en los dos casos no sujeta nada.",pinYes:"sí",pinNo:"no",pinHold:"Sujeta",pinHoldTip:"Un pin puede estar montado y no querer contarse: apagarlo deja verlo en el 3D sin que entre en la cuenta, que es como se comprueba qué pin está causando qué.",pinMeasFree:"Se está viendo y midiendo la barra LIBRE con el amarre o la carga puestos: esta tabla, las cotas, los puntos y el sembrado contestan sobre la pieza que habría sin nada que la sujetara, no sobre la que hay encima de la mesa. Las reacciones no: salen del reparto de la pieza sujeta y siguen siendo las suyas. Elige «Sujeta» o «Las dos» en «Ver», en la pestaña Amarre, para leer la barra que hay.",pinShow:"Ver",pinShowFree:"Libre",pinShowHeld:"Sujeta",pinShowBoth:"Las dos",pinShowTip:"Qué barra se ve y contra cuál se mide TODO, en todos los modelos a la vez: la libre —el diseño, la pieza fuera del fixture— o la que de verdad queda sujeta por los pines y colgando de su peso. Con «Sujeta» o «Las dos» van con la sujeta las dos tablas, las cotas, la flecha, los puntos PI y sus etiquetas, el desplazamiento entre modelos, la cinta, los colores de los apoyos y dónde nacen los pedestales y pines sembrados. «Las dos» añade la libre en alambre como referencia. Lo único que no cambia es dónde se COLOCA la pieza ni dónde están los apoyos, que están atornillados a la mesa.",pinTilt:"Inclin.",pinTiltTip:"Cuánto se tumba el poste respecto de la vertical, en grados. 0 = a plomo. Un pin inclinado toca la barra en un punto distinto y con otra dirección: el contacto se resuelve entre los dos ejes en el espacio, no en planta.",pinYaw:"Rumbo",pinYawTip:"Hacia dónde se tumba, medido en planta desde +X. Sin inclinación no significa nada: un cilindro vertical girado sobre su propio eje es el mismo cilindro.",pinLen:"Largo",pinLenTip:"Lo que MIDE el poste desde su base, en milímetros. No es a qué altura está puesto: uno que se queda corto no llega a la barra y no sujeta de lado por bien colocado que esté, y uno demasiado largo acaba tocando también por donde no debe. Para subirlo sin alargarlo está la columna de al lado.",pinZ:"Altura",pinZTip:"A qué altura sobre la mesa ARRANCA la base del poste, en milímetros. 0 es el pin atornillado a la mesa, que es lo normal. Se levanta para llegar a una barra que pasa alta sin que el poste toque además por debajo, donde a lo mejor pasa otro tramo de la pieza. Lo que lo sostiene ahí arriba —un dado, un suplemento, el propio cuerpo del fixture— no se dibuja ni entra en la cuenta: esto dice dónde está el cilindro, no de qué cuelga.",pinDist:"Dist.",pinDistTip:"Distancia entre el eje del pin y el eje de la barra donde más se acercan, en el espacio. Con los pines a plomo coincide con la distancia en planta; inclinados, no.",pinSide:"Lado",pinSideAuto:"auto",pinSideTip:"De qué lado de la barra está MONTADO el pin. Es dato del fixture, no una lectura: si se lee de la forma de cada momento, en cuanto un ángulo manda la barra más allá del eje del poste la lectura sale invertida y el contacto se cierra por la cara equivocada — o sea, se resuelve una pieza que atravesó el pin. «auto» lo decide por la geometría la primera vez, que es lo que hacía antes.",pinState:"Estado",pinHolding:"sujetando",pinEmpty:"Sin pines. «Sembrar» reparte unos cuantos tocando de lado y alternando de lado, que es como se sujeta una barra de verdad: todos del mismo lado la dejarían girar sobre ellos.",addPin:"+ Pin",seedPin:"Sembrar pines",clearPin:"Quitar todos",pinNote:"Un pedestal sostiene; un pin IMPIDE. Los pines están atornillados a la mesa, así que no se mueven cuando la pieza se recoloca: lo que cambia es si siguen tocando. Un pin con hueco a favor no empuja nada y se ignora — no es un error, el fixture puede tener más pines de los que esta pieza usa.",pinOffNote:"Con el amarre apagado la barra se calcula libre en el espacio. Los pines se pueden colocar y ver en el 3D, pero no deforman nada.",pinNoneHold:"Ningún pin está tocando la barra, así que el amarre no cambia nada. Revisa la altura y la posición: la columna «Llega» dice cuáles no alcanzan la barra y «Hueco» a qué distancia se quedan.",pinHeldN:"{n} pin(es) sujetando",pinTip:"Punta",pinTipTip:"Cuánto se mueve el extremo libre por estar la barra sujeta, comparado con la misma pieza libre en el espacio. Es la consecuencia que se mide.",pinWorstKink:"Peor codo",pinStress:"Esfuerzo",pinOfYield:"del límite",pinYield:"En algún punto la barra pasa del límite elástico: al soltarla NO vuelve, y la pieza que sale no es la que dice el modelo. Con el material sin confirmar esto es un aviso, no una medida — pero el sitio donde ocurre sí es real.",pinYieldTip:"Tensión de flexión en la fibra más alejada, comparada con el límite elástico del material. Por encima del 100 % la deformación deja de ser recuperable.",pinOpen:"{n} contacto(s) sin cerrar",pinOpenTip:"El solver no pudo llevar la barra a tocar estos pines. Suele significar un fixture imposible: dos pines que piden la barra en dos sitios a la vez, o uno metido tan adentro que la pieza tendría que romperse para llegar.",pinKink:"Codo °",pinCurv:"Curvatura °/m",pinSigma:"σ MPa",matRho:"Densidad",matRhoTip:"Peso del material por metro cúbico. Solo la usa la flecha por gravedad: es lo que hace que la barra se cuelgue entre apoyos. Provisional como el resto del material.",sag:"Flecha",sagTip:"Cuánto se cuelga la barra por su propio peso en el tramo que ACABA en este pedestal, en milímetros. El voladizo de cada punta cuenta como ménsula y es donde más se nota: la longitud va a la cuarta potencia. La orientación manda más que el vano — de plano se cuelga (ancho/espesor)² veces más que de canto, que con 40×12 son once veces.",sagNote:"La flecha se calcula tramo a tramo como viga biapoyada, y los voladizos como ménsula. Una viga continua sobre varios apoyos es MÁS rígida que eso, así que este número sobreestima: es el lado seguro. Cada tramo se trata como recto — los dobleces dentro de un vano no rigidizan aquí. Cuando llegue el escaneo de una barra recta certificada montada en el fixture, esto se contrasta contra la flecha medida y deja de ser una estimación.",sagBad:"La flecha por gravedad pasa de la tolerancia de punto. Eso entra en la medición como un error que NO es de doblado: el lazo intentará corregirlo y no podrá. Añade un apoyo en el tramo peor, o acorta el voladizo.",sagNoMat:"Flecha: falta el material",sagNoMatTip:"Sin densidad y sin módulo elástico no hay número que dar. Se rellenan en la pestaña Amarre.",matE:"Módulo E",matYield:"Límite elástico",matTip:"Solo hace falta para pasar de deformación a esfuerzo. La FORMA que toma la barra sujeta no depende de E: con sección constante se cancela en el reparto, y hay una prueba de que cambiarlo no mueve un solo punto.",matProv:"Material PROVISIONAL: son valores de manual de un 6061-T6, no los de la colada que está en el taller. Sirven para ver dónde se concentra el esfuerzo; para afirmar «esta pieza se pasa por 12 MPa» hace falta el certificado del material.",load:"La carga",loadOn:"La pieza pesa",loadOnTip:"Con esto puesto la barra deja de quedarse donde la deja la tabla: se cae hacia donde tira la carga, se apoya en los pedestales y aprieta contra los pines que le queden en el camino. Un apoyo EMPUJA pero no TIRA, así que si un doblez separa la pieza de un pin, se separa; y si la gravedad la devuelve a él, vuelve.",loadSlow:"Esta pieza tiene {n} dobleces. Por encima de {lim}, calcular cómo se asienta deja de ser instantáneo: con 34 tarda cerca de un segundo y con 60 pasa de los quince. No es un límite y el resultado es igual de bueno —se dice para que no parezca que el programa se coló—. Lo que manda es el NÚMERO de dobleces: ni el largo de la barra ni lo juntos que vayan cambian nada.",loadG:"Gravedad (×g)",loadGTip:"Múltiplo del peso propio. 1 es el peso de verdad; 0 lo quita y deja solo el empuje de la punta; 2 sirve para ver qué se movería si la pieza pesara el doble.",loadDir:"Dirección",loadDirTip:"Hacia dónde tira la carga. (0, 0, −1) es hacia abajo, que es lo que hace la gravedad. Apuntando a otro lado se empuja la pieza contra un amarre concreto, para ver si ese amarre la aguanta.",loadTipF:"Empuje en la punta",loadTipTip:"Una fuerza más, en el extremo libre y en la misma dirección. Es el dedo con el que uno prueba si la pieza se mueve, puesto donde más se nota.",loadWeight:"Peso",loadWeightTip:"Lo que pesa la pieza entera, más el empuje de la punta. Sale de la densidad y de la sección: una barra de 1.7 m de 40×12 son unos 22 N, o sea 2.2 kg.",loadCarried:"Los apoyos llevan",loadCarriedTip:"Cuánto de ese peso se reparte entre pedestales y pines: la suma de las reacciones, proyectada contra la carga.",loadRoot:"La mordaza aguanta",loadRootTip:"Lo que no llevan los apoyos se queda en el primer extremo, que es por donde la pieza está agarrada. Es el número que contesta «¿me hacen falta más pedestales?». Negativo quiere decir que la mordaza tira hacia ABAJO: los apoyos llevan más que la pieza entera porque la barra hace palanca sobre alguno.",loadRootDown:"La mordaza tira de la pieza hacia ABAJO con {n} N: la barra hace palanca sobre un pedestal y los apoyos llevan más que la pieza entera. Con la mordaza que tiene el fixture es un resultado posible, pero dice que sin ella el primer extremo se levantaría: comprueba que la mordaza aprieta y no solo apoya.",loadDrop:"Se movió",loadDropTip:"Cuánto se ha desplazado el punto que más, medido contra la pieza libre. Incluye lo que hacen los pines Y lo que hace la carga: para separarlas, quita la carga y mira el mismo número.",loadPene:"Se hunde",loadPeneTip:"Cuánto se mete un apoyo dentro de la barra. El contacto se modela con un muelle muy duro, así que esto tiene que salir en micras; si llega a la tolerancia, el muelle se quedó corto y las reacciones de al lado hay que mirarlas con recelo.",loadN:"Reacción",loadNTip:"Con cuánta fuerza empuja ese apoyo, en newton. Un guion quiere decir que la pieza no lo está tocando, que es una respuesta y no un fallo. «n/d» quiere decir otra cosa muy distinta: que ahí el modelo no puede decir nada. Y esta cifra vale lo que valga el alto MEDIDO: una micra de más en un apoyo mete varios newton en la pieza, y junto a la mordaza los mete enteros porque ahí la barra no puede ceder. Sirve para ver qué apoyo trabaja y cuál no; no es la lectura de una célula de carga.",loadNd:"n/d",glLost:"La tarjeta gráfica ha soltado el 3D (suspensión, cambio de pantalla o controlador). Los datos y las tablas siguen bien. El 3D vuelve solo si el navegador lo recupera; si no vuelve, guarda el trabajo y recarga la página.",faultMsg:"Algo ha fallado ({e}). Lo que hay en pantalla puede no estar al día: guarda el trabajo y recarga la página.",faultClose:"Cerrar aviso",clashCard:"No cabe en el fixture: {n} se mete {d} mm",clashTip:"Con este modelo encima del fixture, ese apoyo queda DENTRO de la barra por muchos milímetros que la barra ceda. Pasa cuando la pieza es distinta de la que el fixture sujeta: un doblez unos grados distinto puede dejar la barra al otro lado de un pin, y ninguna deformación elástica la devuelve atravesándolo. La forma sujeta que se dibuja es la más cercana que el modelo encuentra, no una que se pueda montar. En el 3D hay un rombo rojo en cada apoyo que choca.",fixLoadOn:"Aquí la pieza pesa {w} N, y eso se enciende en la pestaña Amarre. La columna «Reacción» dice cuánto de ese peso lleva cada pedestal.",fixLoadOff:"Aquí la pieza no pesa. La flecha ya usa su peso propio, pero cuánto carga cada pedestal solo sale con «La pieza pesa» puesto, en la pestaña Amarre: entonces aparece la columna «Reacción».",colVis:"Visible en el 3D",xyTip:"Dónde está sobre la mesa, en milímetros. Es una medida del taller: no se mueve cuando la pieza se recoloca.",pedHTip:"Cuánto sube la cuna desde la mesa, en milímetros.",pedPadTip:"Largo de la cuna, en milímetros. Con una cuna larga, medio grado de inclinación de más ya levanta la barra.",pedTiltTip:"Con qué inclinación está puesta la cuna, en grados. Positiva si sube, con el mismo criterio que «Pide».",pedWantTip:"La inclinación que tiene la barra justo encima del pedestal, en grados. Positiva si sube.",pedD:"Δ",pedDTip:"Lo que le sobra o le falta a la cuna: su inclinación menos la que pide la barra, en grados. Se pinta en rojo cuando eso levanta la barra en la punta de la cuna más que la tolerancia de punto; la ayuda de cada celda dice cuántos milímetros.",pedSTip:"Dónde toca, medido a lo largo de la barra desde el primer extremo, en milímetros.",pedPlanTip:"Distancia en planta del pie al eje de la barra, en milímetros. Dice si el pedestal está debajo de la barra o al lado.",pedGapTip:"Aire entre la cuna y la cara de abajo de la barra, en milímetros. Positivo: la barra vuela y no apoya. Negativo: el pedestal estorba y levantaría la pieza.",pedSpanTip:"Distancia al pedestal anterior a lo largo de la barra, en milímetros. Es lo que decide la flecha por gravedad.",pinDiaTip:"Diámetro del poste, en milímetros.",pinGapTip:"Aire entre el poste y la barra donde más se acercan, en milímetros. Positivo: la barra no llega al pin. Negativo: el pin está metido donde iría la barra y la empuja.",pinStateTip:"Si el amarre está usando este pin ahora mismo para sujetar la barra.",stHold:"Sujeta por los pines",stLoad:"La pieza pesa",stHoldLoad:"Sujeta y pesando",stHoldGo:"Clic: abre la pestaña Amarre, que es donde están los dos interruptores.",loadNdTip:"Aquí no se puede dar un número. Este apoyo cae en un tramo que el modelo no sabe doblar —las incógnitas son los codos de las estaciones— así que su hueco no cambia por mucho que la pieza ceda, y la reacción que saliera no querría decir nada. No es un cero: un cero significa que la pieza no lo está tocando.",loadNoDof:"La pieza no tiene ninguna estación, así que este modelo no la sabe colgar: lo que pesa sí se sabe, cómo se reparte entre los apoyos no. Para una barra recta el número que sirve es la flecha por gravedad, en la pestaña Fixture.",loadStuck:"Sin resolver",loadStuckTip:"La búsqueda del equilibrio se paró antes de llegar a él: lo que hay al lado es el último tanteo y no una solución. Suele pasar cuando un apoyo entra y sale del contacto en cada paso, o cuando dos apoyos se pelean por el mismo punto.",loadStuckWarn:"La carga no llegó al equilibrio en {n} pasos: los números de abajo son el último tanteo y no se pueden defender. Sube el amortiguado, o aparta el apoyo que esté justo en el límite de tocar.",loadNote:"Las incógnitas son los codos de las ESTACIONES, así que en este modelo un tramo recto no se cuelga por el medio: esa parte la da la flecha por gravedad, en la pestaña Fixture. Las dos miran cosas distintas de la misma barra y no se suman. La rigidez de una estación se toma como EI/L, que para un voladizo es unas cuatro veces más blanda que la exacta: esto da el orden y la dirección, no una flecha certificada.",loadNoMat:"Sin densidad y sin módulo elástico no hay carga que aplicar. Los dos se rellenan aquí arriba, en el material.",loadHang:"Los apoyos llevan menos de la mitad del peso: la pieza está colgando de su propio extremo. Lo que se ve es un voladizo, no una pieza montada; o faltan pedestales, o los que hay no la están tocando.",mach:"Máquina",machTitle:"Comando de máquina",machCols:"Columnas, en este orden",machAxis:"Eje abs.",machSep:"Separador",machDec:"Decimales",machLen:"Longitudes",machAng:"Ángulos",machSignA:"Signo del ángulo",machSignR:"Signo del rodado",machSignTip:"Invierte el signo SOLO en el archivo. La cinemática no se toca: los mismos números siguen doblando la misma pieza en pantalla. Está aquí porque una máquina puede tener el eje montado al revés, y eso se corrige al escribir, no en el motor.",machRot:"Rodado como",machRotDelta:"giro respecto al anterior",machRotAbs:"posición absoluta del eje",machRotTip:"El modelo guarda cuánto GIRA el eje en cada estación, porque la máquina lo sostiene entre dobleces. Hay controles que quieren en cambio la posición absoluta del eje. Las dos describen la misma pieza; elegir la equivocada dobla bien la primera estación y mal todas las demás.",machHead:"Con encabezado",machCrlf:"Fin de línea CRLF",machCrlfTip:"Muchos controles de máquina no leen un fin de línea de UNIX. Con esto el archivo termina cada línea como espera un control de Windows.",machTail:"Fila de la cola",machTailTip:"Una última fila con la recta de salida. Sin ella el archivo no dice cuánto material queda después del último doblez, y las columnas que no le corresponden salen vacías, no en cero: un cero en la columna del ángulo es un doblez de cero grados, o sea una instrucción.",machPrev:"Vista previa",machMore:"y {n} fila(s) más.",machExport:"Exportar comando",machDirty:"Hay un ajuste manual escrito y sin aplicar. El archivo lleva el comando guardado, no lo que muestra la tabla de compensación: aplica primero, o el ajuste no sale.",machNote:"El formato que lee la dobladora está pedido y no ha llegado, así que aquí no se adivina: se deja a la vista. Antes de mandar una barra, comprueba en la vista previa las unidades y los signos contra una pieza que ya conozcas — es lo único de este archivo que no se puede deshacer. El perfil viaja en el JSON de la pieza, así que un archivo de máquina de hace meses se puede volver a generar igual.",lims:"Límites",limWhat:"Umbral",limVal:"Valor",limDef:"Fábrica",limState:"Estado",limWait:"Espera",limTouched:"tocado",limFactory:"de fábrica",limProv:"provisional · {p}",limRead:"Al leer un dato medido",limLoop:"Guardas del lazo",limReset:"Volver a los de fábrica",limHitStraight:"Con este umbral, {n} recta(s) de esta pieza no caben.",limNote:"Estos números no mueven ningún PI: deciden qué se rechaza, de qué dato se desconfía y cuánto puede corregir el lazo de una vez. Viajan en el JSON de la pieza, así que un archivo guardado dice con qué umbrales se juzgó. «Provisional» significa que el valor se eligió a falta de un dato que está pedido: A.6 es la repetibilidad real del escaneo (σ) y B.2 la cota de la máquina. Un 0 apaga esa vigilancia.",lim_axisMin:"Eje legible",lim_axisMinTip:"Desvío mínimo para creerle el EJE a un doblez medido. Por debajo, la dirección lateral es ruido: el eje se hereda del doblez anterior en vez de inventarlo. La regla real es atan(3σ/avance). Solo se aplica a lo MEDIDO; en un modelo tecleado un doblez de 0.2° es deliberado.",lim_piMin:"PI separados",lim_piMinTip:"Distancia mínima entre dos PI de un archivo importado. Dos puntos más juntos dan una dirección de puro ruido y de ahí un doblez inventado que además envenena la fila siguiente. La regla real es 5σ. Con dos PI pegados se rechaza el archivo entero: significa que la extracción de la nube salió mal.",lim_scaleMin:"Escala mínima",lim_scaleMinTip:"Fracción del paso nominal por debajo de la cual la nube importada no puede ser la misma pieza. NO es una tolerancia: caza un export cuyas columnas son la DESVIACIÓN y no la coordenada, o metros leídos como milímetros. Solo por abajo: a un escaneo con puntos de menos el paso medio le SUBE, y eso no es un archivo malo.",lim_straightMin:"Recta mínima",lim_straightMinTip:"Recta entre tangencias que hace falta para que quepan los herramentales: mordaza más carrera del cabezal. Es una cota de la MÁQUINA, no del escáner. Una recta negativa se lista aparte pase lo que pase: son dos herramentales en el mismo sitio.",lim_tubeRfac:"Radio mínimo de tubo",lim_tubeRfacTip:"Solo para tubo REDONDO, y en diámetros exteriores: con 1.5 aquí, un Ø40 no se dobla por debajo de R60. Nace en 0, que significa no vigilar esto, y no es un descuido: en un tubo el radio que aguanta lo mandan la relación diámetro/pared y la ovalización al doblarlo, y este programa no tiene con qué deducirlo. Poner una cifra de fábrica sería darle cara de dato a una opinión. Si el taller tiene su norma, aquí se teclea.",lim_dead:"Banda muerta (ángulo)",lim_deadTip:"Por debajo de esta diferencia contra el nominal, el lazo no corrige: es ruido de medición y perseguirlo hace oscilar la pieza. 0 la apaga.",lim_deadFeed:"Banda muerta (avance)",lim_deadFeedTip:"Lo mismo que la banda muerta del ángulo, en milímetros y sobre el avance.",lim_maxStep:"Tope por ciclo (ángulo)",lim_maxStepTip:"Corrección máxima que el lazo puede aplicar de una vez. Un salto mayor no es una desviación de proceso: es un dato malo o un doblez que cruzó de rama. Se recorta y se sigue, en vez de mandarlo a la máquina. 0 quita el tope.",lim_maxStepFeed:"Tope por ciclo (avance)",lim_maxStepFeedTip:"Lo mismo que el tope del ángulo, en milímetros y sobre el avance.",fabHead:"Esta pieza no se puede fabricar como está:",fabNeg:"la recta que entra a {b} es NEGATIVA: los herramentales se cruzan.",fabShort:"la recta que entra a {b} no llega a {n} mm, que es lo que necesita el herramental.",fabTail:"la recta de salida no llega a {n} mm.",fabOver:"{b} pide más de {n}° de desvío: los largos de esa fila salen topados.",fabTube:"En {b} el radio no llega al mínimo de tubo: {n} diámetros son R{r}.",fileUnread:"el sistema no dejó leer el archivo (¿se movió, o lo tiene abierto otro programa?)",csvShort:"Estas piezas traen MENOS puntos que el modelo. Los dobleces que faltan quedan SIN MEDIR y no se compensan:",compSim:"CUIDADO: {n} de las piezas que alimentan este cálculo son SIMULADAS, no medidas. Lo que salga de aquí no describe ninguna barra real.",compHeld:"El amarre o la carga están puestos, así que el 3D puede estar enseñando la pieza ASENTADA. Estas correcciones NO: se calculan contra la pieza libre, que es la que describe la tabla. Si lo que se quiere es la forma con el fixture puesto, todavía no se corrige contra eso.",compShort:"Solo {a} de {b} dobleces están medidos. Los que faltan salen marcados con — y NO se compensan.",rowNoMeas:"Este doblez no está medido: la pieza traía menos puntos que el modelo. El comando se deja como está.",compFewN:"El lazo lee {a} pieza(s) y hacen falta {n}. Con menos, el comando persigue la dispersión de esa pieza y la siguiente puede salir peor.",batchUse:"Usar la mediana de las piezas visibles ·",batchTip:"Con una sola pieza, el lazo corrige también lo que fue dispersión de esa pieza y la siguiente puede salir peor. Con varias, la mediana deja pasar solo lo que se repite.",batchOn:"El lazo lee la mediana de %n piezas, no la última.",batchHint:"Hay más de una pieza visible: marque la casilla para que el lazo lea la mediana.",spread:"±σ",spreadTip:"Dispersión del ángulo entre las piezas visibles (MAD escalado). Grande junto a una desviación grande = mala puntería, no un doblez mal ajustado.",sbMeas:"Resorte medido",sbUse:"Usar en el simulador",sbNote:"sb = 1 − ángulo medido / ángulo comandado, por orientación. Mediana ± σ robusta sobre los dobleces de las piezas visibles; los casi rectos (<1°) no entran.",sbCircular:"Aviso: %n de las piezas visibles son simuladas. Estimar el resorte de una pieza inventada devuelve lo que ya está escrito abajo — es un ciclo cerrado, no una medición.",sbSpreadTip:"Dispersión entre dobleces y entre piezas. Si es del tamaño del propio valor, ese resorte no está medido: está adivinado.",mnFile:"Archivo",mnModel:"Modelos",mnView:"Vista",mnPieces:"Piezas",soloOn:"Solo 3D",soloOff:"Volver",rotAxisTip:"Cuánto gira el eje de doblado en esta estación. Queda en %e°.",rotHeadTip:"Giro del eje de doblado respecto a la estación anterior. Un 0 deja el eje donde estaba: el proceso es secuencial.",history:"Historial",undo:"Deshacer",redo:"Rehacer",histNote:"Deshace ediciones de la pieza: celdas, puntos, modelos, cotas, colocación y compensación aplicada. No deshace la cámara, el tema, el idioma, las capas ni el modo. 50 pasos.",soloTip:"Plegar la tabla y el lateral para ver la pieza entera (tecla F). Al volver, la tabla sigue donde estaba.",expPts:"Exportar puntos",expStep:"Eje a STEP (.stp)",expStepTip:"El eje nominal como curvas EXACTAS —rectas y arcos, no una malla—, con los PI y el perfil en grupos con nombre y las unidades declaradas dentro del archivo. Sale el nominal, no el comando. NO lleva la torsión: donde la haya, barrer el perfil por el eje da la pieza sin retorcer.",modeModel:"Modelar",modeMeas:"Medir",modeComp:"Compensar",modeModelTip:"Teclear la pieza: la tabla entera a la derecha y el modelo al lado.",modeMeasTip:"Mirar la pieza medida: el modelo grande, la cinta alta y las estadísticas.",modeCompTip:"Modo taller: solo se editan las celdas de compensación. Los comandos a todo el ancho y el 3D como banda de comprobación.",sbTrend:"depende del ángulo (%s %/°, r=%r)",sbTrendTip:"El resorte cambia con el ángulo comandado, así que una constante única no describe el proceso. Con esta señal, ajuste por rango de ángulo en vez de adoptar un solo número.",srcSimTip:"Pieza inventada por el simulador. No se ha medido nada.",srcVerifyTip:"Verificación simulada tras aplicar la compensación. Tampoco es una medida.",srcMeasTip:"Pieza medida importada.",srcUnkTip:"Procedencia desconocida: viene de un archivo que no la guardaba.",anchor:"Extremo fijo",aStart:"Amarre (P0)",aEnd:"Libre (punta)",aBest:"Mejor ajuste",insPt:"+ Punto intermedio",delPt:"✕ Punto",ptNote:"Edición ABSOLUTA: al mover un punto los demás se quedan donde están y la cadena LRA se recalcula por inversa. Un punto nuevo nace colineal (ángulo 0), listo para moverse. Editar puntos funde los Δ en la base.",bake:"Fundir Δ",zeroD:"Δ a cero",bakeAsk:`Este modelo tiene Δ sin fundir.

Editar puntos trabaja sobre la geometría efectiva, así que los Δ se funden en la base y quedan en cero.

¿Continuar?`,dTip:"Δ punta vs ref",dblz:"dbl",place:"Colocación",pivot:"Pivote",plX:"Mover X",plY:"Mover Y",plZ:"Mover Z",plRX:"Giro X",plRY:"Giro Y",plRZ:"Giro Z",plReset:"Restablecer colocación",plNote:"Mueve y gira la PIEZA sobre un suelo quieto, alrededor del PI que elijas como origen: la cuadrícula y la cámara no se mueven. Los pedestales la siguen, apoyando siempre en el suelo. No toca ningún avance, ángulo ni radio.",lMarks:"Puntos de referencia",marks:"Puntos de referencia",addMark:"+ Punto",nearPi:"PI",distPi:"Dist.",markNote:"Cotas sueltas en el espacio: el punto se une con el PI más cercano del modelo activo y la cifra dice a cuánto quedó. Sirve para acotar contra el fixture o un datum de taller. «+ Punto» lo crea sobre el doblez seleccionado.",cCalc:"Δ calc.",cAdj:"Δ aplicada",zeroTw:"Δ manual a cero",cellNote:"La celda Δ aplicada se escribe como en una hoja de cálculo, y hay tres formas. RELATIVO A LO QUE VES: un operador al principio opera sobre lo que muestra la celda — «+2» le suma 2, «-0.3» le quita tres décimas, «*1.1» le pone un 10 % más. RELATIVO AL LAZO: lo que calculó se llama c — «c», «c+2», «(c+1)/2». ABSOLUTO: un número suelto reemplaza, y «=» lo fuerza, que es como se escribe un negativo suelto — «=-3». El resto de la tabla es de solo lectura.",cellBad:`No se entendió lo que escribiste, así que no se guardó nada.

Se admite un número suelto (2), una cuenta sobre lo que ves (+2, -0.3, *1.1), una cuenta sobre lo que calculó el lazo (c+2) o un absoluto con = (=-3).`,tweakOn:"con ajuste manual",fixture:"Fixture",pedH:"Alto",pedPad:"Cuna",pedTilt:"Inclin.",pedWant:"Pide",pedS:"Toca",pedPlan:"Desvío",pedGap:"Hueco",pedSpan:"Vano",pedWorst:"Vano mayor",pedOff:"la barra no le pasa por encima",pedOffN:"{n} sin apoyo",pedOffTip:"El pie queda más lejos del eje de la barra que media cuna más medio ancho de sección: este pedestal no sostiene nada. Mueve X e Y hasta que la barra le pase por encima.",pedLiftTip:"Con esta inclinación la barra se despega {v} mm en la punta de la cuna. Se compara contra la tolerancia de punto.",addPed:"+ Pedestal",seedPed:"Sembrar {n}",clearPed:"Vaciar",fixEmpty:"Sin pedestales. «Sembrar» reparte unos cuantos bajo la pieza con la altura y la inclinación que pide en cada sitio; a partir de ahí se corrigen con las medidas del fixture real.",fixNote:"El fixture está atornillado a la mesa: X, Y, alto y cuna son del taller y no se mueven cuando la pieza se recoloca. «Pide» es la inclinación que la barra tiene justo encima; Δ es lo que le sobra al pedestal, y se pinta en rojo cuando levanta la barra más que la tolerancia de punto. «Hueco» es el aire entre la cuna y la cara de abajo: positivo la barra vuela, negativo el pedestal estorba. «Vano» es la distancia al pedestal anterior a lo largo de la barra, que es lo que decide la flecha por gravedad.",sbFew:"tendencia: faltan piezas",sbFewTip:"Con menos de %n piezas no se puede decir si el resorte depende del ángulo: una muestra de puro ruido dispara el aviso una de cada tres veces. La mediana de arriba sí vale; lo que falta es poder afirmar la dependencia.",sbFlat:"tendencia: un solo nivel de ángulo",sbFlatTip:"Las piezas medidas se doblaron casi al mismo ángulo, o hay una sola lejos del resto arrastrando la recta ella sola. Una pendiente se mide entre dos niveles: hacen falta al menos %p piezas a cada lado, separadas %s° o más."};var ob={sub:"Bend compensation · alpha",bNew:"New model",bOpen:"Open JSON",bSave:"Save JSON",bRep:"Report",bDemo:"Load demo",layers:"Layers",datasets:"Measured parts",model:"Model",meas:"Inspection",thSys:"System theme",thLight:"Light theme",thDark:"Dark theme",comp:"Compensation",points:"Points",lNom:"Nominal bar",lVar:"Other models",lDiff:"Model-to-model displacement",lMeas:"Measured bar",lPred:"Corrected prediction",lDev:"Deviation vectors",lPts:"PI points",lLbl:"Labels",lGrid:"Grid",lFix:"Pedestals",addSim:"Simulate part",del:"Delete",view:"View",vIso:"ISO",vTop:"Top",vFront:"Front",vSide:"Side",vFit:"Fit",exag:"Exaggeration",cmode:"Color",cSolid:"Solid",cDev:"Deviation",legend:"Legend",devscale:"Point deviation",hint:"Drag: orbit · Wheel: zoom · Shift+drag: pan",ribbon:"Total-deflection deviation per bend along developed length",vsRef:"Δ deflection per bend against the reference model",gripW:"Right panel width",gripH:"Table height",name:"Name",section:"Section",width:"Width",thick:"Thickness",chamfer:"Chamfer",endlen:"Machined end",tail:"Tail",secKind:"Shape",secRect:"Rectangular",secRound:"Round",dia:"Diameter",wall:"Wall",wallHint:"0 = solid",secSolid:"solid",secHollow:"hollow",secArea:"Area",secInertia:"Inertia",secMass:"Weight",secTip:"The shape of the bar. It changes what it weighs, what it resists with, and how it sits on a support.",secFig:"The face of the bar, drawn to scale with its measurements",secChamNote:"The chamfer is dashed because it is drawn and not counted: it takes material off the corners, so it can only make the section smaller, and ignoring it declares contact earlier rather than later.",secChamNone:"The drawing is the same outline the 3D sweeps and the contact maths answer.",secRoundWarn:"On a round bar both inertias are equal: there is no «flat» or «on edge». ROLL still says which way it bends, but it no longer changes what the section resists with, and the part’s twist cannot be observed in the 3D view.",secHollowWarn:"The minimum-radius thresholds are those of a SOLID bar. On a tube the usable radius is set by the diameter/wall ratio and by ovalization while bending, and this program does not judge that yet: on screen it bends more easily than it does on the machine.",secHollowJudged:"Tube threshold set: {n} diameters. Bends with a tighter radius are flagged on the Model tab. That figure is the one typed into Limits, not one of the program’s own: the program cannot work it out.",tol:"Tolerances",tolA:"Angle",tolR:"Rotation",tolF:"Feed",tolP:"Point",bends:"Bends",addBend:"Add bend",nBend:"#",feed:"Feed",rot:"Roll",ang:"Angle",rad:"Radius",twist:"Twist",twlen:"Twist len",ori:"Or.",dcol:"Δ",straight:"Straight",arcL:"L",cumL:"Σ L",tailRow:"Tail",lenNote:"Straight = tangent-to-tangent run, and the only length you type. L = arc length the bend generates (radius × deflection). Σ L = running developed length on the neutral axis: straight, arc, straight, arc. Changing a radius or an angle leaves the straights put; the PI-to-PI feed is recomputed underneath and is what gets saved and sent to the machine.",kbdNote:"Keyboard: Tab / ⇧Tab move across · Enter and ↑ ↓ move down and up · Esc discards the cell · mouse wheel or Ctrl+↑ ↓ step the value. Entering a cell selects its value: typing replaces it. Up to three decimals are accepted.",twnote:"Twist len = straight run (mm) the torsion is spread over, centred on the straight. 0 = whole straight. It moves no PI: it only sets where the torsion happens.",proc:"Simulated process (virtual part)",sbW:"Springback hard way",sbT:"Springback easy way",slip:"Feed slip",biasR:"Rotation bias",noise:"Scan noise",seed:"Seed",simulate:"Generate measured part",dNone:"No measured part. Simulate one or import a CSV.",deltas:"Per-bend deviations",dA:"Δ angle",dR:"Δ roll",dF:"Δ Feed",dP:"Tip dev.",statMaxA:"Max Δ deflection",statRms:"Deflection RMS",statTip:"Free-end deviation",statOut:"Out of tol.",gains:"Correction gains",gainW:"Hard-way gain",gainT:"Easy-way gain",gainR:"Roll gain",gainF:"Feed gain",gainNote:'Roll and feed carry their own gain because they are not the same quantity as the bend. "Hard way" and "easy way" are springback constants: how far the bar opens when released. Roll has no spring — it was corrected in full, that is at gain 1.0, exactly what is forbidden for the angle because it oscillates with measurement noise — and feed is thrown off by slip, which is a different phenomenon.',what:"What to correct",cAng:"Bend angles",cRot:"Roll",cFeed:"Feeds",apply:"Apply compensation",reset:"Reset commands",cmdTbl:"Machine commands",cNow:"Current",cNew:"New",cDelta:"Δ",predict:"Predicted residual",verify:"Verify (run 2nd part)",noMeas:"A measured part is required to compute compensation.",stLen:"Developed length",stBends:"Bends",stDatum:"Datum",stMax:"Max dev.",stUnits:"Units",engine:"Engine",stVer:"Version",stVerTip:"Build currently running. Quote it when reporting an odd number: with one copy in the shop and another published, this is the only thing that tells them apart. «+sucio» = built on uncommitted changes.",schemaAmbiguous:`This file is barcomp/2.2 and does not record which bend direction it was written with.

CHECK THE SHAPE in the 3D view before compensating. Saving makes it 2.3 and no longer ambiguous.`,schemaMigrated:`File from an older version: converted to the current convention without moving the part.
