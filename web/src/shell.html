<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<!-- `interactive-widget` es el que impide que la cabecera se vaya de la
     pantalla al entrar en una celda: sin el, el teclado del telefono tapa
     media pagina SIN encogerla, y el navegador panea el viewport visual hasta
     el campo enfocado. Medido a 390x844: el primer campo numerico de la tabla
     esta en y=596, el ultimo en y=1323, y con un teclado de 420 px el paneo va
     de 206 a 933 px -- la cabecera mide 44. Con `resizes-content` el teclado
     encoge el contenido, no hay nada que panear y la barra de menus se queda
     donde esta. Ver tambien --appH en app/phone.ts, que cubre lo mismo donde
     esa bandera no se entiende. -->
<meta name="viewport" content="width=device-width,initial-scale=1,interactive-widget=resizes-content">
<title>BARCOMP α — Compensación de dobleces</title>
<style>/*__CSS__*/</style>
</head>
<body>
<div id="app">
  <header id="hd"></header>
  <aside id="lf"></aside>
  <section id="ct">
    <div id="vpwrap">
      <canvas id="vp"></canvas>
      <div id="labels"></div>
      <div id="vptool"></div>
      <div id="vplegend"></div>
      <div id="hint"></div>
      <div id="gizmo"></div>
      <div id="vpnote" role="alert" hidden></div>
    </div>
    <div id="rtgrip" title="Ancho del panel derecho"></div>
  </section>
  <aside id="rt"><div id="side"></div></aside>
  <div id="rb"><canvas id="rbc"></canvas><div id="rbtitle"></div>
    <div id="btgrip" title="Alto de la tabla"></div></div>
  <section id="bt"><nav id="tabs"></nav><div id="panes"></div></section>
  <footer id="st"></footer>
  <!-- Sello de compilación. Lo sustituye build.mjs y lo lee renderStatus():
       con una copia en el taller y otra en Pages, es la única forma de saber
       qué versión produjo un número. -->
  <script id="ver" type="application/json">/*__VER__*/</script>
</div>
<!-- three.js + todo el código de src/ empotrados por build.mjs en un solo
     bloque: el archivo abre con doble clic bajo file://, sin servidor. -->
<script>/*__APP__*/</script>
</body>
</html>
